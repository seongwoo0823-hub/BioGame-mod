<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@900&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#000}#w{position:relative;width:1280px;height:720px;overflow:hidden}canvas{position:absolute;inset:0}
.t{position:absolute;right:56px;bottom:86px;font-family:'Noto Sans KR';font-weight:900;font-size:118px;line-height:1;color:#fff;-webkit-text-stroke:9px #1a2238;paint-order:stroke;text-shadow:0 10px 0 #1a2238}
.e{position:absolute;right:64px;bottom:44px;font-family:'Press Start 2P';font-size:26px;color:#ffd040;letter-spacing:6px;-webkit-text-stroke:5px #1a2238;paint-order:stroke}
.s{position:absolute;right:70px;bottom:228px;font-family:'Noto Sans KR';font-weight:900;font-size:32px;color:#fff;background:#ff6a3a;border:5px solid #1a2238;padding:4px 18px;border-radius:14px;box-shadow:0 6px 0 #1a2238;transform:rotate(3deg)}
.pl{position:absolute;left:28px;display:flex;align-items:center;gap:14px;background:#fffaf0;border:5px solid #1a2238;border-radius:16px;box-shadow:0 6px 0 #1a2238;padding:6px 26px 6px 8px;font-family:'Press Start 2P';font-size:26px;color:#1a2238}
.pl canvas{position:static;width:64px;height:64px;image-rendering:pixelated}
</style></head><body><div id="w"><canvas id="c" width="1280" height="720"></canvas>
<div class="s">떨어뜨리면 패배!</div><div class="t">바이오 타워</div><div class="e">BIO TOWER</div></div>
<script>
const L=s=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src='../../games/bio-tower/'+s;});
(async()=>{
const [pc,isl,cl,land,fc,meta0,wj]=await Promise.all([L('pieces.png'),L('island.png'),L('clouds.png'),L('landscape.jpg'),L('faces.png'),fetch('../../games/bio-tower/pieces.json').then(r=>r.json()),fetch('../../games/bio-tower/world.json').then(r=>r.json())]);
const meta=meta0.pieces;
await document.fonts.ready;
const c=document.getElementById('c'),g=c.getContext('2d');g.imageSmoothingEnabled=false;
g.drawImage(land,0,0,1280,720);
// 구름 몇 개
const C=(i,x,y,s)=>{const [sx,w,h]=wj.clouds[i];g.drawImage(cl,sx,0,w,h,x,y,w*s,h*s);};
C(2,860,40,1.3);C(0,40,120,1.1);
const S=2.6; // 화면 1픽셀 = 2.6배
const GY=625; // 땅 높이
g.drawImage(isl,640-wj.gx*S,GY-wj.ground*S,wj.islandW*S,wj.islandH*S);
const H=k=>meta[k].h*S;
// 아랫면을 bottom에 맞춰 그리기
const P=(k,x,bottom,a=0)=>{const m=meta[k];g.save();g.translate(x,bottom-(m.h-m.oy)*S);g.rotate(a);g.drawImage(pc,m.sx,m.sy,m.sw,m.sh,-m.ox*S,-m.oy*S,m.w*S,m.h*S);g.restore();};
// 쌓인 탑 (아래부터)
let y=GY;P('elephant',560,y);P('cow',760,y);
y-=Math.max(H('elephant'),H('cow'))-14;P('whale',650,y,-0.02);
y-=H('whale')-12;P('lion',620,y);P('rabbit',740,y);
y-=H('lion')-8;P('penguin',640,y);P('egg',700,y,0.1);
y-=H('penguin')-6;
// 떨어지는 조각 + 움직임 선
P('giraffe',680,y-60,0.12);
g.fillStyle='rgba(255,255,255,.85)';for(const x of [630,680,730])g.fillRect(x,y-60-H('giraffe')-70+(x%3)*10,6,50);
// 가장자리에 걸친 조각 (아슬아슬)
P('turtle',880,GY+4,0.25);P('dna',395,GY+8,-0.4);
// 플레이어 1P~4P
const names=['1P','2P','3P','4P'];
names.forEach((n,i)=>{const d=document.createElement('div');d.className='pl';d.style.top=(34+i*104)+'px';const cc=document.createElement('canvas');cc.width=cc.height=64;cc.getContext('2d').drawImage(fc,i*64,0,64,64,0,0,64,64);d.appendChild(cc);d.appendChild(document.createTextNode(n));document.getElementById('w').appendChild(d);});
// 하트
g.fillStyle='#ff6a9a';for(const [x,y,s] of [[960,300,1.2],[1010,250,0.8]]){g.save();g.translate(x,y);g.scale(s,s);g.beginPath();g.moveTo(0,10);g.bezierCurveTo(-26,-8,-12,-30,0,-14);g.bezierCurveTo(12,-30,26,-8,0,10);g.fill();g.lineWidth=4;g.strokeStyle='#1a2238';g.stroke();g.restore();}
document.title='done';
})();
</script></body></html>
