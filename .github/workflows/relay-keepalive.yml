# 실시간 중계 서버(Render 무료) 깨워 두기
# Render 무료 서버는 15분 동안 아무 요청이 없으면 잠들고, 깨어나는 데 30~60초가 걸려요.
# 수업 시간(평일 한국 시각 7시~19시)에는 10분마다 서버를 두드려 잠들지 않게 합니다.
# (GitHub의 예약 실행은 몇 분씩 늦게 돌 수 있어요. 게임 페이지(net.js)도 열려 있는 동안 4분마다 두드립니다.)
name: Relay keep-alive
on:
  schedule:
    - cron: '*/10 22-23 * * 0-4'   # 한국 시각 월~금 07:00~08:59 (UTC 전날 22~23시)
    - cron: '*/10 0-9 * * 1-5'     # 한국 시각 월~금 09:00~18:59
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake relay server
        run: |
          for i in 1 2 3 4; do
            if curl -fsS -m 75 "https://bio-arcade-relay.onrender.com/?keepalive=1"; then echo; echo "server awake"; exit 0; fi
            sleep 10
          done
          echo "server did not answer"; exit 0
