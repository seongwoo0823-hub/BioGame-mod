# Cloudflare 배포 설정 (server/cloudflare 폴더에서: npx wrangler deploy)
name = "bio-arcade-relay"
main = "worker.js"
compatibility_date = "2025-06-01"

[[durable_objects.bindings]]
name = "RELAY"
class_name = "Relay"

# 무료 요금제는 SQLite 저장소를 쓰는 Durable Object만 됨
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Relay"]
