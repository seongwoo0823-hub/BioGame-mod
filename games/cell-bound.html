<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#cv{display:block;background:#000;image-rendering:pixelated;image-rendering:crisp-edges;outline:none}
#touch{position:fixed;inset:0;pointer-events:none;display:none;z-index:2}
body.touch.playing #touch{display:block}
.stick{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:132px;height:132px;border-radius:50%;
  background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.16);pointer-events:auto;touch-action:none}
#stL{left:calc(18px + env(safe-area-inset-left,0px))}#stR{right:calc(18px + env(safe-area-inset-right,0px))}
.knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.35)}
#stR .knob{background:rgba(120,200,255,.25)}
.tb{position:absolute;pointer-events:auto;touch-action:none;width:50px;height:50px;border-radius:50%;border:2px solid rgba(255,255,255,.3);
  background:rgba(0,0,0,.35);color:#fff;font:12px 'Do Hyeon',sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1}
.tb:active{background:rgba(255,255,255,.25)}
#tbBomb{right:calc(160px + env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px))}
#tbAct{right:calc(160px + env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px))}
#tbPock{left:calc(160px + env(safe-area-inset-left,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px))}
#tbDrop{left:calc(160px + env(safe-area-inset-left,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px))}
#tbPause{right:calc(12px + env(safe-area-inset-right,0px));top:calc(86px + env(safe-area-inset-top,0px));width:42px;height:42px}
#tbMap{right:calc(62px + env(safe-area-inset-right,0px));top:calc(86px + env(safe-area-inset-top,0px));width:42px;height:42px}
#rot{position:fixed;inset:0;z-index:5;background:#000;color:#ddd;display:none;flex-direction:column;align-items:center;justify-content:center;font:20px 'Do Hyeon',sans-serif;text-align:center;gap:10px}
#rot b{font-size:44px}
@media (orientation:portrait){body.touch #rot{display:flex}}

<script>/* 휴대폰에서 두 손가락·두 번 탭으로 화면이 확대되어 조작이 막히는 것을 방지 */
(()=>{const no=e=>{if(e.cancelable)e.preventDefault();};['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,no,{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches&&e.touches.length>1)no(e);},{passive:false});
document.addEventListener('dblclick',e=>{if(!e.target.closest('input,textarea,select'))no(e);},{passive:false});})();</script>

<body>
<div id="wrap"><canvas id="cv" width="960" height="540" tabindex="0"></canvas></div>
<div id="touch">
  <div class="stick" id="stL"><div class="knob"></div></div>
  <div class="stick" id="stR"><div class="knob"></div></div>
  <div class="tb" id="tbBomb">폭탄</div><div class="tb" id="tbAct">액티브</div>
  <div class="tb" id="tbPock">카드<br>알약</div><div class="tb" id="tbDrop">교체</div>
  <div class="tb" id="tbPause">❚❚</div><div class="tb" id="tbMap">지도</div>
</div>
<div id="rot"><b>⟳</b>기기를 가로로 돌려 주세요</div>
<script>
'use strict';
/* =========================================================
   기본 상수 · 유틸
   ========================================================= */
const W=960,H=540,TS=56,COLS=13,ROWS=7,RX=116,RY=74,RW=COLS*TS,RH=ROWS*TS,PX=2;
const DOORX=RX+RW/2,DOORY=RY+RH/2;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let BS=1;
function fit(){const s=Math.min(innerWidth/W,innerHeight/H),dpr=window.devicePixelRatio||1;BS=Math.max(1,Math.min(3,Math.round(s*dpr)));
  cv.width=W*BS;cv.height=H*BS;cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px';}
addEventListener('resize',fit);fit();
const R=Math.random,rnd=(a,b)=>a+R()*(b-a),ri=(a,b)=>a+Math.floor(R()*(b-a+1)),pick=a=>a[Math.floor(R()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v,dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),angTo=(a,b)=>Math.atan2(b.y-a.y,b.x-a.x),lerp=(a,b,t)=>a+(b-a)*t;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function wpick(list){let t=0;for(const x of list)t+=x[1];let r=R()*t;for(const x of list){if((r-=x[1])<0)return x[0];}return list[0][0];}
const sgn=v=>v>0?1:v<0?-1:0;
let UIDN=1;const uid=()=>UIDN++;
const tileOf=(x,y)=>({c:Math.floor((x-RX)/TS),r:Math.floor((y-RY)/TS)});
const tileC=(c,r)=>({x:RX+c*TS+TS/2,y:RY+r*TS+TS/2});
const inRoom=(c,r)=>c>=0&&c<COLS&&r>=0&&r<ROWS;
function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

/* =========================================================
   입력 (키보드 · 터치 · 게임패드)
   ========================================================= */
const KEY={},PRESS={};let shootStack=[];
const SHOOTK={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};
const BLOCK=new Set(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Tab','KeyQ','KeyE']);
addEventListener('keydown',e=>{
  if(BLOCK.has(e.code))e.preventDefault();
  if(e.repeat)return;
  KEY[e.code]=true;PRESS[e.code]=true;
  if(SHOOTK[e.code]){shootStack=shootStack.filter(k=>k!==e.code);shootStack.push(e.code);}
  auInit();
});
addEventListener('keyup',e=>{KEY[e.code]=false;shootStack=shootStack.filter(k=>k!==e.code);});
addEventListener('blur',()=>{for(const k in KEY)KEY[k]=false;shootStack=[];TOUCH.mx=TOUCH.my=TOUCH.sx=TOUCH.sy=0;if(G.mode==='play')G.mode='pause';});
const TOUCH={mx:0,my:0,sx:0,sy:0,btn:{}};
let usingTouch=false;
function setupTouch(){
  const stick=(id,kx,ky)=>{const el=document.getElementById(id),kn=el.querySelector('.knob');let tid=null;
    const upd=t=>{const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=t.clientX-cx,dy=t.clientY-cy;const m=Math.hypot(dx,dy),max=r.width/2;
      if(m>max){dx*=max/m;dy*=max/m;}kn.style.transform=`translate(${dx}px,${dy}px)`;const n=Math.hypot(dx,dy)/max;
      if(n<.22){TOUCH[kx]=0;TOUCH[ky]=0;}else{TOUCH[kx]=dx/max;TOUCH[ky]=dy/max;}};
    el.addEventListener('touchstart',e=>{e.preventDefault();auInit();const t=e.changedTouches[0];tid=t.identifier;upd(t);},{passive:false});
    el.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches)if(t.identifier===tid)upd(t);},{passive:false});
    const end=e=>{for(const t of e.changedTouches)if(t.identifier===tid){tid=null;TOUCH[kx]=0;TOUCH[ky]=0;kn.style.transform='';}};
    el.addEventListener('touchend',end);el.addEventListener('touchcancel',end);};
  stick('stL','mx','my');stick('stR','sx','sy');
  const btn=(id,k)=>{const el=document.getElementById(id);el.addEventListener('touchstart',e=>{e.preventDefault();auInit();TOUCH.btn[k]=true;PRESS['T_'+k]=true;},{passive:false});
    const up=e=>{TOUCH.btn[k]=false;};el.addEventListener('touchend',up);el.addEventListener('touchcancel',up);};
  btn('tbBomb','bomb');btn('tbAct','act');btn('tbPock','pock');btn('tbDrop','drop');btn('tbPause','pause');btn('tbMap','map');
}
setupTouch();
addEventListener('touchstart',()=>{if(!usingTouch){usingTouch=true;document.body.classList.add('touch');}},{passive:true});
let PAD={mx:0,my:0,sx:0,sy:0,b:[]},padPrev=[];
function pollPad(){const gp=navigator.getGamepads?[...navigator.getGamepads()].find(g=>g):null;if(!gp){PAD.mx=PAD.my=PAD.sx=PAD.sy=0;return;}
  const dz=v=>Math.abs(v)<.25?0:v;PAD.mx=dz(gp.axes[0]||0);PAD.my=dz(gp.axes[1]||0);PAD.sx=dz(gp.axes[2]||0);PAD.sy=dz(gp.axes[3]||0);
  const b=gp.buttons.map(x=>x.pressed);if(b[12])PAD.my=-1;if(b[13])PAD.my=1;if(b[14])PAD.mx=-1;if(b[15])PAD.mx=1;
  // 패드 버튼 → 가상 키 (Y/B/X/A 사격, LT 폭탄, RT 액티브, LB 카드, RB 교체, START 일시정지)
  const map={3:'PadUp',0:'PadDown',2:'PadLeft',1:'PadRight',6:'KeyE',7:'Space',4:'KeyQ',5:'ControlLeft',9:'Escape',8:'Tab'};
  for(const i in map){if(b[i]&&!padPrev[i]){PRESS[map[i]]=true;auInit();}KEY[map[i]]=!!b[i];}
  if(b[0]&&!padPrev[0])PRESS.PadA=true;if(b[12]&&!padPrev[12])PRESS.PadMU=true;if(b[13]&&!padPrev[13])PRESS.PadMD=true;if(b[14]&&!padPrev[14])PRESS.PadML=true;if(b[15]&&!padPrev[15])PRESS.PadMR=true;
  padPrev=b;}
// 한 프레임 입력 요약
const IN={mx:0,my:0,sx:0,sy:0};
function readInput(){
  pollPad();
  let mx=(KEY.KeyD?1:0)-(KEY.KeyA?1:0)+TOUCH.mx+PAD.mx,my=(KEY.KeyS?1:0)-(KEY.KeyW?1:0)+TOUCH.my+PAD.my;
  const m=Math.hypot(mx,my);if(m>1){mx/=m;my/=m;}IN.mx=mx;IN.my=my;
  let sx=0,sy=0;
  if(shootStack.length){[sx,sy]=SHOOTK[shootStack[shootStack.length-1]];}
  else if(KEY.PadUp)sy=-1;else if(KEY.PadDown)sy=1;else if(KEY.PadLeft)sx=-1;else if(KEY.PadRight)sx=1;
  else{const tx=TOUCH.sx||PAD.sx,ty=TOUCH.sy||PAD.sy;if(Math.hypot(tx,ty)>.3){if(Math.abs(tx)>Math.abs(ty))sx=sgn(tx);else sy=sgn(ty);}}
  IN.sx=sx;IN.sy=sy;
  IN.bomb=PRESS.KeyE||PRESS.ShiftLeft||PRESS.ShiftRight||PRESS.T_bomb;
  IN.act=PRESS.Space||PRESS.T_act;
  IN.pock=PRESS.KeyQ||PRESS.T_pock;
  IN.drop=PRESS.ControlLeft||PRESS.ControlRight||PRESS.T_drop;
  IN.pause=PRESS.Escape||PRESS.KeyP||PRESS.T_pause;
  IN.map=KEY.Tab||TOUCH.btn.map;
  IN.restart=KEY.KeyR;
  IN.up=PRESS.KeyW||PRESS.ArrowUp||PRESS.PadMU;IN.down=PRESS.KeyS||PRESS.ArrowDown||PRESS.PadMD;
  IN.left=PRESS.KeyA||PRESS.ArrowLeft||PRESS.PadML;IN.right=PRESS.KeyD||PRESS.ArrowRight||PRESS.PadMR;
  IN.ok=PRESS.Enter||PRESS.Space||PRESS.KeyE||PRESS.PadA||PRESS.NumpadEnter;
  IN.back=PRESS.Escape||PRESS.Backspace;
}
function clearPress(){for(const k in PRESS)delete PRESS[k];}
// 메뉴용 포인터 (캔버스 좌표)
const PTR={x:-1,y:-1,click:false};
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();PTR.x=(e.clientX-r.left)/r.width*W;PTR.y=(e.clientY-r.top)/r.height*H;PTR.click=true;auInit();});
cv.addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect();PTR.x=(e.clientX-r.left)/r.width*W;PTR.y=(e.clientY-r.top)/r.height*H;});

/* =========================================================
   소리 · 효과음
   ========================================================= */
const OPT=Object.assign({sfx:.8,music:.6},lsGet('cellBoundOpt',{}));
const saveOpt=()=>lsSet('cellBoundOpt',OPT);
const AU={c:null};
const mf=n=>440*Math.pow(2,(n-69)/12);
function mkCurve(k){const n=1024,c=new Float32Array(n);for(let i=0;i<n;i++){const x=i/(n-1)*2-1;c[i]=Math.tanh(k*x)/Math.tanh(k);}return c;}
function auInit(){
  if(AU.c){if(AU.c.state==='suspended')AU.c.resume();return;}
  try{const A=window.AudioContext||window.webkitAudioContext,c=new A();AU.c=c;
    const comp=c.createDynamicsCompressor();comp.threshold.value=-12;comp.ratio.value=4;comp.connect(c.destination);
    AU.m=c.createGain();AU.m.gain.value=.9;AU.m.connect(comp);
    AU.sfx=c.createGain();AU.sfx.gain.value=OPT.sfx;AU.sfx.connect(AU.m);
    AU.mus=c.createGain();AU.mus.gain.value=OPT.music*.5;AU.musF=c.createBiquadFilter();AU.musF.type='lowpass';AU.musF.frequency.value=18000;
    AU.mus.connect(AU.musF);AU.musF.connect(AU.m);
    // 기타 버스: 디스토션 → 캐비닛 → 좌우 더블링
    AU.gtr=c.createGain();AU.gtr.gain.value=1;const sh=c.createWaveShaper();sh.curve=mkCurve(18);sh.oversample='2x';
    const hp=c.createBiquadFilter();hp.type='highpass';hp.frequency.value=95;const pk=c.createBiquadFilter();pk.type='peaking';pk.frequency.value=650;pk.gain.value=-6;pk.Q.value=1;
    const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=4300;const out=c.createGain();out.gain.value=.16;
    AU.gtr.connect(sh);sh.connect(hp);hp.connect(pk);pk.connect(lp);lp.connect(out);
    const pl=c.createStereoPanner?c.createStereoPanner():null,pr=c.createStereoPanner?c.createStereoPanner():null,dl=c.createDelay(.1);dl.delayTime.value=.017;
    if(pl){pl.pan.value=-.55;pr.pan.value=.55;out.connect(pl);pl.connect(AU.mus);out.connect(dl);dl.connect(pr);pr.connect(AU.mus);}else out.connect(AU.mus);
    // 리드 기타 버스
    AU.lead=c.createGain();const sh2=c.createWaveShaper();sh2.curve=mkCurve(10);const lp2=c.createBiquadFilter();lp2.type='lowpass';lp2.frequency.value=5000;const lo=c.createGain();lo.gain.value=.07;
    const ld=c.createDelay(1);ld.delayTime.value=.28;const lfb=c.createGain();lfb.gain.value=.3;
    AU.lead.connect(sh2);sh2.connect(lp2);lp2.connect(lo);lo.connect(AU.mus);lo.connect(ld);ld.connect(lfb);lfb.connect(ld);ld.connect(AU.mus);
    // 베이스 버스
    AU.bass=c.createGain();const sh3=c.createWaveShaper();sh3.curve=mkCurve(3);const lp3=c.createBiquadFilter();lp3.type='lowpass';lp3.frequency.value=520;const bo=c.createGain();bo.gain.value=.34;
    AU.bass.connect(sh3);sh3.connect(lp3);lp3.connect(bo);bo.connect(AU.mus);
    AU.drum=c.createGain();AU.drum.gain.value=.85;AU.drum.connect(AU.mus);
    const n=c.sampleRate;AU.nb=c.createBuffer(1,n,n);const d=AU.nb.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
    MUS.next=c.currentTime+.1;setInterval(musicTick,40);
  }catch(e){AU.c=null;}
}
document.addEventListener('visibilitychange',()=>{if(!AU.c)return;if(document.hidden)AU.c.suspend();else AU.c.resume();});
function vo(o){const c=AU.c;if(!c)return;const t=(o.at!=null?o.at:c.currentTime)+(o.dl||0),d=Math.max(.01,o.d||.1),a=o.a||.004,r=o.r||.05,v=Math.max(.0006,o.v||.05),g=c.createGain();
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+a);if(o.hold)g.gain.setValueAtTime(v,t+Math.max(a,d-r));g.gain.exponentialRampToValueAtTime(.0005,t+d+r);
  let out=g;if(o.lp){const f=c.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(Math.max(20,o.lp),t);if(o.lp2)f.frequency.exponentialRampToValueAtTime(Math.max(20,o.lp2),t+d);f.Q.value=o.q||.7;g.connect(f);out=f;}
  out.connect(o.dest||AU.sfx);
  for(const dt of (o.det||[0])){const os=c.createOscillator();os.type=o.type||'square';os.frequency.setValueAtTime(Math.max(1,o.f||440),t);if(o.f2)os.frequency.exponentialRampToValueAtTime(Math.max(1,o.f2),t+(o.fd||d));os.detune.value=dt;
    if(o.vib){const l=c.createOscillator(),lg=c.createGain();l.frequency.value=o.vr||6;lg.gain.value=o.vib;l.connect(lg);lg.connect(os.detune);l.start(t);l.stop(t+d+r+.05);}
    os.connect(g);os.start(t);os.stop(t+d+r+.05);}}
function nz(o){const c=AU.c;if(!c)return;const t=(o.at!=null?o.at:c.currentTime)+(o.dl||0),d=Math.max(.01,o.d||.1),v=Math.max(.0006,o.v||.05),s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=AU.nb;s.loop=true;s.playbackRate.value=o.rate||1;
  f.type=o.ft||'bandpass';f.frequency.setValueAtTime(Math.max(20,o.f||2000),t);if(o.f2)f.frequency.exponentialRampToValueAtTime(Math.max(20,o.f2),t+d);f.Q.value=o.q||1;
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+(o.a||.002));g.gain.exponentialRampToValueAtTime(.0005,t+d);s.connect(f);f.connect(g);g.connect(o.dest||AU.sfx);s.start(t,Math.random()*.5);s.stop(t+d+.05);}
const SFX={
  shoot:()=>{vo({f:520+R()*80,f2:230,d:.07,type:'sine',v:.2});nz({d:.04,v:.07,f:3000});},
  shootBig:()=>{vo({f:300,f2:120,d:.12,type:'sine',v:.28});nz({d:.07,v:.1,f:1500});},
  tearHit:()=>{nz({d:.08,v:.12,f:2400,f2:900,q:1.4});vo({f:900,f2:400,d:.04,type:'sine',v:.05});},
  tearWall:()=>nz({d:.06,v:.08,f:3200,f2:1500,q:2}),
  hit:()=>{nz({d:.07,v:.14,f:900,f2:300});vo({f:180,f2:90,d:.06,type:'square',v:.06,lp:900});},
  die:()=>{nz({d:.28,v:.22,f:700,f2:150,q:.6});vo({f:140,f2:50,d:.18,type:'sawtooth',v:.08,lp:700});},
  splat:()=>{nz({d:.18,v:.18,f:500,f2:120,q:.8});},
  hurt:()=>{vo({f:520,f2:260,d:.32,type:'sawtooth',v:.11,lp:2200,vib:60,vr:14});nz({d:.15,v:.1,f:1200});},
  coin:()=>{vo({f:mf(88),d:.05,type:'square',v:.07});vo({f:mf(95),d:.2,type:'square',v:.07,dl:.06});},
  heart:()=>{vo({f:200,f2:420,d:.12,type:'sine',v:.2});vo({f:mf(84),d:.18,type:'triangle',v:.06,dl:.08});},
  soul:()=>{[76,81,88].forEach((n,i)=>vo({f:mf(n),d:.3,type:'sine',v:.06,dl:i*.05,vib:15}));},
  key:()=>{[0,1,2].forEach(i=>vo({f:2400+i*400,d:.04,type:'triangle',v:.06,dl:i*.05}));nz({d:.08,v:.05,f:7000,ft:'highpass'});},
  pickBomb:()=>{vo({f:220,f2:330,d:.08,type:'square',v:.08,lp:1500});},
  battery:()=>{vo({f:300,f2:1200,d:.25,type:'square',v:.06,lp:3000});},

  if(o.rot)ctx.rotate(o.rot);if(o.fx)ctx.scale(-1,1);if(o.sx||o.sy)ctx.scale(o.sx||1,o.sy||1);ctx.drawImage(s,-w/2,o.bottom?-h:-h/2,w,h);ctx.restore();}
// 발광 효과: 매 프레임 그라디언트를 새로 만들지 않도록 색상별로 미리 그려 둔 캔버스를 재사용 (모바일 성능 개선)
const GLOWC={};
function glowSpr(col){let c=GLOWC[col];if(c)return c;const cg=mkc(64,64);c=cg[0];const g=cg[1];const gr=g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,col);gr.addColorStop(.45,col.length===7?col+'88':col);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(0,0,64,64);return GLOWC[col]=c;}
function drawGlow(x,y,r,col,a){if(!(r>0)||!isFinite(x)||!isFinite(y))return;const al=a==null?.28:a;if(al<=0)return;ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=Math.min(1,al);
  ctx.imageSmoothingEnabled=true;ctx.drawImage(glowSpr(col),x-r,y-r,r*2,r*2);ctx.restore();}
function shade(hex,k){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;if(k<0){r*=1+k;g*=1+k;b*=1+k;}else{r+=(255-r)*k;g+=(255-g)*k;b+=(255-b)*k;}
  return '#'+[r,g,b].map(v=>Math.round(clamp(v,0,255)).toString(16).padStart(2,'0')).join('');}
function srand(s){return ()=>{s=(s*16807)%2147483647;return (s-1)/2147483646;};}

/* ---------- 캐릭터 (귀여운 SD 3D 젤리 도트) ---------- */
function headSpr(ch,dir,mode){
  // mode: 0=일반, 1=사격(> <), 2=깜빡임(- -), 3=아이템획득(^ ^)
  return spr(`h_${ch.id}_${dir}_${mode||0}`,26,24,(g)=>{
    const sk=ch.skin,dk2=shade(sk,-.36),dk=shade(sk,-.2),lt=shade(sk,.24),lt2=shade(sk,.48);
    // 뒷장식 (뿔, 더듬이, 귀, 캡시드)
    if(ch.id==='onco'){
      line(g,5,6,2,1,'#3a1848',3);line(g,20,6,23,1,'#3a1848',3);
      P(g,1,0,2,2,'#ff4070');P(g,22,0,2,2,'#ff4070');
    }
    if(ch.id==='neuron'){
      [[4,5,1,1],[21,5,24,1],[7,2,5,0],[18,2,20,0],[13,2,13,0]].forEach(a=>{
        line(g,a[0],a[1],a[2],a[3],'#f0b840',1);
        circ(g,a[2],a[3],1.4,'#fff4a0');P(g,a[2],a[3],1,1,'#7ae8ff');
      });
    }
    if(ch.id==='virion'){
      for(let i=0;i<10;i++){const a=i/10*Math.PI*2;
        line(g,13+Math.cos(a)*9,12+Math.sin(a)*9,13+Math.cos(a)*11.5,12+Math.sin(a)*11.5,'#5ab8ff');
        circ(g,13+Math.cos(a)*11.5,12+Math.sin(a)*11.5,1.2,'#d8f8ff');}
    }
    if(ch.id==='planaria'){
      // 귀여운 우파루파/플라나리아 귀 돌기
      ell(g,2,10,3,4,dk);ell(g,2.5,10,2.5,3.2,sk);P(g,1,9,2,2,'#ffa0b8');
      ell(g,23,10,3,4,dk);ell(g,22.5,10,2.5,3.2,sk);P(g,22,9,2,2,'#ffa0b8');
    }
    if(ch.id==='stem'){
      // 머리 위 귀여운 줄기 새싹 안테나
      line(g,13,3,13,0,'#ff8ad0',2);circ(g,11,0,1.6,'#9affb8');circ(g,15,0,1.6,'#8ae8ff');
    }
    // 3D 구형 머리 볼륨 (하단 암부 -> 본체 -> 상단 밝은면 -> 젤리 하이라이트)
    ell(g,13,12.5,10.5,9.8,dk2);
    ell(g,13,12,10.2,9.5,dk);
    ell(g,12.6,11.2,9.5,8.8,sk);
    ell(g,11.2,9.2,6.8,5.8,lt);
    ell(g,9,6.8,3.2,2.2,lt2);
    P(g,7,9,1,1,'#ffffff');
    // 캐릭터별 머리 디테일
    if(ch.id==='rbc'){
      // 귀여운 적혈구 베레모 오목 모자
      ell(g,13,5.5,7.5,3,'#c82030');ell(g,13,5,4.5,1.6,'#901420');P(g,8,4,3,1,'#ff9098');
    }
    if(ch.id==='wbc'){
      // 폭신한 면역 모자 + 보라색 핵 방울
      ell(g,13,4.8,7,2.5,'#d8d0ff');[[8,5],[13,4],[18,5]].forEach(([x,y])=>{circ(g,x,y,1.8,'#8a6ae0');P(g,x-1,y-1,1,1,'#f0e8ff');});
    }
    if(ch.id==='mito'){
      // 귀여운 양갈래 만두머리(불꽃 롤)
      circ(g,4,5,3.2,'#4a2218');circ(g,22,5,3.2,'#4a2218');
      P(g,6,3,2,2,'#ffd050');P(g,18,3,2,2,'#ffd050');
      ell(g,13,4.2,7.5,2.5,'#4a2218');P(g,9,3,8,1,'#7a3a28');
    }
    if(ch.id==='onco'){
      [[6,15],[19,14]].forEach(([x,y])=>circ(g,x,y,1.3,dk2));
    }
    if(dir==='u'){
      if(ch.id==='mito'){ell(g,13,9,9,6,'#4a2218');}
      return;
    }
    // 표정 & 초롱초롱한 큰 눈 + 볼터치
    const ey=12,ex=dir==='d'?[8.5,17.5]:dir==='l'?[6.5,13.5]:[12.5,19.5];
    const blushX=dir==='d'?[5,20]:dir==='l'?[4,16]:[9,21];
    // 양볼 핑크 볼터치
    ell(g,blushX[0],15,2.2,1.2,ch.id==='onco'?'#d04090':'#ff7a98');
    ell(g,blushX[1],15,2.2,1.2,ch.id==='onco'?'#d04090':'#ff7a98');
    for(let idx=0;idx<2;idx++){
      const x=ex[idx];
      if(mode===3){
        // 아이템 획득 시 기쁜 ^ ^ 눈
        line(g,x-2,ey,x,ey-2,'#1a0c10',2);line(g,x,ey-2,x+2,ey,'#1a0c10',2);
      }else if(mode===2){
        // 자연스러운 눈 깜빡임 (- -)
        P(g,x-2,ey,5,1,'#1a0c10');P(g,x-1,ey+1,3,1,dk2);
      }else if(mode===1){
        // 사격 시 귀여운 > < 표정
        if(idx===0){line(g,x-2,ey-2,x+1,ey,'#1a0c10',1);line(g,x+1,ey,x-2,ey+2,'#1a0c10',1);}
        else{line(g,x+2,ey-2,x-1,ey,'#1a0c10',1);line(g,x-1,ey,x+2,ey+2,'#1a0c10',1);}
      }else{
        // 평소 초롱초롱한 큰 SD 눈 (4x5) + 더블 하이라이트
        ell(g,x,ey,2.3,2.8,'#160a10');
        // 눈동자 하단 컬러 반사광
        const iris=ch.id==='onco'?'#ff3060':ch.id==='mito'?'#ffb830':ch.id==='virion'?'#5ae8ff':ch.id==='wbc'?'#a080ff':'#5a3850';
        P(g,x-1,ey+1,3,1,iris);
        // 큰 메인 안광 (2x2) + 서브 반짝이 (1x1)
        P(g,x-1.5,ey-2,2,2,'#ffffff');
        P(g,x+1,ey+1,1,1,'#ffffff');
      }
      if(ch.id==='wbc'&&idx===1&&mode===0){
        ring(g,x,ey,3.2,'#3a2850');P(g,x-2,ey-2,1,1,'#7ae8ff');
      }
      if(ch.tear&&(mode===0||mode===1)){
        P(g,x-1,ey+3,2,mode===1?3:2,ch.id==='virion'?'#7ae8ff':'#7ad0ff');
      }
    }
    // 귀여운 입 모양 (고양이 입 ω / 미소 / 사격 중 'o' 입)
    const mx=dir==='d'?13:dir==='l'?9.5:16.5;
    if(mode===3){
      ell(g,mx,16.5,2.2,1.6,'#6a1828');P(g,mx-1,16.5,2,1,'#ff8090');
    }else if(mode===1){
      circ(g,mx,16.5,1.4,'#4a1220');
    }else if(ch.id==='onco'){
      P(g,mx-2,16,4,1,'#3a0c18');P(g,mx-2,17,1,1,'#ffffff');P(g,mx+1,17,1,1,'#ffffff');
    }else{
      P(g,mx-2,16,1,1,'#5a1824');P(g,mx-1,17,1,1,'#5a1824');P(g,mx,16,1,1,'#5a1824');P(g,mx+1,17,1,1,'#5a1824');P(g,mx+2,16,1,1,'#5a1824');
    }
  });
}

function bodySpr(ch,dir,fr){
  return spr(`b_${ch.id}_${dir}_${fr}`,18,14,(g)=>{
    const sk=ch.skin,dk2=shade(sk,-.35),dk=shade(sk,-.2),lt=shade(sk,.22);
    if(ch.fly){
      const wy=fr%2?1:4;
      ell(g,3,wy+2,3.5,2.2,'#4a1e5a');ell(g,15,wy+2,3.5,2.2,'#4a1e5a');
      P(g,1,wy+1,2,1,'#d07aff');P(g,15,wy+1,2,1,'#d07aff');
    }
    // 플라나리아 귀여운 꼬리
    if(ch.id==='planaria'){ell(g,9,10,3.5,2.2,dk);}
    // 통통하고 둥근 3D 젤리 몸통
    ell(g,9,5.5,5.2,4.8,dk2);
    ell(g,9,5,4.8,4.4,sk);
    ell(g,8.2,4,3,2.5,lt);
    if(ch.id==='rbc'){ell(g,9,5,4.2,2.5,'#d02230');P(g,8,4,2,1,'#ff9aa0');}
    if(ch.id==='mito'){ell(g,9,5,2.8,2,'#ffd050');}
    if(ch.id==='virion'){ell(g,9,5,2.8,2,'#58a8f8');}
    // 종종걸음 귀여운 발
    const lg=fr%4,a=lg===1?1.5:lg===3?-1.5:0;
    if(dir==='l'||dir==='r'){
      ell(g,7+a,10.5,2,1.8,dk2);ell(g,7+a,10,1.8,1.5,sk);
      ell(g,11-a,10.5,2,1.8,dk2);ell(g,11-a,10,1.8,1.5,dk);
    }else{
      ell(g,6.5,10.5-(a>0?1:0),2,1.8,dk2);ell(g,6.5,10-(a>0?1:0),1.8,1.5,sk);
      ell(g,11.5,10.5-(a<0?1:0),2,1.8,dk2);ell(g,11.5,10-(a<0?1:0),1.8,1.5,sk);
    }
    // 동글동글한 손 (fr===9면 만세 포즈)
    if(fr===9){
      ell(g,3.5,2,2,2.2,sk);ell(g,14.5,2,2,2.2,sk);
    }else{
      const ay=lg===1?1:lg===3?-1:0;
      ell(g,3.5,5+ay,1.8,2.2,sk);ell(g,14.5,5-ay,1.8,2.2,dk);
    }
  });
}

/* ---------- 눈물 · 탄 (3D 구슬 음영) ---------- */
function tearSpr(col,r){const k=`t_${col}_${r}`;return spr(k,r*2+2,r*2+2,(g)=>{
  circ(g,r+1,r+1,r,shade(col,-.32));
  circ(g,r+.7,r+.7,r*.88,col);
  circ(g,r-.2*r+1,r-.2*r+1,r*.55,shade(col,.28));
  circ(g,r-.38*r+1,r-.38*r+1,Math.max(1.2,r*.28),'#ffffff');
},shade(col,-.58));}

  {n:'세포질',fl:'#7a5a50',fl2:'#6a4a42',wl:'#4a3030',wl2:'#5e3c3a',ac:'#c08a7a',rock:'#9a8a80',dot:'#a87a6a'},

  {n:'림프절',fl:'#4e5a48',fl2:'#424c3c',wl:'#2a3226',wl2:'#3a4434',ac:'#8aa86a',rock:'#8a948a',dot:'#6a7a5a'},
  {n:'핵',fl:'#3e3458',fl2:'#342a4a',wl:'#1e1830',wl2:'#2c2444',ac:'#8a7ad0',rock:'#7a7898',dot:'#5a4a8a'},
];

function rockSpr(th,v,kind){return spr(`rk_${th}_${v}_${kind}`,28,28,(g)=>{
  const c=kind==='metal'?'#8490a4':THEME[th].rock,rnd=srand(v*97+th*13+3);
  if(kind==='metal'){
    // 3/4 시점 입체 금속 큐브 (상단면 + 정면 두께 단면 + 리벳 + 하이라이트)
    P(g,2,16,24,10,'#343c4a'); // 정면 하단 암부
    P(g,2,14,24,10,'#525c6e'); // 정면 수직 단면
    for(let i=0;i<4;i++){P(g,5+i*5,16,2,7,'#3e4656');P(g,4+i*5,16,1,7,'#687488');} // 정면 홈
    P(g,2,3,24,12,c); // 상단면
    P(g,3,4,22,2,'#c8d4e6'); // 상단 전면 베벨 하이라이트
    P(g,3,13,22,2,'#687488'); // 상단-정면 경계 엣지
    line(g,5,11,13,5,'#b8c6da',2); // 대각선 금속 광택
    [[4,5],[22,5],[4,11],[22,11]].forEach(([x,y])=>{P(g,x,y,2,2,'#2e3644');P(g,x,y,1,1,'#dce8f8');});
    return;
  }
  if(kind==='urn'){
    g.clearRect(0,0,28,28);
    // 3/4 시점 입체 항아리(생체 단지): 둥근 몸체 음영 + 입구 두께 + 어두운 내부 구멍
    ell(g,14,24,9,3,'#3a2014'); // 바닥 접지 암부
    ell(g,14,16,10,9,'#5e3822'); // 우측/하단 깊은 음영
    ell(g,13,15.5,9,8.2,'#8e5838'); // 중간 톤
    ell(g,11.5,14.5,6.8,6.5,'#b47650'); // 좌상단 밝은 볼륨
    ell(g,9.5,12.5,3,3.5,'#da9c72'); // 하이라이트
    P(g,8,11,2,2,'#ffe0c0');
    // 항아리 장식 띠
    ell(g,14,16,9.5,2,'#6e4228');ell(g,13.5,15.5,9,1.2,'#d49858');
    // 목 & 3D 입구 림
    P(g,9,5,10,4,'#78482c');
    ell(g,14,5,6.5,2.8,'#c88a60');
    ell(g,14,5,4.5,1.6,'#221008'); // 입구 안쪽 어두운 구멍
    return;
  }
  // 3/4 시점 다면체 입체 바위 (하단 접지 + 정면 절벽 단면 + 좌/우 경사면 + 상단 고원면)
  ell(g,14,23,12.5,4.5,shade(c,-.48)); // 기저부 AO
  ell(g,14,17,12,8.5,shade(c,-.35)); // 정면 수직 절벽면
  ell(g,13.5,14.5,11.5,8,shade(c,-.14)); // 중간 경사면
  ell(g,12.8,11.5,10,6.5,c); // 상단면
  ell(g,11,9.5,7.2,4.2,shade(c,.24)); // 상단 좌측 수광면
  ell(g,9.5,8,3.8,2,shade(c,.42)); // 능선 하이라이트
  // 입체 균열과 단층선
  line(g,5,14,12,16,shade(c,-.42),1);line(g,12,16,21,13,shade(c,-.42),1);
  line(g,6,13,12,15,shade(c,.28),1);
  for(let i=0;i<3;i++){const x=6+rnd()*14,y=15+rnd()*6;line(g,x,y,x+1,y+3,shade(c,-.45));}
  if(kind==='tint'){
    // 색 바위: 박혀 있는 푸른 발광 크리스탈 결정
    line(g,9,14,7,7,'#2a68c8',3);line(g,9,14,7,7,'#7ad0ff',1);
    line(g,14,15,18,8,'#2a68c8',3);line(g,14,15,18,8,'#9ae8ff',1);
    line(g,12,17,13,10,'#4a90ff',2);P(g,7,7,2,2,'#ffffff');P(g,17,8,2,2,'#ffffff');
  }
});}

function poopSpr(stage,gold){return spr(`pp_${stage}_${gold?1:0}`,24,22,(g)=>{
  const c=gold?'#e8b830':'#825028',d2=shade(c,-.42),d=shade(c,-.24),l=shade(c,.26),l2=shade(c,.52);
  const s=4-stage;if(s<=0){ell(g,12,18,9,3,d2);ell(g,12,17,7,2,d);return;}
  // 1단 (하단 링: 3D 원기둥 음영)
  ell(g,12,17,10.5,4.2,d2);ell(g,12,16,10,4,d);ell(g,11.2,15.2,8.5,3.2,c);ell(g,9,14.5,4,1.8,l);
  if(s>1){
    // 2단
    ell(g,12,12.5,8,3.6,d2);ell(g,11.5,11.5,7.5,3.2,c);ell(g,9.5,10.8,4.2,2,l);P(g,7,10,2,1,l2);
  }
  if(s>2){
    // 3단 + 꼭지
    ell(g,12,8,5.2,2.8,d2);ell(g,11.5,7.2,4.8,2.5,c);ell(g,10.5,6.6,2.6,1.4,l);
    ell(g,12,4.2,2.2,2,c);P(g,11,3,2,1,l2);
  }
  P(g,6,14,2,2,l2);
});}

function fireSpr(fr,blue,out){return spr(`fi_${fr}_${blue?1:0}_${out?1:0}`,24,28,(g)=>{
  // 3D 장작더미 (원통형 측면 + 둥근 나무 단면 나이테)

  line(g,3,23,20,19,'#4e2a16',4);line(g,3,22,20,18,'#784424',2);

  circ(g,3,23,2,'#c89868');circ(g,21,23,2,'#c89868');circ(g,20,19,1.8,'#b88858');
  if(out){ell(g,12,21,5,2,'#3a3030');ell(g,12,21,3,1,'#ff5020');return;}
  const c0=blue?'#1a48c8':'#c82810',c1=blue?'#3a8aff':'#ff6a1a',c2=blue?'#8ad8ff':'#ffc838',c3='#ffffff',w=fr%2;
  ell(g,12,16,8,7,c0);ell(g,12,15,7,6,c1);

  ell(g,12,16,5,4.5,c2);P(g,10,7+w,4,8,c2);
  ell(g,12,17,2.8,2.5,c3);P(g,11,12,2,4,c3);
});}

function spikeSpr(on){return spr(`spk_${on?1:0}`,28,28,(g)=>{
  // 3D 오목 석판 + 원뿔형 입체 금속 가시
  P(g,1,1,26,26,'#221a22');P(g,2,2,24,24,'#342a36');
  P(g,2,2,24,2,'#18121a');P(g,2,2,2,24,'#18121a');
  P(g,2,24,24,2,'#4a3e4c');P(g,24,2,2,24,'#4a3e4c');
  for(let y=0;y<3;y++)for(let x=0;x<3;x++){
    const cx=6+x*8,cy=7+y*8;
    ell(g,cx,cy+1,3,1.5,'#120c14'); // 가시 구멍 홈
    if(on){
      P(g,cx+1,cy,3,2,'rgba(0,0,0,.45)'); // 가시 그림자
      line(g,cx,cy-6,cx-2,cy+1,'#e8ecf8',2); // 좌측 밝은 칼날면
      line(g,cx,cy-6,cx+2,cy+1,'#687084',2); // 우측 어두운 칼날면
      P(g,cx,cy-7,1,3,'#ffffff'); // 가시 끝 광택
    }else P(g,cx-1,cy,3,1,'#5a5060');
  }
},'#120c10');}

function heartShape(g,x,y,c,half,keepBg){if(half&&keepBg){g.save();g.beginPath();g.rect(x-1,y-1,6,12);g.clip();}
  circ(g,x+2.5,y+2.5,2.5,c);circ(g,x+6.5,y+2.5,2.5,c);for(let i=0;i<5;i++)P(g,x+i,y+3+i,9-2*i,1,c);
  if(half&&keepBg)g.restore();else if(half)g.clearRect(x+5,y-1,6,11);}
function heartSpr(kind){return spr('hp_'+kind,kind==='double'?14:11,kind==='double'?12:10,(g)=>{const c={red:'#e02a3a',half:'#e02a3a',soul:'#5a8aff',hsoul:'#5a8aff',black:'#2a2230',eternal:'#ffffff',double:'#e02a3a',bone:'#e8e0d0'}[kind];
  if(kind==='double'){heartShape(g,0,0,shade(c,-.18));heartShape(g,3,2,c);P(g,4,3,2,2,shade(c,.55));return;}
  heartShape(g,1,1,c,kind==='half'||kind==='hsoul');P(g,2,2,2,2,shade(c,.5));
  if(kind==='black')P(g,2,2,2,2,'#7a5a9a');if(kind==='eternal')P(g,4,4,2,2,'#ffe080');});}

  const [c,h]=map[kind];if(h)heartShape(g,1,1,'#3a1a20');heartShape(g,1,1,c,h,true);if(kind!=='empty')P(g,2,2,2,2,shade(c,.5));if(kind==='unk'){P(g,4,3,3,1,'#fff');P(g,6,4,1,1,'#fff');P(g,5,5,1,1,'#fff');P(g,5,7,1,1,'#fff');}});}
function coinSpr(kind,fr){return spr(`cn_${kind}_${fr}`,9,9,(g)=>{const c={penny:'#d08a3a',nickel:'#c8ccd8',dime:'#ffd040',lucky:'#5ad06a',sticky:'#d08a3a'}[kind];

function bombSpr(kind){return spr('bm_'+kind,12,13,(g)=>{const c=kind==='troll'?'#3a3a3a':kind==='gold'?'#e0b030':'#2a2a34';circ(g,6,8,5,c);P(g,5,1,3,3,'#6a6a7a');line(g,7,1,9,-1,'#c8a060');P(g,3,5,2,2,'#8a8aa0');

function keySpr(kind){return spr('ky_'+kind,7,12,(g)=>{const c=kind==='gold'?'#ffd040':'#c8ccd8';ring(g,3,3,2.5,c);ring(g,3,3,1.5,c);P(g,2,5,2,6,c);P(g,4,8,2,1,c);P(g,4,10,2,1,c);

function cardBack(kind){return spr('cb_'+kind,10,13,(g)=>{const c={tarot:'#6a3aa0',play:'#f0f0f0',rune:'#7a7a8a',spec:'#2a6a5a',bio:'#1e5a7a',rev:'#a03a5a'}[kind]||'#6a3aa0';
  P(g,0,0,10,13,c);P(g,1,1,8,11,shade(c,kind==='play'?-.05:.18));
  if(kind==='tarot'||kind==='rev'){P(g,4,3,2,7,'#ffd040');P(g,2,5,6,2,'#ffd040');}if(kind==='play'){heartShape(g,1,3,'#e02a3a');}
  if(kind==='rune'){line(g,3,3,7,9,'#7affd0');line(g,7,3,3,9,'#7affd0');}if(kind==='spec'){circ(g,5,6.5,2.5,'#ffd040');}

function chestSpr(kind,open){return spr(`ch_${kind}_${open?1:0}`,22,18,(g)=>{
  const c={brown:'#9a6436',gold:'#e0b034',red:'#b42830',stone:'#848894'}[kind]||'#9a6436';
  const dk2=shade(c,-.42),dk=shade(c,-.22),lt=shade(c,.28),lt2=shade(c,.5),trim=kind==='gold'?'#fff0a0':kind==='red'?'#ffd060':'#c8ccd8';
  // 하단 몸체 (3/4 시점 정면 + 상단 테두리)
  P(g,1,8,20,9,dk2);P(g,2,8,18,8,dk);P(g,3,8,14,7,c);
  // 세로 금속 띠
  P(g,4,8,2,8,trim);P(g,16,8,2,8,trim);
  if(!open){
    // 둥근 3D 아치형 상자 뚜껑
    ell(g,11,6,10,4,dk);ell(g,11,5.5,9.5,3.5,c);ell(g,11,4,8.5,2,lt);
    P(g,4,3,14,1,lt2);
    P(g,4,3,2,5,trim);P(g,16,3,2,5,trim);
  }else{

  P(g,9,6,4,5,'#3a2810');P(g,9,6,4,4,'#ffd850');P(g,10,8,2,2,'#2a1808');

function trapSpr(){return spr('trap',30,26,(g)=>{
  // 3/4 시점 입체 지하 통로 해치 (외곽 베벨 프레임 + 북쪽 수직 내벽 + 사다리)

  ell(g,15,13.5,11,8.5,'#050208');

function ctx_clip_trap(g){
  g.save();g.beginPath();g.ellipse(15,13.5,11,8.5,0,0,Math.PI*2);g.clip();
  ell(g,15,9,11,6,'#2e1e16');ell(g,15,8,10,4,'#422c20');
  // 입체 사다리
  P(g,19,5,2,18,'#7a5432');P(g,24,5,2,18,'#5a3c22');
  for(let y=7;y<22;y+=4)P(g,19,y,6,2,'#9a6e44');
  g.restore();
}

function effText(ef,p){
  const pk={coin:'동전',heart:'빨간 하트',soul:'소울 하트',bomb:'폭탄',key:'열쇠',batt:'배터리',card:'카드',pill:'알약',chest:'상자',black:'검은 하트',trinket:'장신구'};
  if(ef.startsWith('pk_'))return `${pk[ef.slice(3)]}${p>1?' '+p+'개':''} 드랍`;
  if(ef.startsWith('t_'))return `눈물에 ${TEAR_T[ef.slice(2)]} 효과`;
  if(ef.startsWith('s_'))return `${STAT_T[ef.slice(2)]} +${p}`;
  if(ef.startsWith('r_'))return `이번 방에서 ${STAT_T[ef.slice(2)]} +${p}`;
  if(ef.startsWith('f_'))return `영구히 ${STAT_T[ef.slice(2)]} +${p}`;
  return ({heal:p>=99?'체력 모두 회복':`빨간 하트 ${p/2}칸 회복`,soul:`소울 하트 ${p/2}칸`,black:`검은 하트 ${p/2}칸`,charge:`액티브 충전 +${p}`,fly:`아군 파지 ${p}마리`,spider:`아군 아메바 ${p}마리`,
    inv:`${p}초 무적`,nuke:`모든 적에게 ${p} 피해`,boom:'그 자리에서 폭발 (자신은 피해 없음)',ring:`사방으로 눈물 ${p}발`,creep:'적을 녹이는 산성 웅덩이',
    slowall:`모든 적 ${p}초 감속`,fearall:`모든 적 ${p}초 공포`,freezeall:`모든 적 ${p}초 동결`,charmone:`가까운 적 ${p}초 매혹`,poisonall:`모든 적 중독`,burnall:`모든 적 화상`,
    shield:'피해를 1번 막는 보호막',map:'지도 일부 공개',gold:`동전 ${p}개 획득`,heal_full:'체력 모두 회복',key1:'열쇠 1개 돌려받음',bomb1:'폭탄 1개 획득'})[ef]||ef;
}

const EN={};
function defE(id,o){EN[id]=Object.assign({id,spd:1,r:12,hp:10,w:16,h:16,fly:0},o);}
function orb3d(g,cx,cy,rx,ry,c){
  ell(g,cx+.5,cy+.8,rx,ry,shade(c,-.36));
  ell(g,cx,cy,rx,ry,c);
  ell(g,cx-rx*.2,cy-ry*.22,rx*.68,ry*.62,shade(c,.22));
  ell(g,cx-rx*.35,cy-ry*.38,Math.max(1.2,rx*.3),Math.max(1,ry*.26),shade(c,.52));
}
const eyes=(g,x1,x2,y,c)=>{
  const ec=c||'#1a0c10',hi=ec==='#ffffff'||ec==='#fff'?'#ff3050':'#ffffff';
  P(g,x1,y,3,3,ec);P(g,x2,y,3,3,ec);
  P(g,x1,y,1,1,hi);P(g,x2,y,1,1,hi);
};

function buildPools(){const p={tr:[],sh:[],bo:[],de:[],an:[],se:[]};for(const id in IT){for(const k of IT[id].pl)if(p[k])p[k].push(id);}return p;}
function newRun(cid){

  S={v:1,char:cid,floor:1,pools:buildPools(),pillMap,pillKnown:{},curse:null,devilTaken:0,devilSeen:0,hitFloor:0,kills:0,time:0,cleared:0,trans:{B:0,M:0},transDone:{},slowTears:0,won:0,seen:{},prevRoom:0,bossLag:1,bossSeen:[],timeStop:0};
  PL={x:DOORX,y:DOORY+60,vx:0,vy:0,r:13,ch:cid,maxH:ch.red*2,red:ch.red*2,sh:[],eternal:0,coins:ch.coins,bombs:ch.bombs,keys:ch.keys,goldKey:0,
    act:null,trk:[],pock:null,items:[],perm:{},buffs:[],fx:0,fy:1,inv:0,fireCd:0,chargeT:0,mantle:0,noRed:ch.noRed?1:0,lives:0,shieldT:0,star:0,jumpT:0,spinT:0,stunT:0,
    dash:null,rage:0,hurtRoom:0,holdT:0,walk:0,eye:0,allies:0,lastDir:{x:0,y:1},sx:1,sy:1,shotCnt:0,killCnt:0,funnyFace:0};
  for(let i=0;i<ch.soul;i++)PL.sh.push('s');for(let i=0;i<ch.black;i++)PL.sh.push('b');
  if(ch.act)PL.act={id:ch.act,ch:IT[ch.act].ch};
  if(ch.trk)PL.trk=[ch.trk];
  if(ch.pill)PL.pock={k:'pill',ci:pillColorOf(ch.pill)};
  for(const id of ch.pas)addItem(id,{quiet:1,init:1});
  for(const id of ch.pas)for(const k in S.pools)S.pools[k]=S.pools[k].filter(x=>x!==id);
  if(ch.act)for(const k in S.pools)S.pools[k]=S.pools[k].filter(x=>x!==ch.act);

function cntItem(id){let n=0;for(const x of PL.items)if(x===id)n++;return n;}
const hasItem=id=>PL.items.includes(id);
const hasTk=id=>PL.trk.includes(id);
function itemFlag(k){for(const id of PL.items)if(IT[id][k])return IT[id][k];return 0;}
function buffSum(k){let s=0;for(const b of PL.buffs)if(b.k===k)s+=b.v;return s;}
function recalc(){
  if(!PL)return;
  const ch=CH_BY[PL.ch];
  let dmgUp=0,dmgF=0,dmgM=ch.dmgM,tears=ch.tears,fdM=1,rng=ch.rng,spd=ch.spd,ss=ch.ss,luck=ch.luck,size=1,body=1;
  const tf={};let mode=ch.mode||null,multi=null,fly=!!ch.fly;
  const MODE_P={ebeam:6,brim:5,tech:4,xring:3.5,sword:3.2,lung:3,choc:2,lob:1};
  const addSt=st=>{for(const k in st){const v=st[k];
    if(k==='dmg')dmgUp+=v;else if(k==='dmgF')dmgF+=v;else if(k==='dmgM')dmgM*=v;else if(k==='tears')tears+=v;else if(k==='fdM')fdM=Math.max(fdM,v);else if(k==='rng')rng+=v;
    else if(k==='spd')spd+=v;else if(k==='ss')ss+=v;else if(k==='luck')luck+=v;else if(k==='size')size*=v;else if(k==='body')body*=v;}};
  for(const id of PL.items){const it=IT[id];if(!it)continue;if(it.st)addSt(it.st);
    if(it.tf)for(const f in it.tf)tf[f]=Math.min(1,(tf[f]||0)+it.tf[f]);
    if(it.mode&&(!mode||MODE_P[it.mode]>MODE_P[mode]))mode=it.mode;
    if(it.multi&&(!multi||it.multi.n>multi.n||it.multi.par&&!multi.par&&it.multi.n>=multi.n))multi=it.multi;
    if(it.fly)fly=true;}
  const meatLv=cntItem('meatcube');
  if(meatLv>1)dmgF+=(meatLv-1)*.45;
  // 미토콘드리아 미토 고유 특성: ATP 과출력 각성
  PL.mitoAwake=(PL.ch==='mito'&&(PL.red<=2||PL.hurtRoom));
  if(PL.mitoAwake){dmgF+=1.0;tears+=.4;spd+=.12;}
  // 장신구 상시 효과
  const lowHP=!PL.noRed&&PL.red<=2||PL.noRed&&PL.sh.length<=2,fullHP=PL.red>=PL.maxH&&PL.maxH>0;
  for(const id of PL.trk){const tk=TK[id];if(!tk||!tk.ef.startsWith('s_'))continue;
    if(tk.tr==='stat'||tk.tr==='low'&&lowHP||tk.tr==='full'&&fullHP)addSt({[tk.ef.slice(2)]:tk.p});}
  // 영구 변화 (알약 · 장신구 · 실험 · 줄기세포 분화)
  for(const k in PL.perm){const v=PL.perm[k];if(k==='dmg')dmgF+=v;else if(k==='body')body+=v;else addSt({[k]:v});}
  // 일시 버프
  for(const b of PL.buffs){
    if(b.k==='dmgF')dmgF+=b.v;else if(b.k==='tears')tears+=b.v;else if(b.k==='spd')spd+=b.v;else if(b.k==='rng')rng+=b.v;else if(b.k==='luck')luck+=b.v;else if(b.k==='ss')ss+=b.v;
    else if(b.k==='fly')fly=true;else if(b.k==='homing')tf.homing=1;else if(b.k==='twin'){if(!multi)multi={n:2,par:1};}else if(b.k==='body')body+=b.v;}
  if(hasItem('adrenaline')&&!PL.noRed)dmgF+=.4*Math.floor((PL.maxH-PL.red)/2);
  if(S&&S.transDone.M){fly=true;dmgF+=1;}
  if(S&&S.transDone.B)fly=true;
  PL.dmg=Math.max(.5,(3.5*Math.sqrt(1+1.2*Math.max(-.8,dmgUp))+dmgF)*dmgM);
  const fd30=tears>=0?16-6*Math.sqrt(tears*1.3+1):16-6*tears;
  PL.fd=Math.max(5,Math.round((Math.max(5,fd30)*fdM+1)*2));
  PL.tps=60/PL.fd;
  PL.rng=Math.max(1.5,rng);PL.range=PL.rng*TS;PL.ssv=Math.max(.6,ss);PL.ss=7*PL.ssv;PL.spdv=clamp(spd,.3,2);PL.spd=PL.spdv*3.0;PL.luck=luck;
  PL.size=size;PL.body=clamp(body,.6,2);PL.r=13*PL.body;PL.tf=tf;PL.mode=mode;PL.multi=multi;PL.flying=fly;
}
function buff(k,v,dur){PL.buffs.push({k,v,dur:typeof dur==='number'?'t':dur,t:typeof dur==='number'?dur:0});recalc();}
function tickBuffs(){let ch=false;for(const b of PL.buffs)if(b.dur==='t'&&--b.t<=0){b.dead=1;ch=true;}if(ch){PL.buffs=PL.buffs.filter(b=>!b.dead);recalc();}}
function clearBuffs(kind){const n=PL.buffs.length;PL.buffs=PL.buffs.filter(b=>b.dur!==kind);if(PL.buffs.length!==n)recalc();PL.rage=0;}

const heartSlots=()=>PL.maxH/2+Math.ceil(PL.sh.length/2);
function heal(n){
  if(n<=0)return 0;
  if(PL.noRed||PL.maxH<=0){if(n>=20)return addSoul(4,PL.ch==='onco'?'b':'s');return 0;}
  const b=PL.red;PL.red=Math.min(PL.maxH,PL.red+n);
  if(PL.red>b){
    fxText(PL.x,PL.y-30,'+♥','#ff5a6a');fxNova(PL.x,PL.y,55,'#ff5a6a',10);
    // 적혈구 에리 고유 특성: 산소 파동
    if(PL.ch==='rbc'&&WR.en.length){dmgArea(PL.x,PL.y,135,PL.dmg*2+10,true);fxRing(PL.x,PL.y,135,'#ff5060');}
    recalc();
  }
  return PL.red-b;
}
function addMax(n,fill){if(PL.noRed){addSoul(n*2);return;}for(let i=0;i<n;i++){if(heartSlots()>=12&&PL.sh.length)PL.sh.pop();if(PL.maxH>=24||heartSlots()>=12)break;PL.maxH+=2;}
  PL.red=Math.min(PL.maxH,PL.red+(fill==null?n*2:fill));recalc();}
function addSoul(n,kind){kind=kind||'s';let k=0;for(let i=0;i<n;i++){if(heartSlots()>=12&&PL.sh.length%2===0)break;PL.sh.push(kind);k++;}if(k){fxText(PL.x,PL.y-30,'+♥',kind==='b'?'#a87aff':'#7ab8ff');fxNova(PL.x,PL.y,50,kind==='b'?'#8a4aff':'#5aa8ff',9);recalc();}return k;}
function addEternal(){if(PL.eternal){PL.eternal=0;addMax(1,2);toastSmall('영원한 하트 2개 → 최대 체력 +1');}else PL.eternal=1;fxNova(PL.x,PL.y,70,'#fff8c0',14);sfx('holy');}
function invuln(f){PL.inv=Math.max(PL.inv,f);}
function hurtP(n,src,o){
  o=o||{};if(!PL||G.mode!=='play'&&G.mode!=='hold')return;
  if(!o.self){if(PL.inv>0||PL.shieldT>0||PL.jumpT>0||PL.star>0)return;
    if(PL.mantle){PL.mantle=0;sfx('shield');invuln(60);fxHex(PL.x,PL.y,'#8ae8ff');fxRing(PL.x,PL.y,68,'#ffffff');toastSmall('미엘린 보호막 발동!');return;}
    if(hasItem('thorn')&&R()<.25){invuln(30);fxRing(PL.x,PL.y,50,'#7aff8a');fxText(PL.x,PL.y-30,'가시 방어!','#8aff8a');return;}}
  if(!o.self&&itemFlag('glass'))n+=1;
  for(let i=0;i<n;i++){
    if(o.self&&PL.red>0&&(!PL.noRed&&(PL.red>1||PL.sh.length>0))){PL.red--;continue;}
    if(PL.sh.length){const idx=PL.sh.length-1,k=PL.sh.pop();if(k==='b'&&idx%2===0){dmgAll(40);flash('#3a1050');fxRing(PL.x,PL.y,240,'#b06aff');fxNova(PL.x,PL.y,150,'#7a30c0',22);fxText(PL.x,PL.y-42,'흑색 괴사 폭발!','#d89aff');}continue;}

  }

  fxBlood(PL.x,PL.y,1,'#ff3040');
  if(!o.self){S.hitFloor=1;const wasAwake=PL.mitoAwake;PL.hurtRoom=1;invuln(hasItem('platelet')?120:60);
    if(PL.ch==='mito'&&!wasAwake){fxNova(PL.x,PL.y,110,'#ffb830',20);fxRing(PL.x,PL.y,100,'#ffd050');toastSmall('ATP 과출력 각성!');}

function checkDeath(){

      PL.cloneBud=(PL.cloneBud||0)+1;invuln(180);flash('#ffd0e0');fxNova(PL.x,PL.y,160,'#ffd0e0',30);sfx('holy');toast('복제 배아 각성!','완전한 복제 세포로 부활했다','복제 세포 동료가 함께 싸운다');recalc();rebuildFams();return false;}

function addItem(id,o){o=o||{};const it=IT[id];if(!it)return;
  if(it.ty==='a'){PL.act={id,ch:it.ch};if(!o.quiet){toast(it.n,it.s,it.d);fxNova(PL.x,PL.y,85,'#ffe060',18);}sfx('item');return;}

    if(it.hp.soul)addSoul(it.hp.soul);if(it.hp.black)addSoul(it.hp.black,'b');}

  recalc();
  if(S)rebuildFams();

function chargeActive(n){if(!PL.act)return;const mx=IT[PL.act.id].ch;if(!mx)return;const was=PL.act.ch;PL.act.ch=Math.min(mx,PL.act.ch+n);if(was<mx&&PL.act.ch>=mx){sfx('charged');fxText(PL.x,PL.y-36,'충전 완료!','#8aff7a');}}

/* ---------- 장신구 발동 ---------- */
function trinketTrig(tr,ctx){

  for(const id of PL.trk){const tk=TK[id];if(!tk||tk.tr!==tr)continue;
    if(tr==='shoot')continue;

}
function tkEffect(tk,c){

  if(ef.startsWith('pk_')){const k=ef.slice(3);for(let i=0;i<p;i++){
      if(k==='soul')spawnPk('heart','soul',x+rnd(-20,20),y+rnd(10,30));else if(k==='black')spawnPk('heart','black',x,y+20);
      else if(k==='heart')spawnPk('heart','red',x+rnd(-20,20),y+rnd(10,30));else spawnPk(k,null,x+rnd(-20,20),y+rnd(10,30));}}
  else if(ef.startsWith('r_')){buff(ef.slice(2)==='dmg'?'dmgF':ef.slice(2),p,'room');}
  else if(ef.startsWith('f_')){const k=ef.slice(2);PL.perm[k]=(PL.perm[k]||0)+p;recalc();}
  else switch(ef){
    case 'heal':heal(p);break;case 'heal_full':heal(99);break;case 'soul':addSoul(p);break;case 'black':addSoul(p,'b');break;
    case 'charge':chargeActive(p);break;case 'fly':spawnAlly('fly',p);break;case 'spider':spawnAlly('spider',p);break;
    case 'inv':invuln(p*60);PL.shieldT=Math.max(PL.shieldT,p*60);break;case 'nuke':dmgAll(p);break;
    case 'boom':explode(x,y,{dmg:Math.max(40,PL.dmg*8),hurt:0});break;case 'ring':shootRing(x,y,p,{});break;
    case 'creep':addCreep(x,y,60,'acid',300);break;case 'slowall':statusAll('slow',p*60);break;case 'fearall':statusAll('fear',p*60);break;
    case 'freezeall':statusAll('freeze',p*60);break;case 'charmone':{const e=nearEnemy(x,y,true);if(e)setStatus(e,'charm',p*60);break;}
    case 'poisonall':statusAll('poison',180);break;case 'burnall':statusAll('burn',180);break;case 'shield':PL.mantle=1;break;
    case 'map':revealMap(1);break;case 'key1':giveKeys(1);break;case 'bomb1':giveBombs(1);break;case 'gold':giveCoins(p);break;
  }
  fxText(PL.x,PL.y-44,tk.n,'#ffe890');
}

/* =========================================================
   층 생성 (13×13 격자, 아이작 방식)
   ========================================================= */
const DIRS={u:[0,-1],d:[0,1],l:[-1,0],r:[1,0]},OPP={u:'d',d:'u',l:'r',r:'l'};
function genFloor(){
  const st=S.floor,target=Math.min(20,Math.floor(3.33*st)+ri(5,6));
  let fl=null;
  for(let tries=0;tries<400&&!fl;tries++)fl=tryFloor(target);
  if(!fl)fl=tryFloor(6);
  S.fl=fl;
  (S.bossSeen=S.bossSeen||[]).push(fl.boss);
  S.curse=null;
  if(S.floor>1&&R()<.22&&!hasItem('wingprot'))S.curse=pick(Object.keys(CURSES));
  S.hitFloor=0;
  const start=fl.rooms[fl.start];start.visited=1;start.seen=1;
  for(const d in start.doors)if(start.doors[d]!=null)fl.rooms[start.doors[d]].seen=1;
  S.cur=fl.start;
  for(const id of PL.items){const h=IT[id].on&&IT[id].on.floor;if(h)h();}
}
function tryFloor(target){
  const N=13,grid=[];for(let i=0;i<N;i++)grid.push(new Array(N).fill(-1));
  const rooms=[];const add=(x,y)=>{const r={id:rooms.length,gx:x,gy:y,type:'normal',doors:{u:null,d:null,l:null,r:null},cleared:0,visited:0,seen:0,pk:[],grid:null,en:null};grid[y][x]=r.id;rooms.push(r);return r;};
  const nb=(x,y)=>{let n=0;for(const d in DIRS){const nx=x+DIRS[d][0],ny=y+DIRS[d][1];if(nx>=0&&ny>=0&&nx<N&&ny<N&&grid[ny][nx]>=0)n++;}return n;};
  add(6,6);let q=[[6,6]],guard=0;
  while(q.length&&rooms.length<target&&guard++<300){const nq=[];
    for(const [x,y] of q){for(const d of shuffle(Object.keys(DIRS))){const nx=x+DIRS[d][0],ny=y+DIRS[d][1];
      if(nx<1||ny<1||nx>N-2||ny>N-2||grid[ny][nx]>=0||rooms.length>=target)continue;
      if(nb(nx,ny)>1||R()<.5)continue;add(nx,ny);nq.push([nx,ny]);}}
    if(!nq.length&&rooms.length<target)nq.push(...shuffle(rooms.map(r=>[r.gx,r.gy]).filter(([x,y])=>nb(x,y)<4)).slice(0,4));
    q=nq;}
  if(rooms.length<Math.min(target,7))return null;
  for(const r of rooms)for(const d in DIRS){const nx=r.gx+DIRS[d][0],ny=r.gy+DIRS[d][1];if(nx>=0&&ny>=0&&nx<N&&ny<N&&grid[ny][nx]>=0)r.doors[d]=grid[ny][nx];}
  const dist0=new Array(rooms.length).fill(-1);dist0[0]=0;const bq=[0];while(bq.length){const c=bq.shift();for(const d in rooms[c].doors){const n=rooms[c].doors[d];if(n!=null&&dist0[n]<0){dist0[n]=dist0[c]+1;bq.push(n);}}}
  const dead=rooms.filter(r=>r.id!==0&&Object.values(r.doors).filter(v=>v!=null).length===1).sort((a,b)=>dist0[b.id]-dist0[a.id]);
  if(dead.length<3)return null;
  const boss=dead[0];if(dist0[boss.id]<2)return null;boss.type='boss';
  const rest=shuffle(dead.slice(1));
  rest[0].type='treasure';rest[1].type='shop';
  if(rest[2]&&S.floor>1&&R()<.6)rest[2].type='curse';
  else if(rest[2]&&R()<.35)rest[2].type='sacrifice';
  if(rest[3]&&rest[3].type==='normal'&&R()<.4)rest[3].type='sacrifice';
  rooms[0].type='start';
  let best=null,bs=0;
  for(let y=1;y<N-1;y++)for(let x=1;x<N-1;x++){if(grid[y][x]>=0)continue;let s=0,bad=0;
    for(const d in DIRS){const v=grid[y+DIRS[d][1]][x+DIRS[d][0]];if(v>=0){if(rooms[v].type==='boss'||rooms[v].type==='secret')bad=1;else s++;}}
    if(bad)continue;s+=R()*.5;if(s>bs&&s>=1){bs=s;best=[x,y];}}
  const lock={};
  for(const r of rooms)if((r.type==='treasure'||r.type==='shop')&&S.floor>1){const nbId=Object.values(r.doors).find(v=>v!=null);lock[pairKey(r.id,nbId)]='key';}
  if(best){const sr=add(best[0],best[1]);sr.type='secret';
    for(const d in DIRS){const v=grid[best[1]+DIRS[d][1]][best[0]+DIRS[d][0]];if(v>=0&&v!==sr.id){sr.doors[d]=v;rooms[v].doors[OPP[d]]=sr.id;lock[pairKey(v,sr.id)]='bomb';}}}
  const bossId=pickBoss();
  return {rooms,start:0,lock,boss:bossId,grid};
}
function pickBoss(){if(S.floor===6)return 'mother';if(S.floor===8)return 'heart';
  const pool=BPOOL[Math.min(3,Math.floor((S.floor-1)/2))],seen=S.bossSeen||[],fresh=pool.filter(b=>!seen.includes(b));return pick(fresh.length?fresh:pool);}
const pairKey=(a,b)=>a<b?a+'-'+b:b+'-'+a;
function doorLock(r,d){
  const n=r.doors[d];if(n==null)return null;
  const k=S.fl.lock[pairKey(r.id,n)];
  if(k==='bomb'&&hasItem('xray'))return null;
  // 보물방/상점 내부에서 밖으로 나갈 때는 잠금 없이 항상 열림 (소프트락 방지)
  if(k==='key'&&(r.type==='treasure'||r.type==='shop')){delete S.fl.lock[pairKey(r.id,n)];return null;}
  return k||null;
}

/* ---------- 방 내용물 생성 ---------- */
function emptyGrid(){const g=[];for(let r=0;r<ROWS;r++)g.push(new Array(COLS).fill(0));return g;}
function mkTile(ch){
  switch(ch){case 'r':return {t:'rock',v:ri(0,3)};case 't':return {t:'tint',v:0};case 'm':return {t:'metal'};case 'p':return {t:'poop',hp:4,gold:R()<.02};
    case 'x':return {t:'pit'};case 's':return {t:'spike'};case 'f':return {t:'fire',hp:4,blue:R()<.08};case 'u':return {t:'urn',hp:1};}return 0;}
function prepRoom(r){
  if(r.grid)return;
  r.grid=emptyGrid();r.en=[];
  const C=tileC;
  if(r.type==='normal'){
    let lay=pick(LAYOUTS).split('\n');const fx=R()<.5,fy=R()<.5;
    const marks=[];
    for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const sx=fx?COLS-1-x:x,sy=fy?ROWS-1-y:y,ch=lay[sy][sx];
      if(ch==='e')marks.push([x,y]);else r.grid[y][x]=mkTile(ch);}
    const rocks=[];for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(r.grid[y][x]&&r.grid[y][x].t==='rock')rocks.push([x,y]);
    if(rocks.length&&R()<.18){const [x,y]=pick(rocks);r.grid[y][x]={t:'tint',v:0};}
    fixPaths(r);
    const pool=EPOOL[chap()];
    const types=shuffle(pool.slice()).slice(0,R()<.5?1:2);
    if(R()<.08&&S.floor>0){const k=pick(['slot','blood','beggar','chest','chest','pickups']);
      if(k==='pickups'){for(let i=0;i<3;i++)r.pk.push(mkPk(pick(['coin','heart','bomb','key']),null,DOORX+rnd(-100,100),DOORY+rnd(-60,60)));}
      else{let c=null;for(let i=0;i<40&&!c;i++){const t=freeTile(r);if(t&&t[0]!==6&&t[1]!==3&&t[1]>0&&t[1]<6)c=t;}const p=c?tileC(c[0],c[1]):tileC(3,1);r.grid[c?c[1]:1][c?c[0]:3]=0;
        r.pk.push(mkPk(k==='chest'?'chest':k,k==='chest'?(R()<.3?'gold':'brown'):null,p.x,p.y));}return;}
    let n=marks.length;if(!n){for(let i=0;i<3+Math.floor(S.floor/3);i++){const c=freeTile(r);if(c)marks.push(c);}n=marks.length;}
    marks.forEach(([x,y],i)=>{const id=types[i%types.length];carveTo(r,x,y);const p=C(x,y);r.en.push({id,x:p.x,y:p.y});});
    if(r.en.length>6)r.en.length=6;
  }
  else if(r.type==='boss'){const sp=[[1,1],[11,1],[1,5],[11,5]];if(R()<.5)sp.forEach(([x,y])=>r.grid[y][x]={t:'rock',v:ri(0,3)});r.boss=S.fl.boss;}
  else if(r.type==='treasure'){const p=C(6,3);r.pk.push(mkPk('item',drawItem('tr'),p.x,p.y));if(R()<.4){[[2,1],[10,5]].forEach(([x,y])=>r.grid[y][x]={t:'rock',v:1});}}
  else if(r.type==='shop'){
    {const kp=C(6,2);r.pk.push(mkPk('keeper',null,kp.x,kp.y));}
    const slots=[[3,4],[5,4],[7,4],[9,4]];const nItems=R()<.5?2:1;
    slots.forEach(([x,y],i)=>{const p=C(x,y);let k;
      if(i<nItems){k=mkPk('item',drawItem('sh'),p.x,p.y);k.price=15;}
      else{const kind=pick(['heart','bomb','key','card','pill','batt','heart']);k=mkPk(kind,kind==='heart'?'red':kind==='batt'?'normal':kind==='bomb'?'one':null,p.x,p.y);k.price=kind==='heart'?3:5;}
      r.pk.push(k);});}
  else if(r.type==='secret'){const p=C(6,3);
    if(R()<.5)r.pk.push(mkPk('item',drawItem('se'),p.x,p.y));
    else{for(let i=0;i<ri(4,7);i++)r.pk.push(mkPk(pick(['coin','coin','heart','bomb','key']),null,p.x+rnd(-90,90),p.y+rnd(-50,50)));}}
  else if(r.type==='curse'){const p=C(6,3);
    if(R()<.5)r.pk.push(mkPk('chest','red',p.x,p.y));else{r.pk.push(mkPk('chest','red',p.x-60,p.y));r.pk.push(mkPk('chest','red',p.x+60,p.y));}
    const pool=EPOOL[chap()];for(let i=0;i<3;i++){const c=freeTile(r);if(c){const q=C(c[0],c[1]);r.en.push({id:pick(pool),x:q.x,y:q.y});}}}
  else if(r.type==='sacrifice'){r.grid[3][6]={t:'spike',sac:1};r.sacN=0;}
  else if(r.type==='devil'||r.type==='angel'){const n=r.type==='devil'?ri(2,3):ri(1,2);const xs=n===1?[6]:n===2?[4,8]:[3,6,9];
    xs.forEach(x=>{const p=C(x,4);const k=mkPk('item',drawItem(r.type==='devil'?'de':'an'),p.x,p.y);if(r.type==='devil')k.devil=1;r.pk.push(k);});
    {const sp=C(6,2);r.pk.push(mkPk('statue',r.type,sp.x,sp.y));}if(r.type==='devil'){r.grid[1][2]={t:'fire',hp:4};r.grid[1][10]={t:'fire',hp:4};}}
}
function freeTile(r){for(let k=0;k<60;k++){const x=ri(1,COLS-2),y=ri(1,ROWS-2);if(!r.grid[y][x]&&!(x===6&&y===3))return [x,y];}return null;}
const solidT=t=>t&&(t.t==='rock'||t.t==='tint'||t.t==='metal'||t.t==='poop'||t.t==='fire'||t.t==='urn');
const blockWalk=t=>t&&(solidT(t)||t.t==='pit');
function carveTo(r,x,y){
  const seen=new Set(['6,0']);const q=[[6,0]];while(q.length){const [cx,cy]=q.shift();for(const d of Object.values(DIRS)){const nx=cx+d[0],ny=cy+d[1];if(!inRoom(nx,ny)||seen.has(nx+','+ny)||blockWalk(r.grid[ny][nx]))continue;seen.add(nx+','+ny);q.push([nx,ny]);}}
  if(seen.has(x+','+y))return;
  if(blockWalk(r.grid[y][x]))r.grid[y][x]=0;
  let cx=x,cy=y;for(let k=0;k<30&&!seen.has(cx+','+cy);k++){if(cy!==0)cy--;else if(cx!==6)cx+=sgn(6-cx);else break;if(blockWalk(r.grid[cy][cx]))r.grid[cy][cx]=0;}
}
function fixPaths(r){
  const doorT=[[6,0],[6,6],[0,3],[12,3]];
  for(const [x,y] of doorT){r.grid[y][x]=0;}
  [[6,1],[6,5],[1,3],[11,3]].forEach(([x,y])=>{if(blockWalk(r.grid[y][x]))r.grid[y][x]=0;});
  for(let k=0;k<30;k++){
    const seen=new Set(['6,0']);const q=[[6,0]];while(q.length){const [x,y]=q.shift();for(const d of Object.values(DIRS)){const nx=x+d[0],ny=y+d[1];if(!inRoom(nx,ny)||seen.has(nx+','+ny)||blockWalk(r.grid[ny][nx]))continue;seen.add(nx+','+ny);q.push([nx,ny]);}}
    const miss=doorT.find(([x,y])=>!seen.has(x+','+y))||(seen.has('6,3')?null:[6,3]);
    if(!miss)return;
    let [x,y]=miss;while(x!==6||y!==3){if(blockWalk(r.grid[y][x]))r.grid[y][x]=0;if(x!==6)x+=sgn(6-x);else y+=sgn(3-y);}
    r.grid[3][6]=blockWalk(r.grid[3][6])?0:r.grid[3][6];
  }
}

/* =========================================================
   방 입장 · 이동
   ========================================================= */
function enterRoom(id,fromSide,o){
  o=o||{};
  const prevRoom=RM;G.bossIntro=null;
  if(prevRoom&&!prevRoom.special)S.prevRoom=prevRoom.id;
  RM=S.fl.rooms[id];S.cur=id;
  prepRoom(RM);
  clearBuffs('room');S.slowTears=0;S.timeStop=0;BEAMS=[];
  WR.en=[];WR.t=[];WR.et=[];WR.bombs=[];WR.fx=[];WR.creep=[];WR.las=[];WR.misc=[];WR.timers=[];WR.pk=RM.pk;
  WR.fam=WR.fam.filter(f=>!f.room);
  RM.visited=1;RM.seen=1;for(const d in RM.doors){const n=RM.doors[d];if(n!=null&&(doorLock(RM,d)!=='bomb'))S.fl.rooms[n].seen=1;}
  if(fromSide){const s=OPP[fromSide];const p=doorPos(s);const inw={u:[0,1],d:[0,-1],l:[1,0],r:[-1,0]}[s];PL.x=p.x+inw[0]*48;PL.y=p.y+inw[1]*48;}
  else if(!o.keepPos||!RM.cleared){PL.x=DOORX;PL.y=DOORY+(RM.type==='start'?60:0);if(RM.type==='treasure'||RM.type==='secret'||RM.type==='devil'||RM.type==='angel')PL.y=DOORY+100;}
  PL.vx=PL.vy=0;PL.hurtRoom=0;PL.chargeT=0;PL.dash=null;recalc();
  for(const f of WR.fam){f.x=PL.x;f.y=PL.y;}
  if(!RM.cleared){
    for(const s of RM.en)spawnEnemy(s.id,s.x,s.y,{appear:1});
    if(RM.type==='boss')spawnBoss(RM.boss);
    if(!WR.en.length&&RM.type!=='boss')RM.cleared=1;
  }
  if(RM.trap)WR.misc.push({k:'trap',x:RM.trap.x,y:RM.trap.y,arm:20,needLeave:Math.hypot(PL.x-RM.trap.x,PL.y-RM.trap.y)<55?1:0});
  if(WR.en.length){sfx('doorShut');}
  // 저주방 문 피해: 비행·무적·보호막·미엘린을 존중하도록 수정
  if(fromSide&&!PL.flying&&(RM.type==='curse'||prevRoom&&prevRoom.type==='curse'))hurtP(1,'저주방 가시 문');
  if(!o.load){for(const id2 of PL.items){const h=IT[id2].on&&IT[id2].on.enter;if(h)h();}
    trinketTrig('enter',{x:PL.x,y:PL.y});}
  if(RM.type==='devil'&&!RM.greet){RM.greet=1;sfx('devil');S.devilSeen=1;}
  if(RM.type==='angel'&&!RM.greet){RM.greet=1;sfx('angel');}
  if(RM.type==='secret'&&!RM.greet){RM.greet=1;sfx('secret');}
  updateMood();
  rebuildFams(true);
  if(!o.noSave)saveRun();
}
function updateMood(){
  if(!S){setMusic('title');return;}
  if(RM&&RM.type==='boss'&&!RM.cleared)setMusic(S.floor>=6&&(S.floor===6||S.floor===8)?'final':'boss');
  else if(RM&&(RM.type==='shop'||RM.type==='devil'||RM.type==='angel'))setMusic('shop');
  else setMusic('ch'+(chap()+1));
}
function doorPos(s){return s==='u'?{x:DOORX,y:RY}:s==='d'?{x:DOORX,y:RY+RH}:s==='l'?{x:RX,y:DOORY}:{x:RX+RW,y:DOORY};}
function doorState(s){const n=RM.doors[s];if(n==null)return 'none';const lk=doorLock(RM,s);
  if(lk==='bomb')return 'hidden';if(lk==='key')return 'locked';if(!RM.cleared&&WR.en.some(e=>!e.ally&&!e.dead))return 'closed';return 'open';}
function doorType(s){const n=RM.doors[s];if(n==null)return null;const o=S.fl.rooms[n];
  if(['boss','treasure','shop','secret','curse','devil','angel'].includes(o.type))return o.type;
  if(['boss','curse','devil','angel','secret'].includes(RM.type))return RM.type;return 'normal';}
function tryDoor(s){
  const st=doorState(s);
  if(st==='locked'){
    if(PL.goldKey||PL.keys>0){if(!PL.goldKey)PL.keys--;delete S.fl.lock[pairKey(RM.id,RM.doors[s])];sfx('unlock');fxNova(doorPos(s).x,doorPos(s).y,48,'#ffd040',12);trinketTrig('key',{x:PL.x,y:PL.y});}

function startTrans(to,side){if(G.trans)return;G.trans={to,side,t:0};sfx('door');}
function tickTrans(){const tr=G.trans;if(!tr)return;tr.t++;

function openAllDoors(secretToo){for(const d in RM.doors){const n=RM.doors[d];if(n==null)continue;const k=pairKey(RM.id,n);if(S.fl.lock[k]==='key'||secretToo&&S.fl.lock[k]==='bomb')delete S.fl.lock[k];}

function openSecretDoors(){for(const k in S.fl.lock)if(S.fl.lock[k]==='bomb')delete S.fl.lock[k];}
function revealMap(lv){for(const r of S.fl.rooms){if(lv>=2&&r.type!=='secret')r.seen=1;if(lv===1&&!['normal','secret'].includes(r.type))r.seen=1;if(lv>=3)r.seen=1;if(lv===4&&r.type==='secret')r.seen=1;}}
function teleport(kind){
  let tgt=null;const rs=S.fl.rooms;
  if(kind==='random')tgt=pick(rs.filter(r=>r!==RM&&r.type!=='secret'&&r.type!=='devil'&&r.type!=='angel'));
  else if(kind==='start')tgt=rs[S.fl.start];
  else if(kind==='devil'){tgt=getDevilRoom(true);}
  else tgt=rs.find(r=>r.type===kind);
  if(!tgt){toastSmall('갈 수 있는 곳이 없습니다');return false;}
  if(tgt===RM&&kind!=='random'){toastSmall('이미 여기에 있습니다');return false;}
  sfx('teleport');flash('#ffffff');fxNova(PL.x,PL.y,90,'#b08aff',20);
  // 순간이동한 방의 잠긴 문/비밀문 자동 개방 (소프트락 방지)
  for(const d in tgt.doors){const n=tgt.doors[d];if(n!=null){const pk=pairKey(tgt.id,n);if(S.fl.lock[pk]==='key'||(tgt.type==='secret'&&S.fl.lock[pk]==='bomb'))delete S.fl.lock[pk];}}
  addTimer(1,()=>enterRoom(tgt.id,null));return true;
}
function getDevilRoom(fromTele){
  let r=S.fl.rooms.find(x=>x.type==='devil'||x.type==='angel');
  if(r)return r;
  r={id:S.fl.rooms.length,gx:-9,gy:-9,type:S.devilTaken||!S.devilSeen||R()<.5?'devil':'angel',doors:{u:null,d:null,l:null,r:null},cleared:1,visited:0,seen:1,pk:[],grid:null,en:null,special:1,teleOnly:fromTele?1:0};
  if(fromTele)r.doors.d=S.cur||S.fl.start;

}
function maybeDevilDoor(){

}
function nextFloor(){

  if(PL.eternal){PL.eternal=0;addMax(1,2);toastSmall('영원한 하트 → 최대 체력 +1');}

function tileAt(x,y){const c=Math.floor((x-RX)/TS),r=Math.floor((y-RY)/TS);if(!inRoom(c,r))return null;return RM.grid[r][c];}
function hitsGrid(x,y,r,walk){const c0=Math.floor((x-r-RX)/TS),c1=Math.floor((x+r-RX)/TS),r0=Math.floor((y-r-RY)/TS),r1=Math.floor((y+r-RY)/TS);
  for(let rr=r0;rr<=r1;rr++)for(let cc=c0;cc<=c1;cc++){if(!inRoom(cc,rr))continue;const t=RM.grid[rr][cc];if(!t)continue;
    if(!(solidT(t)||walk&&t.t==='pit'))continue;
    const tx=RX+cc*TS,ty=RY+rr*TS,pad=t.t==='pit'?10:4;const nx=clamp(x,tx+pad,tx+TS-pad),ny=clamp(y,ty+pad,ty+TS-pad);if((x-nx)**2+(y-ny)**2<r*r)return {c:cc,r:rr,t};}
  return null;}
function wallClamp(e,isP){
  const r=e.r*.8;
  let minX=RX+r,maxX=RX+RW-r,minY=RY+r,maxY=RY+RH-r;
  if(isP){const near=(a,b)=>Math.abs(a-b)<22;
    if(near(e.x,DOORX)&&RM.doors.u!=null&&doorState('u')==='open')minY=RY-40;
    if(near(e.x,DOORX)&&RM.doors.d!=null&&doorState('d')==='open')maxY=RY+RH+40;
    if(near(e.y,DOORY)&&RM.doors.l!=null&&doorState('l')==='open')minX=RX-40;
    if(near(e.y,DOORY)&&RM.doors.r!=null&&doorState('r')==='open')maxX=RX+RW+40;
    if(e.y<RY||e.y>RY+RH){minX=Math.max(minX,DOORX-22);maxX=Math.min(maxX,DOORX+22);}
    if(e.x<RX||e.x>RX+RW){minY=Math.max(minY,DOORY-22);maxY=Math.min(maxY,DOORY+22);}}
  let hit=false;
  if(e.x<minX){e.x=minX;hit=true;}if(e.x>maxX){e.x=maxX;hit=true;}if(e.y<minY){e.y=minY;hit=true;}if(e.y>maxY){e.y=maxY;hit=true;}
  return hit;}
function moveEnt(e,dx,dy,o){o=o||{};let bx=false,by=false;
  const walk=!o.fly,steps=Math.max(1,Math.ceil(Math.max(Math.abs(dx),Math.abs(dy))/8));
  for(let i=0;i<steps;i++){
    e.x+=dx/steps;if(!o.ghost&&!o.fly&&hitsGrid(e.x,e.y,e.r*.85,walk)){if(o.crush){crushAt(e.x,e.y,e.r);}else{e.x-=dx/steps;bx=true;}}
    else if(o.fly&&!o.ghost&&o.solidFly&&hitsGrid(e.x,e.y,e.r*.85,false)){e.x-=dx/steps;bx=true;}
    e.y+=dy/steps;if(!o.ghost&&!o.fly&&hitsGrid(e.x,e.y,e.r*.85,walk)){if(o.crush){crushAt(e.x,e.y,e.r);}else{e.y-=dy/steps;by=true;}}
    else if(o.fly&&!o.ghost&&o.solidFly&&hitsGrid(e.x,e.y,e.r*.85,false)){e.y-=dy/steps;by=true;}
  }
  const w=wallClamp(e,o.player);
  return {bx,by,w};}
function crushAt(x,y,r){const h=hitsGrid(x,y,r,false);if(h&&h.t.t!=='metal'&&h.t.t!=='pit')breakTile(h.c,h.r);}
function breakTile(c,r,byBomb){const t=RM.grid[r][c];if(!t)return;const p=tileC(c,r);
  if(t.t==='metal'||t.t==='pit')return;
  if(t.t==='spike'){if(t.sac)return;RM.grid[r][c]=0;return;}
  RM.grid[r][c]=0;
  if(t.t==='rock'){sfx('rock');fxDebris(p.x,p.y,THEME[chap()].rock);fxRing(p.x,p.y,28,THEME[chap()].ac);}
  else if(t.t==='tint'){sfx('rock');fxDebris(p.x,p.y,'#5a8aff');fxNova(p.x,p.y,55,'#7ab8ff',14);spawnPk(pick(['heart','bomb','key','bomb']),R()<.5?'soul':null,p.x,p.y);if(R()<.3)spawnPk('chest','brown',p.x,p.y);}
  else if(t.t==='poop'){sfx('poop');fxDebris(p.x,p.y,t.gold?'#ffd040':'#7a4a24');if(t.gold)for(let i=0;i<ri(3,6);i++)spawnPk('coin','penny',p.x,p.y);else if(R()<.12)dropRandom(p.x,p.y);}
  else if(t.t==='fire'){sfx('fire');fxSmoke(p.x,p.y,t.blue?'#6ab8ff':'#ff9040');if(R()<.15||(t.blue&&byBomb&&R()<.35))spawnPk(t.blue?'heart':pick(['coin','heart','bomb','key']),t.blue?'soul':null,p.x,p.y);}
  else if(t.t==='urn'){sfx('rock');fxDebris(p.x,p.y,'#a87048');if(R()<.4)spawnPk(pick(['coin','coin','heart','key','bomb']),null,p.x,p.y);else if(R()<.15)spawnEnemy('amoeba',p.x,p.y,{});}
}
function hitTile(c,r,dmg){const t=RM.grid[r][c];if(!t)return;if(t.t==='poop'||t.t==='fire'||t.t==='urn'){if(t.t==='fire'&&t.blue)return;t.hp-=1;fxSpark(tileC(c,r).x,tileC(c,r).y,t.t==='fire'?'#ffb050':'#8a5a30');if(t.t==='poop')sfx('poop');if(t.hp<=0)breakTile(c,r);}}

  PL.sx=lerp(PL.sx||1,1,.18);PL.sy=lerp(PL.sy||1,1,.18);
  const spdMag=Math.hypot(PL.vx,PL.vy);

  if(PL.dash){tx=PL.dash.vx;ty=PL.dash.vy;PL.vx=tx;PL.vy=ty;

    if(--PL.dash.t<=0)PL.dash=null;
    for(const e of WR.en)if(!e.ally&&!e.inv&&!e.nohit&&dist(e,PL)<e.r+PL.r+8&&!(e.dashHit===S.time)){e.dashHit=S.time;damageEnemy(e,PL.dmg*2+5,{kx:PL.vx*.35,ky:PL.vy*.35});fxSlash(e.x,e.y,Math.atan2(PL.vy,PL.vx),28,'#7ae8ff');}}
  else{PL.vx+=(tx-PL.vx)*.24;PL.vy+=(ty-PL.vy)*.24;}
  if(PL.star>0&&S.time%3===0){const c=['#ff5050','#ffd040','#50ff80','#50a0ff','#d050ff'][Math.floor(S.time/3)%5];WR.fx.push({k:'after',x:PL.x,y:PL.y,ch:PL.ch,sc:PL.body,c,t:0,life:10});}
  const crush=PL.buffs.some(b=>b.k==='crush');
  const fly=PL.flying||PL.jumpT>0;
  moveEnt(PL,PL.vx,PL.vy,{fly,player:1,crush});
  if(Math.abs(PL.vx)+Math.abs(PL.vy)>.4){
    const prevW=Math.floor(PL.walk*2);
    PL.walk+=.16*clamp(spdMag/2.5,.6,1.35);
    if(Math.floor(PL.walk*2)!==prevW&&!fly){
      WR.fx.push({k:'smoke',x:PL.x+rnd(-5,5),y:PL.y+12,vx:-PL.vx*.15,vy:-.2,c:THEME[chap()].ac,t:0,life:14,s:4});
    }
    if(PL.ch==='rbc'&&S.time%14===0)WR.fx.push({k:'p',x:PL.x+rnd(-6,6),y:PL.y+6,vx:rnd(-.3,.3),vy:-rnd(.5,1.1),c:'#ff7080',t:0,life:20,s:3,glow:1});
  }
  if(Math.hypot(IN.mx,IN.my)>.3&&!IN.sx&&!IN.sy){PL.fx=Math.abs(IN.mx)>Math.abs(IN.my)?sgn(IN.mx):0;PL.fy=PL.fx?0:sgn(IN.my);}
  if(!G.trans){if(PL.y<RY-14)tryDoor('u')||(PL.y=RY-14);else if(PL.y>RY+RH+14)tryDoor('d')||(PL.y=RY+RH+14);
    else if(PL.x<RX-14)tryDoor('l')||(PL.x=RX-14);else if(PL.x>RX+RW+14)tryDoor('r')||(PL.x=RX+RW+14);

    if(d<e.r+PL.r-2){

  if(hasItem('enzymeaura')&&S.time%18===0){for(const e of WR.en)if(!e.ally&&!e.nohit&&dist(e,PL)<102)damageEnemy(e,PL.dmg*.5,{quiet:1});}

function shootUpdate(){
  if(PL.fireCd>0)PL.fireCd--;

  if(sh){PL.fx=sx;PL.fy=sy;PL.eye=8;}else if(PL.eye>0)PL.eye--;
  const m=PL.mode;

  if(m==='brim'||m==='choc'||m==='lung'||m==='xring'){
    const mx=m==='brim'?Math.max(28,PL.fd*(PL.ch==='onco'&&!hasItem('plasmaray')?2.2:2.6)):m==='choc'?Math.max(24,PL.fd*2.5):m==='xring'?Math.max(26,PL.fd*2.2):Math.max(30,PL.fd*3);
    if(sh&&PL.fireCd<=0){PL.chargeT=Math.min(mx,PL.chargeT+1);PL.chargeMax=mx;PL.cdir={x:sx,y:sy};
      if(S.time%4===0){const a=R()*6.28,d=rnd(18,34);WR.fx.push({k:'p',x:PL.x+Math.cos(a)*d,y:PL.y-8+Math.sin(a)*d,vx:-Math.cos(a)*1.8,vy:-Math.sin(a)*1.8,c:m==='brim'?'#ff2040':m==='lung'?'#ff9ab0':'#ffe8b0',t:0,life:12,s:2,glow:1});}}
    else if(PL.chargeT>0&&!sh){const k=PL.chargeT/mx;const d=PL.cdir;PL.chargeT=0;
      if(m==='brim'){if(k>=1){fireBrim(d);PL.fireCd=20;}}
      else if(m==='choc'){fireVolley(d,{dmgK:.25+k*3.75,sizeK:.6+k*.9});PL.fireCd=Math.round(PL.fd*.5);}
      else if(m==='lung'){if(k>=1){fireLung(d);PL.fireCd=PL.fd;}}
      else if(m==='xring'){if(k>=.3){fireXRing(d,k);PL.fireCd=Math.round(PL.fd*.6);}}}
    if(sh)famShoot(sx,sy);
    return;}

  if(t.head){explode(t.x,t.y,{dmg:30,r:70,hurt:0});addCreep(t.x,t.y,70,'gas',240);return;}
  if(t.fl.explode&&t.src==='p'){explode(t.x,t.y,{dmg:PL.dmg+10,r:60,hurt:0,small:1});return;}
  fxSplash(t.x,t.y,t.col);if(wall)sfx('tearWall');}

/* ---------- 적의 탄 ---------- */
function eShoot(x,y,a,spd,o){o=o||{};WR.et.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,r:o.r||7,life:o.life||180,col:o.col||'#ff3048',z:10,grav:o.grav||0,vz:o.vz||0,spec:o.spec||0,name:o.name,tr:[]});}
function eBurst(x,y,n,spd,o){const off=(o&&o.off)||0;fxRing(x,y,24,(o&&o.col)||'#ff5060');for(let i=0;i<n;i++)eShoot(x,y,off+i/n*Math.PI*2,spd,o);}
function eSpread(x,y,a,n,sp,spd,o){fxMuzzle(x,y,a,(o&&o.col)||'#ff5060');for(let i=0;i<n;i++)eShoot(x,y,a+(i-(n-1)/2)*sp,spd,o);}
function updateETears(){
  const slow=S.slowTears?.45:1,stop=S.timeStop>0;
  for(const t of WR.et){
    if(!stop){t.tr.unshift({x:t.x,y:t.y-(t.grav?t.z:0)});if(t.tr.length>5)t.tr.pop();
    t.x+=t.vx*slow;t.y+=t.vy*slow;t.life--;
    if(t.grav){t.z+=t.vz*slow;t.vz-=t.grav*slow;if(t.z<=0){t.dead=1;fxSplash(t.x,t.y,t.col);if(t.creep)addCreep(t.x,t.y,t.cr||30,t.creep,300);continue;}}}
    if(t.x<RX||t.x>RX+RW||t.y<RY-4||t.y>RY+RH||t.life<=0){t.dead=1;fxSplash(t.x,t.y,t.col);continue;}
    const tl=tileAt(t.x,t.y);if(tl&&solidT(tl)&&!t.spec){t.dead=1;fxSplash(t.x,t.y,t.col);continue;}
    for(const f of WR.fam)if(f.block&&Math.hypot(f.x-t.x,f.y-t.y)<f.r+t.r){t.dead=1;fxSpark(t.x,t.y,'#fff');fxRing(t.x,t.y,14,'#fff');break;}
    if(t.dead)continue;
    if((t.x-PL.x)**2+(t.y-PL.y+6)**2<(t.r+PL.r-3)**2&&(!t.grav||t.z<16)){if(PL.jumpT>0)continue;t.dead=1;fxSplash(t.x,t.y,t.col);hurtP(contactDmg(),t.name||'적의 탄');}
  }
  WR.et=WR.et.filter(t=>!t.dead);
}

function placeBomb(x,y,o){o=o||{};const b={x,y,vx:0,vy:0,r:11,t:o.t||90,big:o.big||itemFlag('bomb')==='big',seek:itemFlag('bomb')==='seek'&&!o.troll,troll:o.troll,uid:uid()};
  b.x=clamp(b.x,RX+20,RX+RW-20);b.y=clamp(b.y,RY+20,RY+RH-20);WR.bombs.push(b);sfx('place');return b;}
function updateBombs(){
  for(const b of WR.bombs){b.t--;if(b.t%15===0)sfx('fuse');
    if(S.time%3===0)WR.fx.push({k:'p',x:b.x+4,y:b.y-14,vx:rnd(-1.2,1.2),vy:-rnd(1,2.2),c:b.t<30?'#ff3030':'#ffd040',t:0,life:9,s:2,glow:1});
    if(b.seek||b.troll){const tgt=b.troll?PL:nearEnemy(b.x,b.y,true,300);if(tgt){const a=angTo(b,tgt),acc=b.troll?.08:.16;b.vx+=Math.cos(a)*acc;b.vy+=Math.sin(a)*acc;}}
    const d=dist(b,PL);if(d<b.r+PL.r&&d>0&&b.t<80){const a=angTo(PL,b);b.vx+=Math.cos(a)*.6;b.vy+=Math.sin(a)*.6;}
    b.vx*=.9;b.vy*=.9;moveEnt(b,b.vx,b.vy,{});
    if(b.t<=0){b.dead=1;explode(b.x,b.y,{big:b.big,src:'bomb'});}}
  WR.bombs=WR.bombs.filter(b=>!b.dead);
}
function explode(x,y,o){o=o||{};const big=o.big,r=o.r||(big?122:88),dmg=o.dmg||(big?110:60);
  sfx(o.small?'shootBig':'boom');if(!o.small){shake(big?15:10);hitstop(big?4:2);}fxExplosion(x,y,r);
  for(const e of WR.en){if(e.dead||e.ally||e.under||e.nohit)continue;if(Math.hypot(e.x-x,e.y-y)<r+e.r*.5){damageEnemy(e,dmg,{kx:(e.x-x)*.09,ky:(e.y-y)*.09,col:'#ff9a30'});}}
  if(o.hurt!==0&&Math.hypot(PL.x-x,PL.y-y)<r+PL.r*.4&&PL.jumpT<=0){if(itemFlag('blastproof'))heal(1);else hurtP(2,'폭발');}
  if(!o.small){
    for(let rr=0;rr<ROWS;rr++)for(let cc=0;cc<COLS;cc++){const t=RM.grid[rr][cc];if(!t)continue;const p=tileC(cc,rr);if(Math.hypot(p.x-x,p.y-y)<r+12)breakTile(cc,rr,true);}
    for(const s of ['u','d','l','r']){const n=RM.doors[s];if(n==null)continue;const k=pairKey(RM.id,n);if(S.fl.lock[k]!=='bomb')continue;const p=doorPos(s);
      if(Math.hypot(p.x-x,p.y-y)<r+40){delete S.fl.lock[k];S.fl.rooms[n].seen=1;sfx('secret');fxDebris(p.x,p.y,THEME[chap()].wl2);fxNova(p.x,p.y,60,'#ffd060',16);}}
    for(const k of WR.pk){if(Math.hypot(k.x-x,k.y-y)>r+10)continue;
      if(k.k==='slot'||k.k==='blood'||k.k==='beggar'||k.k==='keeper'){k.dead=1;sfx('rock');fxDebris(k.x,k.y,'#8a8a98');for(let i=0;i<ri(2,5);i++)spawnPk(k.k==='blood'?'heart':'coin',k.k==='blood'?'red':'penny',k.x,k.y);if(k.k==='slot'&&R()<.15)spawnPk('item',drawItem('tr'),k.x,k.y,{cool:25});}
      else if(k.k==='chest'&&!k.open&&k.s==='stone')openChest(k);
      else if(!k.price&&k.k!=='item'&&k.k!=='statue'){const a=Math.atan2(k.y-y,k.x-x);k.vx+=Math.cos(a)*6;k.vy+=Math.sin(a)*6;}}
    RM.pk=RM.pk.filter(k=>!k.dead);WR.pk=RM.pk;
    for(const b of WR.bombs)if(!b.dead&&Math.hypot(b.x-x,b.y-y)<r)b.t=Math.min(b.t,4);
    if(o.src==='bomb')trinketTrig('bomb',{x,y});}
}

function nearEnemy(x,y,vulnOnly,maxD){let best=null,bd=maxD||1e9;for(const e of WR.en){if(e.dead||e.ally||e.under||e.spawnT>0||e.nohit)continue;if(vulnOnly&&(e.inv||e.ghostOff))continue;const d=Math.hypot(e.x-x,e.y-y);if(d<bd){bd=d;best=e;}}return best;}
function dmgAll(n){
  let hitPart=false;
  for(const e of WR.en.slice())if(!e.dead&&!e.ally&&!e.under&&!e.nohit&&!(e.spawnT>0)){damageEnemy(e,n,{});if(e.part)hitPart=true;}
  // 마더 보스가 파츠를 내밀지 않았을 때도 전체 공격 스킬이 50% 피해를 입히도록 보정
  if(!hitPart){for(const e of WR.en.slice())if(e.bid==='mother'&&!e.dead){e.hp-=n*.5;e.flashT=8;if(e.hp<=0)killEnemy(e);}}
  if(n>=20)shake(7);
}
function dmgArea(x,y,r,n,kb){for(const e of WR.en.slice()){if(e.dead||e.ally||e.under||e.nohit)continue;const d=Math.hypot(e.x-x,e.y-y);if(d<r+e.r){damageEnemy(e,n,kb?{kx:(e.x-x)/(d||1)*8,ky:(e.y-y)/(d||1)*8}:{});}}}
function shootRing(x,y,n,o){for(let i=0;i<n;i++){const a=i/n*Math.PI*2;fireTear({x,y,vx:Math.cos(a)*PL.ss,vy:Math.sin(a)*PL.ss,dmg:o.dmg||PL.dmg,r:7,life:Math.round(PL.range/PL.ss),fl:{},col:'#8acbff'});}sfx('shoot');}
function statusAll(k,f){for(const e of WR.en)if(!e.dead&&!e.ally&&!e.nohit)setStatus(e,k,f);}
function setStatus(e,k,f){if(e.boss&&(k==='freeze'||k==='charm'||k==='fear'))f=Math.round(f*.35);
  if(k==='poison')e.poisonT=Math.max(e.poisonT||0,f);else if(k==='burn')e.burnT=Math.max(e.burnT||0,f);else if(k==='slow')e.slowT=Math.max(e.slowT||0,f);
  else if(k==='freeze'){e.freezeT=Math.max(e.freezeT||0,f);}else if(k==='charm')e.charmT=Math.max(e.charmT||0,f);else if(k==='fear')e.fearT=Math.max(e.fearT||0,f);}
function fart(x,y,kind){sfx('fart');fxSmoke(x,y,kind==='poison'?'#7ad040':'#e0d080');fxRing(x,y,130,kind==='poison'?'#8aff4a':'#fff0a0');
  for(const e of WR.en){if(e.dead||e.ally||e.nohit)continue;const d=Math.hypot(e.x-x,e.y-y);if(d>135)continue;
    if(kind==='poison'){setStatus(e,'poison',200);damageEnemy(e,5,{});}else if(!e.boss&&!e.stat){const a=Math.atan2(e.y-y,e.x-x);e.kx+=Math.cos(a)*12;e.ky+=Math.sin(a)*12;damageEnemy(e,2,{});}}
  if(kind==='push')for(const t of WR.et){if(Math.hypot(t.x-x,t.y-y)<165){const a=Math.atan2(t.y-y,t.x-x),sp=Math.hypot(t.vx,t.vy);t.vx=Math.cos(a)*sp*1.5;t.vy=Math.sin(a)*sp*1.5;}}
  if(kind==='poison')addCreep(x,y,90,'gas',150);}
function addCreep(x,y,r,k,life){WR.creep.push({x,y,r,k,life,max:life,seed:R()*10});if(WR.creep.length>65)WR.creep.shift();}
function updateCreep(){for(const c of WR.creep){c.life--;
    if(c.k==='acid'||c.k==='gas'){if(S.time%15===0)for(const e of WR.en)if(!e.dead&&!e.ally&&!e.fly&&!e.under&&!e.nohit&&Math.hypot(e.x-c.x,e.y-c.y)<c.r+e.r*.5){if(c.k==='gas')setStatus(e,'poison',90);else damageEnemy(e,Math.max(1.5,PL.dmg*.4),{quiet:1});}}
    else if(c.k!=='decal'&&c.k!=='net'&&!PL.flying&&PL.jumpT<=0&&Math.hypot(PL.x-c.x,PL.y-c.y)<c.r*.8)hurtP(contactDmg(),{red:'피 웅덩이',yellow:'고름 웅덩이',tox:'독소 웅덩이',myco:'균사 오염 지대'}[c.k]||'웅덩이');}
  WR.creep=WR.creep.filter(c=>c.life>0);}
function addTimer(t,fn){WR.timers.push({t,fn,room:RM});}
function updateTimers(){const list=WR.timers;WR.timers=[];const room=RM;for(const tm of list){if(tm.room!==room)continue;if(--tm.t<=0){try{tm.fn();}catch(e){console.error(e);}}else if(RM===room)WR.timers.push(tm);}}
function stompAt(x,y,dmg,o){WR.misc.push({k:'stomp',x,y,t:0,dmg,hurtP:o&&o.hurtP,r:o&&o.r||70});}

   적 생성 · 피해 · 처치 · AI
   ========================================================= */
function spawnEnemy(id,x,y,o){o=o||{};const d=EN[id];if(!d)return null;
  const sc=1+(S.floor-1)*.15;
  const e={uid:uid(),id,name:d.n,x,y,vx:0,vy:0,kx:0,ky:0,r:d.r,hp:d.hp*sc,fly:d.fly,t:ri(0,60),st:0,spawnT:o.appear?36:0,z:0,dir:{x:1,y:0},next:ri(20,80),sx:1,sy:1};
  if(!o.noChamp&&S.floor>=2&&R()<.08&&!o.minion){e.champ=pick(['#ff4848','#48a8ff','#ffd040','#48ff88']);e.hp*=1.6;e.r*=1.12;}
  e.mhp=e.hp;
  if(d.ai==='diag'){e.vx=d.spd*sgn(rnd(-1,1)||1);e.vy=d.spd*sgn(rnd(-1,1)||1);}
  if(d.shield)e.face={x:0,y:1};
  if(d.ai==='host'){e.inv=1;}
  if(d.ai==='burrow'){e.under=1;e.st='under';e.t=0;}
  if(d.ai==='boil')e.grow=1;
  if(o.ally){e.ally=1;}
  WR.en.push(e);
  if(o.appear){sfx('spawn');fxRing(x,y,d.r+12,'#b090ff');}
  return e;}
function damageEnemy(e,dmg,o){o=o||{};if(e.dead||e.under||e.spawnT>0||e.nohit)return;
  if(e.part&&e.core){const c=e.core;if(c.dead)return;if(e.kind==='tseg')dmg*=.6;c.hp-=dmg;e.flashT=6;c.flashT=6;e.sx=1.22;e.sy=.82;
    fxDmg(e.x,e.y-e.r,dmg,o.col||'#ff8090');
    if(!o.quiet)sfx('hit');if(c.hp<=0)killEnemy(c,o);return;}
  if(e.inv||e.ghostOff)return;
  if(e.reflect>0){fxSpark(e.x,e.y,'#9ae8ff');return;}
  if(e.armor!=null&&e.armor!==1){dmg*=e.armor;if(e.armor<1)o=Object.assign({},o,{col:'#9a9aa8'});}
  e.hp-=dmg;e.flashT=6;e.sx=1.24;e.sy=.8;
  if(EN[e.id]&&EN[e.id].ai==='boil')e.grow=Math.max(.42,e.hp/e.mhp);
  fxDmg(e.x,e.y-e.r,dmg,o.col||(dmg>=PL.dmg*1.5?'#ffd050':'#ffffff'));
  if(o.kx!=null&&!e.boss&&!e.stat&&EN[e.id]&&EN[e.id].spd>0){e.kx+=o.kx;e.ky+=o.ky;}
  if(!o.quiet)sfx('hit');
  // 보스 50% 이하 광폭화 연출
  if(e.boss&&!e.minionOf&&!e.enraged&&!e.part&&e.hp>0&&e.hp<=e.mhp*.5){
    e.enraged=1;fxRing(e.x,e.y,e.r*2.4,'#ff3040');fxNova(e.x,e.y,e.r*2,'#ff4040',20);shake(8);sfx('roar');
  }
  if(e.hp<=0)killEnemy(e,o);}
function killEnemy(e,o){o=o||{};if(e.dead)return;e.dead=1;e.hp=0;
  const d=EN[e.id]||{};
  fxBlood(e.x,e.y,e.boss?3.2:1.2,e.boss?'#e02038':d.blood||'#c82038');
  fxRing(e.x,e.y,e.r*1.8,e.boss?'#ff4050':'#ff7080');
  if(e.boss)hitstop(8);
  if(!o.quiet)sfx(e.boss?'splat':'die');
  if(e.worm)wormSplit(e);
  if(e.boss&&e.parts)for(const p of e.parts)p.dead=1;
  const die=d.die;
  if(die&&!o.quiet){
    if(die.split)for(let i=0;i<die.split[1];i++)spawnEnemy(die.split[0],e.x+(i?12:-12),e.y,{noChamp:1,minion:1});
    if(die.burst)eBurst(e.x,e.y,die.burst,3.6,{off:R()});
    if(die.explode)explode(e.x,e.y,{dmg:40,r:80,src:'enemy'});
    if(die.spawn)for(let i=0;i<die.spawn[1];i++)spawnEnemy(die.spawn[0],e.x+rnd(-14,14),e.y+rnd(-14,14),{noChamp:1,minion:1});
    if(die.creep)addCreep(e.x,e.y,46,die.creep,300);
    if(die.goo)spawnEnemy('goo',e.x,e.y,{noChamp:1,minion:1});}
  if(e.champ)dropRandom(e.x,e.y);
  // 바이러스 비리 고유 특성: 감염된 적 처치 시 아군 파지 증식
  if(e.viral){spawnAlly('fly',1);fxNova(e.x,e.y,45,'#5ae8ff',10);}
  // 암세포 온코 고유 특성: 혈장 광선으로 처치 시 암흑 전이탄 2발
  if(PL.ch==='onco'&&o.brim){
    for(let i=0;i<2;i++){const a=R()*6.28;fireTear({x:e.x,y:e.y,vx:Math.cos(a)*5.5,vy:Math.sin(a)*5.5,dmg:PL.dmg*.75,r:7,life:55,fl:{homing:1,spectral:1},col:'#d030ff'});}
  }
  if(!e.ally&&!e.minionOf){
    S.kills++;
    // 백혈구 루코 고유 특성: 4킬마다 면역 과립 버프
    if(PL.ch==='wbc'&&S.kills%4===0){buff('tears',.3,'room');buff('spd',.12,'room');fxNova(PL.x,PL.y,60,'#9a7aff',12);fxText(PL.x,PL.y-38,'면역 포식!','#c8b0ff');}
    for(const id of PL.items){const h=IT[id].on&&IT[id].on.kill;if(h)h(e);}
    trinketTrig('kill',{x:e.x,y:e.y,e});
    if(S.transDone.B&&R()<.25)spawnAlly('fly',1);
    if(PL.eatT>0){PL.eatN=(PL.eatN||0)+1;if(PL.eatN%3===0)heal(1);}
  }
  if(e.boss&&!e.part)checkBossDone(e);
}
function anyHostile(){return WR.en.some(e=>!e.dead&&!e.ally);}

let FF=null,FFt=-99;
function flowField(){if(FF&&S.time-FFt<12)return FF;FFt=S.time;const f=[];for(let r=0;r<ROWS;r++)f.push(new Array(COLS).fill(999));
  const p=tileOf(PL.x,PL.y);const sc=clamp(p.c,0,COLS-1),sr=clamp(p.r,0,ROWS-1);f[sr][sc]=0;const q=[[sc,sr]];
  while(q.length){const [c,r]=q.shift();for(const d of Object.values(DIRS)){const nc=c+d[0],nr=r+d[1];if(!inRoom(nc,nr)||f[nr][nc]<999||blockWalk(RM.grid[nr][nc]))continue;f[nr][nc]=f[r][c]+1;q.push([nc,nr]);}}
  FF=f;return f;}
function pathDir(e,away){
  const f=flowField(),t=tileOf(e.x,e.y);
  if(!inRoom(t.c,t.r))return dirTo(e,PL,away);
  const cur=f[t.r][t.c];
  if(!away&&cur<=1)return dirTo(e,PL);
  let best=null,bv=away?-1:cur;
  for(const d of Object.values(DIRS)){const nc=t.c+d[0],nr=t.r+d[1];if(!inRoom(nc,nr))continue;const v=f[nr][nc];if(v>=999)continue;if(away?v>bv:v<bv){bv=v;best=[nc,nr];}}
  if(!best)return away?dirTo(e,PL,true):dirTo(e,PL);
  const p=tileC(best[0],best[1]);return dirTo(e,p);}
function dirTo(a,b,away){const dx=b.x-a.x,dy=b.y-a.y,m=Math.hypot(dx,dy)||1;return away?{x:-dx/m,y:-dy/m}:{x:dx/m,y:dy/m};}
function losClear(a,b){const n=Math.ceil(dist(a,b)/20);for(let i=1;i<n;i++){const t=tileAt(a.x+(b.x-a.x)*i/n,a.y+(b.y-a.y)*i/n);if(t&&solidT(t))return false;}return true;}

function updateEnemies(){
  if(S.timeStop>0){for(const e of WR.en){if(e.flashT>0)e.flashT--;e.sx=lerp(e.sx||1,1,.2);e.sy=lerp(e.sy||1,1,.2);}WR.en=WR.en.filter(e=>!e.dead);return;}
  for(const e of WR.en){
    if(e.dead)continue;
    e.sx=lerp(e.sx||1,1,.2);e.sy=lerp(e.sy||1,1,.2);
    if(e.flashT>0)e.flashT--;
    if(e.spawnT>0){e.spawnT--;continue;}
    if(e.poisonT>0){e.poisonT--;if(e.poisonT%20===0)damageEnemy(e,Math.max(1,PL.dmg*.35),{quiet:1,col:'#7aff4a'});}
    if(e.burnT>0){e.burnT--;if(e.burnT%15===0)damageEnemy(e,Math.max(1,PL.dmg*.3),{quiet:1,col:'#ff8a2a'});}
    if(e.dead)continue;
    if(e.slowT>0)e.slowT--;if(e.charmT>0)e.charmT--;if(e.fearT>0)e.fearT--;
    if(e.freezeT>0){e.freezeT--;e.kx*=.8;e.ky*=.8;continue;}
    const sm=(e.slowT>0?.5:1)*(e.enraged?1.18:1)*(e.bchamp?1.12:1);
    e.t+=e.slowT>0&&S.time%2?0:1;
    if(Math.abs(e.kx)+Math.abs(e.ky)>.05){moveEnt(e,e.kx,e.ky,{fly:e.fly});e.kx*=.78;e.ky*=.78;}
    if(e.part||e.orbit)continue;

 // 분열 아메바: 위족 돌진(예고선) · 독성 점액 포격 · 체력 절반마다 2분열 (최대 3세대)

 },

 metastasis(e,sm){const P_=PL;const nodes=minions(e).filter(m=>m.id==='metnode');e.armor=nodes.length>=2?.45:1;

// 회충 형제: 벽 끼임 및 축 이탈 완벽 방지
function wormMove(w,sm){const h=w.segs[0];if(!h)return;const sp=1.8*sm;
  if(!w.dir||(!w.dir.x&&!w.dir.y))w.dir={x:1,y:0};

  if(inRoom(t.c,t.r)){const c=tileC(t.c,t.r);
    // 이동 수직축을 타일 중앙으로 부드럽게 정렬해 축 이탈 방지
    if(w.dir.x!==0)h.y=lerp(h.y,c.y,.35);else h.x=lerp(h.x,c.x,.35);
    const key=t.c+','+t.r;
    const ok=d=>{const nc=t.c+d.x,nr=t.r+d.y;return inRoom(nc,nr)&&!blockWalk(RM.grid[nr][nc]);};
    const atCenter=Math.abs(h.x-c.x)<=sp*1.5&&Math.abs(h.y-c.y)<=sp*1.5;
    if((w.lastT!==key&&atCenter)||!ok(w.dir)){
      w.lastT=key;if(atCenter){h.x=c.x;h.y=c.y;}
      const opts=[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}].filter(d=>!(d.x===-w.dir.x&&d.y===-w.dir.y)&&ok(d));
      if(!ok(w.dir)||R()<.28){if(opts.length){const tp=dirTo(h,PL);opts.sort((a,b)=>(b.x*tp.x+b.y*tp.y)-(a.x*tp.x+a.y*tp.y));w.dir=R()<.6?opts[0]:pick(opts);}else w.dir={x:-w.dir.x,y:-w.dir.y};}}}
  h.x+=w.dir.x*sp;h.y+=w.dir.y*sp;
  if(h.x<=RX+TS/2||h.x>=RX+RW-TS/2)w.dir={x:0,y:h.y<DOORY?1:-1};
  if(h.y<=RY+TS/2||h.y>=RY+RH-TS/2)w.dir={x:h.x<DOORX?1:-1,y:0};
  h.x=clamp(h.x,RX+TS/2,RX+RW-TS/2);h.y=clamp(h.y,RY+TS/2,RY+RH-TS/2);
  w.trail.unshift({x:h.x,y:h.y});if(w.trail.length>w.segs.length*16+2)w.trail.length=w.segs.length*16+2;
  for(let i=1;i<w.segs.length;i++){const p=w.trail[Math.min(w.trail.length-1,i*15)];w.segs[i].x=p.x;w.segs[i].y=p.y;}
  if(h.t%200===0){const p=w.trail[Math.min(w.trail.length-1,30)];addCreep(p.x,p.y,22,'red',220);}
