function mkPk(k,s,x,y){const o={k,s,x,y,vx:0,vy:0,z:0,vz:0,cool:0,uid:uid()};
  if(k==='heart'&&!s)o.s=wpick([['red',40],['half',30],['soul',12],['black',4],['eternal',2],['double',6],['hsoul',6]]);
  if(k==='coin'&&!s)o.s=wpick([['penny',85],['nickel',9],['dime',3],['lucky',2]]);
  if(k==='bomb'&&!s)o.s=wpick([['one',85],['double',12],['troll',3]]);
  if(k==='key'&&!s)o.s=wpick([['one',90],['gold',4],['ring',6]]);
  if(k==='batt'&&!s)o.s=wpick([['micro',50],['normal',40],['mega',10]]);
  if(k==='pill'&&s==null)o.ci=Math.floor(R()*PILLC.length);
  if(k==='card'&&!s)o.s=pick(CARD_IDS);
  if(k==='trinket'&&!s)o.s=pick(TKS);
  if(k==='chest'&&!s)o.s=R()<.15?'gold':'brown';
  if(k==='item'){o.id=s;o.bob=R()*6;}
  if(k==='slot'||k==='blood'||k==='beggar'||k==='keeper'||k==='statue'){o.solid=1;o.t=0;}
  return o;}
function spawnPk(k,s,x,y,o){
  const p=mkPk(k,s,clamp(x,RX+24,RX+RW-24),clamp(y,RY+24,RY+RH-24));
  // 트롤 폭탄이 뽑히면 즉시 살아있는 트롤 폭탄으로 작동하도록 수정
  if(p.k==='bomb'&&p.s==='troll'&&!(o&&o.price)){placeBomb(p.x,p.y,{troll:1,t:72});return {};}
  const a=R()*Math.PI*2;
  if(k!=='item'&&!p.solid){p.vx=Math.cos(a)*2.6;p.vy=Math.sin(a)*2.6;p.z=4;p.vz=2.6;p.cool=18;}
  else if(k==='item'){p.cool=16;}
  if(o)Object.assign(p,o);
  RM.pk.push(p);WR.pk=RM.pk;
  if(itemFlag('quorum')&&['coin','heart','bomb','key'].includes(k)&&R()<.25&&!(o&&o.noDup)){const q=mkPk(k,p.s,p.x,p.y);q.vx=-p.vx;q.vy=-p.vy;q.z=4;q.vz=2.6;q.cool=18;RM.pk.push(q);}
  return p;}

function famDef(k){return {buddy:{r:10,follow:1,shoot:1,dmg:3.5,cd:28,col:'#8acbff'},sister:{r:10,follow:1,shoot:1,dmg:5,cd:28,col:'#ffa0d0'},robo:{r:10,follow:1,laser:1,dmg:3.5,cd:34},
  guard:{r:10,orbit:1,od:44,os:.05,block:1,cdmg:.6},meat:{r:12,orbit:1,od:60,os:.038,block:1,cdmg:.55},demon:{r:10,follow:1,auto:1,dmg:3.2,cd:26},leech:{r:9,hunt:1,cdmg:.38},
  bird:{r:9,bird:1,cdmg:.42},sackc:{r:9,follow:1,sack:'coin',every:2},sackb:{r:9,follow:1,sack:'bomb',every:3},sackh:{r:9,follow:1,sack:'heart',every:3},
  planclone:{r:10,follow:1,shoot:1,dmg:4.2,cd:24,col:'#80ffaa'},
  antibody:{r:9,orbit:1,od:54,os:.055,block:1,cdmg:.75,auto:1,dmg:3,cd:45},mirrorfam:{r:10,follow:1,shoot:1,mirror:1},clonebud:{r:10,follow:1,shoot:1,clone:1,col:'#ffd0e0'},
  fly:{r:6,ally:'fly'},spider:{r:6,ally:'spider'}}[k];}
function rebuildFams(keepPos){
  const keepAllies=WR.fam.filter(f=>f.k==='fly'||f.k==='spider'||f.room);
  const old={};for(const f of WR.fam)if(f.item)old[f.k+f.n]=f;
  const fams=[];const cnt={};
  for(const id of PL.items){const k=IT[id].fam;if(!k)continue;if(k==='meat'&&cnt.meat){cnt.meat++;continue;}
    for(let j=0;j<(IT[id].famN||1);j++){cnt[k]=(cnt[k]||0)+1;
      const n=cnt[k];const prev=old[k+n];const f=prev||Object.assign({k,n,item:1,x:PL.x,y:PL.y,t:0,a:R()*6,cnt:0},famDef(k));fams.push(f);}}
  for(let i=0;i<(PL.cloneBud||0);i++){const prev=old['clonebud'+(i+1)];fams.push(prev||Object.assign({k:'clonebud',n:i+1,item:1,x:PL.x,y:PL.y,t:0,a:0,cnt:0},famDef('clonebud')));}
  for(let i=0;i<(PL.planClone||0);i++){const prev=old['planclone'+(i+1)];fams.push(prev||Object.assign({k:'planclone',n:i+1,item:1,x:PL.x,y:PL.y,t:0,a:0,cnt:0},famDef('planclone')));}
  for(const f of fams)if(f.k==='meat'){f.lv=cnt.meat||1;if(f.lv>=3){f.orbit=0;f.hunt=1;f.auto=1;f.cd=32;f.dmg=4.5;}}
  const orb=fams.filter(f=>f.orbit);orb.forEach((f,i)=>f.a=i/orb.length*Math.PI*2);
  WR.fam=fams.concat(keepAllies);
}
function addFam(k,o){const f=Object.assign({k,n:99,x:PL.x,y:PL.y,t:0,a:R()*6,cnt:0},famDef(k),o||{});WR.fam.push(f);return f;}
function spawnAlly(k,n){for(let i=0;i<n;i++){if(WR.fam.filter(f=>f.k===k).length>=24)break;addFam(k,{a:R()*6,x:PL.x+rnd(-10,10),y:PL.y+rnd(-10,10),life:k==='spider'?900:99999});}}
function famShoot(sx,sy){for(const f of WR.fam){if((!f.shoot&&!f.laser&&!(f.k==='meat'&&f.lv===2))||f.cd2>0)continue;f.cd2=f.cd||30;
  if(f.mirror||f.clone){f.cd2=Math.round(PL.fd*(f.clone?1.3:1));const fl=f.mirror?rollFlags():{};fireTear({x:f.x,y:f.y-6,vx:sx*PL.ss,vy:sy*PL.ss,dmg:PL.dmg*(f.clone?.75:1),r:f.mirror?Math.round(clamp(5+PL.dmg*.3,5,12)):7,life:Math.round(PL.range/PL.ss),fl,col:f.mirror?'#c8b0ff':'#ffd0e0'});continue;}
  if(f.laser){fireLaser(f.x,f.y,Math.atan2(sy,sx),{dmg:f.dmg,w:6,life:6,tick:99,col:'#ff6a6a',thin:1});}
  else fireTear({x:f.x,y:f.y,vx:sx*6.5,vy:sy*6.5,dmg:f.dmg||4,r:6,life:50,fl:{},col:f.col||'#ff8080'});}}
function updateFams(){
  const followers=WR.fam.filter(f=>f.follow);
  if(!PL.trailPts)PL.trailPts=[];PL.trailPts.unshift({x:PL.x,y:PL.y});if(PL.trailPts.length>200)PL.trailPts.length=200;
  followers.forEach((f,i)=>{const p=PL.trailPts[Math.min(PL.trailPts.length-1,(i+1)*14)];f.x+=(p.x-f.x)*.25;f.y+=(p.y-f.y)*.25;});
  for(const f of WR.fam){f.t++;if(f.cd2>0)f.cd2--;
    if(f.orbit){f.a+=f.os;const od=f.od+(f.lv>1?6:0);f.x=PL.x+Math.cos(f.a)*od;f.y=PL.y-4+Math.sin(f.a)*od;
      if(S.time%6===0)for(const e of WR.en)if(!e.dead&&!e.ally&&!e.under&&!e.nohit&&Math.hypot(e.x-f.x,e.y-f.y)<e.r+f.r)damageEnemy(e,f.cdmg*6*(f.lv||1)*(f.k==='meat'?1.6:1),{quiet:1});}
    if(f.auto&&f.t%(f.cd||28)===0){const e=nearEnemy(f.x,f.y,true,320);if(e){const a=angTo(f,e);fireTear({x:f.x,y:f.y,vx:Math.cos(a)*6.2,vy:Math.sin(a)*6.2,dmg:f.dmg||3.5,r:6,life:60,fl:{},col:f.k==='meat'?'#ff6070':f.k==='antibody'?'#ffe080':'#c08aff'});}}
    if(f.hunt||(f.bird&&PL.hurtRoom)){const e=nearEnemy(f.x,f.y,true);if(e){const v=dirTo(f,e);f.x+=v.x*(f.bird?3.4:2.7);f.y+=v.y*(f.bird?3.4:2.7);if(dist(f,e)<e.r+f.r&&S.time%6===0)damageEnemy(e,f.cdmg*6*(f.lv||1)+1,{quiet:1});}
      else{f.x+=(PL.x+20-f.x)*.05;f.y+=(PL.y-20-f.y)*.05;}}
    else if(f.bird){f.x+=(PL.x+24-f.x)*.06;f.y+=(PL.y-40-f.y)*.06;}
    if(f.ally){const e=nearEnemy(f.x,f.y,true);
      if(e){const v=dirTo(f,e),sp=f.ally==='fly'?3.7:3.1;f.x+=v.x*sp;f.y+=v.y*sp;if(f.ally==='spider')wallClamp(f);if(dist(f,e)<e.r+6){damageEnemy(e,PL.dmg*2,{col:'#5ae8ff'});f.dead=1;fxSplash(f.x,f.y,'#5ae8ff');}}
      else{f.a+=.06;const od=f.ally==='fly'?30:24;f.x+=(PL.x+Math.cos(f.a)*od-f.x)*.15;f.y+=(PL.y+Math.sin(f.a)*od*.6-f.y)*.15;}
      if(f.life!=null&&--f.life<=0)f.dead=1;}
  }
  WR.fam=WR.fam.filter(f=>!f.dead);
}
function famRoomClear(){for(const f of WR.fam){if(!f.sack)continue;f.cnt++;if(f.cnt>=f.every){f.cnt=0;spawnPk(f.sack,null,f.x,f.y);}}}

/* =========================================================
   기타 물체 (블랙홀 · 스프링클러 · 함정문 · 발구르기 · 피 비)

function updateMisc(){
  for(const m of WR.misc){if(S.timeStop>0&&(m.k==='myco'||m.k==='rain'||m.k==='tcirc'||m.k==='tline'||m.k==='stomp'&&m.hurtP))continue;m.t=(m.t||0)+1;
    if(m.k==='hole'){
      for(const e of WR.en){if(e.dead||e.ally||e.boss||e.stat||e.nohit||(EN[e.id]&&EN[e.id].spd===0))continue;const d=Math.hypot(m.x-e.x,m.y-e.y);if(d<260&&d>4){moveEnt(e,(m.x-e.x)/d*2.2,(m.y-e.y)/d*2.2,{fly:1});}if(d<42&&S.time%6===0)damageEnemy(e,PL.dmg*.6+1,{quiet:1,col:'#b06aff'});}
      for(const t of WR.et){const d=Math.hypot(m.x-t.x,m.y-t.y);if(d<200&&d>2){t.vx+=(m.x-t.x)/d*.4;t.vy+=(m.y-t.y)/d*.4;}if(d<24)t.dead=1;}
      if(m.t>300)m.dead=1;}
    else if(m.k==='sprinkler'){if(m.t%10===0){m.a+=.45;for(let i=0;i<4;i++){const a=m.a+i*Math.PI/2;fireTear({x:m.x,y:m.y,vx:Math.cos(a)*5.5,vy:Math.sin(a)*5.5,dmg:PL.dmg*.8,r:6,life:45,fl:{},col:'#7ae0ff'});}}if(m.t>420)m.dead=1;}
    else if(m.k==='trap'){if(m.arm>0){m.arm--;continue;}if(m.needLeave){if(Math.hypot(PL.x-m.x,PL.y-m.y)>60)m.needLeave=0;else continue;}if(Math.hypot(PL.x-m.x,PL.y-m.y)<20&&!G.trans&&PL.jumpT<=0){m.dead=1;RM.trap=null;G.trans={floor:1,t:0};sfx('trap');}}
    else if(m.k==='stomp'){
      if(m.t===12){
        shake(14);hitstop(5);sfx('stomp');fxRing(m.x,m.y,m.r,'#ff8a9a');fxNova(m.x,m.y,m.r*.9,'#e0a0a0',18);
        for(const e of WR.en)if(!e.dead&&!e.ally&&!e.nohit&&m.dmg&&Math.hypot(e.x-m.x,e.y-m.y)<m.r+e.r)damageEnemy(e,m.dmg,{});
        if(m.hurtP&&Math.hypot(PL.x-m.x,PL.y-m.y)<m.r+PL.r*.45)hurtP(2,'대식세포의 위족');
        for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const p=tileC(c,r);if(RM.grid[r][c]&&Math.hypot(p.x-m.x,p.y-m.y)<m.r)breakTile(c,r);}
      }
      if(m.t>40)m.dead=1;}
    else if(m.k==='rain'){if(m.t===50){addCreep(m.x,m.y,40,'red',240);fxSplash(m.x,m.y,'#ff3040');fxRing(m.x,m.y,42,'#ff3040');if(Math.hypot(PL.x-m.x,PL.y-m.y)<40)hurtP(contactDmg(),'피 비');sfx('splat');}if(m.t>50)m.dead=1;}
    else if(m.k==='shadow'){if(m.t>=m.life)m.dead=1;}
    else if(m.k==='tcirc'||m.k==='tline'){if(m.t>=m.life)m.dead=1;}
    else if(m.k==='myco'){if(m.boss&&m.boss.dead){m.dead=1;continue;}m.len+=2.4;m.a+=Math.sin(m.t*.12)*.025;const x=m.x+Math.cos(m.a)*m.len,y=m.y+Math.sin(m.a)*m.len;m.hx=x;m.hy=y;
      if(x<RX+12||x>RX+RW-12||y<RY+12||y>RY+RH-12||m.len>m.max)m.dead=1;else if(m.t%8===0)addCreep(x,y,19,'myco',420);}
    else if(m.k==='lyso'){
      for(const e of WR.en){if(e.dead||e.ally||e.nohit||e.under)continue;const d=Math.hypot(m.x-e.x,m.y-e.y);
        if(!e.boss&&!e.stat&&!e.part&&!e.orbit&&!(EN[e.id]&&EN[e.id].spd===0)&&d<360&&d>6)moveEnt(e,(m.x-e.x)/d*3,(m.y-e.y)/d*3,{fly:1});
        if(d<78+e.r*.5&&S.time%6===0)damageEnemy(e,PL.dmg*1.1+2,{quiet:1,col:'#ff7ab0'});}
      for(const t of WR.et){const d=Math.hypot(m.x-t.x,m.y-t.y);if(d<300&&d>2){t.vx+=(m.x-t.x)/d*.6;t.vy+=(m.y-t.y)/d*.6;}if(d<34)t.dead=1;}
      if(m.t%30===0)sfx('hum');
      if(m.t>=300){m.dead=1;explode(m.x,m.y,{dmg:80+PL.dmg*8,r:120,hurt:0});flash('#ff7ab0');}}
  }
  WR.misc=WR.misc.filter(m=>!m.dead);
}

function hitstop(n){G.hitstop=Math.max(G.hitstop||0,n);}
function camKick(dx,dy){G.camX=clamp((G.camX||0)+dx,-10,10);G.camY=clamp((G.camY||0)+dy,-10,10);}
function fxMuzzle(x,y,a,c){

}
function fxSplash(x,y,c){
  WR.fx.push({k:'ring',x,y,r:18,c:c||'#8acbff',t:0,life:10});
  for(let i=0;i<8;i++){const a=R()*Math.PI*2,s=rnd(.8,3.2);WR.fx.push({k:'p',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,c,t:0,life:ri(10,18),s:ri(2,3),glow:1});}

function fxSpark(x,y,c){for(let i=0;i<6;i++){const a=R()*Math.PI*2,s=rnd(1.5,4.2);WR.fx.push({k:'p',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,c,t:0,life:11,s:2,glow:1});}}
function fxBlood(x,y,n,c){c=c||'#d02038';

function fxDebris(x,y,c){for(let i=0;i<12;i++){const a=R()*Math.PI*2,s=rnd(1.2,4.5);WR.fx.push({k:'p',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.4,g:.16,c:i%2?c:shade(c,.22),t:0,life:ri(18,32),s:ri(3,5)});}}
function fxSmoke(x,y,c){for(let i=0;i<10;i++){const a=R()*Math.PI*2,s=rnd(.4,1.6);WR.fx.push({k:'smoke',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-.5,c:c||'#9a9aa0',t:0,life:ri(24,42),s:ri(7,14)});}}
function fxExplosion(x,y,r){

  WR.creep.push({x,y,r:r*.48,k:'decal',life:1800,max:1800,c:'#1a1214',seed:R()*10});

function fxRing(x,y,r,c){WR.fx.push({k:'ring',x,y,r,c,t:0,life:18});}
function fxNova(x,y,r,c,cnt){

function fxSlash(x,y,a,r,c){WR.fx.push({k:'slash',x,y,a,r:r||32,c:c||'#ffffff',t:0,life:12});}
function fxBolt(x0,y0,x1,y1,c){
  const pts=[[x0,y0]];const n=6;

function fxDmg(x,y,dmg,c){
  if(dmg<=0)return;

  WR.fx.push({k:'dmg',x:x+rnd(-10,10),y:y+rnd(-6,4),vx:rnd(-.4,.4),vy:-1.7,s,c:c||'#fff',big:dmg>=12,t:0,life:32});

function fxText(x,y,s,c){WR.fx.push({k:'text',x,y,s,c,t:0,life:50});}
function fxMark(x,y,life){WR.fx.push({k:'mark',x,y,t:0,life});}
function updateFx(){
  for(const a of G.amb){a.x+=a.vx;a.y+=a.vy;a.p+=.04;if(a.y<RY){a.y=RY+RH;a.x=rnd(RX,RX+RW);}if(a.x<RX)a.x=RX+RW;if(a.x>RX+RW)a.x=RX;}
  for(const f of WR.fx){f.t++;if(f.k==='p'||f.k==='smoke'){f.x+=f.vx;f.y+=f.vy;if(f.g)f.vy+=f.g;f.vx*=.92;f.vy*=.92;}
    else if(f.k==='dmg'){f.x+=f.vx;f.y+=f.vy;f.vy+=.07;}
    else if(f.k==='text')f.y-=.6;}
  WR.fx=WR.fx.filter(f=>f.t<f.life);if(WR.fx.length>600)WR.fx.splice(0,WR.fx.length-600);
}

function banner(n,s){G.banner={n,s,t:170};}
function flash(c){G.flash={c,t:14};}
function shake(n){G.shake=Math.max(G.shake,n);}

const BGC={};
function bgCanvas(th){if(BGC[th])return BGC[th];const [c,g]=mkc(480,270);const T=THEME[th],rn=srand(th*991+7);
  const fx0=RX/2,fy0=RY/2,fw=RW/2,fh=RH/2; // fx0=58, fy0=37, fw=364, fh=196
  const ox=10,oy=8,ow=460,oh=254;
  // 1) 최외곽 심연 테두리 & 상단 벽체 천장 단면(Crown Molding)
  P(g,0,0,480,270,shade(T.wl,-.45));
  P(g,ox,oy,ow,oh,shade(T.wl,-.15));
  P(g,ox+1,oy+1,ow-2,2,shade(T.ac,.18)); // 상단 외곽 하이라이트 림
  // 2) 4면 3D 원근 벽면 (북쪽 수직 벽면 + 좌/우 사선 경사 벽면 + 남쪽 단면)
  // 북쪽 벽 (y: oy+3 .. fy0) - 3/4 시점에서 정면으로 보이는 입체 수직 벽
  for(let y=oy+3;y<fy0;y++){
    const k=(y-(oy+3))/(fy0-(oy+3));
    P(g,ox+3,y,ow-6,1,shade(T.wl2,.12-k*.28));
  }
  // 좌측 벽 (수광면/음영 경사) & 우측 벽
  for(let x=ox+3;x<fx0;x++){
    const k=(x-(ox+3))/(fx0-(ox+3));
    const y0=Math.round(lerp(oy+3,fy0,k)),y1=Math.round(lerp(oy+oh-3,fy0+fh,k));
    P(g,x,y0,1,y1-y0,shade(T.wl,.05-k*.22));
    const rx=480-1-x;
    P(g,rx,y0,1,y1-y0,shade(T.wl,-.08-k*.25));
  }
  // 남쪽 하단 벽 (단면 두께)
  for(let y=fy0+fh;y<oy+oh-2;y++){
    const k=(y-(fy0+fh))/(oy+oh-2-(fy0+fh));
    P(g,ox+3,y,ow-6,1,shade(T.wl,-.28-k*.2));
  }
  // 북쪽 벽 입체 기둥(Ribs)과 오목 벽감(Alcove) 디테일
  for(let i=0;i<=COLS;i++){
    const px=fx0+i*28;
    if(i===6||i===7)continue; // 중앙 문 자리 비움
    P(g,px-3,oy+5,6,fy0-oy-7,shade(T.wl,-.25));
    P(g,px-2,oy+5,3,fy0-oy-7,shade(T.wl2,.18));
    P(g,px-1,oy+5,1,fy0-oy-7,shade(T.ac,.22));
    // 기둥 하단 주초(Base)
    P(g,px-4,fy0-5,8,4,shade(T.wl2,.1));
    P(g,px-4,fy0-5,8,1,shade(T.ac,.28));
  }
  // 좌·우측 벽 입체 가로 리브(Ribs)
  for(let r=1;r<ROWS;r++){
    if(r===3||r===4)continue;
    const py=fy0+r*28;
    line(g,ox+5,py-6,fx0,py,shade(T.ac,.15),2);
    line(g,ox+5,py-4,fx0,py+2,shade(T.wl,-.35),2);
    line(g,480-ox-5,py-6,fx0+fw,py,shade(T.ac,.1),2);
    line(g,480-ox-5,py-4,fx0+fw,py+2,shade(T.wl,-.38),2);
  }
  // 벽 유기적 세포 조직 질감
  for(let i=0;i<160;i++){
    const x=ox+6+rn()*(ow-12),y=oy+5+rn()*(oh-10);
    if(x>fx0-4&&x<fx0+fw+4&&y>fy0-4&&y<fy0+fh+4)continue;
    const r=2+rn()*4;circ(g,x,y,r,shade(T.wl2,(rn()-.5)*.22));
    P(g,x-r*.3,y-r*.3,1,1,shade(T.ac,.18));
  }
  // 4개 모서리 45도 입체 연귀(Miter) 이음선
  line(g,ox+2,oy+2,fx0,fy0,shade(T.wl,-.45),2);line(g,ox+3,oy+2,fx0,fy0-1,shade(T.ac,.18),1);
  line(g,ox+ow-2,oy+2,fx0+fw,fy0,shade(T.wl,-.45),2);
  line(g,ox+2,oy+oh-2,fx0,fy0+fh,shade(T.wl,-.48),2);
  line(g,ox+ow-2,oy+oh-2,fx0+fw,fy0+fh,shade(T.wl,-.48),2);
  // 벽 하단 걸레받이(Baseboard) 림
  P(g,fx0-2,fy0-3,fw+4,3,shade(T.wl,-.35));
  P(g,fx0-2,fy0-3,fw+4,1,shade(T.ac,.2));

  // 3) 3D 베벨 타일 바닥 (13×7 격자 입체감)
  P(g,fx0,fy0,fw,fh,T.fl);
  for(let r=0;r<ROWS;r++)for(let col=0;col<COLS;col++){
    const tx=fx0+col*28,ty=fy0+r*28;
    const alt=(col+r)%2===0?.02:-.02;
    P(g,tx,ty,28,28,shade(T.fl,alt));
    // 타일 사이 오목 줄눈(Groove) + 좌상단 하이라이트 베벨
    P(g,tx,ty,28,1,shade(T.fl,-.14));
    P(g,tx,ty,1,28,shade(T.fl,-.14));
    P(g,tx+1,ty+1,26,1,shade(T.fl,.08));
    P(g,tx+1,ty+1,1,26,shade(T.fl,.06));
  }
  // 바닥 세부 질감 & 챕터별 입체 무늬
  for(let i=0;i<500;i++)P(g,fx0+rn()*fw,fy0+rn()*fh,1+Math.floor(rn()*2),1,T.fl2);
  for(let i=0;i<110;i++)P(g,fx0+rn()*fw,fy0+rn()*fh,1,1,shade(T.fl,.16));
  if(th===0){for(let i=0;i<16;i++){const x=fx0+12+rn()*(fw-24),y=fy0+12+rn()*(fh-24);ell(g,x,y,4+rn()*4,2+rn()*2,shade(T.fl,-.14));ell(g,x-1,y-1,2,1,shade(T.fl,.14));}}
  if(th===1){for(let i=0;i<8;i++){let x=fx0+rn()*fw,y=fy0+rn()*fh;for(let s=0;s<40;s++){x+=rn()*4-2;y+=rn()*4-1.5;if(x>fx0&&x<fx0+fw&&y>fy0&&y<fy0+fh){P(g,x,y,1,2,'#480c14');P(g,x,y-1,1,1,'#902830');}}}}
  if(th===2){for(let x=fx0+14;x<fx0+fw;x+=28)for(let y=fy0+14;y<fy0+fh;y+=28){ring(g,x,y,5,shade(T.fl,-.12));P(g,x-2,y-2,1,1,shade(T.fl,.15));}}
  if(th===3){for(let k=0;k<3;k++){const y0=fy0+30+k*64;for(let x=fx0+4;x<fx0+fw-4;x++){const s=Math.sin(x/9)*6;P(g,x,y0+s,1,2,shade(T.fl,.15));P(g,x,y0-s,1,2,shade(T.fl,-.14));}}}

  // 4) 북쪽·서쪽 벽이 바닥에 드리우는 다단계 3D 드리움 그림자(Cast Shadow) & 코너 AO
  for(let i=0;i<14;i++){
    const a=(1-i/14)*.34;
    g.fillStyle=`rgba(0,0,0,${a*.22})`;
    g.fillRect(fx0,fy0+i,fw,1);
    g.fillRect(fx0+i,fy0,1,fh);
  }
  for(let i=0;i<6;i++){
    g.fillStyle=`rgba(0,0,0,${(1-i/6)*.22})`;
    g.fillRect(fx0,fy0+fh-1-i,fw,1);
    g.fillRect(fx0+fw-1-i,fy0,1,fh);
  }
  // 남쪽 바닥 가장자리 전면 립 하이라이트
  P(g,fx0,fy0+fh,fw,2,shade(T.ac,.18));
  return BGC[th]=c;
}

function drawTutorial(){ctx.save();ctx.globalAlpha=.46;ctx.fillStyle='#2a1810';ctx.textAlign='center';ctx.font='22px "Do Hyeon"';
  const items=usingTouch?[['이동','왼쪽 스틱'],['공격','오른쪽 스틱'],['폭탄','폭탄 버튼'],['액티브','액티브 버튼'],['카드·알약','카드 버튼']]:[['이동','W A S D'],['공격','← ↑ ↓ →'],['폭탄','E / Shift'],['액티브','Space'],['카드·알약','Q']];
  items.forEach(([a,b],i)=>{const x=RX+80+i*142,y=RY+110;ctx.font='24px "Do Hyeon"';ctx.fillText(a,x,y);ctx.font='20px "Do Hyeon"';ctx.fillText(b,x,y+30);});
  ctx.font='16px "Do Hyeon"';ctx.fillText(usingTouch?'교체 버튼: 장신구 버리기 · 지도 버튼을 누르고 있으면 큰 지도':'Tab 지도 · Ctrl 장신구 버리기 · Esc 일시정지 · R 길게 다시 시작',DOORX,RY+RH-60);ctx.restore();}

const DOOR_COL={normal:null,treasure:'#e0b030',shop:'#4aa060',boss:'#7a1018',secret:'#3a3030',curse:'#a01020',devil:'#1a0a10',angel:'#f0f0ff'};
function drawDoor(s){const st=doorState(s);if(st==='none'||st==='hidden')return;const type=doorType(s);const p=doorPos(s),T=THEME[chap()];
  ctx.save();ctx.translate(p.x,p.y);ctx.rotate({u:0,d:Math.PI,l:-Math.PI/2,r:Math.PI/2}[s]);
  const fc=DOOR_COL[type]||T.ac,dk=shade(fc,-.38),dk2=shade(fc,-.55),lt=shade(fc,.28);
  if(type==='secret'){
    ctx.fillStyle='#080406';ctx.beginPath();ctx.moveTo(-28,0);ctx.lineTo(-22,-32);ctx.lineTo(-6,-44);ctx.lineTo(10,-40);ctx.lineTo(24,-26);ctx.lineTo(28,0);ctx.fill();
    ctx.strokeStyle=shade(T.wl,-.3);ctx.lineWidth=3;ctx.stroke();
    drawGlow(0,-16,34,'#8a7aff',.2);ctx.restore();return;
  }
  if(type==='treasure'||type==='angel'||type==='devil')drawGlow(0,-24,50,type==='treasure'?'#ffd040':type==='angel'?'#fff8c0':'#ff2030',.25);
  // 열린 문에서 바닥으로 쏟아지는 입체 바닥 빛줄기
  if(st==='open'){
    const beamCol=type==='treasure'?'rgba(255,215,80,.16)':type==='boss'?'rgba(255,40,60,.16)':type==='angel'?'rgba(255,255,220,.22)':type==='devil'?'rgba(220,20,50,.18)':'rgba(255,240,220,.08)';
    ctx.fillStyle=beamCol;ctx.beginPath();ctx.moveTo(-22,0);ctx.lineTo(22,0);ctx.lineTo(38,34);ctx.lineTo(-38,34);ctx.closePath();ctx.fill();
  }
  // 3D 문틀 외곽 그림자 & 좌우 입체 기둥(Pilasters)
  ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(-42,-60,84,62);
  ctx.fillStyle=dk2;ctx.fillRect(-39,-58,78,58);
  ctx.fillStyle=fc;ctx.fillRect(-35,-54,70,54);
  // 좌·우 돌출 기둥 입체 음영
  ctx.fillStyle=lt;ctx.fillRect(-35,-54,8,54);ctx.fillRect(27,-54,4,54);
  ctx.fillStyle=dk;ctx.fillRect(-27,-54,4,54);ctx.fillRect(31,-54,4,54);
  // 상단 인방(Lintel) & 쐐기돌(Keystone)
  ctx.fillStyle=lt;ctx.fillRect(-37,-56,74,7);
  ctx.fillStyle=dk;ctx.fillRect(-37,-49,74,3);
  ctx.fillStyle=lt;ctx.fillRect(-8,-60,16,12);ctx.fillStyle=fc;ctx.fillRect(-6,-58,12,9);
  // 문 안쪽 깊이감 있는 턱(Recessed Threshold)
  ctx.fillStyle=dk2;ctx.fillRect(-25,-45,50,45);
  ctx.fillStyle='#050204';ctx.fillRect(-22,-42,44,42);
  if(type==='boss'){ctx.fillStyle='#e8e0d0';for(let i=0;i<5;i++){ctx.fillRect(-20+i*9,-42,5,9);}ctx.fillStyle='#ff3030';ctx.fillRect(-14,-54,5,5);ctx.fillRect(9,-54,5,5);}
  if(type==='curse'||type==='devil'){ctx.fillStyle=type==='devil'?'#ff2838':'#e8d8d0';for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(-34+i*22,-56);ctx.lineTo(-27+i*22,-70);ctx.lineTo(-20+i*22,-56);ctx.fill();}}
  if(type==='treasure'){ctx.fillStyle='#fff6b0';ctx.fillRect(-5,-55,10,5);}
  if(type==='shop'){ctx.fillStyle='#ffe060';ctx.font='12px "Press Start 2P"';ctx.textAlign='center';ctx.fillText('$',0,-48);}
  if(type==='angel'){ctx.fillStyle='rgba(255,255,220,.55)';ctx.fillRect(-22,-42,44,42);}
  if(st==='closed'||st==='locked'){
    // 입체 문짝 패널 (좌/우 짝 + 가로 철장 + 중앙 분할선)
    ctx.fillStyle=shade(fc,-.12);ctx.fillRect(-22,-42,21,42);ctx.fillRect(1,-42,21,42);
    ctx.fillStyle=lt;ctx.fillRect(-20,-40,3,38);ctx.fillRect(3,-40,3,38);
    ctx.fillStyle=dk2;for(let i=0;i<4;i++)ctx.fillRect(-22,-38+i*10,44,3);
    if(st==='locked'){
      ctx.fillStyle='#3a2408';ctx.fillRect(-10,-27,20,16);
      ctx.fillStyle='#ffd850';ctx.fillRect(-9,-26,18,14);
      ctx.strokeStyle='#ffd850';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,-26,6,Math.PI,0);ctx.stroke();
      ctx.fillStyle='#2a1808';ctx.fillRect(-2,-22,4,6);
    }
  }
  ctx.restore();
}

// 3/4 시점 연결형 입체 구덩이(Chasm) 렌더링
function drawPit3D(c,r){
  const p=tileC(c,r),x=p.x-28,y=p.y-28,T=THEME[chap()];
  const upPit=r>0&&RM.grid[r-1][c]&&RM.grid[r-1][c].t==='pit';
  const dnPit=r<ROWS-1&&RM.grid[r+1][c]&&RM.grid[r+1][c].t==='pit';
  const lfPit=c>0&&RM.grid[r][c-1]&&RM.grid[r][c-1].t==='pit';
  const rtPit=c<COLS-1&&RM.grid[r][c+1]&&RM.grid[r][c+1].t==='pit';
  // 심연 바닥
  ctx.fillStyle='#050208';ctx.fillRect(x,y,56,56);
  // 상단이 일반 바닥이면 3D 수직 절벽 내벽(두께 18px) 표시
  if(!upPit){
    ctx.fillStyle=shade(T.wl,-.32);ctx.fillRect(x,y,56,18);
    ctx.fillStyle=shade(T.wl,-.48);ctx.fillRect(x,y+10,56,8);
    // 내벽의 세로 조직 기둥 결
    ctx.fillStyle=shade(T.wl,-.18);
    for(let i=0;i<4;i++)ctx.fillRect(x+6+i*14,y+2,4,13);
    // 바닥과 절벽이 만나는 상단 립(Lip) 베벨
    ctx.fillStyle=shade(T.fl,-.25);ctx.fillRect(x,y,56,3);
    ctx.fillStyle=shade(T.fl,.14);ctx.fillRect(x,y,56,1);
  }
  // 좌·우·하단 입체 테두리 립
  if(!lfPit){ctx.fillStyle=shade(T.wl,-.38);ctx.fillRect(x,y,5,56);ctx.fillStyle=shade(T.fl,-.2);ctx.fillRect(x,y,2,56);}
  if(!rtPit){ctx.fillStyle=shade(T.wl,-.45);ctx.fillRect(x+51,y,5,56);ctx.fillStyle=shade(T.fl,-.25);ctx.fillRect(x+54,y,2,56);}
  if(!dnPit){ctx.fillStyle=shade(T.fl,-.28);ctx.fillRect(x,y+53,56,3);}
}

let tintCache={},tintCount=0;
function tinted(s,col,key){const k=key+'_'+col;if(tintCache[k])return tintCache[k];if(tintCount>400){tintCache={};tintCount=0;}tintCount++;const [c,g]=mkc(s.width,s.height);g.drawImage(s,0,0);g.globalCompositeOperation='source-atop';g.fillStyle=col;g.fillRect(0,0,s.width,s.height);return tintCache[k]=c;}

// 3D 이중 그림자 (부드러운 외곽 확산 그림자 + 진한 접지 AO 그림자)
function shadow(x,y,w,a){
  const al=a||.34,r=Math.max(1,w);
  ctx.fillStyle=`rgba(0,0,0,${al*.45})`;
  ctx.beginPath();ctx.ellipse(x+2,y+1,r*1.18,Math.max(1,r*.46),0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=`rgba(0,0,0,${al})`;
  ctx.beginPath();ctx.ellipse(x,y,r*.88,Math.max(1,r*.34),0,0,Math.PI*2);ctx.fill();
}

function renderGame(){
  ctx.save();
  G.camX=lerp(G.camX||0,0,.22);G.camY=lerp(G.camY||0,0,.22);
  let sx=G.camX,sy=G.camY;
  if(G.shake>0){sx+=rnd(-G.shake,G.shake)*.65;sy+=rnd(-G.shake,G.shake)*.65;G.shake*=.85;if(G.shake<.35)G.shake=0;}
  if(Math.abs(sx)+Math.abs(sy)>.1)ctx.translate(sx,sy);
  ctx.drawImage(bgCanvas(chap()),0,0,W,H);
  // 방 중앙 은은한 입체 조명 스포트라이트
  const rmGr=ctx.createRadialGradient(DOORX,DOORY,40,DOORX,DOORY,420);
  rmGr.addColorStop(0,'rgba(255,245,235,.06)');rmGr.addColorStop(.7,'rgba(0,0,0,0)');rmGr.addColorStop(1,'rgba(0,0,0,.28)');
  ctx.fillStyle=rmGr;ctx.fillRect(RX,RY,RW,RH);

  if(RM.type==='start'&&S.floor===1)drawTutorial();
  if(RM.type==='devil'||RM.type==='angel'){ctx.fillStyle=RM.type==='devil'?'rgba(60,0,10,.36)':'rgba(255,255,230,.18)';ctx.fillRect(RX,RY,RW,RH);}
  if(S.slowTears){ctx.fillStyle='rgba(60,120,220,.12)';ctx.fillRect(RX,RY,RW,RH);}
  if(S.timeStop>0){ctx.fillStyle='rgba(200,230,255,.14)';ctx.fillRect(RX,RY,RW,RH);}
  // 웅덩이 (유기적인 세포액/산성 입체 표현 + 하이라이트)
  for(const c of WR.creep){const a=Math.min(1,c.life/60);ctx.globalAlpha=(c.k==='decal'?.36:.6)*a;
    const col=c.k==='decal'?c.c:c.k==='acid'?'#9aff30':c.k==='gas'?'#7ab040':c.k==='yellow'?'#e8d850':c.k==='tox'?'#b048c8':c.k==='myco'?'#8a9a48':c.k==='net'?'#dcd8f8':'#b01028';
    const wob=c.k==='decal'?1:1+.05*Math.sin(S.time*.12+(c.seed||0));
    if(c.k!=='decal'){ctx.fillStyle=shade(col,-.35);ctx.beginPath();ctx.ellipse(c.x,c.y+2,c.r*wob,c.r*.65/wob,0,0,Math.PI*2);ctx.fill();}
    ctx.fillStyle=col;
    ctx.beginPath();ctx.ellipse(c.x,c.y,c.r*wob,c.r*.65/wob,0,0,Math.PI*2);ctx.fill();
    if(c.k!=='decal'){ctx.fillStyle=shade(col,.35);ctx.beginPath();ctx.ellipse(c.x-c.r*.22,c.y-c.r*.15,c.r*.35,c.r*.18,0,0,Math.PI*2);ctx.fill();}
    if(c.k==='net'){ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=1;ctx.beginPath();for(let i=0;i<6;i++){const a=i*Math.PI/3+(c.seed||0);ctx.moveTo(c.x,c.y);ctx.lineTo(c.x+Math.cos(a)*c.r,c.y+Math.sin(a)*c.r*.65);}ctx.stroke();ctx.beginPath();ctx.ellipse(c.x,c.y,c.r*.55,c.r*.36,0,0,7);ctx.stroke();}
    if(c.k==='myco'){ctx.fillStyle='#e0f8a8';for(let i=0;i<3;i++){const a=(c.seed||0)+i*2.1;ctx.fillRect(c.x+Math.cos(a)*c.r*.5-1,c.y+Math.sin(a)*c.r*.3-1,2,2);}}
    if(c.k==='acid'||c.k==='gas'||c.k==='tox'){ctx.fillStyle=c.k==='tox'?'#f0a0ff':'#e0ff90';const bx=c.x+Math.cos(S.time*.07+(c.seed||0))*c.r*.4,by=c.y+Math.sin(S.time*.09+(c.seed||0))*c.r*.25;ctx.beginPath();ctx.arc(bx,by,2.5,0,7);ctx.fill();}
  }ctx.globalAlpha=1;
  for(const s of ['u','d','l','r'])drawDoor(s);
  // 지형 (3D 연결형 구덩이 · 가시)
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const t=RM.grid[r][c];if(!t)continue;const p=tileC(c,r);
    if(t.t==='pit'){drawPit3D(c,r);continue;}
    if(t.t==='spike'){drawS(spikeSpr(true),p.x,p.y);if(t.sac){ctx.fillStyle='rgba(190,0,30,.24)';ctx.fillRect(p.x-28,p.y-28,56,56);drawGlow(p.x,p.y,28,'#ff2040',.15);}continue;}}

    if(m.k==='tcirc'){const k=Math.min(1,m.t/m.life);ctx.save();ctx.translate(m.x,m.y);ctx.scale(1,.62);ctx.globalAlpha=.4+.3*Math.sin(m.t*.5);ctx.strokeStyle=m.col;ctx.lineWidth=m.lock?4:2.5;ctx.setLineDash(m.lock?[]:[8,6]);ctx.lineDashOffset=-m.t;
      ctx.beginPath();ctx.arc(0,0,m.r,0,7);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=.14+.16*k;ctx.fillStyle=m.col;ctx.beginPath();ctx.arc(0,0,m.r*k,0,7);ctx.fill();ctx.restore();}

      ctx.fillStyle=m.col;ctx.beginPath();ctx.moveTo(m.len+10,0);ctx.lineTo(m.len-4,-8);ctx.lineTo(m.len-4,8);ctx.fill();ctx.restore();}

  // 부유 미세 입자 (깊이감 있는 보케 조명)

  // 이펙트 렌더링 (바닥 충격파 3/4 원근 타원 투영 적용)
  for(const f of WR.fx){const k=1-f.t/f.life;

    else if(f.k==='smoke'){ctx.globalAlpha=k*.48;ctx.fillStyle=f.c;ctx.beginPath();ctx.arc(f.x,f.y,f.s*(1.5-k*.7),0,7);ctx.fill();}
    else if(f.k==='boom'){drawGlow(f.x,f.y,f.r*1.35,'#ff8a20',k*.68);ctx.globalAlpha=k;ctx.fillStyle=f.t<5?'#ffffff':f.t<11?'#ffe060':'#ff6a20';ctx.beginPath();ctx.ellipse(f.x,f.y,f.r*(.35+.65*(1-k)),f.r*(.3+.52*(1-k)),0,0,7);ctx.fill();}

    else if(f.k==='bolt'){ctx.save();ctx.globalAlpha=k;ctx.strokeStyle=f.c;ctx.lineWidth=4*k;ctx.beginPath();f.pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();ctx.restore();}

// 플레이어 눈물: 발사 초기 스무스 팝업 + 속도 방향 일롱게이션(Elongation) + 3D 구슬 음영
function drawPTear(t){
  const ty=t.y-(t.lob?t.z*2:0);
  if(t.ring){ctx.save();ctx.translate(t.x,ty);ctx.globalCompositeOperation='lighter';ctx.strokeStyle=t.col;ctx.globalAlpha=.3;ctx.lineWidth=12;ctx.beginPath();ctx.arc(0,0,t.rr,0,7);ctx.stroke();
    ctx.globalAlpha=.9;ctx.lineWidth=4;ctx.stroke();ctx.strokeStyle='#ffffff';ctx.lineWidth=1.5;ctx.stroke();ctx.restore();return;}
  if(t.lob)shadow(t.x,t.y+8,t.r*clamp(1-t.z/45,.4,1),.28);else shadow(t.x,t.y+t.z,t.r*.7,.22);
  if(t.tr&&t.tr.length>1){
    ctx.save();
    for(let i=0;i<t.tr.length;i++){
      const p=t.tr[i],k=(1-i/t.tr.length)*.38;
      ctx.globalAlpha=k;ctx.fillStyle=t.col;
      ctx.beginPath();ctx.arc(p.x,p.y,Math.max(1.5,t.r*(1-i/t.tr.length*.65)),0,7);ctx.fill();
    }
    ctx.restore();
  }
  drawGlow(t.x,ty,t.r*2.4,t.col,.28);
  const f=t.fl||{};
  if(f.halo){drawGlow(t.x,ty,t.r+32,'#ffe070',.2);ctx.strokeStyle='rgba(255,230,120,.55)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(t.x,ty,t.r+22+Math.sin(S.time*.3)*3,0,7);ctx.stroke();}
  const age=(t.max||50)-t.life;
  const popSc=age<3?(.65+age*.12):1;
  if(t.boomer){
    ctx.save();ctx.translate(t.x,ty);ctx.rotate(S.time*.38);
    ctx.strokeStyle='#ffd060';ctx.lineWidth=5;ctx.beginPath();ctx.arc(0,0,t.r,-1.1,1.1);ctx.stroke();
    ctx.strokeStyle='#a07030';ctx.lineWidth=2;ctx.stroke();ctx.restore();return;
  }
  if(f.pierce&&!t.lob){
    const a=Math.atan2(t.vy,t.vx);
    ctx.save();ctx.translate(t.x,ty);ctx.rotate(a);ctx.scale(popSc,popSc);
    ctx.fillStyle=t.col;ctx.beginPath();ctx.moveTo(t.r*1.5,0);ctx.lineTo(-t.r,t.r*.85);ctx.lineTo(-t.r*.4,0);ctx.lineTo(-t.r,-t.r*.85);ctx.closePath();ctx.fill();
    ctx.fillStyle='#ffffff';ctx.beginPath();ctx.moveTo(t.r*.9,0);ctx.lineTo(-t.r*.3,t.r*.35);ctx.lineTo(-t.r*.3,-t.r*.35);ctx.closePath();ctx.fill();
    ctx.restore();return;
  }
  if(f.freeze){
    ctx.save();ctx.translate(t.x,ty);ctx.rotate(S.time*.12);
    ctx.strokeStyle='#ffffff';ctx.lineWidth=2;
    for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(-t.r,0);ctx.lineTo(t.r,0);ctx.stroke();ctx.rotate(Math.PI/3);}
    ctx.restore();
  }
  const spd=Math.hypot(t.vx,t.vy),ang=spd>.5&&!f.orbit?Math.atan2(t.vy,t.vx):0;
  const stretch=spd>2&&!f.orbit?1.12:1;
  drawS(tearSpr(t.col,Math.min(14,t.r)),t.x,ty,{sc:(t.r>14?t.r/14:1)*popSc,rot:ang,sx:stretch,sy:1/Math.sqrt(stretch)});
  if(f.homing){ctx.strokeStyle='#e0b0ff';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(t.x,ty,t.r+3+Math.sin(S.time*.25)*1.5,0,7);ctx.stroke();}
  if(f.split&&!t.child){ctx.fillStyle='#fff8b0';ctx.beginPath();ctx.arc(t.x-2,ty-1,2,0,7);ctx.arc(t.x+2,ty+1,2,0,7);ctx.fill();}
}
function drawETear(t){
  const ty=t.y-(t.grav?t.z:0);
  shadow(t.x,t.y+10,t.r*.7,.22);
  if(t.tr&&t.tr.length>1){
    ctx.save();for(let i=0;i<t.tr.length;i++){const p=t.tr[i];ctx.globalAlpha=(1-i/t.tr.length)*.3;ctx.fillStyle=t.col;ctx.beginPath();ctx.arc(p.x,p.y,t.r*(1-i*.15),0,7);ctx.fill();}ctx.restore();
  }
  drawGlow(t.x,ty,t.r*2.2,t.col,.26);
  drawS(tearSpr(t.col,t.r),t.x,ty);
}

function drawTile(t,p){const th=chap();
  if(t.t==='rock'||t.t==='tint'||t.t==='metal'||t.t==='urn'){
    shadow(p.x+4,p.y+19,t.t==='urn'?19:25,.38);
    if(t.t==='tint')drawGlow(p.x,p.y-2,36,'#5a9aff',.22);
    drawS(rockSpr(th,t.v||0,t.t==='rock'?'rock':t.t),p.x,p.y-2);
  }
  else if(t.t==='poop'){
    shadow(p.x+2,p.y+16,18*(.5+.5*t.hp/4),.32);
    if(t.gold)drawGlow(p.x,p.y,34,'#ffd040',.25);
    drawS(poopSpr(4-t.hp,t.gold),p.x,p.y+2);
  }
  else if(t.t==='fire'){
    shadow(p.x+2,p.y+17,19,.35);
    const lit=t.hp>0;drawS(fireSpr(Math.floor(S.time/8)%2,t.blue,!lit),p.x,p.y-4,{sc:.6+.4*(t.hp/4)});
    if(lit)drawGlow(p.x,p.y-6,62,t.blue?'#4a9aff':'#ff8a20',.26+.05*Math.sin(S.time*.2));
  }
}

function drawPk(k){const bob=Math.sin(S.time*.08+k.uid)*2-(k.z||0)*1.6;
  if(k.k==='item'){
    shadow(k.x+3,k.y+25,22,.4);
    drawS(pedSpr(),k.x,k.y+14);
    if(k.id){
      const it=IT[k.id],blind=S.curse==='blind'&&!k.price&&!k.devil;
      const qCol=['#90e080','#7ac8ff','#c88aff','#ffd040','#ff5060'][clamp(it?it.q:1,0,4)];
      const col=blind?'#888888':qCol;

      ctx.save();ctx.globalCompositeOperation='lighter';
      ctx.globalAlpha=.18+.06*Math.sin(S.time*.1);
      const lg=ctx.createLinearGradient(k.x,k.y+6,k.x,k.y-44);
      lg.addColorStop(0,col);lg.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=lg;ctx.fillRect(k.x-14,k.y-44,28,50);
      ctx.strokeStyle=col;ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(k.x,k.y+6,15,5,0,0,7);ctx.stroke();
      ctx.restore();
      drawGlow(k.x,k.y-18,40,col,.3+.08*Math.sin(S.time*.1));
      const ic=blind?qSpr():iconSpr(it.ic);
      shadow(k.x,k.y+5,11,.25);
      drawS(ic,k.x,k.y-20+Math.sin(k.bob)*3.8,{sc:1.12});
      if(it.ty==='a'&&!blind){ctx.fillStyle='#ffe060';ctx.font='10px "Press Start 2P"';ctx.textAlign='center';ctx.fillText('A',k.x+18,k.y-32);}
    }
    drawPrice(k);return;
  }
  if(k.k==='keeper'){
    shadow(k.x+2,k.y+20,18,.38);
    const s=spr('keeper',24,26,(g)=>{
      orb3d(g,12,19,8,6,'#3a5a3e');
      orb3d(g,12,10,8.5,8,'#78a068');
      ell(g,7,12,2,1.2,'#ff90a0');ell(g,17,12,2,1.2,'#ff90a0');
      P(g,7,8,3,3,'#1a0c10');P(g,14,8,3,3,'#1a0c10');P(g,7,8,1,1,'#fff');P(g,14,8,1,1,'#fff');
      P(g,10,13,4,1,'#2a1810');
      ell(g,12,2.5,9,2.2,'#4a321e');P(g,7,0,10,3,'#6a482c');P(g,7,2,10,1,'#ffd040');
    });
    drawS(s,k.x,k.y);return;
  }
  if(k.k==='statue'){
    const dv=k.s==='devil';shadow(k.x+4,k.y+28,24,.42);drawGlow(k.x,k.y,56,dv?'#ff2030':'#fff6b0',.24);

  const age=L.t-(L.warm||0);
  const openK=L.thin?1:Math.min(1,age/4);
  const closeK=L.thin?1:Math.min(1,(L.life-age)/8);
  const k=openK*closeK;
  const w=L.w*(L.thin?1:.76+.24*Math.sin(L.t*.8))*k;
  ctx.save();ctx.globalCompositeOperation='lighter';
  ctx.globalAlpha=.38*k;ctx.fillStyle=L.col;ctx.fillRect(0,-w*.9,L.len,w*1.8);
  ctx.globalAlpha=.85*k;ctx.fillStyle=L.col;ctx.fillRect(0,-w/2,L.len,w);
  ctx.fillStyle='#ffffff';ctx.fillRect(0,-w*.2,L.len,w*.4);
  if(L.brim||L.w>=24||L.beam){
    ctx.strokeStyle=L.beam?'#eaffc0':'#ff90a0';ctx.lineWidth=2.5;ctx.beginPath();
    for(let x=0;x<L.len;x+=12){const y=Math.sin(x*.06-L.t*.55)*w*.42;x?ctx.lineTo(x,y):ctx.moveTo(x,y);}
    ctx.stroke();
    ctx.beginPath();
    for(let x=0;x<L.len;x+=12){const y=-Math.sin(x*.06-L.t*.55)*w*.42;x?ctx.lineTo(x,y):ctx.moveTo(x,y);}
    ctx.stroke();
  }else if(L.elec||L.thin){
    ctx.strokeStyle='#ffffff';ctx.lineWidth=1.8;ctx.beginPath();ctx.moveTo(0,0);
    for(let x=16;x<L.len;x+=18)ctx.lineTo(x,rnd(-w*.9,w*.9));
    ctx.stroke();
  }
  ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(0,0,w*.55,0,7);ctx.arc(L.len,0,w*.5,0,7);ctx.fill();
  ctx.restore();ctx.restore();ctx.globalAlpha=1;
}

// 플레이어 렌더링: 귀여운 표정 변화 + 자연스러운 호흡/기울기/관성 바운스 + 코스튬
function drawPlayer(){
  const ch=CH_BY[PL.ch];if(PL.inv>0&&PL.star<=0&&PL.shieldT<=0&&Math.floor(PL.inv/4)%2&&!PL.holdT)return;
  const shoot=IN.sx||IN.sy;let dir='d';const dx=shoot?IN.sx:PL.vx,dy=shoot?IN.sy:PL.vy;
  if(Math.abs(dx)+Math.abs(dy)>.3){dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u');}
  if(PL.holdT>0)dir='d';
  const moving=Math.abs(PL.vx)+Math.abs(PL.vy)>.4;
  const fr=PL.holdT>0?9:moving?Math.floor(PL.walk)%4:0;
  // 표정 모드: 3=아이템획득(^ ^), 1=사격(> <), 2=자연스러운 눈 깜빡임(- -), 0=초롱초롱 기본 눈
  const faceMode=(PL.holdT>0||PL.funnyFace>0)?3:(shoot&&(PL.fireCd>PL.fd-6||PL.chargeT>0))?1:(S.time%160<5)?2:0;

  const walkBob=moving&&!PL.flying?Math.abs(Math.sin(PL.walk*2))*2.2:0;
  const headBob=moving?Math.sin(PL.walk*2-.5)*1.4:Math.sin(S.time*.08)*.8;
  const breath=Math.sin(S.time*.09)*.035;
  const sc=PL.body,x=PL.x,y=PL.y-z-walkBob;

  const tilt=PL.tilt||0;
  shadow(PL.x,PL.y+14*sc,13*sc*clamp(1-z/90,.45,1),.38);
  drawGlow(x,y-4,28*sc,PL.mitoAwake?'#ffb830':ch.aura||'#8acbff',PL.mitoAwake?.32:.15);

  }
  let body=bodySpr(ch,dir,fr),head=headSpr(ch,dir,faceMode);
  if(PL.star>0){const c=['#ff5050','#ffd040','#50ff80','#50a0ff','#d050ff'][Math.floor(S.time/4)%5];body=tinted(body,c+'88','st_'+c+ch.id+dir+fr);head=tinted(head,c+'88','sth_'+c+ch.id+dir+faceMode);}

  if(dir!=='u'){
    if(hasItem('bioelectric')){
      ctx.fillStyle='#50f0ff';ctx.fillRect(hx-12*sc,hy-2*sc,24*sc,4*sc);drawGlow(hx,hy,18*sc,'#50f0ff',.3);
    }

      ctx.fillStyle='#1a0c10';ctx.beginPath();ctx.arc(hx,hy-8*sc,3.2*sc,0,7);ctx.fill();
      ctx.fillStyle='#7aff8a';ctx.beginPath();ctx.arc(hx,hy-8*sc,1.8*sc,0,7);ctx.fill();
    }
  }
  if(hasItem('plasmaray')&&ch.id!=='onco'){
    ctx.strokeStyle='#ff2040';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(hx-10*sc,hy-10*sc);ctx.lineTo(hx-16*sc,hy-20*sc);ctx.moveTo(hx+10*sc,hy-10*sc);ctx.lineTo(hx+16*sc,hy-20*sc);ctx.stroke();
  }
  if(hasItem('chemotaxis')){

}

];
function renderHelp(){drawTitleBg();const p=HELP[G.helpPage];krText(p[0],480,70,34,'#fff','center',5);

function renderOptions(){drawTitleBg();krText('설정',480,90,34,'#fff','center',5);
  const rows=[['효과음',OPT.sfx],['배경음 (메탈)',OPT.music]];
  rows.forEach(([n,v],i)=>{const y=180+i*70,on=G.optSel===i;krText((on?'▶ ':'')+n,330,y,24,on?'#fff':'#9a8a8a','left',4);ctx.fillStyle='#222';ctx.fillRect(560,y-16,200,14);ctx.fillStyle='#e05a6a';ctx.fillRect(560,y-16,200*v,14);pxText(Math.round(v*100)+'',780,y-3,11);});

function renderPause(){renderGame();ctx.fillStyle='rgba(0,0,0,.74)';ctx.fillRect(0,0,W,H);
  krText('일시정지',480,64,34,'#fff','center',5);
  menuList(['계속하기','설정','저장하고 타이틀로'],210,140,G.pauseSel,46,22);

  const list=[];if(PL.act)list.push({ic:IT[PL.act.id].ic,n:IT[PL.act.id].n,d:IT[PL.act.id].d,t:'액티브'});

  for(const id of PL.trk)list.push({ic:TK[id].ic,n:TK[id].n,d:TK[id].d,t:'장신구'});
  list.forEach((it,i)=>{const x=470+(i%10)*42,y=140+Math.floor(i/10)*42;if(i===G.itemSel){ctx.fillStyle='rgba(255,255,255,.22)';ctx.fillRect(x-18,y-18,36,36);}drawS(iconSpr(it.ic),x,y,{sc:.9});});

  ctx.fillStyle='#e8dcc0';ctx.fillRect(280,80,400,360);ctx.fillStyle='#c8b8a0';ctx.fillRect(290,90,380,340);
  krText('사망했습니다',480,140,38,'#3a1a10','center',0);krText('사인: '+(PL.lastHit||'?'),480,186,20,'#5a2a20','center',0);
  krText(FLOOR_N[S.floor-1]+'에서 쓰러짐',480,222,18,'#5a3a30','center',0);

  menuList(['다시 하기','타이틀로'],480,330,G.menu,48,24);}

  krText('종양 심장을 쓰러뜨리고 몸을 지켜냈습니다.',480,180,22,'#fff','center',4);

  PL.items.slice(0,24).forEach((id,i)=>drawS(iconSpr(IT[id].ic),300+(i%12)*33,280+Math.floor(i/12)*36,{sc:.85}));

/* =========================================================
   메뉴 입력 & 메인 루프
   ========================================================= */
function navMenu(n){if(IN.up){G.menu=(G.menu+n-1)%n;sfx('menu');}if(IN.down){G.menu=(G.menu+1)%n;sfx('menu');}}
function titleUpdate(){setMusic('title');for(const a of G.amb){a.x+=a.vx;a.y+=a.vy;if(a.y<0)a.y=H;}
  const items=titleItems();G.menu=Math.min(G.menu,items.length-1);navMenu(items.length);
  let pk=menuPick(items.length,480,330,42);if(pk>=0)G.menu=pk;
  if(IN.ok||pk>=0){sfx('select');const it=items[G.menu];
    if(it==='새 게임'){G.mode='charsel';}
    else if(it==='이어하기'){if(loadRun()){G.mode='play';banner(FLOOR_N[S.floor-1],'이어하기');}else{toastSmall('저장된 게임을 불러올 수 없습니다');clearSave();}}
    else if(it==='도움말'){G.mode='help';G.helpPage=0;}else if(it==='설정'){G.mode='options';G.optFrom='title';G.optSel=0;}
    else if(it==='게임 목록'){location.href='../index.html';}}}
function charUpdate(){if(IN.left){G.cs=(G.cs+7)%8;sfx('menu');}if(IN.right){G.cs=(G.cs+1)%8;sfx('menu');}
  if(PTR.click){for(let i=0;i<8;i++){const x=120+i*103;if(Math.abs(PTR.x-x)<46&&Math.abs(PTR.y-120)<50){if(G.cs===i)startGame(CHARS[i].id);else{G.cs=i;sfx('menu');}return;}}
    if(PTR.y>455&&PTR.y<510&&Math.abs(PTR.x-480)<90){startGame(CHARS[G.cs].id);return;}if(PTR.x<100&&PTR.y<200){G.cs=(G.cs+7)%8;}if(PTR.x>860&&PTR.y<200){G.cs=(G.cs+1)%8;}}
  if(IN.ok)startGame(CHARS[G.cs].id);if(IN.back){G.mode='title';sfx('menu');}}
function startGame(cid){resetG();sfx('select');clearSave();WR.fam=[];newRun(cid);RM=null;enterRoom(S.fl.start,null);G.mode='play';G.lastChar=cid;banner(FLOOR_N[0],CH_BY[cid].n);}
function helpUpdate(){if(IN.left){G.helpPage=(G.helpPage+HELP.length-1)%HELP.length;sfx('menu');}if(IN.right||PTR.click&&PTR.x>480){G.helpPage=(G.helpPage+1)%HELP.length;sfx('menu');}if(PTR.click&&PTR.x<=480&&PTR.y>440)G.mode='title';if(IN.back)G.mode='title';}
function optUpdate(){if(IN.up){G.optSel=(G.optSel+2)%3;sfx('menu');}if(IN.down){G.optSel=(G.optSel+1)%3;sfx('menu');}
  const ch=(IN.right?.1:0)-(IN.left?.1:0);
  if(PTR.click){for(let i=0;i<2;i++){const y=180+i*70;if(PTR.y>y-26&&PTR.y<y+6&&PTR.x>=550&&PTR.x<=770){const v=clamp((PTR.x-560)/200,0,1);if(i===0)OPT.sfx=v;else OPT.music=v;saveOpt();}}if(PTR.y>320&&PTR.y<360)G.optSel=2,IN.ok=true;}
  if(ch){if(G.optSel===0)OPT.sfx=clamp(Math.round((OPT.sfx+ch)*10)/10,0,1);if(G.optSel===1)OPT.music=clamp(Math.round((OPT.music+ch)*10)/10,0,1);saveOpt();if(AU.sfx)AU.sfx.gain.value=OPT.sfx;sfx('menu');}
  if(AU.sfx)AU.sfx.gain.value=OPT.sfx;
  if(IN.back||IN.ok&&G.optSel===2){G.mode=G.optFrom==='pause'?'pause':'title';sfx('menu');}}
function pauseUpdate(){if(IN.up){G.pauseSel=(G.pauseSel+2)%3;sfx('menu');}if(IN.down){G.pauseSel=(G.pauseSel+1)%3;sfx('menu');}
  const n=G.pauseList||0;if(IN.right&&n){G.itemSel=(G.itemSel+1)%n;sfx('menu');}if(IN.left&&n){G.itemSel=(G.itemSel+n-1)%n;sfx('menu');}
  if(PTR.click){for(let i=0;i<n;i++){const x=470+(i%10)*42,y=140+Math.floor(i/10)*42;if(Math.abs(PTR.x-x)<20&&Math.abs(PTR.y-y)<20){G.itemSel=i;return;}}const pk=menuPick(3,210,140,46);if(pk>=0){G.pauseSel=pk;IN.ok=true;}}
  if(IN.pause&&!PRESS.Space){G.mode='play';return;}
  if(IN.ok){sfx('select');if(G.pauseSel===0)G.mode='play';else if(G.pauseSel===1){G.mode='options';G.optFrom='pause';G.optSel=0;}else{saveRun();G.mode='title';G.menu=0;S=null;}}}
function deadUpdate(){navMenu(2);const y=G.mode==='win'?400:330;const pk=menuPick(2,480,y,48);if(pk>=0){G.menu=pk;IN.ok=true;}
  if(IN.ok){sfx('select');if(G.menu===0)startGame(PL.ch);else{G.mode='title';G.menu=0;S=null;}}}

function playUpdate(){
  if(IN.pause){G.mode='pause';G.pauseSel=0;G.itemSel=-1;sfx('menu');return;}
  if(G.trans){tickTrans();return;}
  if(G.hitstop>0){G.hitstop--;updateFx();return;}
  S.time++;
  if(S.timeStop>0)S.timeStop--;
  if(G.winT>0&&--G.winT<=0){winGame();return;}
  if(IN.restart){G.restartT=(G.restartT||0)+1;if(G.restartT>=70){G.restartT=0;startGame(PL.ch);return;}}else G.restartT=0;
  if(IN.bomb&&PL.bombs>0&&!(PL.holdT>0)){PL.bombs--;placeBomb(PL.x,PL.y+6,{});}
  if(IN.act&&!(PL.holdT>0))useActive();
  if(IN.pock&&!(PL.holdT>0))usePocket();
  if(IN.drop)dropTrinket();
  updatePlayer();if(G.mode!=='play')return;
  updateTears();updateETears();updateLasers();updateBombs();updateEnemies();updateParts();updateFams();updatePickups();updateCreep();updateMisc();updateTimers();updateFx();
  if(G.mode!=='play'||G.trans)return;
  if(!RM.cleared&&!anyHostile())roomClear();
}
function roomClear(){RM.cleared=1;sfx('clear');S.cleared++;
  fxRing(PL.x,PL.y,90,'#9aff9a');
  if(PL.ch==='planaria'&&S.cleared%2===0){if(heal(1))toastSmall('플라나리아 재생!');}
  if(RM.type!=='boss')roomReward();
  chargeActive(1);
  for(const id of PL.items){const h=IT[id].on&&IT[id].on.clear;if(h)h();}
  trinketTrig('clear',{x:DOORX,y:DOORY});famRoomClear();
  updateMood();saveRun();}
function gameOver(){if(G.mode==='dead')return;G.mode='dead';G.menu=0;sfx('death');setMusic('dead');clearSave();const st=stats();st.deaths++;st.kills+=S.kills;saveStats(st);}
function winGame(){if(G.mode==='win')return;S.won=1;G.mode='win';G.menu=0;sfx('win');setMusic('title');clearSave();const st=stats();st.wins++;st.kills+=S.kills;st.bestFloor=Math.max(st.bestFloor,9);st.charWins[PL.ch]=(st.charWins[PL.ch]||0)+1;saveStats(st);}
function update(){
  readInput();G.t++;
  const playing=G.mode==='play'||G.mode==='pause';if(playing!==G.wasPlaying){G.wasPlaying=playing;document.body.classList.toggle('playing',playing);}
  try{
    switch(G.mode){case 'title':titleUpdate();break;case 'charsel':charUpdate();break;case 'help':helpUpdate();break;case 'options':optUpdate();break;
      case 'play':playUpdate();break;case 'pause':pauseUpdate();break;case 'dead':case 'win':deadUpdate();break;}
  }catch(err){console.error(err);G.err=String(err&&err.stack||err);}
  clearPress();PTR.click=false;
}
function render(){
  ctx.setTransform(BS,0,0,BS,0,0);ctx.imageSmoothingEnabled=false;ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  try{
    switch(G.mode){case 'title':renderTitle();break;case 'charsel':renderCharSel();break;case 'help':renderHelp();break;case 'options':renderOptions();break;
      case 'play':renderGame();if(IN.map&&S.curse!=='lost')drawMinimap(true);break;case 'pause':renderPause();break;case 'dead':renderDead();break;case 'win':renderWin();break;}
  }catch(err){console.error(err);G.err=String(err&&err.stack||err);}
  if(G.mode==='title'||G.mode==='charsel'||G.mode==='help'||G.mode==='options'){G.small.forEach((m,i)=>{m.t--;krText(m.s,480,300+i*24,17,'#fff','center',4);});G.small=G.small.filter(m=>m.t>0);}
}
let lastT=performance.now(),acc=0;
function frame(now){acc+=Math.min(100,now-lastT);lastT=now;let n=0;while(acc>=1000/60&&n<4){update();acc-=1000/60;n++;}if(n>0)render();requestAnimationFrame(frame);}
document.fonts&&document.fonts.ready.then(()=>{});
requestAnimationFrame(frame);
window.__CB={get G(){return G;},get S(){return S;},get PL(){return PL;},get RM(){return RM;},WR};
