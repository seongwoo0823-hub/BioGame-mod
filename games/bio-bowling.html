<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>바이오 볼링</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#fff;--panel:rgba(18,16,48,.86);--panel2:rgba(255,255,255,.08);--line:rgba(255,255,255,.14);--acc:#ffd23a;--acc2:#3ee6c8;--pink:#ff5aa8;--red:#ff4d5e;
  --sat:env(safe-area-inset-top,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);--sab:env(safe-area-inset-bottom,0px);
  --fd:'Black Han Sans','Noto Sans KR',system-ui,sans-serif;--fb:'Noto Sans KR',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#140f32;color:var(--ink);font-family:var(--fb);word-break:keep-all;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font-family:inherit;color:inherit;cursor:pointer;border:0}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.fd{font-family:var(--fd);font-weight:400}
.gb{position:relative;border-radius:16px;padding:12px 22px;min-height:50px;font-family:var(--fd);font-size:19px;letter-spacing:.01em;color:#fff;background:linear-gradient(180deg,#5b5ce8,#3a33b8);box-shadow:inset 0 -5px 0 rgba(0,0,0,.28),inset 0 2px 0 rgba(255,255,255,.25),0 4px 0 #1c1458;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.gb:active{transform:translateY(3px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.28),0 1px 0 #1c1458}
.gb.y{background:linear-gradient(180deg,#ffe25a,#ffb21a);color:#3a2200;text-shadow:0 1px 0 rgba(255,255,255,.5);box-shadow:inset 0 -5px 0 rgba(160,80,0,.45),inset 0 2px 0 rgba(255,255,255,.6),0 4px 0 #8a4a00}
.gb.g{background:linear-gradient(180deg,#5ff0c8,#18b890);box-shadow:inset 0 -5px 0 rgba(0,80,60,.45),inset 0 2px 0 rgba(255,255,255,.4),0 4px 0 #0a5a48}
.gb.d{background:linear-gradient(180deg,#3a3570,#26214e);box-shadow:inset 0 -4px 0 rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.12),0 3px 0 #120e30;font-size:16px}
.gb small{font-size:12px;font-family:var(--fb);font-weight:700;opacity:.85}
.gb:disabled{filter:grayscale(.8);opacity:.5}
#gMenu{position:fixed;z-index:30;top:calc(10px + var(--sat));left:calc(10px + var(--sal));width:48px;height:48px;border-radius:15px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;backdrop-filter:blur(8px)}
#gMenu svg{width:22px;height:22px;stroke:#fff;stroke-width:2.6;fill:none;stroke-linecap:round}
#sheet{position:fixed;inset:0;z-index:40;display:none;background:rgba(8,6,24,.5)}#sheet.on{display:block}
#sheet .sh{position:absolute;top:calc(66px + var(--sat));left:calc(10px + var(--sal));width:min(250px,calc(100vw - 20px));background:#1d1946;border:1px solid var(--line);border-radius:18px;padding:8px;display:flex;flex-direction:column;gap:2px;box-shadow:0 18px 40px rgba(0,0,0,.45)}
#sheet button{background:transparent;text-align:left;padding:13px 14px;border-radius:12px;font-weight:700;font-size:16px}#sheet button:hover{background:rgba(255,255,255,.08)}
.scr{position:fixed;inset:0;z-index:10;display:none}.scr.on{display:flex}
#title{flex-direction:column;align-items:center;justify-content:flex-end;padding:0 16px calc(26px + var(--sab));background:linear-gradient(180deg,rgba(20,15,50,0) 30%,rgba(20,15,50,.85) 82%)}
.logo{text-align:center;margin-bottom:8px;filter:drop-shadow(0 8px 0 rgba(0,0,0,.25))}
.logo .k{font-family:var(--fd);font-size:clamp(54px,11vw,118px);line-height:.95;color:#fff;-webkit-text-stroke:3px #2a1270;paint-order:stroke;text-shadow:0 6px 0 #2a1270,0 0 30px rgba(255,90,168,.5)}
.logo .k b{font-weight:400;color:var(--acc)}
.logo .e{font-family:var(--fd);letter-spacing:.42em;color:var(--acc2);font-size:clamp(14px,2.4vw,22px);margin-top:6px;text-shadow:0 2px 0 #0a2a40}
#tStat{font-weight:700;margin:4px 0 16px;opacity:.9;text-align:center;font-size:14px}
.tmenu{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:min(620px,100%)}
.tmenu .wide{grid-column:span 3}
.tsub{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;justify-content:center}
.ov{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(8,6,24,.6);padding:12px}.ov.on{display:flex}
.box{width:min(480px,100%);max-height:100%;overflow:auto;background:linear-gradient(180deg,#25205a,#1a1644);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.box.wide{width:min(900px,100%)}
.box h2{margin:0 0 12px;font-family:var(--fd);font-weight:400;font-size:30px;letter-spacing:.01em}
.box h3{margin:16px 0 8px;font-size:15px;color:var(--acc2);letter-spacing:.04em}
.box p{line-height:1.65;font-size:14px;margin:8px 0}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.fld{display:flex;flex-direction:column;gap:6px;margin:10px 0}.fld label{font-size:13px;font-weight:700;opacity:.85}
.fld input{font:700 18px var(--fb);padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:rgba(0,0,0,.25);color:#fff;outline:none;user-select:text;-webkit-user-select:text}
.fld input:focus{border-color:var(--acc2)}
#onCode{text-transform:uppercase;letter-spacing:.3em;text-align:center}
.plist{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.pl{display:flex;align-items:center;gap:10px;background:var(--panel2);border-radius:12px;padding:8px 12px;font-weight:700}
.pl i{width:14px;height:14px;border-radius:50%;flex:none}.pl small{margin-left:auto;opacity:.7;font-size:12px}
.code{font-family:var(--fd);font-size:44px;letter-spacing:.25em;text-align:center;color:var(--acc);margin:6px 0}
.note{font-size:12px!important;opacity:.75}
.seg{display:flex;background:rgba(0,0,0,.25);border-radius:12px;padding:4px;gap:4px}.seg button{flex:1;background:transparent;border-radius:9px;padding:9px;font-weight:900}.seg button.on{background:var(--acc2);color:#063a30}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.dx{display:flex;gap:12px;align-items:flex-start;background:var(--panel2);border-radius:16px;padding:10px}
.dx img{flex:none;width:72px;height:72px;border-radius:12px;background:radial-gradient(circle at 50% 40%,#3c3680,#1d1946)}
.dx b{display:block;font-size:16px;font-family:var(--fd);font-weight:400;letter-spacing:.02em}.dx small{display:block;font-size:12.5px;line-height:1.45;opacity:.9;margin-top:2px}.dx .f{opacity:.6}
.stat{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}.stat span{font-size:11px;font-weight:900;background:rgba(255,255,255,.1);border-radius:6px;padding:1px 6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;font-weight:700}.row input[type=range]{width:55%;accent-color:var(--acc2)}
#hud{position:fixed;inset:0;z-index:6;pointer-events:none;display:none}#hud.on{display:block}
#hud .pe{pointer-events:auto}
.glass{background:var(--panel);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(8px);box-shadow:0 6px 18px rgba(0,0,0,.25)}
#turn{position:absolute;top:calc(10px + var(--sat));left:calc(68px + var(--sal));padding:7px 14px 7px 8px;display:flex;align-items:center;gap:10px;height:48px}
#turn i{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-family:var(--fd);font-style:normal;font-size:17px;color:#1a1040;flex:none}
#turn b{font-family:var(--fd);font-weight:400;font-size:17px;display:block;line-height:1.1;white-space:nowrap}#turn small{font-size:12px;font-weight:700;opacity:.8;white-space:nowrap}
#score{position:absolute;top:calc(10px + var(--sat));right:calc(10px + var(--sar));padding:6px;max-width:calc(100% - 290px);overflow-x:auto;scrollbar-width:none}
#score::-webkit-scrollbar{display:none}
#score table{border-collapse:separate;border-spacing:2px;font-variant-numeric:tabular-nums}
#score td,#score th{background:rgba(255,255,255,.93);color:#1a1440;text-align:center;min-width:30px;padding:0;font-weight:900;font-size:12px;border-radius:5px;height:21px}
#score th{background:#3a33b8;color:#fff;font-size:10px;height:16px}
#score th:first-child{background:transparent}
#score td.nm{background:transparent;text-align:left;padding:0 6px 0 2px;min-width:0;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
#score tr.me td:not(.nm){box-shadow:inset 0 0 0 2px var(--acc)}
#score td.tot{background:var(--acc);font-family:var(--fd);font-weight:400;font-size:15px;min-width:38px}
#score .rr{display:flex;height:100%}#score .rr span{flex:1;line-height:21px;border-left:1px solid #c8cbe8;min-width:14px}#score .rr span:first-child{border-left:0}
#score td.cur{background:#fff3b0}
#pinsBox{position:absolute;top:calc(68px + var(--sat));left:calc(10px + var(--sal));padding:8px}
#pinDia{display:block;width:128px;height:98px}
#pinTags{display:flex;flex-direction:column;gap:3px;margin-top:6px;max-width:150px}
#pinTags span{font-size:11px;font-weight:700;display:flex;align-items:center;gap:5px}#pinTags i{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:0 0 0 1.5px #fff8}
#pip{position:absolute;border:3px solid rgba(255,255,255,.9);border-radius:16px;box-shadow:0 8px 22px rgba(0,0,0,.45);pointer-events:none;display:none;overflow:hidden}
#pip span{position:absolute;left:8px;top:6px;font-size:11px;font-weight:900;background:rgba(20,15,50,.7);border-radius:7px;padding:2px 8px}
#ballCard{position:absolute;left:calc(10px + var(--sal));bottom:calc(10px + var(--sab));width:min(300px,calc(100% - 20px));padding:10px;display:flex;gap:10px;align-items:center}
#ballCard img{flex:none;width:66px;height:66px;border-radius:14px;background:radial-gradient(circle at 50% 40%,#4a44a0,#231e58)}
#ballCard b{font-family:var(--fd);font-weight:400;font-size:18px;display:block;letter-spacing:.02em}#ballCard small{display:block;font-size:12px;line-height:1.4;opacity:.92}
.tagc{font-family:var(--fb);font-size:11px;font-weight:900;color:#1a1040;border-radius:6px;padding:1px 6px;vertical-align:3px}
.bars{display:grid;grid-template-columns:auto 1fr;gap:2px 6px;margin-top:5px;font-size:10px;font-weight:900;align-items:center}
.bars u{display:block;height:6px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden;text-decoration:none}.bars u i{display:block;height:100%;background:var(--acc2);border-radius:3px}
#pad{position:absolute;right:calc(12px + var(--sar));bottom:calc(12px + var(--sab));display:flex;align-items:flex-end;gap:12px}
.pg{display:flex;flex-direction:column;gap:6px;align-items:center}
.pg .lab{font-size:11px;font-weight:900;opacity:.85;letter-spacing:.05em;text-shadow:0 1px 2px #000}
.pg .pair{display:flex;gap:6px}
.mv{display:grid;grid-template-columns:auto auto;gap:6px 6px;justify-items:center}
.mv .lab{grid-column:span 2}
.ib{width:54px;height:54px;border-radius:16px;font-size:22px;font-weight:900;background:linear-gradient(180deg,#3a3570,#26214e);box-shadow:inset 0 -4px 0 rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.14),0 3px 0 #120e30;touch-action:none;display:grid;place-items:center}
.ib:active{transform:translateY(2px)}
.ib svg{width:24px;height:24px;stroke:#fff;stroke-width:2.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
#curve{display:flex;gap:4px;background:rgba(18,16,48,.8);border:1px solid var(--line);border-radius:14px;padding:4px}
#curve button{width:40px;height:46px;border-radius:10px;background:transparent;font-weight:900;font-size:15px;display:grid;place-items:center}
#curve button.on{background:var(--acc2);color:#063a30}
#curve svg{width:22px;height:22px;stroke:currentColor;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
#throwWrap{position:relative;width:124px;height:124px;display:grid;place-items:center}
#throwWrap svg.ring{position:absolute;inset:0;pointer-events:none;transform:rotate(-90deg);width:100%;height:100%}
#throwWrap .rb{fill:none;stroke:rgba(10,8,30,.75);stroke-width:13}
#throwWrap .rz{fill:none;stroke:rgba(62,230,200,.6);stroke-width:13}
#throwWrap .rf{fill:none;stroke:url(#pgrad);stroke-width:9;stroke-linecap:round}
#throwBtn{position:relative;z-index:1;width:92px;height:92px;border-radius:50%;font-family:var(--fd);font-size:20px;line-height:1.05;color:#3a2200;background:radial-gradient(circle at 50% 35%,#fff08a,#ffb21a 70%);box-shadow:inset 0 -6px 0 rgba(160,80,0,.45),inset 0 3px 0 rgba(255,255,255,.7),0 5px 0 #8a4a00,0 0 24px rgba(255,210,58,.45);touch-action:none}
#throwBtn small{display:block;font-family:var(--fb);font-weight:900;font-size:10px;opacity:.8;margin-top:2px}
#throwBtn.hold{transform:scale(.93)}
#pwTxt{position:absolute;pointer-events:none;z-index:2;top:-24px;left:-20px;right:-20px;text-align:center;font-family:var(--fd);font-size:18px;text-shadow:0 2px 0 #000,0 0 6px #000}
#wait{position:absolute;left:50%;bottom:calc(24px + var(--sab));transform:translateX(-50%);padding:12px 20px;font-weight:900;display:none;white-space:nowrap}
#hint{position:absolute;left:50%;top:calc(70px + var(--sat));transform:translateX(-50%);padding:8px 14px;font-weight:700;font-size:13px;white-space:nowrap;display:none;max-width:calc(100% - 20px);overflow:hidden;text-overflow:ellipsis}
#banner{position:fixed;z-index:9;left:50%;top:38%;transform:translate(-50%,-50%);font-family:var(--fd);font-size:clamp(46px,11vw,120px);opacity:0;pointer-events:none;white-space:nowrap;-webkit-text-stroke:3px #2a1270;paint-order:stroke;text-shadow:0 7px 0 #2a1270}
#banner.go{animation:ban 1.9s}@keyframes ban{0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(-6deg)}14%{opacity:1;transform:translate(-50%,-50%) scale(1.15) rotate(2deg)}24%{transform:translate(-50%,-50%) scale(1) rotate(0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%)}}
.pop{position:fixed;z-index:8;font-family:var(--fd);font-size:20px;pointer-events:none;transform:translate(-50%,-50%);-webkit-text-stroke:2px #1a1040;paint-order:stroke;animation:popup 1.2s forwards;white-space:nowrap}@keyframes popup{20%{transform:translate(-50%,-50%) scale(1.15)}to{opacity:0;margin-top:-46px}}
#toast{position:fixed;z-index:22;left:50%;top:calc(80px + var(--sat));transform:translateX(-50%);padding:10px 16px;font-weight:700;display:none;max-width:calc(100% - 20px)}
#err{position:fixed;z-index:99;left:10px;right:10px;bottom:10px;background:#c83a4a;padding:10px;border-radius:10px;display:none}
/* 가로 화면: 휘기 위 · 위치/방향 아래 · 던지기 오른쪽 */
html:not(.portrait) #pad{display:grid;grid-template-columns:auto auto;column-gap:12px;row-gap:6px;align-items:end}
html:not(.portrait) #pad .cv{grid-column:1;grid-row:1}html:not(.portrait) #pad .mv{grid-column:1;grid-row:2;grid-template-columns:repeat(4,auto)}
html:not(.portrait) #pad>.pg:last-child{grid-column:2;grid-row:1/3}
html:not(.portrait) .mv>:nth-child(1){grid-area:1/1/2/3}html:not(.portrait) .mv>:nth-child(2){grid-area:2/1}html:not(.portrait) .mv>:nth-child(3){grid-area:2/2}
html:not(.portrait) .mv>:nth-child(4){grid-area:1/3/2/5}html:not(.portrait) .mv>:nth-child(5){grid-area:2/3}html:not(.portrait) .mv>:nth-child(6){grid-area:2/4}
/* 세로 화면 (휴대폰) */
html.portrait #score{left:calc(10px + var(--sal));right:calc(10px + var(--sar));top:calc(66px + var(--sat));max-width:none}
html.portrait #ballCard{bottom:auto;top:var(--rowY,140px);left:calc(10px + var(--sal));width:auto;right:calc(128px + var(--sar));padding:7px;gap:8px}
html.portrait #ballCard img{width:46px;height:46px}html.portrait .bars{display:none}html.portrait #ballCard b{font-size:16px}html.portrait #ballCard small{font-size:11px;line-height:1.35}
html.portrait #pinsBox{top:var(--rowY,140px);left:auto;right:calc(10px + var(--sar));padding:5px}
html.portrait #pinDia{width:104px;height:80px}html.portrait #pinTags{display:none}
html.portrait #pad{left:calc(8px + var(--sal));right:calc(8px + var(--sar));flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:flex-end}
html.portrait #pad .cv{order:-1;width:100%}html.portrait #pad .cv .lab{display:none}
html.portrait #curve{width:100%}html.portrait #curve button{flex:1;width:auto;height:42px}
html.portrait .mv .lab{display:none}html.portrait .ib{width:50px;height:50px}
html.portrait #throwWrap{width:112px;height:112px}html.portrait #throwBtn{width:84px;height:84px;font-size:19px}
/* 낮은 가로 화면 (휴대폰 가로) */
html.short #turn{height:42px;padding:4px 10px 4px 5px}html.short #turn i{width:30px;height:30px}html.short #gMenu{width:42px;height:42px}
html.short #pinsBox{top:calc(58px + var(--sat));padding:5px}html.short #pinDia{width:88px;height:67px}html.short #pinTags{display:none}
html.short #ballCard{width:220px;padding:6px}html.short #ballCard img{width:42px;height:42px}html.short .bars{display:none}html.short #ballCard small{font-size:10.5px}html.short #ballCard b{font-size:15px}
html.portrait .tmenu .gb{font-size:17px;padding:10px 8px}
html.short #pad{gap:8px}html.short .pg .lab{display:none}
html.short #throwWrap{width:100px;height:100px}html.short #throwBtn{width:76px;height:76px;font-size:17px}html.short #throwBtn small{display:none}html.short .ib{width:44px;height:44px}html.short #curve button{width:32px;height:40px}
html.short #score td,html.short #score th{min-width:22px;font-size:11px;height:18px}html.short #score .rr span{line-height:18px;min-width:11px}html.short #score th{height:14px}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<button id="gMenu" aria-label="메뉴"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
<div id="sheet"><div class="sh">
  <button data-act="hub">게임 목록으로</button><button data-act="title">메인 화면</button><button data-act="dex">도감</button><button data-act="help">게임 방법</button><button data-act="opt">설정</button>
</div></div>

<section id="title" class="scr on">
  <div class="logo"><div class="k">바이오 <b>볼링</b></div><div class="e">IMMUNE STRIKE LANES</div></div>
  <div id="tStat"></div>
  <div class="tmenu">
    <button class="gb y wide" data-act="solo">혼자 하기</button>
    <button class="gb" data-act="local">같이 하기<br><small>한 기기 2~4명</small></button>
    <button class="gb g" data-act="online">온라인 대전<br><small>최대 4명</small></button>
    <button class="gb d" data-act="practice">자유 연습<br><small>점수 없이</small></button>
  </div>
  <div class="tsub"><button class="gb d" data-act="dex">도감</button><button class="gb d" data-act="help">게임 방법</button><button class="gb d" data-act="hub">게임 목록</button></div>
</section>

<div id="hud">
  <div id="turn" class="glass"><i id="turnIco">1</i><div><b id="turnName">나</b><small id="turnSub">1프레임 · 1구</small></div></div>
  <div id="score" class="glass pe"></div>
  <div id="pinsBox" class="glass"><canvas id="pinDia" width="256" height="196"></canvas><div id="pinTags"></div></div>
  <div id="pip"><span>병원체 핀</span></div>
  <div id="hint" class="glass"></div>
  <div id="ballCard" class="glass"><img id="ballImg" alt=""><div style="min-width:0"><b id="ballName"></b><small id="ballDesc"></small><div class="bars" id="ballBars"></div></div></div>
  <div id="pad" class="pe">

/* =========================================================
   온라인 (PeerJS / 교실 서버 중계, 같은 브라우저 탭은 BroadcastChannel)
   ========================================================= */
const NET = (() => {
  const PREFIX = 'biobowl-v1-', BC = 'biobowl-bc-v1-', VER = 1;
  const genCode = () => { const c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s = ''; for (let i = 0; i < 4; i++) s += c[Math.floor(Math.random() * c.length)]; return s; };
  const opts = () => ({ debug: 0, config: { iceServers: [{ urls: ['stun:stun.l.google.com:19302'] }, { urls: ['turn:eu-0.turn.peerjs.com:3478', 'turn:us-0.turn.peerjs.com:3478'], username: 'peerjs', credential: 'peerjsp' }] } });
  const N = { role: null, code: '', myId: 'b' + Math.random().toString(36).slice(2, 10), peer: null, hostConn: null, bc: null, conns: new Map(), seen: new Map(), lastHost: 0, players: [], on: {}, started: false };
  N.listen = (t, f) => (N.on[t] = N.on[t] || []).push(f);
  N.emit = (t, m) => (N.on[t] || []).forEach(f => f(m));
  function openPeer(id) { return new Promise((ok, no) => { if (!window.Peer) return no(new Error('no-peer')); let p; try { p = id ? new Peer(id, opts()) : new Peer(opts()); } catch (e) { return no(e); }
    const wait = window.BioRelay && BioRelay.wait ? BioRelay.wait(9000) : 9000;
    const to = setTimeout(() => { try { p.destroy(); } catch (e) {} no(new Error('timeout')); }, typeof wait === 'number' ? wait : 9000);
    p.on('open', () => { clearTimeout(to); ok(p); }); p.on('error', e => { clearTimeout(to); no(e); }); }); }
  function openBc(code) { try { N.bc = new BroadcastChannel(BC + code); N.bc.onmessage = e => { const m = e.data; if (!m) return;
      if (N.role === 'host' && m.from && m.from !== N.myId) onHost(m, null);
      else if (N.role === 'guest' && !m.from && (!m.to || m.to === N.myId) && m.src !== N.myId) onGuest(m); }; } catch (e) { N.bc = null; } }
  const sendC = (c, m) => { if (c && c.open) try { c.send(m); } catch (e) {} };
  function broadcast(m, except) { for (const [pid, c] of N.conns) if (pid !== except) sendC(c, m); if (N.bc) try { N.bc.postMessage(m); } catch (e) {} }
  function sendTo(pid, m) { const c = N.conns.get(pid); if (c) sendC(c, m); else if (N.bc) try { N.bc.postMessage(Object.assign({ to: pid }, m)); } catch (e) {} }
  function toHost(m) { m.from = N.myId; if (N.hostConn && N.hostConn.open) sendC(N.hostConn, m); if (N.bc) try { N.bc.postMessage(m); } catch (e) {} }
  N.send = m => { if (N.role === 'host') broadcast(m); else if (N.role === 'guest') toHost(Object.assign({}, m)); };
  N.host = async nick => {
    N.leave(); N.role = 'host'; N.players = [{ id: N.myId, name: nick }];
    for (let k = 0; k < 3 && !N.peer; k++) { N.code = genCode(); try { N.peer = await openPeer(PREFIX + N.code); } catch (e) { if (!(e && e.type === 'unavailable-id')) break; } }
    if (!N.code) N.code = genCode(); openBc(N.code);
    if (N.peer) { N.peer.on('connection', c => { c.on('data', m => onHost(m, c)); c.on('close', () => { if (c.pid) drop(c.pid); }); }); try { if (window.BioRelay && BioRelay.setInfo) BioRelay.setInfo(N.peer, { name: nick + '의 볼링장', playing: false }); } catch (e) {} }
    N.online = !!N.peer; N.emit('lobby'); return N.code;
  };
  function onHost(m, c) {
    if (!m || !m.t) return; const pid = m.from; if (!pid) return; N.seen.set(pid, performance.now());
    const reply = r => c ? sendC(c, r) : sendTo(pid, r);
    if (m.t === 'hello') {
      if (m.v !== VER) return reply({ t: 'deny', why: '게임 버전이 달라요. 새로고침해 주세요.' });
      if (c) { c.pid = pid; N.conns.set(pid, c); }
      if (!N.players.find(p => p.id === pid)) {
        if (N.started) return reply({ t: 'deny', why: '이미 게임이 시작됐어요.' });
        if (N.players.length >= 4) return reply({ t: 'deny', why: '방이 가득 찼어요 (최대 4명).' });
        N.players.push({ id: pid, name: String(m.name || '선수').slice(0, 8) }); }
      broadcast({ t: 'lobby', players: N.players, code: N.code }); N.emit('lobby'); return;
    }
    if (m.t === 'bye') return drop(pid);
    if (m.t === 'ping') return;
    if (!N.players.find(p => p.id === pid)) return;
    const r = Object.assign({}, m); delete r.from; r.src = pid;
    N.emit(m.t, r); broadcast(r, pid);
  }
  function drop(pid) { N.conns.delete(pid); N.seen.delete(pid); const i = N.players.findIndex(p => p.id === pid); if (i >= 0) { N.players.splice(i, 1); broadcast({ t: 'lobby', players: N.players, code: N.code }); broadcast({ t: 'left', id: pid }); N.emit('left', { id: pid }); N.emit('lobby'); } }
  N.join = async (code, nick) => {
    N.leave(); code = String(code || '').trim().toUpperCase(); if (!/^[A-Z0-9]{3,6}$/.test(code)) { toast('방 코드를 확인하세요'); return; }
    N.code = code; N.role = 'guest'; openBc(code);
    const hello = () => toHost({ t: 'hello', v: VER, name: nick }); hello();
    openPeer().then(p => { if (N.role !== 'guest') { try { p.destroy(); } catch (e) {} return; } N.peer = p; N.hostConn = p.connect(PREFIX + code, { reliable: true }); N.hostConn.on('open', hello); N.hostConn.on('data', onGuest); N.hostConn.on('close', () => { if (N.role === 'guest') N.emit('lost', {}); }); }).catch(() => {});
    setTimeout(() => { if (N.role === 'guest' && !N.lastHost) { toast(`방 [${code}]을 찾지 못했어요`); N.leave(); N.emit('fail', {}); } }, 12000);
  };
  function onGuest(m) { if (!m || !m.t) return; if (m.src === N.myId) return; N.lastHost = performance.now(); if (m.t === 'deny') { toast('참가할 수 없어요: ' + m.why); N.leave(); N.emit('fail', {}); return; } if (m.t === 'lobby') { N.players = m.players; N.emit('lobby'); return; } N.emit(m.t, m); }
  N.leave = () => { if (N.role === 'guest') toHost({ t: 'bye' }); if (N.role === 'host') broadcast({ t: 'deny', why: '방장이 방을 닫았어요.' }); try { if (N.peer) N.peer.destroy(); } catch (e) {} try { if (N.bc) N.bc.close(); } catch (e) {}
    N.peer = null; N.hostConn = null; N.bc = null; N.conns.clear(); N.seen.clear(); N.role = null; N.code = ''; N.lastHost = 0; N.players = []; N.started = false; };
  setInterval(() => { if (N.role === 'guest') toHost({ t: 'ping' }); if (N.role === 'host') { const now = performance.now(); for (const [pid, t] of N.seen) if (now - t > 15000) drop(pid); } }, 3000);
  addEventListener('beforeunload', () => N.leave());
  return N;
})();

function hostStart() { if (NET.role !== 'host' || NET.players.length < 2) return; NET.started = true; const m = { t: 'start', players: NET.players.map(p => ({ id: p.id, name: p.name })) }; NET.send(m); startGame('online', m.players); }
NET.listen('lobby', () => { if (document.body.dataset.screen !== 'play') lobbyModal(); });
NET.listen('start', m => { NET.started = true; startGame('online', m.players); });
NET.listen('setup', m => { if (G.mode !== 'online' || G.phase === 'over') return; G.cur = m.cur; applySetup(m); });
NET.listen('throw', m => { if (G.mode !== 'online' || G.phase !== 'aim') return; doThrow(m.tp, true); });
NET.listen('result', m => { if (G.mode !== 'online') return; if (G.waitRes) { G.cur = m.cur; endRoll(m); } else G.pendingRes = m; });
NET.listen('left', m => { const p = G.players.find(q => q.id === m.id); if (!p || G.mode !== 'online') return; p.gone = true; toast(`${p.name}님이 나갔어요`); drawScore();
  if (G.players[G.cur] === p && G.phase !== 'over') { G.pendingRes = null; G.waitRes = false; SND.rollStop(); const n = nextPlayer(); if (n < 0) finishGame(); else { G.cur = n; beginTurn(true); } }
  else if (G.players.filter(q => !q.gone).length < 1) finishGame(); });
NET.listen('lost', () => { toast('방장과 연결이 끊겼어요'); });
NET.listen('fail', () => { if (document.body.dataset.screen !== 'play') onlineModal(); });

/* ---------------- 입력 ---------------- */
function act(c) { if (G.phase !== 'aim' || !myTurn() || G.charging) return;
  if (c === 'left') G.pos = clamp(G.pos - 0.03, -HALF + 0.13, HALF - 0.13); if (c === 'right') G.pos = clamp(G.pos + 0.03, -HALF + 0.13, HALF - 0.13);
  if (c === 'rotL') G.ang = clamp(G.ang - 0.004, -0.05, 0.05); if (c === 'rotR') G.ang = clamp(G.ang + 0.004, -0.05, 0.05);
  G.ang = Math.round(G.ang * 1000) / 1000; G.ball.x = G.pos; }
function startCharge() { if (G.phase !== 'aim' || !myTurn() || G.charging) return; SND.init(); G.charging = true; G.power = 0; G.chT0 = performance.now(); $('#throwBtn').classList.add('hold'); hint(''); }
function updPower() { const ph = ((performance.now() - G.chT0) / 1050) % 2; G.power = ph < 1 ? ph : 2 - ph; }   // 1.05초에 가득 → 다시 내려감 (실제 시간 기준)
function releaseCharge() { if (!G.charging) return; updPower(); G.charging = false; $('#throwBtn').classList.remove('hold'); if (G.power < 0.05) { setRing(0); $('#pwTxt').textContent = ''; return; }
  const p = G.power; $('#pwTxt').textContent = Math.round(p * 100) + '%' + (p >= 0.75 && p <= 0.92 ? ' 좋아요!' : p > 0.92 ? ' 너무 셈!' : p < 0.6 ? ' 약해요' : ''); setTimeout(() => { if (!G.charging) { $('#pwTxt').textContent = ''; setRing(0); } }, 1500);
  doThrow(throwParams(p)); }
const RING_LEN = 2 * Math.PI * 54;
function setRing(p) { $('#ringFill').style.strokeDasharray = `${RING_LEN * p} ${RING_LEN}`; }
function setCurve(v) { if (G.phase !== 'aim' || !myTurn()) return; G.curve = v; setCurveUI(); SND.click(); }
function bindInput() {
  const z = $('#ringZone'); z.style.strokeDasharray = `${RING_LEN * 0.17} ${RING_LEN}`; z.style.strokeDashoffset = `${-RING_LEN * 0.75}`; setRing(0);
  const tb = $('#throwBtn');
  tb.addEventListener('pointerdown', e => { e.preventDefault(); try { tb.setPointerCapture(e.pointerId); } catch (_) {} startCharge(); });
  tb.addEventListener('pointerup', releaseCharge); tb.addEventListener('pointercancel', releaseCharge); tb.addEventListener('lostpointercapture', releaseCharge);
  tb.addEventListener('contextmenu', e => e.preventDefault());
  let hold = null, holdT = null;
  const stopHold = () => { clearInterval(hold); clearTimeout(holdT); };
  document.querySelectorAll('#pad .ib').forEach(b => b.addEventListener('pointerdown', e => { e.preventDefault(); SND.init(); act(b.dataset.c); stopHold(); holdT = setTimeout(() => hold = setInterval(() => act(b.dataset.c), 60), 260); }));
  ['pointerup', 'pointercancel', 'blur'].forEach(t => addEventListener(t, stopHold));
  $('#curve').addEventListener('click', e => { const b = e.target.closest('[data-cv]'); if (b) setCurve(+b.dataset.cv); });
  const keys = {};
  addEventListener('keydown', e => { if (e.target.tagName === 'INPUT') return; if (e.code === 'Space') e.preventDefault(); if (keys[e.code]) return; keys[e.code] = true; SND.init();
    if (e.code === 'Space') startCharge();
    if (e.code === 'KeyQ') setCurve(clamp(G.curve - 0.5, -1, 1)); if (e.code === 'KeyE') setCurve(clamp(G.curve + 0.5, -1, 1));
    if (e.code === 'Escape') $('#modal').classList.remove('on'); });
  addEventListener('keyup', e => { keys[e.code] = false; if (e.code === 'Space') releaseCharge(); });
  setInterval(() => { if (keys.ArrowLeft) act('left'); if (keys.ArrowRight) act('right'); if (keys.KeyA) act('rotL'); if (keys.KeyD) act('rotR'); }, 60);
  document.addEventListener('click', e => { const a = e.target.closest('[data-act]'); if (!a || a.disabled) return; SND.init(); SND.click(); const k = a.dataset.act;
    const me = (SAVE.nick || '나').slice(0, 8);
    if (k === 'solo') startGame('solo', [{ name: me }]);
    else if (k === 'practice') startGame('practice', [{ name: me }]);

    else if (k === 'title') { if (NET.role) NET.leave(); G.phase = 'title'; G.mode = 'title'; SND.rollStop(); G.charging = false; show('title'); titleStat(); setScreen('BIO BOWL', '#3ee6c8'); }
    else if (k === 'hub') { if (NET.role) NET.leave(); location.href = '../index.html'; }
    else if (k === 'dex') dexModal(); else if (k === 'help') helpModal(); else if (k === 'opt') optModal();
    else if (k === 'close') $('#modal').classList.remove('on');

  });
  $('#modal').addEventListener('click', async e => {
    const id = e.target.id; if (id !== 'onHost' && id !== 'onJoin') return;
    const nick = ($('#onNick').value || '').trim().slice(0, 8) || '선수'; SAVE.nick = nick; save(); e.target.disabled = true;

}

/* ---------------- 메인 루프 ---------------- */
let last = performance.now();
function rollTick(dt) {
  for (let i = 0, n = Math.round(dt / DT); i < n; i++) { stepPhys(); physEvents(); }
  G.t += dt; handleEvents(); SND.rollVol(G.ball.done ? 0 : clamp(Math.hypot(G.ball.vx, G.ball.vz) / 9, 0.1, 0.6));
  if (G.ball.done && !G.ball.doneT) G.ball.doneT = G.t;
  if ((G.ball.done && settled() && G.t - G.ball.doneT > 0.8) || G.t > 12) {
    G.phase = 'count';
    setTimeout(() => { if (G.mode === 'online' && G.pendingRes) { const m = G.pendingRes; G.pendingRes = null; G.cur = m.cur; endRoll(m); } else finishRoll(); }, 350);

}
function frame(now) {

  if (G.charging) { updPower(); setRing(G.power); $('#pwTxt').textContent = Math.round(G.power * 100) + '%'; }
  if (G.ball) { syncBall(dt); syncPins(); }
  const aim = G.phase === 'aim' && myTurn() && document.body.dataset.screen === 'play';
  R.aim.visible = aim; if (aim) { R.aim.position.set(G.pos, 0, 0); R.aim.rotation.y = G.ang; const s = 1 + Math.sin(now / 200) * 0.06; R.arrow.scale.set(0.75 * s, s, 1); }
  predictPath(aim);
  animArena(dt, now); stepFx(dt); updCam(dt);
  const w = innerWidth, h = innerHeight;
  R.r.setScissorTest(false); R.r.setViewport(0, 0, w, h); R.r.render(R.scene, R.cam);
  const showPip = G.phase === 'aim' && document.body.dataset.screen === 'play';
  $('#pip').style.display = showPip ? 'block' : 'none';
  if (showPip) { const p = R.pip; R.r.setScissorTest(true); R.r.setScissor(p.x, h - p.y - p.h, p.w, p.h); R.r.setViewport(p.x, h - p.y - p.h, p.w, p.h); R.r.render(R.scene, R.pipCam); R.r.setScissorTest(false); }
}
// 탭이 가려져도 굴러가던 공은 끝까지 계산 (온라인에서 다른 사람이 기다리지 않게)
let hidLast = 0;
setInterval(() => { if (!document.hidden || G.phase !== 'roll') { hidLast = 0; return; } const now = performance.now(); if (hidLast) { let t = Math.min(2, (now - hidLast) / 1000); while (t > 0 && G.phase === 'roll') { rollTick(Math.min(0.1, t)); t -= 0.1; } } hidLast = now; }, 200);
/* ---------------- 시작 ---------------- */
try {
  initGfx(); makeIcons(); bindInput();
  resetPins(newLayout()); buildPins(); G.curBall = 'macro'; resetBall(); G.ball.x = 0; G.ball.z = HEAD_Z - 1.2; titleStat(); show('title');
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (G.phase === 'title') setScreen('BIO BOWL', '#3ee6c8'); });
  requestAnimationFrame(frame);
} catch (e) { console.error(e); $('#err').textContent = '시작 오류: ' + e.message; $('#err').style.display = 'block'; }
window.BB = { G, NET, R, rollTick, hostStart, doThrow, throwParams, startGame, scoreFrames, frameState, stepPhys, applySetup, nextPlayer,
  sim(ball, pos, ang, speed, spin, layout) { const mode = G.mode; G.mode = 'sim'; G.curBall = ball; resetPins(layout || newLayout()); G.pos = pos; G.ang = ang; resetBall(); G.phase = 'aim'; doThrow({ pos, ang, speed, spin, seed: Math.floor(Math.random() * 1e9) }, true); SND.rollStop();
    let t = 0; while (t < 12) { stepPhys(); physEvents(); t += DT; if (G.ball.done && settled()) break; } G.events.length = 0; G.phase = 'count'; G.mode = mode; return G.pins.filter(q => q.down || q.gone).length; } };
