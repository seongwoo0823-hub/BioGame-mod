<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>바이오 볼링</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--glass:rgba(16,28,52,.78);--line:rgba(255,255,255,.18);--acc:#36d1c4;--gold:#ffd23a;--red:#ff5a6a;--sat:env(safe-area-inset-top,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#1a2440;color:#fff;font-family:'Noto Sans KR',system-ui,sans-serif;word-break:keep-all;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font-family:inherit;color:inherit;cursor:pointer}
.bh{font-family:'Black Han Sans',sans-serif;font-weight:400}
.btn{border:0;border-radius:14px;padding:12px 20px;min-height:46px;font-weight:900;font-size:16px;background:rgba(255,255,255,.16);box-shadow:inset 0 -4px 0 rgba(0,0,0,.22)}
.btn.big{background:linear-gradient(180deg,#5ff0de,#22b8aa);color:#06302c;box-shadow:inset 0 -5px 0 #168a80,0 6px 18px rgba(34,184,170,.4);font-size:20px}
#gMenu{position:fixed;z-index:30;top:calc(10px + var(--sat));left:calc(10px + var(--sal));width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:rgba(16,28,52,.75);display:grid;place-items:center}
#gMenu svg{width:22px;height:22px;stroke:#fff;stroke-width:2.4;fill:none;stroke-linecap:round}
#sheet{position:fixed;inset:0;z-index:40;display:none;background:rgba(5,10,25,.45)}#sheet.on{display:block}
#sheet .sh{position:absolute;top:calc(64px + var(--sat));left:calc(10px + var(--sal));width:min(250px,calc(100vw - 20px));background:rgba(16,28,52,.96);border:1px solid var(--line);border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:4px}
#sheet button{border:0;background:transparent;text-align:left;padding:13px 12px;border-radius:10px;font-weight:700;font-size:16px}#sheet button:hover{background:rgba(255,255,255,.08)}
.scr{position:fixed;inset:0;z-index:10;display:none}.scr.on{display:flex}
#title{flex-direction:column;align-items:center;justify-content:flex-end;padding:0 16px calc(30px + var(--sab));background:linear-gradient(180deg,rgba(10,20,40,0) 35%,rgba(10,20,40,.7) 80%)}
#title h1{margin:0;font-family:'Black Han Sans';font-weight:400;font-size:clamp(46px,10vw,100px);line-height:1;text-shadow:0 5px 0 #1a6a8a,0 10px 26px rgba(0,0,0,.4);-webkit-text-stroke:2px #0d3a52}
#title .en{font-family:'Black Han Sans';letter-spacing:.4em;color:var(--gold);font-size:clamp(14px,2.4vw,24px);margin:4px 0 6px}
#tStat{opacity:.9;font-weight:700;margin-bottom:16px;text-align:center;text-shadow:0 1px 4px #000}
.tmenu{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tmenu .big{min-width:220px}
.ov{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(5,10,25,.55)}.ov.on{display:flex}
.box{width:min(460px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;background:rgba(16,28,52,.96);border:1px solid var(--line);border-radius:18px;padding:18px}
.box h2{margin:0 0 10px;font-family:'Black Han Sans';font-weight:400;font-size:28px}.box p{line-height:1.6;font-size:14px}
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.dx{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.07);border-radius:12px;padding:8px}
.dx i{flex:none;width:40px;height:40px;border-radius:50%;box-shadow:inset -4px -5px 0 rgba(0,0,0,.25),0 0 0 2px #fff3}
.dx b{display:block;font-size:15px}.dx small{font-size:12px;opacity:.85;line-height:1.35;display:block}
.box.wide{width:min(860px,calc(100% - 24px))}
.box h3{margin:14px 0 6px;font-size:16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;font-weight:700}.row input[type=range]{width:50%;accent-color:var(--acc)}
/* HUD */
#hud{position:fixed;inset:0;z-index:6;pointer-events:none;display:none}#hud.on{display:block}
#hud .pe{pointer-events:auto}
#pins{position:absolute;top:calc(10px + var(--sat));left:calc(64px + var(--sal));background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:8px 10px}
#pins .nm{font-weight:900;font-size:13px;margin-bottom:4px;color:var(--acc)}
#pinDia{display:block}
#board{position:absolute;top:calc(10px + var(--sat));right:calc(10px + var(--sar));background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:6px;display:flex;gap:2px;max-width:calc(100% - 220px);overflow-x:auto;scrollbar-width:none}
#board::-webkit-scrollbar{display:none}
.fr{flex:none;width:44px;background:rgba(255,255,255,.92);color:#162040;border-radius:6px;text-align:center;overflow:hidden}
.fr.cur{outline:3px solid var(--gold)}.fr .n{font-size:10px;font-weight:900;background:#2a4a7a;color:#fff}.fr .rr{display:flex;height:18px;border-bottom:1px solid #c8d4e8}.fr .rr span{flex:1;font-weight:900;font-size:13px;line-height:18px;border-left:1px solid #c8d4e8}.fr .rr span:first-child{border-left:0}
.fr .c{font-family:'Black Han Sans';font-size:16px;height:22px;line-height:22px}.fr.f10{width:60px}
#ballCard{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(12px + var(--sab));display:flex;gap:10px;align-items:center;background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:8px 14px 8px 8px;max-width:min(560px,calc(100% - 20px))}
#ballCard i{flex:none;width:44px;height:44px;border-radius:50%;box-shadow:inset -5px -6px 0 rgba(0,0,0,.25),0 0 0 3px #fff4}
#ballCard b{font-size:16px;display:block}#ballCard small{font-size:12px;opacity:.9;display:block;line-height:1.35}
#ctrl{position:absolute;right:calc(12px + var(--sar));bottom:calc(84px + var(--sab));display:grid;grid-template-columns:repeat(2,58px);gap:8px}
#ctrl button{width:58px;height:58px;border-radius:16px;border:1px solid var(--line);background:var(--glass);font-size:22px;font-weight:900;touch-action:none}
#ctrl button small{display:block;font-size:10px;font-weight:700;opacity:.85}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(84px + var(--sab));font-weight:900;font-size:15px;text-shadow:0 2px 6px #000;white-space:nowrap;animation:bob 1.3s infinite}
@keyframes bob{50%{transform:translate(-50%,-5px)}}
#power{position:absolute;left:calc(14px + var(--sal));bottom:calc(84px + var(--sab));width:22px;height:160px;border-radius:12px;background:rgba(0,0,0,.4);border:2px solid #fff6;overflow:hidden;display:none}
#power i{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(0deg,#3ad07a,#ffd23a,#ff5a3a)}
#spinTag{position:absolute;left:calc(44px + var(--sal));bottom:calc(84px + var(--sab));font-weight:900;font-size:13px;background:var(--glass);border-radius:10px;padding:4px 8px;display:none}
#banner{position:fixed;z-index:9;left:50%;top:40%;transform:translate(-50%,-50%);font-family:'Black Han Sans';font-size:clamp(40px,10vw,110px);opacity:0;pointer-events:none;white-space:nowrap;text-shadow:0 6px 0 rgba(0,0,0,.35)}
#banner.go{animation:ban 1.8s}@keyframes ban{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
.pop{position:fixed;z-index:8;font-weight:900;font-size:15px;pointer-events:none;transform:translate(-50%,-50%);text-shadow:0 2px 0 #000,0 0 8px #000;animation:popup 1.1s forwards;white-space:nowrap}@keyframes popup{to{opacity:0;margin-top:-40px}}
#pip{position:absolute;border:3px solid #fff;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.4);pointer-events:none;display:none}
#pip span{position:absolute;left:6px;top:4px;font-size:11px;font-weight:900;background:rgba(0,0,0,.5);border-radius:6px;padding:1px 6px}
#rotate{position:fixed;inset:0;z-index:25;display:none}
#err{position:fixed;z-index:99;left:10px;right:10px;bottom:10px;background:#c83a4a;padding:10px;border-radius:10px;display:none}
html.small #board .fr{width:34px}html.small .fr.f10{width:46px}html.small .fr .c{font-size:13px}html.small .fr .rr span{font-size:11px}
html.small #ballCard{padding:6px 10px 6px 6px}html.small #ballCard i{width:36px;height:36px}html.small #ballCard small{font-size:11px}
html.portrait #board{left:calc(10px + var(--sal));right:calc(10px + var(--sar));top:calc(62px + var(--sat));max-width:none}
html.portrait #pins{top:calc(122px + var(--sat));left:calc(10px + var(--sal))}
html.portrait #hint{bottom:calc(150px + var(--sab))}
html.small:not(.portrait) #ctrl{bottom:calc(10px + var(--sab));grid-template-columns:repeat(4,50px)}html.small:not(.portrait) #ctrl button{width:50px;height:50px}
html.small:not(.portrait) #ballCard{left:calc(14px + var(--sal));transform:none;max-width:calc(100% - 260px)}
html.small:not(.portrait) #hint{bottom:calc(76px + var(--sab))}
</style>
</head>
<body data-screen="title">
<canvas id="gl"></canvas>
<button id="gMenu" aria-label="메뉴"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
<div id="sheet"><div class="sh">
  <button data-act="hub">게임 목록으로</button><button data-act="title">메인 화면</button><button data-act="dex">도감</button><button data-act="help">게임 방법</button><button data-act="opt">설정</button>
</div></div>
<section id="title" class="scr on">
  <h1>바이오 볼링</h1><div class="en">BIO BOWLING</div>
  <div id="tStat"></div>
  <div class="tmenu"><button class="btn big" data-act="play">10프레임 게임</button><button class="btn" data-act="practice">자유 연습</button><button class="btn" data-act="dex">도감</button><button class="btn" data-act="help">게임 방법</button></div>
</section>
<div id="hud">
  <div id="pins"><div class="nm" id="frameNm">1프레임</div><canvas id="pinDia" width="140" height="108"></canvas></div>
  <div id="board" class="pe"></div>
  <div id="pip"><span>병원체 핀</span></div>
  <div id="hint">위로 밀어서 던지기!</div>
  <div id="power"><i></i></div><div id="spinTag"></div>
  <div id="ballCard"><i id="ballIco"></i><div><b id="ballName"></b><small id="ballDesc"></small></div></div>
  <div id="ctrl" class="pe">
    <button data-c="rotL" aria-label="왼쪽으로 방향">↺<small>방향</small></button><button data-c="rotR" aria-label="오른쪽으로 방향">↻<small>방향</small></button>
    <button data-c="left" aria-label="왼쪽으로 이동">◀<small>이동</small></button><button data-c="right" aria-label="오른쪽으로 이동">▶<small>이동</small></button>
  </div>
</div>
<div id="banner"></div>
<div id="modal" class="ov"><div class="box" id="modalBox"></div></div>
<div id="err"></div>

<script src="../device.js"></script>
<script src="../vendor/three.min.js"></script>
<script>
'use strict';
/* =========================================================
   바이오 볼링 — 면역세포 볼링공으로 병원체 핀 쓰러뜨리기
   ========================================================= */
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];

/* ---------------- 규격 (미터 단위) ---------------- */
const LANE_W = 1.05, HALF = LANE_W / 2, GUT = 0.12, HEAD_Z = 18.29, PIN_GAP = 0.305;
const PIN_R = 0.061, PIN_H = 0.38, DECK_END = HEAD_Z + 1.05;
const PIN_POS = (() => { const p = []; for (let r = 0; r < 4; r++) for (let i = 0; i <= r; i++) p.push([(i - r / 2) * PIN_GAP, HEAD_Z + r * PIN_GAP * 0.866]); return p; })();
// 볼링 번호(1~10): 1번이 앞, 7·8·9·10번이 뒷줄
/* ---------------- 면역세포 볼링공 8종 ---------------- */
const BALLS = {
  neutro: { name: '호중구', col: '#7cc8ff', col2: '#9a6ad8', r: 0.109, m: 7, speedMul: 1.15, desc: '빠른 공! 던지는 속도가 15% 빨라요.', fact: '백혈구 중 가장 많고 감염 부위에 가장 먼저 달려가요.' },
  macro:  { name: '대식세포', col: '#b48cff', col2: '#6a3ab0', r: 0.128, m: 11, desc: '크고 무거운 공. 부딪힌 핀은 무조건 쓰러져요.', fact: '병원체를 통째로 삼키는 거대한 식세포예요.' },
  nk:     { name: 'NK세포', col: '#a874ff', col2: '#ffe14a', r: 0.109, m: 7, desc: '첫 핀에 닿으면 가까운 핀 2개에 번개를 쏴요.', fact: '배우지 않아도 이상한 세포를 바로 처치하는 자연살해세포예요.' },
  comp:   { name: '보체', col: '#ff6a4a', col2: '#ffd23a', r: 0.105, m: 6.5, desc: '첫 핀에 닿으면 펑! 주변 핀을 날려요.', fact: '보체 단백질은 세균 막에 구멍을 뚫는 막 공격 복합체를 만들어요.' },
  killer: { name: '킬러 T세포', col: '#4a78e0', col2: '#ff3b4a', r: 0.109, m: 7, pierce: 3, desc: '핀 3개를 부딪쳐도 속도가 줄지 않고 뚫고 나가요.', fact: '감염된 세포를 찾아 퍼포린으로 제거하는 세포독성 T세포예요.' },
  bcell:  { name: 'B세포', col: '#ff9ccd', col2: '#ffd84a', r: 0.109, m: 7, desc: '항체를 뿌려 모든 핀이 더 잘 쓰러지게 해요.', fact: '항체로 병원체에 표시를 달아 다른 면역세포가 공격하게 도와요.' },
  dend:   { name: '수지상세포', col: '#7ee07a', col2: '#3a9a4a', r: 0.109, m: 7, guide: true, desc: '1번 핀 옆 "포켓"으로 공이 저절로 휘어 들어가요.', fact: '항원을 T세포에게 보여 주며 면역 반응의 길을 안내해요.' },
  mast:   { name: '비만세포', col: '#ffd84a', col2: '#9a4ad0', r: 0.109, m: 7, cloud: true, desc: '지나간 길에 히스타민 구름! 근처 핀이 흔들려 쓰러져요.', fact: '히스타민을 분비해 염증 반응을 일으키는 세포예요.' },
};
const BALL_KEYS = Object.keys(BALLS);
/* ---------------- 병원체 핀 6종 ---------------- */
const PINS = {
  cold:   { name: '감기 바이러스', col: '#7ee05a', m: 1.5, th: 0.7, desc: '평범한 핀이에요.', fact: '감기는 200종이 넘는 바이러스가 일으켜요.' },
  tb:     { name: '결핵균', col: '#c9b8a0', m: 2.6, th: 1.15, desc: '두꺼운 왁스 껍질 때문에 무겁고 잘 안 쓰러져요.', fact: '결핵균은 기름진 세포벽으로 자신을 보호해요.' },
  capsid: { name: '캡시드 바이러스', col: '#a8b0c8', m: 1.6, th: 0.75, armor: true, desc: '단백질 껍질이 있어 첫 충돌은 껍질만 깨져요.', fact: '바이러스의 유전 물질은 캡시드라는 단백질 껍질에 싸여 있어요.' },
  spore:  { name: '곰팡이 포자', col: '#5cc86a', m: 1.4, th: 0.62, burst: true, desc: '쓰러지면 포자가 터져 옆 핀을 밀어요.', fact: '곰팡이는 포자를 퍼뜨려 번식해요.' },
  ecoli:  { name: '대장균', col: '#d8955a', m: 0.9, th: 0.5, desc: '가볍고 미끄러워서 멀리 튕겨 나가요.', fact: '대장균은 편모로 헤엄쳐 다녀요.' },
  hiv:    { name: 'HIV', col: '#c0c4d4', m: 1.5, th: 0.7, nullify: true, desc: '공에 닿으면 공의 특수 능력을 꺼 버려요.', fact: 'HIV는 면역세포를 공격해 면역계를 약하게 만들어요.' },
};
const PIN_KEYS = Object.keys(PINS);

/* ---------------- 저장 ---------------- */
let SAVE = { best: 0, games: 0, strikes: 0 };
try { const s = JSON.parse(localStorage.getItem('bioBowling1') || 'null'); if (s && typeof s === 'object') SAVE = Object.assign(SAVE, s); } catch (e) {}
const OPT = Object.assign({ sfx: 0.8 }, SAVE.opt || {});
const save = () => { SAVE.opt = OPT; try { localStorage.setItem('bioBowling1', JSON.stringify(SAVE)); } catch (e) {} };

/* ---------------- 소리 ---------------- */
const SND = (() => {
  let ac = null, g = null, roll = null;
  const init = () => { if (ac) { if (ac.state === 'suspended') ac.resume(); return; } try { ac = new (window.AudioContext || window.webkitAudioContext)(); g = ac.createGain(); g.gain.value = OPT.sfx * 0.6; g.connect(ac.destination); } catch (e) { ac = null; } };
  const tone = (f, d, type = 'square', v = 0.15, f2) => { if (!ac) return; const t = ac.currentTime, o = ac.createOscillator(), a = ac.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + d); a.gain.setValueAtTime(v, t); a.gain.exponentialRampToValueAtTime(0.001, t + d); o.connect(a); a.connect(g); o.start(t); o.stop(t + d + 0.02); };
  const noise = (d, v = 0.2, lp = 2000, hp = 0) => { if (!ac) return; const t = ac.currentTime, n = ac.createBufferSource(), b = ac.createBuffer(1, Math.ceil(ac.sampleRate * d), ac.sampleRate), a = b.getChannelData(0); for (let i = 0; i < a.length; i++) a[i] = Math.random() * 2 - 1; n.buffer = b; const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp; const x = ac.createGain(); x.gain.setValueAtTime(v, t); x.gain.exponentialRampToValueAtTime(0.001, t + d); n.connect(f); if (hp) { const h = ac.createBiquadFilter(); h.type = 'highpass'; h.frequency.value = hp; f.connect(h); h.connect(x); } else f.connect(x); x.connect(g); n.start(t); };
  let lastClack = 0;
  return {
    init, vol() { if (g) g.gain.value = OPT.sfx * 0.6; },
    rollStart() { if (!ac) return; this.rollStop(); const n = ac.createBufferSource(), b = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate), a = b.getChannelData(0); let l = 0; for (let i = 0; i < a.length; i++) { l = l * 0.97 + (Math.random() * 2 - 1) * 0.03; a[i] = l * 6; } n.buffer = b; n.loop = true; const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 260; const x = ac.createGain(); x.gain.value = 0.5; n.connect(f); f.connect(x); x.connect(g); n.start(); roll = { n, x }; },
    rollVol(v) { if (roll) roll.x.gain.value = v; },
    rollStop() { if (roll) { try { roll.n.stop(); } catch (e) {} roll = null; } },
    clack(v = 1) { const now = performance.now(); if (now - lastClack < 25) return; lastClack = now; noise(0.12 + v * 0.1, 0.12 + v * 0.25, 4500, 900); tone(rand(500, 900), 0.06, 'triangle', 0.08 * v); },

  el.innerHTML = s.frames.map((f, i) => { const n = i === 9 ? 3 : 2, marks = i === 9 ? f.marks : (f.marks.length ? f.marks : ['', '']);
    const cells = Array.from({ length: n }, (_, k) => `<span>${marks[k] || ''}</span>`).join('');
    return `<div class="fr ${i === 9 ? 'f10' : ''} ${i === G.frame && G.phase !== 'over' ? 'cur' : ''}"><div class="n">${i + 1}</div><div class="rr">${cells}</div><div class="c">${f.cum ?? ''}</div></div>`; }).join('');
  const cur = el.querySelector('.cur'); if (cur) cur.scrollIntoView({ inline: 'center', block: 'nearest' });
}
function updHud() {
  $('#frameNm').textContent = G.mode === 'practice' ? '자유 연습' : `${G.frame + 1}프레임 · ${G.roll + 1}구`;
  drawPinDia();
}
function popAt(x, y, z, txt, col) {
  const v = new THREE.Vector3(x, y, z).project(R.cam); if (v.z > 1) return;
  const el = document.createElement('div'); el.className = 'pop'; el.textContent = txt; el.style.color = col;
  el.style.left = clamp((v.x + 1) / 2 * innerWidth, 80, innerWidth - 80) + 'px'; el.style.top = clamp((1 - v.y) / 2 * innerHeight, 120, innerHeight - 140) + 'px'; document.body.appendChild(el); setTimeout(() => el.remove(), 1100);
}
function popCenter(txt) { const el = document.createElement('div'); el.className = 'pop'; el.textContent = txt; el.style.color = '#fff'; el.style.fontSize = '34px'; el.style.left = '50%'; el.style.top = '40%'; document.body.appendChild(el); setTimeout(() => el.remove(), 1100); }
function banner(txt, col) { const b = $('#banner'); b.textContent = txt; b.style.color = col; b.classList.remove('go'); void b.offsetWidth; b.classList.add('go'); }
function show(id) { document.body.dataset.screen = id; $('#title').classList.toggle('on', id === 'title'); $('#hud').classList.toggle('on', id === 'play'); $('#sheet').classList.remove('on'); }
function modal(html, noClose) { $('#modalBox').innerHTML = html + (noClose ? '' : '<div class="btns"><button class="btn" data-act="close">닫기</button></div>'); $('#modal').classList.add('on'); }
function dexModal() {
  const ball = k => { const d = BALLS[k]; return `<div class="dx"><i style="background:radial-gradient(circle at 35% 30%, ${shade(d.col, 0.4)}, ${d.col} 55%, ${shade(d.col, -0.35)})"></i><div><b>${d.name} 볼</b><small>${d.desc}</small><small style="opacity:.65">🔬 ${d.fact}</small></div></div>`; };
  const pin = k => { const d = PINS[k]; return `<div class="dx"><i style="border-radius:40% 40% 30% 30%;background:linear-gradient(180deg,#f7f4ee 18%,${d.col} 18% 70%,#f7f4ee 70%)"></i><div><b>${d.name} 핀</b><small>${d.desc}</small><small style="opacity:.65">🔬 ${d.fact}</small></div></div>`; };
  $('#modalBox').parentElement; modal(`<h2>도감</h2><h3>면역세포 볼링공 · 투구마다 무작위로 나와요</h3><div class="dex">${BALL_KEYS.map(ball).join('')}</div><h3>병원체 핀 · 프레임마다 무작위로 섞여요</h3><div class="dex">${PIN_KEYS.map(pin).join('')}</div>`);
  $('#modalBox').classList.add('wide');
}
function helpModal() {
  modal(`<h2>게임 방법</h2>
  <p>🎳 <b>던지기</b>: 화면을 <b>아래에서 위로 쓱 밀어요</b>. 빠르게 밀수록 공이 빨라요. 비스듬히(오른쪽·왼쪽으로) 밀면 공이 그쪽으로 <b>휘어요</b>.</p>
  <p>↔ <b>위치·방향</b>: 화면을 옆으로 끌거나 오른쪽 아래 ◀ ▶ 버튼으로 서는 위치를, ↺ ↻ 버튼으로 던질 방향을 정해요. 주황 화살표가 방향이에요.</p>
  <p>⌨ <b>키보드</b>: ← → 위치, A·D 방향, Q·E 회전(휘기), <b>스페이스를 누르고 있다가 떼면</b> 던져요(막대가 높을 때 떼면 빨라요).</p>
  <p>🧬 투구마다 <b>면역세포 볼링공</b>이 무작위로 나오고, 핀은 <b>병원체</b>가 섞여 있어요. 공과 핀의 능력은 도감에서 볼 수 있어요.</p>
  <p>⭐ 점수는 실제 볼링과 같아요. 스트라이크(X)는 다음 두 번, 스페어(/)는 다음 한 번 쓰러뜨린 핀 수가 더해져요.</p>`);
  $('#modalBox').classList.remove('wide');
}
function optModal() { modal(`<h2>설정</h2><label class="row">효과음 <input type="range" id="oSfx" min="0" max="1" step="0.05" value="${OPT.sfx}"></label><button class="btn" data-act="resetRec">기록 지우기</button>`); $('#modalBox').classList.remove('wide');
  $('#oSfx').oninput = e => { OPT.sfx = +e.target.value; SND.vol(); save(); }; }

/* ---------------- 입력 ---------------- */
let drag = null;
function bindInput() {
  const cv = $('#gl');
  cv.addEventListener('pointerdown', e => { SND.init(); if (G.phase !== 'aim') return; drag = { x: e.clientX, y: e.clientY, x0: e.clientX, t: performance.now(), mode: null, pts: [[e.clientX, e.clientY, performance.now()]] }; });
  addEventListener('pointermove', e => { if (!drag || G.phase !== 'aim') return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.pts.push([e.clientX, e.clientY, performance.now()]); if (drag.pts.length > 12) drag.pts.shift();
    if (!drag.mode && Math.hypot(e.clientX - drag.x0, e.clientY - (drag.pts[0][1])) > 12) drag.mode = Math.abs(e.clientX - drag.x0) > Math.abs(e.clientY - drag.pts[0][1]) * 1.3 ? 'move' : 'throw';
    if (drag.mode === 'move') { G.pos = clamp(G.pos + dx / Math.min(innerWidth, 700) * 1.1, -HALF + 0.13, HALF - 0.13); G.ball.x = G.pos; }
    drag.x = e.clientX; drag.y = e.clientY; });
  addEventListener('pointerup', e => { if (!drag) return; const d = drag; drag = null; if (G.phase !== 'aim' || d.mode !== 'throw') return;
    const p0 = d.pts[0], p1 = [e.clientX, e.clientY, performance.now()], dy = p0[1] - p1[1], dt = Math.max(30, p1[2] - p0[2]);
    if (dy < 40) return;
    const pxms = dy / dt, speed = 4.4 + clamp((pxms - 0.35) / 2.2, 0, 1) * 5.0, spin = clamp((p1[0] - p0[0]) / dy * 1.8, -1, 1);
    throwBall(speed, spin); });
  // 버튼 (누르고 있으면 계속)
  let hold = null;
  document.querySelectorAll('#ctrl button').forEach(b => { b.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); SND.init(); act(b.dataset.c); clearInterval(hold); hold = setInterval(() => act(b.dataset.c), 90); }); });
  addEventListener('pointerup', () => clearInterval(hold)); addEventListener('pointercancel', () => clearInterval(hold));
  const keys = {};
  addEventListener('keydown', e => { if (keys[e.code]) return; keys[e.code] = true; SND.init();
    if (G.phase !== 'aim') return;
    if (e.code === 'ArrowLeft') act('left'); if (e.code === 'ArrowRight') act('right');
    if (e.code === 'KeyA') act('rotL'); if (e.code === 'KeyD') act('rotR');
    if (e.code === 'KeyQ') { G.spin = clamp(G.spin - 0.25, -1, 1); spinTag(); } if (e.code === 'KeyE') { G.spin = clamp(G.spin + 0.25, -1, 1); spinTag(); }
    if (e.code === 'Space') { e.preventDefault(); G.charging = true; G.power = 0; G.chDir = 1; $('#power').style.display = 'block'; } });
  addEventListener('keyup', e => { keys[e.code] = false; if (e.code === 'Space' && G.charging) { G.charging = false; $('#power').style.display = 'none'; throwBall(4.4 + G.power * 5.0, G.spin); } });
  const repeat = () => { if (G.phase === 'aim') { if (keys.ArrowLeft) act('left'); if (keys.ArrowRight) act('right'); if (keys.KeyA) act('rotL'); if (keys.KeyD) act('rotR'); } };
  setInterval(repeat, 90);
  document.addEventListener('click', e => { const a = e.target.closest('[data-act]'); if (!a) return; SND.init(); SND.click(); const k = a.dataset.act;
    if (k === 'play') { $('#modal').classList.remove('on'); startGame('game'); } else if (k === 'practice') { $('#modal').classList.remove('on'); startGame('practice'); }
    else if (k === 'title') { $('#modal').classList.remove('on'); G.phase = 'title'; SND.rollStop(); show('title'); titleStat(); }
    else if (k === 'hub') location.href = '../index.html'; else if (k === 'dex') dexModal(); else if (k === 'help') helpModal(); else if (k === 'opt') optModal();
    else if (k === 'close') $('#modal').classList.remove('on');
    else if (k === 'resetRec') { if (confirm('기록을 지울까요?')) { SAVE = { best: 0, games: 0, strikes: 0 }; save(); titleStat(); $('#modal').classList.remove('on'); } } });
  $('#gMenu').addEventListener('click', () => { SND.init(); $('#sheet').classList.toggle('on'); });
  $('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') $('#sheet').classList.remove('on'); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) SND.rollStop(); });
}
function act(c) { if (G.phase !== 'aim') return;
  if (c === 'left') G.pos = clamp(G.pos - 0.03, -HALF + 0.13, HALF - 0.13); if (c === 'right') G.pos = clamp(G.pos + 0.03, -HALF + 0.13, HALF - 0.13);
  if (c === 'rotL') G.ang = clamp(G.ang - 0.006, -0.05, 0.05); if (c === 'rotR') G.ang = clamp(G.ang + 0.006, -0.05, 0.05);
  G.ball.x = G.pos; }
function spinTag() { const t = $('#spinTag'); t.style.display = 'block'; t.textContent = G.spin === 0 ? '회전 없음' : (G.spin < 0 ? '◀ 왼쪽으로 휨 ' : '오른쪽으로 휨 ▶ ') + Math.round(Math.abs(G.spin) * 100) + '%'; }
function titleStat() { $('#tStat').textContent = SAVE.games ? `최고 ${SAVE.best}점 · ${SAVE.games}게임 · 스트라이크 ${SAVE.strikes}번` : '면역세포 볼링공으로 병원체 핀을 쓰러뜨려요!'; }

/* ---------------- 메인 루프 ---------------- */
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (G.phase === 'roll') {
    for (let i = 0, n = Math.round(dt / DT); i < n; i++) stepPhys();
    G.t += dt; handleEvents();
    SND.rollVol(G.ball.done ? 0 : clamp(Math.hypot(G.ball.vx, G.ball.vz) / 9, 0.1, 0.6));
    if (G.ball.done && !G.ball.doneT) G.ball.doneT = G.t;
    if ((G.ball.done && settled() && G.t - G.ball.doneT > 0.8) || G.t > 12) { G.phase = 'count'; setTimeout(endRoll, 350); }
    drawPinDia();
  }
  if (G.charging) { G.power += G.chDir * dt * 1.1; if (G.power > 1) { G.power = 1; G.chDir = -1; } if (G.power < 0) { G.power = 0; G.chDir = 1; } $('#power i').style.height = (G.power * 100) + '%'; }
  if (G.ball) { syncBall(dt); syncPins(); }
  R.aim.visible = G.phase === 'aim'; if (R.aim.visible) { R.aim.position.set(G.pos, 0, 0); R.aim.rotation.y = G.ang; }
  stepFx(dt); updCam(dt);
  // 본 화면
  const w = innerWidth, h = innerHeight;
  R.r.setScissorTest(false); R.r.setViewport(0, 0, w, h); R.r.render(R.scene, R.cam);
  // 핀 확대 화면 (조준할 때)
  const showPip = G.phase === 'aim' && document.body.dataset.screen === 'play';
  $('#pip').style.display = showPip ? 'block' : 'none';
  if (showPip) { const p = R.pip; R.r.setScissorTest(true); R.r.setScissor(p.x, h - p.y - p.h, p.w, p.h); R.r.setViewport(p.x, h - p.y - p.h, p.w, p.h); R.r.render(R.scene, R.pipCam); R.r.setScissorTest(false); }
}
/* ---------------- 시작 ---------------- */
try {
  initGfx(); bindInput(); setupPins(false); buildPinMeshes(); rollBall(); resetBall(); titleStat(); show('title');
  requestAnimationFrame(frame);
} catch (e) { console.error(e); $('#err').textContent = '시작 오류: ' + e.message; $('#err').style.display = 'block'; }
window.BB = { G, throwBall, startGame, scoreFrames, stepPhys, endRoll, R,
  // 시험용: 화면 없이 한 번 던져서 쓰러진 핀 수 반환
  sim(ball, pos, ang, speed, spin, layout) { const keep = G.phase; G.curBall = ball; setupPins(false); if (layout) { G.layout = layout; G.pins = PIN_POS.map((q, i) => mkPin(i, q)); } G.pos = pos; G.ang = ang; resetBall(); G.phase = 'aim'; throwBall(speed, spin); SND.rollStop();
    let t = 0; while (t < 12) { stepPhys(); handleEvents(); t += DT; if (G.ball.done && settled()) break; } G.phase = keep; return G.pins.filter(q => q.down || q.gone).length; } };
</script>

<script src="../ilog.js"></script>
