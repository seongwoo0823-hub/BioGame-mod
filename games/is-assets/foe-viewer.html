<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>면역 특공대 적 도감</title>
<style>
:root{--bg:#160a1c;--fg:#f4e6f6;--mut:#b49ac0;--card:#24122c;--one:#7ad8ff;--tough:#ff8a6a;--boss:#ffd060}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,sans-serif;padding:16px}
h1{font-size:18px;margin:0 0 4px}h2{font-size:16px;margin:22px 0 8px}h3{font-size:14px;margin:12px 0 6px}p{color:var(--mut);margin:0 0 10px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.c{background:var(--card);border-radius:8px;padding:6px;text-align:center;border-top:3px solid var(--k)}
.c canvas{image-rendering:pixelated;width:116px;height:96px;background:#3a1a34;border-radius:4px}
.c.big canvas{width:260px;height:240px}.g.b{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.n{font-weight:600;font-size:13px}.s{color:var(--mut);font-size:11px}
.old{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}.old span{background:var(--card);border-left:3px solid var(--k);border-radius:4px;padding:2px 8px;font-size:12px}
.tag{display:inline-block;border-radius:4px;padding:0 6px;font-size:12px;font-weight:600;color:#160a1c;background:var(--k)}
</style></head><body>
<h1>면역 특공대 적 도감 (적 60종 + 보스 9종)</h1>
<p><span class="tag" style="--k:var(--one)">한 방</span> 어떤 공격이든 한 번 맞으면 쓰러지는 졸개 · <span class="tag" style="--k:var(--tough)">여러 발</span> 체력바가 붙어 있고 여러 번 맞혀야 쓰러지는 정예 · 적은 세 세력(부패·잿빛·썩은 살)의 의인화 병원균 병사, 보스는 거대 기계 병기입니다.</p>
<div id="root"></div>
<script src="foes.js"></script>
<script>
const D=[
 {st:'STAGE 1 · 혈관 (세균) — 부패 세력',one:[['ecoli','대장균','칼을 들고 돌진'],['staph','포도상구균','점프, 쓰러지면 꼬마 셋으로 분열'],['salmo','살모넬라','독 주사기 투척'],['helico','헬리코박터','편모 프로펠러로 급강하'],['bacil','바실러스','몸을 말고 굴러서 돌진'],['listeria','리스테리아','로켓 꼬리로 돌진'],['vibrio','비브리오 콜레라','공중을 헤엄치다 내리꽂음'],['neisseria','임균 (쌍구균)','통통 튀며 접근'],['spiro','스피로헤타','웅크렸다 튀어 오름'],['myco','마이코플라스마','셋이 떼로 날며 끈적탄']],
  tough:[['strep','연쇄상구균','꼬마 병사 7명이 줄지어 행진'],['clos','클로스트리디움','껍데기 열 때만 제대로 맞음'],['tb','결핵균','방패 돌격병'],['botul','보툴리누스균','독가스 탱크'],['pseudo','녹농균','끈적탄 사격'],['mrsa','MRSA 내성 포도알균','판갑이 열릴 때만 제대로 맞음'],['anthrax','탄저균 포자탑','포자 박격포'],['klebs','클레브시엘라','굴러서 돌진'],['tetanus','파상풍균','내려찍어 충격파'],['legion','레지오넬라','제트팩 3갈래 사격']],
  boss:[['mid1','중간 보스 · 결핵 중장갑 전차','돌진 / 포자 박격 / 포탑 사격'],['gb1','관문 보스 · 탄저 포격 비행선','포자 융단 폭격 / 저공 돌진 / 유도탄'],['biofilm','최종 보스 · 바이오필름 정화 요새','오물 비 / 바닥 촉수 / 쇠사슬 팔 휩쓸기 / 독가스']]},
 {st:'STAGE 2 · 림프절 (바이러스) — 잿빛 세력',one:[['flu','인플루엔자','날개로 급강하'],['rhino','리노바이러스','넷이 떼로 날아다님'],['hiv','HIV','투명해졌다 나타나 사격'],['herpes','헤르페스','땅속에서 솟아 사격 (숨어 있을 땐 무적)'],['adeno','아데노바이러스','굴러다니며 튐'],['noro','노로바이러스','셋이 떼로 깡충깡충'],['measles','홍역 바이러스','머리 위에서 폭탄'],['hpv','HPV','웅크렸다 덮침'],['zika','지카 모기','주삿바늘로 급강하'],['polio','폴리오바이러스','칼 들고 돌진']],
  tough:[['phage','박테리오파지','점프 착지 충격파'],['corona','코로나바이러스','8방향 가시'],['ebola','에볼라','긴 채찍 휘두르기'],['infcell','감염 세포','시간이 지나면 터져 리노 넷'],['rabies','광견병 바이러스','탄환 머리 돌진'],['hbv','B형 간염 바이러스','유도탄 셋'],['smallpox','천연두 바이러스','산성탄 3발'],['dengue','뎅기 바이러스','돌진, 쓰러지면 노로 둘'],['mers','MERS 코로나바이러스','8방향 가시 (공중)'],['tmv','담배모자이크 바이러스','제트팩 2연사']],
  boss:[['mid2','중간 보스 · 보행 바이러스 공장','바이러스 생산 / 가시 방출 / 점프 충격파'],['gb2','관문 보스 · 강철 T4 착륙선','점프 착지 충격파 / 머리 사격 + 바닥 바늘'],['virking','최종 보스 · 육각 코어 비행 요새','방사 가시 / 낙하 충격파 / DNA 광선 / 증원']]},
 {st:'STAGE 3 · 종양 미세환경 — 썩은 살 세력',one:[['meta','전이 세포','뛰어서 덮침'],['hypox','저산소 거품','닿으면 폭발'],['exo','엑소좀 드론','폭탄 투하'],['treg','타락한 조절 T세포','억제탄 사격'],['mdsc','골수유래 억제세포','동료 회복'],['ctc','순환 종양 세포','수평으로 돌진'],['platelet','납치된 혈소판','붙잡혀 느려짐'],['lactate','젖산 방울','머리 위에서 터져 산성 웅덩이'],['mirna','종양 miRNA','칼 들고 돌진'],['zombie','좀비 세포','비틀비틀 다가와 할큄']],
  tough:[['tumor','종양 세포','둘로 분열'],['tam','종양 관련 대식세포','붙잡아 조름'],['vessel','혈관신생 덩굴','발밑에서 솟아오름'],['pdl1','PD-L1 방패세포','앞에서 쏘면 막힘'],['stem','종양 줄기세포','종양 세포를 낳음'],['caf','암 관련 섬유아세포','섬유 3발'],['p53','돌연변이 p53 세포','색이 변하며 공격이 무작위'],['mdr','다제내성 펌프 세포','맞은 만큼 모아서 되쏨'],['mimic','MHC 위장 세포','반투명하게 다가와 억제탄'],['giant','거대 다핵 세포','양쪽 충격파 짓밟기']],
  boss:[['mid3','중간 보스 · 고릴라형 파쇄 기계','점프 충격파 / 산성탄 / 집게팔 내려치기'],['gb3','관문 보스 · 세 포탑 키메라 기계','세 포탑 연속 사격 / 바닥 촉수'],['oncos','최종 보스 · 생체기계 탑 온코스','방어막 드론 / 레이저 / 분열 / 폭주']]}];
const M=window.IS_FOES,img=new Image();img.src='foes.png';const cs=[];
function card(par,[id,n,d],k,big){const m=M[id];const c=document.createElement('div');c.className='c'+(big?' big':'');c.style.setProperty('--k',k);
 const cv=document.createElement('canvas');const W=big?130:38,H=big?120:34;cv.width=W;cv.height=H;c.append(cv);
 c.insertAdjacentHTML('beforeend',`<div class="n">${n}</div><div class="s">${d}</div>`);par.append(c);cs.push([cv,m,W,H]);}
const root=document.getElementById('root');
for(const s of D){root.insertAdjacentHTML('beforeend',`<h2>${s.st}</h2>`);
 for(const [key,lab,k,big] of [['one','한 방 졸개 10종','var(--one)',0],['tough','여러 발 정예 10종','var(--tough)',0],['boss','보스 3종 (기계 병기)','var(--boss)',1]]){
  root.insertAdjacentHTML('beforeend',`<h3><span class="tag" style="--k:${k}">${lab}</span></h3>`);const g=document.createElement('div');g.className='g'+(big?' b':'');root.append(g);
  for(const it of s[key])card(g,it,k,big);}}
let t=0;img.onload=()=>{(function loop(){t++;for(const [cv,m,W,H] of cs){const x=cv.getContext('2d');x.clearRect(0,0,W,H);const keys=Object.keys(m.A);const seq=[];for(const k of keys)for(const f of m.A[k])seq.push(f);const base=m.A.mv||m.A.core||seq;const tot=base.length*3+seq.length-base.length;let i=Math.floor(t/7)%tot;let f=i<base.length*3?base[i%base.length]:seq[base.length+i-base.length*3];
 x.drawImage(img,f[0],f[1],m.w,m.h,Math.round(W/2-m.o[0]),H-4-m.o[1],m.w,m.h);}requestAnimationFrame(loop);})();};
</script></body></html>
