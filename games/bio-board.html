<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script src="../icons.js"></script>
<script src="../net.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>생명과학 보드게임 천국 · Bio-Board Heaven</title>
<meta name="theme-color" content="#0f1a2e">
<link rel="manifest" href="../manifest.webmanifest?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-v2-32.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon-v2.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800;900&display=swap" rel="stylesheet">
<script>if('serviceWorker' in navigator&&location.protocol!=='file:')addEventListener('load',()=>navigator.serviceWorker.register('../sw.js',{scope:'../'}).catch(()=>{}));</script>
<style>
:root{
  --glass:rgba(18,28,52,.46); --glass2:rgba(255,255,255,.16); --line:rgba(255,255,255,.22); --text:#f4f8ff; --sub:#b9c7e2;
  --neon:#5ef2c8; --pink:#ff7eb6; --amber:#ffd166; --blue:#7cc4ff; --red:#ff6b6b; --bg:#0f1a2e;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);
  box-shadow:0 18px 40px -16px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.18)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 16px;border-radius:14px;font-weight:800;font-size:15px;
  background:var(--glass2);border:1px solid var(--line);transition:transform .12s,background .15s}
.btn:hover{background:rgba(255,255,255,.28)} .btn:active{transform:scale(.96)}
.btn.pri{background:linear-gradient(135deg,#34e0b0,#38a8ff);color:#06221d;border-color:transparent}
.btn.warn{background:linear-gradient(135deg,#ffb36b,#ff6b8b);color:#2b0710;border-color:transparent}
.btn.sm{min-height:34px;padding:0 11px;font-size:13px;border-radius:11px}
.btn[disabled]{opacity:.38;pointer-events:none}
.ui{position:fixed;z-index:5}
#top{left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));display:flex;gap:8px;align-items:flex-start;pointer-events:none}
#top>*{pointer-events:auto}
#title{padding:9px 14px;min-width:0}
#title b{display:block;font-size:16px;font-weight:900;letter-spacing:-.02em}
#title small{display:block;font-size:12px;color:var(--sub);margin-top:1px}
#players{display:flex;gap:6px;flex-wrap:wrap;flex:1;justify-content:flex-end}
.pl{display:flex;align-items:center;gap:7px;padding:6px 11px 6px 6px;border-radius:16px;font-size:13px;min-width:0}
.pl i{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;font-style:normal;font-weight:900;font-size:12px;color:#081320}
.pl b{font-weight:800;white-space:nowrap}
.pl small{display:block;color:var(--sub);font-size:11px;white-space:nowrap}
.pl.on{outline:2px solid var(--neon);box-shadow:0 0 18px rgba(94,242,200,.45)}
.pl.out{opacity:.4}
#bar{left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;align-items:center;width:min(980px,calc(100% - 20px));pointer-events:none}
#bar>*{pointer-events:auto}
#msg{padding:9px 16px;font-size:14px;font-weight:700;text-align:center;max-width:100%}
#msg:empty{display:none}
#acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:8px;border-radius:20px}
#acts:empty{display:none}
#dock{left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));display:flex;gap:8px;padding:8px;border-radius:26px}
#dock button{display:flex;flex-direction:column;align-items:center;gap:3px;width:92px;padding:8px 4px;border-radius:18px;font-size:12px;font-weight:800;transition:transform .15s,background .15s}
#dock button:hover{background:rgba(255,255,255,.14);transform:translateY(-4px)}
#dock svg{width:34px;height:34px}
#lobbyHead{left:50%;top:calc(16px + env(safe-area-inset-top));transform:translateX(-50%);text-align:center;padding:12px 22px;pointer-events:none}
#lobbyHead h1{margin:0;font-size:clamp(20px,4vw,30px);font-weight:900;letter-spacing:-.03em;background:linear-gradient(90deg,#7cf5d4,#9ad0ff,#ffb3d9);-webkit-background-clip:text;background-clip:text;color:transparent}
#lobbyHead p{margin:4px 0 0;font-size:13px;color:var(--sub)}
#homeBtns{right:12px;top:calc(12px + env(safe-area-inset-top));display:flex;gap:6px}
.scrim{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(5,10,22,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.scrim[hidden]{display:none}
.modal{width:min(560px,100%);max-height:calc(100% - 20px);overflow:auto;padding:20px;background:rgba(24,36,62,.78)}
.modal h2{margin:0 0 4px;font-size:21px;font-weight:900}
.modal p.sub{margin:0 0 14px;color:var(--sub);font-size:13.5px;line-height:1.5}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.seg button{flex:1;min-width:90px;padding:10px 8px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-weight:800;font-size:13.5px}
.seg button small{display:block;font-weight:600;color:var(--sub);font-size:11px;margin-top:2px}
.seg button.on{background:linear-gradient(135deg,rgba(52,224,176,.35),rgba(56,168,255,.35));border-color:var(--neon)}
.lbl{font-size:12px;font-weight:800;color:var(--sub);letter-spacing:.04em;margin-top:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input.txt{flex:1;min-width:120px;height:42px;border-radius:13px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:#fff;font:800 16px inherit;padding:0 12px;letter-spacing:.1em;text-transform:uppercase;outline:none;user-select:text;-webkit-user-select:text}
.chars{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0 10px}
.chars button{padding:8px 4px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-size:11.5px;font-weight:800}
.chars button.on{border-color:var(--neon);background:rgba(94,242,200,.18)}
.chars canvas{width:54px;height:54px;display:block;margin:0 auto 3px}
#tip{position:fixed;z-index:30;max-width:280px;padding:12px 14px;pointer-events:none;opacity:0;transition:opacity .15s;font-size:13px;line-height:1.5;background:rgba(24,36,62,.72)}
#tip.show{opacity:1}
#tip b{display:block;font-size:14.5px;margin-bottom:3px;color:#9ff5dc}
#tip i{display:inline-block;font-style:normal;font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:99px;background:rgba(255,255,255,.14);margin-bottom:5px}
#toast{position:fixed;z-index:25;left:50%;top:22%;transform:translate(-50%,-10px) scale(.96);opacity:0;transition:all .3s;text-align:center;padding:16px 26px;pointer-events:none;max-width:min(90vw,520px)}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
#toast b{display:block;font-size:24px;font-weight:900;letter-spacing:-.02em}
#toast span{display:block;font-size:14px;color:var(--sub);margin-top:4px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:7px 12px;border-radius:13px;font-weight:900;font-size:15px;background:rgba(255,255,255,.15);border:1px solid var(--line)}
.badge.on{background:linear-gradient(135deg,#ffe08a,#ff9fc8);color:#2a1020;border-color:transparent}
.badge small{font-weight:700;font-size:11px;opacity:.75}
.code{font:900 34px/1 ui-monospace,Menlo,monospace;letter-spacing:.18em;color:#a6ffe6;text-align:center;padding:10px;border-radius:14px;background:rgba(0,0,0,.25);margin:6px 0}
.list{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.list div{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.07);font-size:14px;font-weight:700}
.rules{font-size:13px;line-height:1.6;color:#d6e2f7}
.rules b{color:#fff}
.rules ul{margin:4px 0;padding-left:18px}
.numgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:10px 0}
.numgrid button{height:46px;border-radius:12px;font-weight:900;font-size:18px;background:rgba(255,255,255,.1);border:1px solid var(--line)}
.numgrid button.x{opacity:.25;text-decoration:line-through}
.numgrid button:hover{background:rgba(255,255,255,.22)}
@media (max-width:640px){
  #lobbyHead{top:calc(58px + env(safe-area-inset-top));width:calc(100% - 24px);padding:8px 12px} #lobbyHead p{font-size:11.5px}
  #title b{font-size:14px} #title small{display:none}
  .pl{padding:4px 8px 4px 4px;font-size:12px} .pl i{width:22px;height:22px} .pl small{font-size:10px}
  #dock button{width:72px;font-size:11px} #dock svg{width:28px;height:28px}
  .btn{min-height:38px;font-size:14px;padding:0 12px}
}
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="3D 보드게임 화면"></canvas>

<div id="lobbyHead" class="ui glass"><h1>생명과학 보드게임 천국</h1><p>4가지 보드게임 컬렉션 · 가운데 DNA 타워 주변의 존을 누르거나 아래 독에서 골라요</p></div>
<div id="homeBtns" class="ui"><button class="btn sm" id="bHelp" type="button">도움말</button><button class="btn sm" id="bSound" type="button">소리 켬</button><button class="btn sm" type="button" onclick="location.href='../index.html'">🏠 게임 목록</button></div>
<div id="dock" class="ui glass"></div>

<div id="top" class="ui" hidden><div id="title" class="glass"><b></b><small></small></div><div id="players"></div></div>
<div id="bar" class="ui" hidden><div id="msg" class="glass"></div><div id="acts" class="glass"></div></div>

<div id="scrim" class="scrim" hidden><div id="modal" class="modal glass"></div></div>
<div id="tip" class="glass"></div>
<div id="toast" class="glass"><b></b><span></span></div>

<script src="../vendor/three.min.js"></script>
<script src="bio-board/core.js"></script>
<script src="bio-board/rummi.js"></script>
<script src="bio-board/cell.js"></script>
<script src="bio-board/code.js"></script>
<script src="bio-board/yut.js"></script>
<script src="bio-board/app.js"></script>

<script src="../rank.js"></script>
<script src="../ilog.js"></script>
</body>
</html>
