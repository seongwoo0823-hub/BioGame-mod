<style>
:root{--glass:rgba(20,28,52,.62);--line:rgba(255,255,255,.22);--text:#f4f8ff;--sub:#b8c6e4;--gold:#ffd25e;--neon:#5ef2c8;--red:#ff5d6c;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#8fd0e6;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 12px 30px -12px rgba(0,0,0,.55)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:13px;font-weight:800;font-size:14px;background:rgba(255,255,255,.14);border:1px solid var(--line);transition:transform .1s}
.btn:active{transform:scale(.95)} .btn[disabled]{opacity:.35;pointer-events:none}
.btn.pri{background:linear-gradient(135deg,#38e0b0,#3aa6ff);color:#05221d;border-color:transparent}
.btn.gold{background:linear-gradient(135deg,#ffe07a,#ff9f43);color:#2a1600;border-color:transparent}
.btn.red{background:linear-gradient(135deg,#ff8a8a,#ff4d6d);color:#2a0008;border-color:transparent}
.btn.sm{min-height:32px;padding:0 10px;font-size:12.5px;border-radius:10px}
#hud{position:fixed;left:10px;right:10px;top:calc(8px + env(safe-area-inset-top));display:flex;gap:8px;align-items:flex-start;z-index:5;pointer-events:none}
#hud>*{pointer-events:auto}
#stat{padding:8px 12px;font-size:13px;line-height:1.45;min-width:0}
#stat b{font-size:17px;color:var(--gold);font-weight:900}
#stat .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
#stat small{color:var(--sub)}
#mats{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
#mats span{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.1);font-size:12px;font-weight:800}
#mats i{width:10px;height:10px;border-radius:3px;display:inline-block}
#topbtn{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
#zone{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top));z-index:4;padding:6px 14px;font-weight:900;font-size:14px;pointer-events:none;transition:opacity .4s}
#prompt{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:5;padding:8px 10px 8px 16px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:14px}
#joy{position:fixed;left:calc(22px + env(safe-area-inset-left));bottom:calc(22px + env(safe-area-inset-bottom));width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:rgba(10,20,40,.22);z-index:5;touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(255,255,255,.6)}
#ft{position:fixed;inset:0;pointer-events:none;z-index:6;overflow:hidden}
.ft{position:absolute;transform:translate(-50%,-50%);font-weight:900;font-size:16px;white-space:nowrap;text-shadow:0 2px 0 rgba(0,0,0,.55),0 0 6px rgba(0,0,0,.35);animation:ftUp 1s ease-out forwards}
@keyframes ftUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-190%) scale(1)}}
#flash{position:fixed;inset:0;pointer-events:none;z-index:7;background:radial-gradient(circle,rgba(255,40,60,0) 35%,rgba(255,30,50,.6));opacity:0;transition:opacity .5s}
#flash.on{opacity:1;transition:none}
#toast{position:fixed;left:50%;top:24%;transform:translate(-50%,-10px);z-index:30;padding:14px 22px;text-align:center;opacity:0;transition:all .3s;pointer-events:none;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast b{display:block;font-size:22px;font-weight:900}
#toast span{display:block;font-size:13.5px;color:var(--sub);margin-top:3px}
.scrim{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:12px;background:rgba(5,10,22,.45)}
.modal{width:min(720px,100%);max-height:calc(var(--app-h,100vh) - 24px);overflow:auto;padding:16px;background:rgba(22,32,58,.86)}
.modal h2{margin:0 0 2px;font-size:20px;font-weight:900}
.modal .sub{margin:0 0 10px;color:var(--sub);font-size:13px;line-height:1.5}
.tabs{display:flex;gap:6px;margin:8px 0 12px;flex-wrap:wrap}
.tabs button{flex:1;min-width:84px;padding:9px 6px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-weight:800;font-size:13.5px}
.tabs button.on{background:linear-gradient(135deg,rgba(56,224,176,.35),rgba(58,166,255,.35));border-color:var(--neon)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:8px}
.item{position:relative;padding:8px;border-radius:13px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-size:12px;text-align:center;cursor:pointer}
.item.on{border-color:var(--neon);background:rgba(94,242,200,.16)}
.item.eq::after{content:'장착';position:absolute;top:5px;right:6px;font-size:10px;font-weight:900;padding:1px 6px;border-radius:99px;background:var(--neon);color:#062}
.item canvas{display:block;margin:0 auto 4px;width:64px;height:64px}
.item b{display:block;font-size:13px}
.lv{display:inline-block;font-weight:900;padding:0 6px;border-radius:7px;background:rgba(255,210,94,.22);color:var(--gold)}
.forge{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:center;padding:12px;border-radius:16px;background:rgba(0,0,0,.22);margin-bottom:10px}
.forge .slot{height:150px;border-radius:14px;border:2px dashed var(--line);display:grid;place-items:center;text-align:center;font-size:12px;color:var(--sub)}
.forge .slot canvas{width:110px;height:110px}
.req{display:flex;flex-direction:column;gap:5px;font-size:13px}
.req div{display:flex;justify-content:space-between;gap:8px;padding:5px 9px;border-radius:9px;background:rgba(255,255,255,.07)}
.req .no{color:#ff9aa6}
.req .ok{color:#9ff5dc}
.rate{font-size:22px;font-weight:900;color:var(--neon)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:6px 10px;border-radius:10px;background:rgba(255,255,255,.08)}
input[type=number]{width:70px;height:34px;border-radius:9px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:#fff;font:800 15px inherit;text-align:center}
table.pt{width:100%;border-collapse:collapse;font-size:12.5px;margin:6px 0}
table.pt td,table.pt th{padding:5px 6px;border-bottom:1px solid rgba(255,255,255,.1);text-align:left}
table.pt th{color:var(--sub);font-weight:700}
.reels{display:flex;gap:10px;justify-content:center;margin:12px 0}
.reel{width:88px;height:104px;border-radius:16px;background:linear-gradient(#fff,#e6ecf8);color:#18223a;display:grid;place-items:center;font-size:30px;font-weight:900;box-shadow:inset 0 -6px 0 rgba(0,0,0,.12),0 6px 0 rgba(0,0,0,.3);overflow:hidden}
.reel.spin span{animation:rl .09s linear infinite}
@keyframes rl{0%{transform:translateY(-40%);filter:blur(1px)}100%{transform:translateY(40%);filter:blur(1px)}}
.res{min-height:44px;text-align:center;font-size:17px;font-weight:900;margin:4px 0 8px}
.jackpot{animation:jp .5s ease-in-out 4}
@keyframes jp{50%{transform:scale(1.12);color:var(--gold)}}
.pet{display:flex;align-items:center;gap:10px}
.pet .dot{width:34px;height:34px;border-radius:10px;flex:none}
.log{font-size:12px;color:var(--sub);max-height:84px;overflow:auto;margin-top:8px;line-height:1.5}
@media (max-width:640px){
  .forge{grid-template-columns:1fr} .forge .slot{height:120px}
  #stat{font-size:12px} #stat b{font-size:15px}
  .reel{width:72px;height:88px;font-size:24px}
}
</style>
</head>

<script>
'use strict';
/* ======================= 데이터 ======================= */
const TOOLS = ['알코올 램프', '비커', '마그네틱 교반기', '피펫', '뷰렛', '분별 깔때기', '원심분리기', '항온 수조', '오토클레이브', 'pH 미터',
  '분광광도계', 'PCR 기기', '전기영동 장치', '클린벤치', '형광현미경', '공초점 현미경', '질량분석기', '전자현미경', 'NMR 분광기', 'X선 회절기',
  'DNA 시퀀서', '크라이오 전자현미경', '슈퍼컴퓨터 클러스터', '초전도 자석', '레이저 간섭계', '싱크로트론', '중성미자 검출기', '양자컴퓨터', '핵융합 토카막', '양자 입자가속기'];
// L단계 → L+1단계 강화 성공 확률(%) · 1→2 95%에서 29→30 0.002%까지 (index 0 = 1→2)
const RATE = [95.0, 84.3, 70.0, 56.0, 43.6, 33.2, 24.7, 18.1, 13.1, 9.3, 6.5, 4.5, 3.1, 2.1, 1.4, 0.92, 0.604, 0.392, 0.252, 0.161, 0.102, 0.064, 0.0399, 0.0246, 0.0151, 0.00921, 0.00558, 0.00335, 0.002];
const DESTROY_FROM = 18, DESTROY_CHANCE = 0.30, PROTECT_PRICE = 1000000, NEW_TOOL_PRICE = 5000, PET_PRICE = 10000, SLOT_PRICE = 1000;
const MATS = [
  {name: '규사 조각', col: '#d8f2ff', zone: '유리 초자 광산'},
  {name: '티타늄 광석', col: '#9aa6b8', zone: '정밀 합금 광산'},

  {name: '반물질 코어', col: '#ff4fd8', zone: '양자 코어 광산'}
];
const ZONES = [
  {name: '1구역 · 유리 초자 광산', ore: 0xd8f2ff, ore2: 0x9fd8f0, ground: 0xcfe8f2, hp: 3, tier: 0},
  {name: '2구역 · 정밀 합금 광산', ore: 0x9aa6b8, ore2: 0x6e7a8c, ground: 0xb8b0a0, hp: 14, tier: 1},
  {name: '3구역 · 반도체 웨이퍼 광산', ore: 0x6a7cff, ore2: 0x3a48c8, ground: 0x9aa0c8, hp: 48, tier: 2},
  {name: '4구역 · 초전도체 광산', ore: 0x3ff0e0, ore2: 0x10a8a0, ground: 0x7fb8c0, hp: 170, tier: 3},
  {name: '5구역 · 양자 코어 광산', ore: 0xff4fd8, ore2: 0x9a20a8, ground: 0x5a4a7a, hp: 600, tier: 4}
];
const PETS = [
  {name: '신입 석사 1학기', w: 70, spd: 0.05, mag: 1.5, col: '#9ad0ff'},
  {name: '실험실 적응 석사', w: 50, spd: 0.10, mag: 2.2, col: '#8ff0b0'},
  {name: '밤샘 전문 석사', w: 30, spd: 0.18, mag: 3.0, col: '#c7a0ff'},
  {name: '논문 쓰는 석사', w: 10, spd: 0.28, mag: 4.2, col: '#ffb36b'},
  {name: '랩장 석사', w: 5, spd: 0.40, mag: 5.5, col: '#ff7eb6'},
  {name: 'SCI급 천재 석사', w: 1, spd: 0.60, mag: 7.5, col: '#ff5d5d'},
  {name: '전설의 석박통합 마스터', w: 0.1, spd: 1.00, mag: 12.0, col: '#ffd25e', gold: true}
];
const PET_W = PETS.reduce((a, p) => a + p.w, 0);
const SLOT_TABLE = [ // 지원금 슬롯: 합계 100%
  {k: 'none', p: 51, label: '꽝', sym: '꽝'},
  {k: 'money', v: 1000, p: 11.5, label: '연구비 1,000원 (본전)', sym: '1천'},
  {k: 'mats', p: 20, label: '강화 재료 랜덤 5개', sym: '재료'},
  {k: 'money', v: 10000, p: 10, label: '연구비 10,000원', sym: '1만'},
  {k: 'money', v: 50000, p: 5, label: '연구비 50,000원', sym: '5만'},
  {k: 'ticket', p: 2.5, label: '장비 보호권 1개 (대박!)', sym: '보호'}
];
const tierOf = L => Math.min(4, Math.floor((L - 1) / 6));               // 강화에 쓰는 재료 종류
const needMat = L => 3 + ((L - 1) % 6) * 2;                             // 필요한 재료 수
const needMoney = L => Math.round(500 * Math.pow(1.38, L - 1) / 100) * 100; // 필요한 연구비
const sellPrice = L => Math.round(2000 * Math.pow(1.6, L - 1) / 100) * 100;
const mineCd = L => Math.max(0.05, 1.2 * Math.pow(0.82, L - 1));         // 채굴 간격(초): 단계마다 0.82배 (최소 0.05초)
const mineDmg = L => Math.max(1, Math.round(Math.pow(1.22, L - 1)));    // 한 번에 깎는 양
const won = n => Math.floor(n).toLocaleString('ko-KR') + '원';
const fmtRate = p => p >= 1 ? p.toFixed(1) + '%' : p.toPrecision(3).replace(/0+$/, '') + '%';

/* ======================= 저장 ======================= */
const SAVE_KEY = 'labForgeSave';
let S = null, uid = 1;
function freshSave() { return {money: 20000, tickets: 0, mats: [0, 0, 0, 0, 0], inv: [{id: 1, L: 1}], store: [], eq: 1, pets: [], petEq: -1, best: 1, uid: 2, stats: {mined: 0, tries: 0, destroyed: 0}}; }
function load() { try { const d = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (d && d.inv) return Object.assign(freshSave(), d); } catch (e) {} return freshSave(); }
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }
S = load(); uid = S.uid;
const newId = () => { S.uid = ++uid; return uid; };
const eqTool = () => S.inv.find(t => t.id === S.eq) || null;
const curPet = () => S.petEq >= 0 ? PETS[S.pets[S.petEq]] : null;
setInterval(save, 4000); addEventListener('pagehide', save); document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });

/* ======================= 소리 (Web Audio 신디사이저) ======================= */
const AU = {
  c: null, out: null, nb: null, muted: false,
  init() { if (this.c) { if (this.c.state !== 'running') this.c.resume(); return; } const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
    try { this.c = new C(); this.out = this.c.createGain(); this.out.gain.value = 0.55; const k = this.c.createDynamicsCompressor(); this.out.connect(k); k.connect(this.c.destination);
      const b = this.c.createBuffer(1, this.c.sampleRate, this.c.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; this.nb = b; } catch (e) { this.c = null; } },
  ok() { return this.c && this.c.state === 'running' && !this.muted; },
  t(f, d, type, g, at, f2) { if (!this.ok()) return; const c = this.c, t = c.currentTime + (at || 0), o = c.createOscillator(), a = c.createGain(); o.type = type || 'sine'; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    a.gain.setValueAtTime(0.0001, t); a.gain.exponentialRampToValueAtTime(g || 0.2, t + 0.006); a.gain.exponentialRampToValueAtTime(0.0001, t + d); o.connect(a); a.connect(this.out); o.start(t); o.stop(t + d + 0.05); },
  n(d, f, q, g, at, type) { if (!this.ok()) return; const c = this.c, t = c.currentTime + (at || 0), s = c.createBufferSource(); s.buffer = this.nb; const fl = c.createBiquadFilter(); fl.type = type || 'bandpass'; fl.frequency.value = f; fl.Q.value = q || 1;
    const a = c.createGain(); a.gain.setValueAtTime(0.0001, t); a.gain.exponentialRampToValueAtTime(g || 0.2, t + 0.004); a.gain.exponentialRampToValueAtTime(0.0001, t + d); s.connect(fl); fl.connect(a); a.connect(this.out); s.start(t, Math.random() * 0.5, d + 0.05); },
  mine(tier) { this.n(0.06, 1800 + tier * 500, 3, 0.22); this.t(240 + tier * 90, 0.07, 'square', 0.05); },
  crack(tier) { this.n(0.22, 700 + tier * 300, 0.8, 0.3); this.t(180, 0.2, 'triangle', 0.12, 0, 90); [0, 1, 2].forEach(i => this.t(900 + tier * 200 + i * 220, 0.08, 'triangle', 0.06, 0.05 + i * 0.04)); },
  coin(big) { this.t(988, 0.07, 'square', 0.06); this.t(1319, big ? 0.3 : 0.16, 'square', 0.06, 0.06); if (big) this.t(1760, 0.3, 'square', 0.05, 0.14); },
  pick() { this.t(660 + Math.random() * 200, 0.06, 'triangle', 0.07); },
  step() { this.n(0.03, 500, 1, 0.06); },
  click() { this.t(880, 0.04, 'triangle', 0.07); },
  tick() { this.n(0.02, 2600, 4, 0.12); this.t(1200, 0.02, 'square', 0.03); },
  slotStop() { this.n(0.05, 900, 2, 0.25); this.t(420, 0.08, 'square', 0.06); },
  hammer() { this.n(0.08, 2400, 5, 0.3); this.t(1500, 0.18, 'triangle', 0.1, 0, 1300); },
  success() { [523, 659, 784, 1047].forEach((f, i) => this.t(f, 0.22, 'triangle', 0.12, i * 0.07)); this.t(2093, 0.4, 'sine', 0.06, 0.3); },
  fail() { this.t(330, 0.25, 'sawtooth', 0.07, 0, 220); this.t(220, 0.3, 'sawtooth', 0.06, 0.15, 150); },

function enhance(id, useTicket) {
  const t = S.inv.find(x => x.id === id); if (!t || t.L >= 30) return {err: '강화할 수 없어요'};
  const L = t.L, tr = tierOf(L), nm = needMat(L), nmo = needMoney(L);

  if (S.money < nmo) return {err: '연구비가 모자라요'};

      const refund = [0, 0, 0, 0, 0]; for (let k = 1; k <= L; k++) refund[tierOf(k)] += Math.ceil(needMat(k) * 0.6);

}

const view = {x: 0, z: 0, zoom: 12};
function updCam(dt) {
  const k = 1 - Math.pow(0.002, dt); view.x += (pl.x - view.x) * k; view.z += (pl.z - view.z) * k;
  const asp = innerWidth / innerHeight, h = view.zoom * (asp < 0.8 ? 1.15 : 1), w = h * asp;
  cam.left = -w; cam.right = w; cam.top = h; cam.bottom = -h; cam.updateProjectionMatrix();
  let sx = 0, sy = 0; if (shake > 0) { shake = Math.max(0, shake - dt * 1.6); sx = (Math.random() - .5) * shake; sy = (Math.random() - .5) * shake; }
  const d = 50, el = 0.68, az = Math.PI / 4;
  cam.position.set(view.x + Math.sin(az) * Math.cos(el) * d + sx, Math.sin(el) * d + sy, view.z + Math.cos(az) * Math.cos(el) * d + sx);
  cam.lookAt(view.x + sx, sy, view.z + sx);
  sun.position.set(view.x + 14, 28, view.z + 10); sun.target.position.set(view.x, 0, view.z);
}
addEventListener('wheel', e => { if (!$('scrim').hidden) return; view.zoom = Math.max(7, Math.min(22, view.zoom * (e.deltaY > 0 ? 1.08 : 0.93))); }, {passive: true});
addEventListener('resize', () => renderer.setSize(innerWidth, innerHeight));
let last = performance.now(), el = 0, hudT = 0;
function loop(now) {
  requestAnimationFrame(loop);
  let dt = Math.min(0.05, (now - last) / 1000); last = now; el += dt;
  update(dt, el); updCam(dt);
  hudT -= dt; if (hudDirty && hudT <= 0) { drawHud(); hudT = 0.15; }
  renderer.render(scene, cam);
}
requestAnimationFrame(loop);
if (!localStorage.getItem('labForgeSeen')) { try { localStorage.setItem('labForgeSeen', '1'); } catch (e) {} setTimeout(helpModal, 600); }
window.LF = {view, refreshPet, refreshHeld, S, enhance, RATE, PETS, SLOT_TABLE, ores, pl, mineCd, mineDmg, needMat, needMoney, tierOf};   // 시험용
</script>
