<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>면역 방어선 · IMMUNE LINE</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#3e2a1e;--navy:#1d2350;--glass:#efe2c6;--page2:#f6eddc;--line:rgba(90,60,40,.28);--acc:#4f8f8a;--gold:#c8901a;--red:#b8452e;--terra:#a4512f;--paper:none;
  --sat:env(safe-area-inset-top,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#2a1a12;color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;word-break:keep-all;overflow-wrap:anywhere;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font-family:inherit;cursor:pointer;color:inherit}
.scr{position:fixed;inset:0;z-index:5;display:none}
.scr.on{display:flex}
.btn{border:0;border-radius:4px;padding:12px 22px;min-height:46px;font-weight:900;font-size:16px;background:var(--page2);color:var(--ink);box-shadow:0 0 0 1px rgba(90,60,40,.32),2px 3px 0 rgba(60,36,20,.16)}
.btn:hover{background:#fbf4e6}
.btn.big{background:var(--terra);color:#fbf6ea;box-shadow:0 0 0 1px rgba(90,40,20,.5),2px 4px 0 rgba(60,24,10,.3)}
.btn.danger{background:#b8452e;color:#fbf6ea;margin-top:12px}
.paper,.panel,.ovb,#sheet .sh,#gMenu,#atpBox,#cards,#waveBox,#hint,#intro,.logo,#loading .lb{background-color:var(--glass)!important;background-image:var(--paper)!important;background-size:256px!important;color:var(--ink);border:0!important;box-shadow:0 1px 0 rgba(255,250,236,.7) inset,0 0 0 1px rgba(90,60,40,.28),3px 6px 0 -1px rgba(60,36,20,.18),4px 10px 18px rgba(42,24,12,.35)!important;backdrop-filter:none!important}
.panel::before,.ovb::before,.logo::before{content:'';position:absolute;inset:6px;border:1.2px solid rgba(74,48,32,.45);border-radius:2px;pointer-events:none}
.panel,.ovb,.logo{position:relative}
.seg{display:inline-flex;gap:4px}.seg button{border:0;border-radius:3px;padding:6px 10px;font-weight:700;background:var(--page2);box-shadow:0 0 0 1px rgba(90,60,40,.3)}.seg button.on{background:var(--acc);color:#fbf6ea}
#loading{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:#2a1a12;transition:opacity .5s}#loading.off{opacity:0;pointer-events:none}#loading .lb{padding:18px 28px;border-radius:3px;font-weight:700;text-align:center}#loading i{display:block;width:54px;height:40px;margin:0 auto 10px;background:var(--terra);border-radius:2px;transform-origin:50% 100%;animation:flap 1s cubic-bezier(.3,1.6,.5,1) infinite alternate}@keyframes flap{0%{transform:perspective(200px) rotateX(78deg)}100%{transform:perspective(200px) rotateX(0)}}
.btn:disabled{opacity:.4;cursor:not-allowed}
h1,h2,h3,.bh{font-family:'Black Han Sans',sans-serif;font-weight:400;letter-spacing:.01em}
/* 메뉴 버튼 · 시트 */
#gMenu{position:fixed;z-index:30;top:calc(10px + var(--sat));left:calc(10px + var(--sal));width:46px;height:46px;border-radius:4px;border:1px solid var(--line);background:rgba(20,26,64,.7);backdrop-filter:blur(8px);display:grid;place-items:center}
#gMenu svg{width:22px;height:22px;stroke:#3e2a1e;stroke-width:2.4;fill:none;stroke-linecap:round}
#gMenu .ip{display:none}body[data-screen=battle] #gMenu .im{display:none}body[data-screen=battle] #gMenu .ip{display:block}
#sheet{position:fixed;inset:0;z-index:40;display:none;background:rgba(10,12,30,.45)}#sheet.on{display:block}
#sheet .sh{position:absolute;top:calc(64px + var(--sat));left:calc(10px + var(--sal));width:min(260px,calc(100vw - 20px));background:rgba(20,26,64,.96);border:1px solid var(--line);border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:4px}
#sheet button{border:0;background:transparent;text-align:left;padding:13px 12px;border-radius:10px;font-weight:700;font-size:16px}#sheet button:hover{background:rgba(74,48,32,.08)}
/* 타이틀 */
#title{flex-direction:column;align-items:center;justify-content:flex-end;padding:0 16px calc(28px + var(--sab));background:linear-gradient(180deg,rgba(40,20,10,0) 40%,rgba(40,20,10,.35) 85%)}
.logo{text-align:center;margin-bottom:12px;padding:16px 34px 14px;border-radius:3px}
.logo h1{margin:0;font-size:clamp(42px,8vw,86px);line-height:1;color:var(--terra);text-shadow:2px 3px 0 rgba(90,40,20,.18)}
.logo .en{font-family:'Black Han Sans';font-size:clamp(14px,2.4vw,22px);letter-spacing:.35em;color:var(--ink);opacity:.8}
#tStat{font-weight:700;margin:6px 0 16px;text-align:center;color:#fbf6ea;text-shadow:0 1px 4px #000c}
.tmenu{display:grid;grid-template-columns:repeat(4,auto);gap:8px}
.tmenu .btn.big{grid-column:span 4;font-size:22px;padding:14px 40px}
/* 공통 패널 화면 */
.panel{margin:auto;width:min(1080px,calc(100% - 20px));max-height:calc(100% - 20px - var(--sat) - var(--sab));overflow:auto;background:var(--glass);border:1px solid var(--line);border-radius:3px;padding:20px;backdrop-filter:blur(10px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-left:52px}.ph h2{margin:0;font-size:26px}.ph .sp{margin-left:auto;font-weight:700;opacity:.8;font-size:14px}
/* 월드 지도 */
#worlds{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.world{border-radius:3px;padding:12px;background:linear-gradient(160deg,var(--w1),var(--w2));color:#2a1a14;box-shadow:0 0 0 1px rgba(90,60,40,.3),2px 4px 0 rgba(60,36,20,.15)}
.world h3{margin:0;font-size:20px}.world p{margin:2px 0 8px;font-size:12px;font-weight:700;opacity:.75}
.stgs{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.stg{border:0;border-radius:3px;background:var(--page2);color:#2a1a14;padding:6px 2px;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.stg b{font-family:'Black Han Sans';font-weight:400;font-size:16px}.stg span{font-size:10px;color:var(--gold);font-weight:900}
.stg.boss{background:#ffe0e6}.stg.lock{opacity:.5}
.mapfoot{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}.mapfoot small{display:block;font-size:11px;opacity:.8}
/* 카드 고르기 */
#deckSlots{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.slot{width:62px;height:74px;border-radius:4px;background:rgba(74,48,32,.06);border:2px dashed rgba(74,48,32,.3);position:relative}
.slot.full{border:2px solid var(--acc);background:var(--page2);padding:0}.slot img{width:100%;height:56px;object-fit:contain}.slot b{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-family:'Black Han Sans';font-weight:400;color:var(--gold)}
#deckAll{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.pickc{display:grid;grid-template-columns:44px 1fr;grid-template-rows:auto auto;align-items:center;column-gap:8px;text-align:left;border:2px solid transparent;border-radius:4px;background:var(--page2);box-shadow:0 0 0 1px rgba(90,60,40,.2);padding:5px 8px}
.pickc img{grid-row:span 2;width:44px;height:44px;object-fit:contain}.pickc b{font-size:14px}.pickc small{font-size:11px;opacity:.8}
.pickc .lk{grid-row:span 2;width:44px;height:44px;display:grid;place-items:center;font-style:normal;font-size:22px;opacity:.5;background:rgba(74,48,32,.08);border-radius:4px}
.pickc.on{border-color:var(--acc);background:#e4f0ec}.pickc.lock{opacity:.35}
.deckSide{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.foe{display:flex;flex-direction:column;align-items:center;width:64px}.foe img{width:48px;height:48px;object-fit:contain}.foe small{font-size:10px;text-align:center}
#deckTip{font-size:13px;opacity:.85}
.deckBar{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
/* 도감 */
.tabs{display:flex;gap:6px}.tabs button{border:0;border-radius:3px;padding:8px 16px;background:var(--page2);box-shadow:0 0 0 1px rgba(90,60,40,.25);font-weight:700}.tabs button.on{background:var(--acc);color:#fbf6ea}
.cxwrap{display:grid;grid-template-columns:1fr 300px;gap:12px;margin-top:10px}
#codexGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px;align-content:start}
.cx{border:2px solid transparent;border-radius:4px;background:var(--page2);box-shadow:0 0 0 1px rgba(90,60,40,.18);padding:4px;display:flex;flex-direction:column;align-items:center}
.cx img{width:56px;height:56px;object-fit:contain}.cx i{width:56px;height:56px;display:grid;place-items:center;font-style:normal;font-size:28px;opacity:.4}.cx small{font-size:11px;text-align:center;line-height:1.2}
.cx.on{border-color:var(--acc)}.cx.lock{opacity:.5}
#codexInfo{background:rgba(74,48,32,.06);border-radius:4px;padding:12px;font-size:14px;line-height:1.55}
#codexInfo img{width:120px;height:120px;display:block;margin:0 auto;object-fit:contain}#codexInfo h3{text-align:center;margin:4px 0;font-size:22px}
#codexInfo .st{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-bottom:6px}#codexInfo .st span{background:rgba(74,48,32,.1);border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700}
.bossT{background:#e88a7a!important}
/* 결과 */
#result{align-items:center;justify-content:center;background:rgba(30,16,8,.45)}
#resBox{width:min(440px,calc(100% - 24px));text-align:center}
#resBox h2{font-size:34px;margin:0 0 6px}.stars{font-size:52px;letter-spacing:6px}.stars i{font-style:normal;color:rgba(74,48,32,.18)}.stars i.on{color:#e0a830;text-shadow:2px 3px 0 rgba(90,50,10,.3)}
.big{font-family:'Black Han Sans';font-size:30px;margin:6px 0}
.unlock{display:flex;gap:10px;align-items:center;background:#e4f0ec;border:2px solid var(--acc);border-radius:14px;padding:8px;text-align:left;margin:10px 0;animation:pop .5s}
.unlock img{width:72px;height:72px}.unlock small{color:var(--acc);font-weight:900;display:block}.unlock b{font-size:20px;display:block}.unlock span{font-size:13px;opacity:.85}
.btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}.tip{font-size:13px;opacity:.85}
/* 전투 HUD */
#hud{position:fixed;inset:0;z-index:6;pointer-events:none;display:none}#hud.on{display:block}
#hud>*{pointer-events:auto}
#topbar{position:absolute;top:calc(8px + var(--sat));left:calc(64px + var(--sal));right:calc(10px + var(--sar));display:flex;gap:8px;align-items:flex-start}
#atpBox{flex:none;width:78px;height:92px;border-radius:4px;background:var(--glass);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center}
#atpBox i{width:30px;height:34px;background:linear-gradient(180deg,#fff6b0,#ffd23a);clip-path:polygon(50% 0,100% 30%,100% 70%,50% 100%,0 70%,0 30%);display:block;filter:drop-shadow(0 2px 0 #a06a00)}
#atp{font-family:'Black Han Sans';font-size:26px;line-height:1.1;color:var(--terra)}
#cards{display:flex;gap:6px;background:var(--glass);border:1px solid var(--line);border-radius:4px;padding:6px;overflow-x:auto;scrollbar-width:none;max-width:100%}
#cards::-webkit-scrollbar{display:none}
.card{position:relative;flex:none;width:66px;height:80px;border:0;border-radius:3px;background:var(--page2);color:#2a1a14;padding:0;overflow:hidden;box-shadow:0 0 0 1px rgba(90,60,40,.28),2px 3px 0 rgba(60,36,20,.15);touch-action:none}
.card img{width:58px;height:50px;object-fit:contain;margin-top:3px;pointer-events:none}
.card b{position:absolute;left:0;right:0;bottom:15px;font-family:'Black Han Sans';font-weight:400;font-size:15px;color:var(--terra)}
.card em{position:absolute;left:0;right:0;bottom:2px;font-style:normal;font-size:10px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
.card .cd{position:absolute;left:0;right:0;top:0;height:0;background:rgba(62,42,30,.5)}
.card.poor{filter:grayscale(.8);opacity:.75}.card.wait img{opacity:.6}
.card.sel{outline:3px solid var(--terra);transform:translateY(-3px)}
.card.tool{background:#f6dcd4}.card.tool b{color:#a02040;bottom:16px;font-size:13px}
.digIco{display:block;width:34px;height:34px;margin:8px auto 0;border-radius:50%;background:radial-gradient(circle at 40% 40%,#ff8aa0,#c0304a);box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.shake{animation:shake .3s}@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
#waveBox{flex:none;margin-left:auto;min-width:170px;background:var(--glass);border:1px solid var(--line);border-radius:4px;padding:8px 10px}
#stageName{font-size:12px;font-weight:700;opacity:.85;white-space:nowrap}
#waveTxt{font-family:'Black Han Sans';font-size:16px}
.wbar{position:relative;height:10px;border-radius:5px;background:rgba(74,48,32,.15);margin-top:4px;overflow:visible}
#waveFill{height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,#7fa65a,#c8603f);transition:width .5s}
#waveFlags i{position:absolute;top:-5px;width:4px;height:20px;margin-left:-2px;background:#6b4630;border-radius:2px}#waveFlags i::after{content:'';position:absolute;left:4px;top:0;border:6px solid transparent;border-left:9px solid #ff5a6a}
#waveFlags i.on::after{border-left-color:#7dffb0}
.wbtns{display:flex;gap:6px;margin-top:6px}.wbtns button{flex:1;border:0;border-radius:3px;padding:6px;min-height:36px;background:var(--page2);box-shadow:0 0 0 1px rgba(90,60,40,.28);font-weight:900}
#hint{position:absolute;left:50%;transform:translateX(-50%);top:calc(116px + var(--sat));color:#2a1a14;font-weight:900;padding:10px 16px;border-radius:4px;animation:bob 1.2s infinite;display:none;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
@keyframes bob{50%{transform:translate(-50%,-4px)}}
#banner{position:fixed;z-index:9;left:50%;top:38%;transform:translate(-50%,-50%) scale(.6);font-family:'Black Han Sans';font-size:clamp(28px,6vw,60px);text-shadow:0 4px 0 #000a,0 0 20px #0008;opacity:0;pointer-events:none;white-space:nowrap}
#banner.go{animation:ban 2.4s}@keyframes ban{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}20%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
#flash,#dark,#fever{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0}#flash.go{animation:fl .5s}@keyframes fl{0%{opacity:.6}100%{opacity:0}}
#dark{background:radial-gradient(circle at 30% 50%,rgba(10,0,30,.2),rgba(10,0,30,.95));transition:opacity .4s}
#fever{background:radial-gradient(circle,transparent 50%,rgba(255,90,40,.7));transition:opacity .4s}
#intro{position:fixed;z-index:8;right:calc(10px + var(--sar));bottom:calc(12px + var(--sab));display:flex;gap:8px;align-items:center;color:#2a1a14;border-radius:4px;padding:8px 12px;max-width:min(360px,80vw);opacity:0;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#intro img{width:52px;height:52px}#intro small{color:#e0405a;font-weight:900;display:block}#intro b{display:block}#intro span{font-size:12px}
#intro.go{animation:intro 4s}@keyframes intro{0%{opacity:0;transform:translateY(20px)}10%,85%{opacity:1;transform:none}100%{opacity:0}}
.pop{position:fixed;z-index:9;font-family:'Black Han Sans';font-size:20px;pointer-events:none;transform:translateX(-50%);animation:popup .8s forwards;text-shadow:0 2px 0 #000a}@keyframes popup{to{opacity:0;margin-top:-30px}}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.05)}100%{transform:scale(1)}}
/* 일시정지 · 모달 */
.ov{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(30,16,8,.5)}.ov.on{display:flex}
.ovb{width:min(400px,calc(100% - 24px));background:var(--glass);border:1px solid var(--line);border-radius:3px;padding:20px;max-height:calc(100% - 24px);overflow:auto}
.ovb h2{margin:0 0 10px}.ovb .col{display:flex;flex-direction:column;gap:8px}.ovb p{line-height:1.6;font-size:14px}.keys{opacity:.7;font-size:12px!important}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;font-weight:700}.row input[type=range]{width:50%;accent-color:var(--acc)}.row input[type=checkbox]{width:22px;height:22px;accent-color:var(--acc)}
#err{position:fixed;z-index:99;left:10px;right:10px;bottom:10px;background:#c83a4a;padding:10px;border-radius:10px;display:none}
#rotate{position:fixed;inset:0;z-index:25;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(20,10,40,.92);text-align:center;padding:20px;font-weight:700}
html.dev-phone.is-portrait body[data-screen=battle]:not(.rot-ok) #rotate{display:flex}
/* ===== 기기별 배치 ===== */
/* 카드 왼쪽 세로 배치 (터치 가로 · 휴대폰 가로) */
html.cards-left #topbar{left:calc(64px + var(--sal))}
html.cards-left #cards{position:fixed;left:calc(8px + var(--sal));top:calc(62px + var(--sat));bottom:calc(8px + var(--sab));flex-direction:column;overflow-y:auto;overflow-x:hidden;width:auto;max-width:none}
html.cards-left .card{width:62px;height:66px}
html.cards-left #atpBox{position:fixed;left:calc(84px + var(--sal));top:calc(8px + var(--sat));width:auto;height:46px;flex-direction:row;gap:6px;padding:0 12px}
html.cards-left #atpBox i{width:22px;height:26px}html.cards-left #atp{font-size:24px}
html.cards-left #hint{top:calc(64px + var(--sat))}
html.dev-phone .panel{padding:12px;border-radius:16px}html.dev-phone .ph{padding-left:50px}html.dev-phone .ph h2{font-size:20px}
html.dev-phone .cxwrap{grid-template-columns:1fr}
html.dev-phone #waveBox{min-width:130px;padding:6px 8px}html.dev-phone #stageName{display:none}
html.dev-phone .tmenu{grid-template-columns:repeat(2,1fr)}html.dev-phone .tmenu .btn.big{grid-column:span 2}
html.dev-phone .logo h1{font-size:clamp(38px,11vw,64px)}
html.dev-phone.is-landscape #title{justify-content:center;align-items:flex-start;padding-left:calc(72px + var(--sal));background:linear-gradient(90deg,rgba(20,10,40,.6),rgba(20,10,40,0) 60%)}
html.dev-phone.is-landscape .logo{text-align:left}html.dev-phone.is-landscape #tStat{text-align:left}
html.dev-phone .card em{display:none}html.dev-phone .card b{bottom:4px}
html.dev-phone #cards .card{width:56px;height:58px}html.dev-phone #cards .card img{width:48px;height:42px}
html.dev-phone .digIco{width:28px;height:28px;margin-top:6px}
html.dev-phone.is-portrait #topbar{flex-wrap:wrap}html.dev-phone.is-portrait #cards{order:3;width:100%}
@media (max-height:500px){html.cards-left #cards .card{height:46px;width:54px}html.cards-left #cards .card img{height:30px;width:42px;margin-top:2px}html.cards-left #cards .card b{bottom:1px;font-size:12px}html.cards-left .digIco{width:22px;height:22px;margin-top:4px}html.cards-left .card em{display:none}html.cards-left #cards{gap:4px;padding:4px}}html.cards-left .card img{height:40px;width:50px}html.cards-left .card b{bottom:13px;font-size:14px}
</style>
</head>
<body data-screen="title">
<canvas id="gl"></canvas>
<div id="loading"><div class="lb"><i></i>세포를 종이로 접는 중…</div></div>
<div id="dark"></div><div id="fever"></div><div id="flash"></div>
<button id="gMenu" aria-label="메뉴"><svg class="im" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg><svg class="ip" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg></button>
<div id="sheet"><div class="sh">
  <button data-act="hub">게임 목록으로</button><button data-act="title">메인 화면</button><button data-act="opt">설정</button><button data-act="help">게임 방법</button><button data-act="codex">도감</button>
</div></div>

<section id="title" class="scr">

const DT = 1 / 60;
let S = null;   // 현재 전투 상태
function newBattle(stage, deck, seed) {
  const W = WORLDS[stage.world], L = W.lanes;
  const rnd = mulberry32(seed || (Date.now() & 0xffffff));
  S = {
    stage, W, L, deck, rnd, t: 0, atp: stage.tut ? 150 : W.skyRate ? 100 : 50, uid: 1, events: [], over: null,
    grid: Array.from({ length: L }, () => Array.from({ length: 9 }, () => ({ cell: 0, shield: 0 }))),
    cells: new Map(), foes: new Map(), shots: [], drops: [],
    cardCd: Object.fromEntries(deck.map(k => [k, 0])), pulses: Array(L).fill(1), sweeps: [],
    wave: 0, waveT: stage.tut ? 9999 : 24, waveFoes: new Set(), spawnQ: [], skyT: 6, feverT: 0, darkT: 0,
    blocked: new Set(), puddle: new Set(), lastLanes: [], killed: 0, stats: { placed: 0, pulsesUsed: 0 }, endless: !!stage.endless, warnT: 0,
  };
  // 첫 카드는 재충전 없이 바로 쓸 수 있게(상피 장벽처럼 재충전이 긴 카드만 처음에 대기)
  for (const k of deck) S.cardCd[k] = CELLS[k].cd >= 25 ? Math.min(CELLS[k].cd, 12) : 0;
  if (W.puddles) for (let l = 0; l < L; l++) for (const c of W.puddles) S.puddle.add(l + ':' + c);
  if (W.walls) { const r = mulberry32(stage.idx * 977 + 13); let n = 5 + (stage.idx % 3); while (n > 0) { const l = Math.floor(r() * L), c = 2 + Math.floor(r() * 7); const k = l + ':' + c; if (!S.blocked.has(k)) { S.blocked.add(k); n--; } } }
  S.totalWaves = stage.endless ? Infinity : stage.waves;
  return S;
}
const ev = (type, o) => S.events.push(Object.assign({ type }, o || {}));
const cx = c => c + 0.5;
const foeInLane = (f, l) => f.lane === l || (f.wide && f.lane + 1 === l);
function foesIn(l) { const out = []; for (const f of S.foes.values()) if (!f.dead && foeInLane(f, l)) out.push(f); return out; }
const targetable = f => !f.dead && !(f.hideT > 0) && !(f.burrowT > 0) && !(f.jumpT > 0);

/* ---------------- 배치 · 제거 ---------------- */
function canPlace(type, lane, col) {
  const d = CELLS[type]; if (!d) return false;
  if (d.kind === 'spell') return d.target === 'all' || (lane >= 0 && lane < S.L);
  if (lane < 0 || lane >= S.L || col < 0 || col > 8) return false;
  const key = lane + ':' + col; if (S.blocked.has(key) || S.puddle.has(key)) return false;
  const tile = S.grid[lane][col];
  if (d.kind === 'shield') return !!tile.cell && !tile.shield;
  return !tile.cell;
}
function cardReady(type) { return S.cardCd[type] <= 0 && S.atp >= CELLS[type].cost; }
function place(type, lane, col) {
  if (!cardReady(type) || !canPlace(type, lane, col)) return false;
  const d = CELLS[type]; S.atp -= d.cost; S.cardCd[type] = d.cd; S.stats.placed++;
  if (d.kind === 'spell') { castSpell(type, lane); return true; }
  const c = { id: S.uid++, type, lane, col, x: cx(col), hp: d.hp, maxHp: d.hp, t: d.kind === 'producer' ? d.first : (d.kind === 'shooter' ? 0.6 : 0), state: '', disabled: 0, born: S.t };
  if (d.kind === 'bomb') c.t = d.fuse;
  if (d.kind === 'assassin') c.t = 0.3;
  S.cells.set(c.id, c);
  if (d.kind === 'shield') S.grid[lane][col].shield = c.id; else S.grid[lane][col].cell = c.id;
  ev('place', { id: c.id, lane, col });
  if (S.stage.tut && S.waveT > 100 && type === 'neutro') S.waveT = 8;
  return true;
}
function removeCell(c, why) {
  if (!c || c.dead) return; c.dead = true; S.cells.delete(c.id);
  const tile = S.grid[c.lane][c.col]; if (tile.cell === c.id) tile.cell = 0; if (tile.shield === c.id) tile.shield = 0;
  ev('cellGone', { id: c.id, lane: c.lane, col: c.col, why });
}
function dig(lane, col) {   // 세포 자멸 신호: 보호막 먼저, 그다음 세포
  const tile = S.grid[lane] && S.grid[lane][col]; if (!tile) return false;

function castSpell(type, lane) {
  if (type === 'fever') { S.feverT = 6; ev('fever'); return; }
  if (type === 'ifn') {
    for (const f of foesIn(lane)) { f.stopDivT = 10; if (f.tags.includes('virus') || f.tags.includes('infect')) hurt(f, CELLS.ifn.dmg, 'ifn'); }
    ev('ifn', { lane });

}

/* ---------------- 피해 ---------------- */
function hurt(f, amt, src) {
  if (f.dead || f.hideT > 0 || f.burrowT > 0) return 0;
  if (S.feverT > 0) amt *= 1.25;
  if (f.resist && f.resist.includes(src)) amt *= 0.25;
  if (f.def.abRes && (src === 'bcell' || src === 'memb')) amt *= f.def.abRes;
  f.flash = 0.08;
  if (f.armor > 0) { const a = Math.min(f.armor, amt); f.armor -= a; amt -= a; if (f.armor <= 0) ev('armorBreak', { id: f.id }); }
  f.hp -= amt;
  if (f.hp <= 0) killFoe(f, src);
  return amt;
}
function killFoe(f, src) {
  if (f.dead) return; f.dead = true; S.killed++;
  ev('foeDie', { id: f.id, type: f.type, x: f.x, lane: f.lane, boss: !!f.def.boss, src });
  if (f.def.split) for (let i = 0; i < f.def.split; i++) spawnFoe('sporelet', f.lane, f.x + i * 0.35, { noWave: false, wave: f.wave });

function slow(f, s) {
  if (f.def.noSlow) return;
  let fac = s.f; if (f.def.slowRes) fac = 1 - (1 - fac) * f.def.slowRes;
  if (f.slowT <= 0 || fac <= f.slowF) { f.slowF = fac; } f.slowT = Math.max(f.slowT, s.t);
}
function hurtTile(lane, col, amt) {
  const tile = S.grid[lane][col]; const id = tile.shield || tile.cell; if (!id) return;
  const c = S.cells.get(id); if (!c) return;
  c.hp -= amt; c.flash = 0.08; if (c.hp <= 0) removeCell(c, 'eaten');
}

/* ---------------- 병원체 생성 ---------------- */
function spawnFoe(type, lane, x, o = {}) {
  const d = FOES[type];
  if (d.wide && lane > S.L - 2) lane = S.L - 2;
  const f = { id: S.uid++, type, def: d, lane, x: x == null ? 10.4 : x, hp: d.hp * (o.hpMul || 1), maxHp: d.hp * (o.hpMul || 1), armor: d.armor, maxArmor: d.armor, tags: d.tags,
    slowT: 0, slowF: 1, eatT: 0, eating: 0, hideT: 0, cycT: d.hide ? d.hide.every : 0, jumped: false, jumpT: 0, rushed: false, gen: o.gen || 0,
    sumT: d.summon ? d.summon.every * 0.6 : 0, divT: d.divide ? d.divide.every : 0, stopDivT: 0, shotT: 1, wide: d.wide ? true : false, phase: 1, resist: null,
    burT: d.burrow ? d.burrow.every : 0, burrowT: 0, darkT: d.dark ? d.dark.every * 0.7 : 0, bob: S.rnd() * 6, flash: 0, wave: o.wave || S.wave, ops: 0 };

  S.lastLanes.push(l); if (S.lastLanes.length > Math.min(2, S.L - 2)) S.lastLanes.shift();

function buildWave(i) {   // i: 0부터
  const st = S.stage, flag = st.endless ? (i + 1) % 10 === 0 : st.flags.includes(i + 1);
  let pool = st.pool;

      html = `<h2>무한 모드 종료</h2><p class="big">${w}웨이브 버팀</p><p>최고 기록 ${SAVE.endlessBest}웨이브 · 처치 ${S.killed}</p>`;
      if (window.BioGoal) BioGoal.result('immune-line', clearedCount(), { text: `무한 모드 ${w}웨이브`, rank: { v: BioGoal.key([[clearedCount(), 100, 1], [w, 1e4, 1]]), f: { stages: clearedCount(), wave: w } } });
    } else if (win) {
      const s = stars(); stars0 = SAVE.cleared[st.id] || 0; if (s > stars0) SAVE.cleared[st.id] = s;
      if (!stars0 && st.unlock) unlock = st.unlock;
      save();
      html = `<h2>방어 성공!</h2><div class="stars">${[1, 2, 3].map(i => `<i class="${i <= s ? 'on' : ''}">★</i>`).join('')}</div>
        <p>처치 ${S.killed} · 림프 펄스 사용 ${S.stats.pulsesUsed}회 · ${Math.floor(S.t / 60)}분 ${Math.floor(S.t % 60)}초</p>
        ${unlock ? `<div class="unlock"><img src="${ICON[unlock]}" alt=""><div><small>새 면역세포 합류!</small><b>${CELLS[unlock].name}</b><span>${CELLS[unlock].desc}</span></div></div>` : ''}`;
      if (window.BioGoal) BioGoal.result('immune-line', clearedCount(), { text: `${clearedCount()}개 스테이지 클리어`, rank: { v: BioGoal.key([[clearedCount(), 100, 1], [SAVE.endlessBest || 0, 1e4, 1]]), f: { stages: clearedCount(), wave: SAVE.endlessBest || 0 } } });
    } else {
      html = `<h2>방어선이 뚫렸어요</h2><p>${FOES[S.foes.size ? [...S.foes.values()][0].type : 'cold'].name} 등이 몸속 깊이 들어왔어요.</p><p class="tip">💡 ${TIPS[Math.floor(Math.random() * TIPS.length)]}</p>`;
    }
    const next = !st.endless && win && st.idx + 1 < STAGES.length;
    html += `<div class="btns">${next ? '<button class="btn big" data-act="next">다음 스테이지</button>' : ''}${!win || st.endless ? '<button class="btn big" data-act="retry">다시 도전</button>' : ''}<button class="btn" data-act="map">월드 지도</button></div>`;
    $('#resBox').innerHTML = html; show('result'); win ? SND.win() : SND.lose(); SND.music(0, false);
  }, res === 'win' ? 900 : 1200);
};
/* ---------------- 월드 지도 · 카드 고르기 ---------------- */
function renderMap() {
  const box = $('#worlds'); box.innerHTML = '';
  WORLDS.forEach((w, wi) => {
    const sec = document.createElement('section'); sec.className = 'world'; sec.style.setProperty('--w1', w.tiles[0]); sec.style.setProperty('--w2', w.ground);
    let btns = '';
    for (let k = 0; k < 5; k++) { const i = wi * 5 + k, s = STAGES[i], open = stageOpen(i), st = SAVE.cleared[s.id] || 0;
      btns += `<button class="stg ${open ? '' : 'lock'} ${s.boss ? 'boss' : ''}" data-i="${i}" ${open ? '' : 'disabled'} aria-label="스테이지 ${s.id}"><b>${s.id}</b><span>${open ? (st ? '★'.repeat(st) + '☆'.repeat(3 - st) : (s.boss ? '보스' : '도전')) : '🔒'}</span></button>`; }
    sec.innerHTML = `<h3>${wi + 1}. ${w.name}</h3><p>${w.sub}</p><div class="stgs">${btns}</div>`;
    box.appendChild(sec);
  });
  const endOpen = !!SAVE.cleared['3-5'];
  $('#endlessBtn').disabled = !endOpen; $('#endlessBtn').innerHTML = endOpen ? `무한 모드 <small>최고 ${SAVE.endlessBest || 0}웨이브</small>` : '무한 모드 <small>3-5 클리어 후</small>';
  $('#mapStat').textContent = `클리어 ${clearedCount()}/25 · 면역세포 ${unlockedCells().length}/16`;
}
function openDeck(stage) {
  UI.stage = stage; const slots = slotsFor(stage.world), un = unlockedCells();
  let deck = (SAVE.deck || []).filter(k => un.includes(k)).slice(0, slots);
  if (un.length <= slots) deck = [...un]; else for (const k of un) if (deck.length < slots && !deck.includes(k)) deck.push(k);
  UI.pick = deck; UI.slots = slots; renderDeck(); show('deck');
}
function renderDeck() {
  const st = UI.stage, un = unlockedCells();
  $('#deckTitle').textContent = st.endless ? '무한 모드 — 세포 고르기' : `${st.id} ${WORLDS[st.world].name} — 세포 고르기`;
  $('#deckSlots').innerHTML = Array.from({ length: UI.slots }, (_, i) => { const k = UI.pick[i]; return k ? `<button class="slot full" data-k="${k}"><img src="${ICON[k]}" alt=""><b>${CELLS[k].cost}</b></button>` : '<div class="slot"></div>'; }).join('');
  $('#deckAll').innerHTML = CELL_ORDER.map(k => { const ok = un.includes(k), on = UI.pick.includes(k);
    return `<button class="pickc ${ok ? '' : 'lock'} ${on ? 'on' : ''}" data-k="${k}" ${ok ? '' : 'disabled'}>${ok ? `<img src="${ICON[k]}" alt="">` : '<i class="lk">?</i>'}${ok ? `<b>${CELLS[k].name}</b><small>${CELLS[k].cost} ATP · ${CELLS[k].role}</small>` : '<b>???</b><small>잠김</small>'}</button>`; }).join('');
  const pool = st.endless ? ['cold', 'capsid', 'ecoli', 'phage', 'tb', 'spore'] : [...st.pool, ...(st.boss ? [st.boss] : [])];
  $('#deckFoes').innerHTML = pool.map(k => `<span class="foe"><img src="${ICON[k]}" alt=""><small>${FOES[k].name}</small></span>`).join('');
  $('#deckTip').textContent = '💡 ' + TIPS[Math.floor(Math.random() * TIPS.length)];
  $('#deckGo').disabled = UI.pick.length === 0;
}
/* ---------------- 도감 ---------------- */
function renderCodex(tab, sel) {
  UI.codexTab = tab = tab || UI.codexTab || 'cells';
  const un = unlockedCells(), list = tab === 'cells' ? CELL_ORDER : FOE_ORDER.filter(k => k !== 'sporelet');
  const known = k => tab === 'cells' ? un.includes(k) : !!SAVE.seen[k];
  document.querySelectorAll('#codex .tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  $('#codexGrid').innerHTML = list.map(k => `<button class="cx ${known(k) ? '' : 'lock'} ${k === sel ? 'on' : ''}" data-k="${k}">${known(k) ? `<img src="${ICON[k]}" alt="">` : '<i>?</i>'}<small>${known(k) ? (CELLS[k] || FOES[k]).name : '???'}</small></button>`).join('');
  const k = sel || list.find(known);
  if (!k || !known(k)) { $('#codexInfo').innerHTML = '<p>아직 만나지 못했어요.</p>'; return; }
  const d = CELLS[k] || FOES[k];
  const stats = CELLS[k] ? `<span>비용 ${d.cost} ATP</span><span>재충전 ${d.cd}초</span>${d.hp ? `<span>체력 ${d.hp}</span>` : ''}<span>${d.role}</span>`
    : `<span>체력 ${d.hp}${d.armor ? ' + 방어 ' + d.armor : ''}</span><span>속도 ${d.speed}</span>${d.boss ? '<span class="bossT">보스</span>' : ''}`;
  $('#codexInfo').innerHTML = `<img src="${ICON[k]}" alt=""><h3>${d.name}</h3><div class="st">${stats}</div><p><b>게임 능력</b> ${d.desc}</p><p><b>실제 생물학</b> ${d.fact}</p>`;
}
/* ---------------- 메뉴 시트 · 모달 ---------------- */
function openSheet() { $('#sheet').classList.add('on'); }
function closeSheet() { const s = $('#sheet'); if (s) s.classList.remove('on'); }
function pauseBattle(on) {
  UI.paused = on; $('#pause').classList.toggle('on', on);
  if (on) { UI.sel = null; updGhost(); }
}
function modal(html) { $('#modalBox').innerHTML = html + '<div class="btns"><button class="btn" data-act="closeModal">닫기</button></div>'; $('#modal').classList.add('on'); }
function optModal() {
  modal(`<h2>설정</h2>
    <label class="row">배경음악 <input type="range" id="oMus" min="0" max="1" step="0.05" value="${OPT.music}"></label>
    <label class="row">효과음 <input type="range" id="oSfx" min="0" max="1" step="0.05" value="${OPT.sfx}"></label>
    <label class="row">ATP 자동 수집 <input type="checkbox" id="oAuto" ${OPT.auto ? 'checked' : ''}></label>
    <label class="row">그림자 (끄면 더 부드러움) <input type="checkbox" id="oShadow" ${OPT.shadow ? 'checked' : ''}></label>
    <div class="row">그래픽 <span class="seg" id="oGfx">${[['high', '선명'], ['mid', '보통'], ['low', '가볍게']].map(([k, n]) => `<button class="${QUALITY === k ? 'on' : ''}" data-v="${k}">${n}</button>`).join('')}</span></div>
    <button class="btn danger" data-act="reset">진행 기록 지우기</button>`);
  $('#oMus').oninput = e => { OPT.music = +e.target.value; SND.vol(); save(); };
  $('#oSfx').oninput = e => { OPT.sfx = +e.target.value; SND.vol(); save(); };
  $('#oAuto').onchange = e => { OPT.auto = e.target.checked; save(); };
  $('#oShadow').onchange = e => { OPT.shadow = e.target.checked; R.renderer.shadowMap.enabled = OPT.shadow; R.renderer.shadowMap.needsUpdate = true; R.scene.traverse(o => { if (o.material) [].concat(o.material).forEach(m => m.needsUpdate = true); }); save(); };
  document.querySelectorAll('#oGfx button').forEach(b => b.onclick = () => { try { localStorage.setItem('immuneLineGfx', b.dataset.v); } catch (er) {} location.reload(); });
}
function helpModal() {
  modal(`<h2>게임 방법</h2>
    <p>🦠 오른쪽에서 병원체가 몰려와요. 왼쪽 끝에 닿지 않게 <b>면역세포</b>를 배치해서 막으세요.</p>
    <p>✨ <b>ATP</b>로 세포를 배치해요. 하늘에서 떨어지는 ATP를 누르거나, <b>미토콘드리아</b>를 놓아 모으세요.</p>
    <p>🃏 위(또는 왼쪽)의 카드를 누른 다음 칸을 누르면 배치돼요. 카드를 끌어다 놓아도 돼요. 카드는 쓰고 나면 잠시 재충전돼요.</p>
    <p>🌊 줄마다 한 번, 병원체가 끝에 닿으면 <b>림프 순환 펄스</b>가 줄을 쓸어 줘요. 펄스가 없는 줄이 뚫리면 패배!</p>
    <p>⭐ 펄스를 하나도 안 쓰면 별 3개, 1개 쓰면 별 2개예요. 스테이지를 깰 때마다 새 면역세포가 합류해요.</p>
    <p class="keys">PC 단축키: 숫자 1~8 카드 선택 · Space 일시정지 · F 속도 · Esc 취소</p>`);
}
/* ---------------- 타이틀 장식 장면 ---------------- */
function showcase() {
  newBattle(STAGES[0], ['neutro'], 1); S.demo = true; buildBoard();
  const put = (k, l, c) => { const id = S.uid++; S.cells.set(id, { id, type: k, lane: l, col: c, x: cx(c), hp: 300, maxHp: 300, t: 9, state: '', disabled: 0 }); S.grid[l][c].cell = id; };
  put('mito', 0, 0); put('neutro', 1, 1); put('bcell', 2, 1); put('killer', 3, 2); put('barrier', 2, 4); put('macro', 4, 1); put('mast', 0, 2); put('dend', 3, 0);
  for (const [k, l, x] of [['cold', 1, 7.5], ['capsid', 2, 8.6], ['ecoli', 3, 6.8], ['phage', 0, 8.2], ['spore', 4, 7.6], ['cold', 4, 9.2]]) { const f = spawnFoe(k, l, x, { noWave: true }); f.speed0 = 0; }
}
/* ---------------- 입력 ---------------- */
let lastPt = null;
function bindInput() {
  const cv = $('#gl');
  cv.addEventListener('pointerdown', e => { SND.init(); if (UI.screen !== 'battle') return; lastPt = [e.clientX, e.clientY]; tryAt(e.clientX, e.clientY); updGhost(e.clientX, e.clientY); });
  addEventListener('pointermove', e => { if (UI.screen !== 'battle') return; lastPt = [e.clientX, e.clientY]; if (e.pointerType === 'mouse' || UI.drag) updGhost(e.clientX, e.clientY); });
  $('#cards').addEventListener('pointerdown', e => { const b = e.target.closest('.card'); if (!b) return; e.preventDefault(); SND.init(); const k = b.dataset.k; const before = UI.sel; selectCard(k); if (UI.sel) UI.drag = { k, id: e.pointerId, moved: false, x: e.clientX, y: e.clientY, was: before === k }; });
  addEventListener('pointermove', e => { if (!UI.drag) return; if (Math.hypot(e.clientX - UI.drag.x, e.clientY - UI.drag.y) > 14) UI.drag.moved = true; });
  addEventListener('pointerup', e => {
    const d = UI.drag; UI.drag = null; if (!d) return;
    if (d.moved && e.target === $('#gl')) { tryAt(e.clientX, e.clientY); if (!UI.sel) updGhost(); }
  });
  addEventListener('keydown', e => {
    if (UI.screen !== 'battle') { if (e.key === 'Escape') closeSheet(); return; }
    if (e.key >= '1' && e.key <= '9') { const k = UI.deck[+e.key - 1]; if (k) selectCard(k); }
    else if (e.key === ' ') { e.preventDefault(); pauseBattle(!UI.paused); }
    else if (e.key === 'f' || e.key === 'F') toggleSpeed();
    else if (e.key === 'Escape') { if (UI.sel) { UI.sel = null; updGhost(); } else pauseBattle(!UI.paused); }
    else if (e.key === 'q' || e.key === 'Q') selectCard('dig');
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden && UI.screen === 'battle' && !UI.paused && S && !S.over) pauseBattle(true); });
  document.addEventListener('click', e => {
    const a = e.target.closest('[data-act]'); if (!a) return; SND.init(); SND.click(); const act = a.dataset.act;
    const acts = {
      start: () => { renderMap(); show('map'); },
      codex: () => { renderCodex('cells'); show('codex'); }, help: helpModal, opt: optModal,
      hub: () => { location.href = '../index.html'; }, title: () => { pauseBattle(false); SND.music(0, false); showcase(); show('title'); },
      map: () => { pauseBattle(false); SND.music(0, false); renderMap(); show('map'); },
      next: () => openDeck(STAGES[S.stage.idx + 1]), retry: () => openDeck(S.stage),
      resume: () => pauseBattle(false), restart: () => { pauseBattle(false); startBattle(S.stage, UI.deck); },
      endless: () => openDeck({ id: '∞', endless: true, world: 0, idx: 99, flags: [], pool: [] }),
      go: () => { SAVE.deck = [...UI.pick]; save(); startBattle(UI.stage, [...UI.pick]); },
      closeModal: () => $('#modal').classList.remove('on'),
      reset: () => { if (confirm('진행 기록을 모두 지울까요?')) { SAVE = { v: 1, cleared: {}, deck: [], endlessBest: 0, seen: {}, opt: OPT }; save(); $('#modal').classList.remove('on'); renderMap(); } },
      speed: toggleSpeed, pause: () => pauseBattle(true),
    };
    if (acts[act]) acts[act]();
  });
  $('#gMenu').addEventListener('click', () => { SND.init(); SND.click(); if (UI.screen === 'battle' && S && !S.over) pauseBattle(true); else $('#sheet').classList.toggle('on'); });
  $('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });
  $('#worlds').addEventListener('click', e => { const b = e.target.closest('.stg'); if (!b || b.disabled) return; SND.click(); openDeck(STAGES[+b.dataset.i]); });
  $('#deckAll').addEventListener('click', e => { const b = e.target.closest('.pickc'); if (!b || b.disabled) return; const k = b.dataset.k; const i = UI.pick.indexOf(k);
    if (i >= 0) UI.pick.splice(i, 1); else if (UI.pick.length < UI.slots) UI.pick.push(k); else { SND.deny(); return; } SND.click(); renderDeck(); });
  $('#deckSlots').addEventListener('click', e => { const b = e.target.closest('.slot.full'); if (!b) return; UI.pick.splice(UI.pick.indexOf(b.dataset.k), 1); SND.click(); renderDeck(); });
  $('#codex').addEventListener('click', e => { const t = e.target.closest('.tabs button'); if (t) { renderCodex(t.dataset.tab); return; } const b = e.target.closest('.cx'); if (b && !b.classList.contains('lock')) renderCodex(UI.codexTab, b.dataset.k); });
}
function toggleSpeed() { OPT.speed = OPT.speed === 1 ? 2 : 1; save(); $('#speedBtn').textContent = '×' + OPT.speed; }
/* ---------------- 메인 루프 ---------------- */
let lastT = performance.now(), acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
  if (!S) return;
  if (UI.screen === 'battle' && !UI.paused && !S.demo) {
    acc += dt * OPT.speed; let n = 0; const maxN = 5 * OPT.speed;
    while (acc >= DT && n < maxN) { step(); acc -= DT; n++; }
    if (n >= maxN) acc = 0;
    for (const f of S.foes.values()) if (!SAVE.seen[f.type] && !f.def.hidden) { SAVE.seen[f.type] = 1; save(); if (!f.def.boss) intro(f.type); }
    handleEvents(); updHud();
  } else if (S.demo) { for (const f of S.foes.values()) f.bob += dt; }
  if (S) { syncUnits(now); syncShots(now); }
  stepFx(dt);
  if (R.shake > 0) { R.shake = Math.max(0, R.shake - dt); R.world.position.set((Math.random() - 0.5) * R.shake * 0.3, 0, (Math.random() - 0.5) * R.shake * 0.3); } else R.world.position.set(0, 0, 0);
  if (UI.screen === 'title' && S.demo) { const t = now / 1000; R.world.rotation.y = Math.sin(t * 0.25) * 0.06; } else R.world.rotation.y = 0;
  if (UI.drag && UI.drag.moved && lastPt) updGhost(lastPt[0], lastPt[1]);
  R.baker.update(dt);
  if (R.post) { R.post.focus.set(4.6, 0, 0); R.post.render(now / 1000); } else R.renderer.render(R.scene, R.camera);
}
function intro(type) { const d = FOES[type], el = $('#intro'); el.innerHTML = `<img src="${ICON[type]}" alt=""><div><small>새 병원체 발견!</small><b>${d.name}</b><span>${d.desc}</span></div>`; el.classList.remove('go'); void el.offsetWidth; el.classList.add('go'); }
/* ---------------- 시작 ---------------- */
function boot() {
  try {
    paperBg(); initRender(); makeIcons(); bindInput(); showcase(); show('title');
    $('#loading').classList.add('off');
    $('#speedBtn').textContent = '×' + OPT.speed;
    $('#tStat').textContent = clearedCount() ? `클리어 ${clearedCount()}/25 · 무한 모드 최고 ${SAVE.endlessBest || 0}웨이브` : '면역세포를 배치해 몸속을 지키는 디펜스 게임';
    const sync = () => { const h = document.documentElement, touch = h.classList.contains('is-touch'), land = innerWidth > innerHeight;
      h.classList.toggle('cards-left', (touch && land) || (h.classList.contains('dev-phone') && land)); fitView(); };
    addEventListener('resize', sync); sync();
    requestAnimationFrame(frame);
  } catch (e) { console.error(e); $('#err').textContent = '시작 오류: ' + e.message; $('#err').style.display = 'block'; }
}
window.IL = { R, get S() { return S; }, step, place, startBattle, STAGES, CELLS, FOES, UI, collect, show, SAVE: () => SAVE };
boot();

</script>
