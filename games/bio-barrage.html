<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>바이오 포격전</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--panel:rgba(18,16,48,.86);--panel2:rgba(255,255,255,.08);--line:rgba(255,255,255,.14);--acc:#ffd23a;--acc2:#3ee6c8;--imm:#3ec8ff;--pat:#ff4d8a;
  --sat:env(safe-area-inset-top,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);--sab:env(safe-area-inset-bottom,0px);
  --fd:'Black Han Sans','Noto Sans KR',system-ui,sans-serif;--fb:'Noto Sans KR',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#140f32;color:#fff;font-family:var(--fb);word-break:keep-all;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font-family:inherit;color:inherit;cursor:pointer;border:0}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.fd{font-family:var(--fd);font-weight:400}
.gb{position:relative;border-radius:16px;padding:12px 22px;min-height:50px;font-family:var(--fd);font-size:19px;color:#fff;background:linear-gradient(180deg,#5b5ce8,#3a33b8);box-shadow:inset 0 -5px 0 rgba(0,0,0,.28),inset 0 2px 0 rgba(255,255,255,.25),0 4px 0 #1c1458;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.gb:active{transform:translateY(3px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.28),0 1px 0 #1c1458}
.gb.y{background:linear-gradient(180deg,#ffe25a,#ffb21a);color:#3a2200;text-shadow:0 1px 0 rgba(255,255,255,.5);box-shadow:inset 0 -5px 0 rgba(160,80,0,.45),inset 0 2px 0 rgba(255,255,255,.6),0 4px 0 #8a4a00}
.gb.g{background:linear-gradient(180deg,#5ff0c8,#18b890);box-shadow:inset 0 -5px 0 rgba(0,80,60,.45),inset 0 2px 0 rgba(255,255,255,.4),0 4px 0 #0a5a48}
.gb.d{background:linear-gradient(180deg,#3a3570,#26214e);box-shadow:inset 0 -4px 0 rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.12),0 3px 0 #120e30;font-size:16px}
.gb small{font-size:12px;font-family:var(--fb);font-weight:700;opacity:.85}
.gb:disabled{filter:grayscale(.8);opacity:.5}
#gMenu{position:fixed;z-index:30;top:calc(10px + var(--sat));left:calc(10px + var(--sal));width:46px;height:46px;border-radius:15px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center}
#gMenu svg{width:22px;height:22px;stroke:#fff;stroke-width:2.6;fill:none;stroke-linecap:round}
#sheet{position:fixed;inset:0;z-index:40;display:none;background:rgba(8,6,24,.5)}#sheet.on{display:block}
#sheet .sh{position:absolute;top:calc(64px + var(--sat));left:calc(10px + var(--sal));width:min(250px,calc(100vw - 20px));background:#1d1946;border:1px solid var(--line);border-radius:18px;padding:8px;display:flex;flex-direction:column;gap:2px;box-shadow:0 18px 40px rgba(0,0,0,.45)}
#sheet button{background:transparent;text-align:left;padding:13px 14px;border-radius:12px;font-weight:700;font-size:16px}#sheet button:hover{background:rgba(255,255,255,.08)}
body:not([data-screen=play]) #sheet [data-act=surrender]{display:none}
.scr{position:fixed;inset:0;z-index:10;display:none}.scr.on{display:flex}
#title{flex-direction:column;align-items:center;justify-content:flex-end;padding:0 16px calc(24px + var(--sab));background:linear-gradient(180deg,rgba(20,15,50,0) 35%,rgba(20,15,50,.9) 82%)}
.logo{text-align:center;margin-bottom:8px;filter:drop-shadow(0 8px 0 rgba(0,0,0,.25))}
.logo .k{font-family:var(--fd);font-size:clamp(50px,10.5vw,112px);line-height:.95;color:#fff;-webkit-text-stroke:3px #2a1270;paint-order:stroke;text-shadow:0 6px 0 #2a1270,0 0 30px rgba(255,120,60,.5)}
.logo .k b{font-weight:400;color:#ff8a3a}
.logo .e{font-family:var(--fd);letter-spacing:.36em;color:var(--acc2);font-size:clamp(13px,2.2vw,20px);margin-top:6px;text-shadow:0 2px 0 #0a2a40}
#tStat{font-weight:700;margin:4px 0 14px;opacity:.9;text-align:center;font-size:14px}
.tmenu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:min(560px,100%)}.tmenu .wide{grid-column:span 2}
.tsub{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;justify-content:center}
.ov{position:fixed;inset:0;z-index:35;display:none;align-items:center;justify-content:center;background:rgba(8,6,24,.62);padding:12px}.ov.on{display:flex}
.box{width:min(560px,100%);max-height:100%;overflow:auto;background:linear-gradient(180deg,#25205a,#1a1644);border:1px solid var(--line);border-radius:22px;padding:18px 20px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.box.wide{width:min(940px,100%)}
.box h2{margin:0 0 10px;font-family:var(--fd);font-weight:400;font-size:30px}
.box h3{margin:16px 0 8px;font-size:15px;color:var(--acc2)}
.box p{line-height:1.65;font-size:14px;margin:8px 0}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.fld{display:flex;flex-direction:column;gap:6px;margin:9px 0}.fld>label,.lab2{font-size:13px;font-weight:700;opacity:.85}
.fld input{font:700 17px var(--fb);padding:11px 13px;border-radius:12px;border:2px solid var(--line);background:rgba(0,0,0,.25);color:#fff;outline:none;user-select:text;-webkit-user-select:text;min-width:0}
.fld input:focus{border-color:var(--acc2)}
#onCode{text-transform:uppercase;letter-spacing:.3em;text-align:center}
.seg{display:flex;background:rgba(0,0,0,.25);border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap}.seg button{flex:1;background:transparent;border-radius:9px;padding:8px 4px;font-weight:900;font-size:13.5px;min-width:44px}.seg button.on{background:var(--acc2);color:#063a30}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.facs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fac{background:var(--panel2);border:3px solid transparent;border-radius:18px;padding:10px 8px;text-align:center}
.fac img{width:96px;height:72px;display:block;margin:0 auto}
.fac b{display:block;font-family:var(--fd);font-weight:400;font-size:21px}.fac small{display:block;font-size:11.5px;opacity:.8;line-height:1.4;margin-top:2px}
.fac.on.imm{border-color:var(--imm);background:rgba(62,200,255,.14)}.fac.on.pat{border-color:var(--pat);background:rgba(255,77,138,.14)}
.prev{display:flex;gap:10px;align-items:center}.prev canvas{width:180px;height:77px;border-radius:10px;background:#000;flex:none}
.plist{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.pl{display:flex;align-items:center;gap:10px;background:var(--panel2);border-radius:12px;padding:8px 12px;font-weight:700}
.pl i{width:14px;height:14px;border-radius:50%;flex:none}.pl small{margin-left:auto;opacity:.8;font-size:12px}
.pl .sw{margin-left:auto;background:rgba(255,255,255,.12);border-radius:9px;padding:6px 10px;font-weight:900;font-size:12px}
.code{font-family:var(--fd);font-size:44px;letter-spacing:.25em;text-align:center;color:var(--acc);margin:6px 0}
.note{font-size:12px!important;opacity:.75}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:8px}
.dx{display:flex;gap:10px;align-items:flex-start;background:var(--panel2);border-radius:14px;padding:9px}
.dx img{flex:none;width:52px;height:52px;border-radius:12px;background:rgba(0,0,0,.25)}
.dx b{display:block;font-size:15px;font-family:var(--fd);font-weight:400}.dx small{display:block;font-size:12px;line-height:1.45;opacity:.92;margin-top:2px}.dx .f{opacity:.6}.dx .num{font-size:11px;font-weight:900;color:var(--acc)}
table.st{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}table.st td,table.st th{padding:6px;border-bottom:1px solid var(--line);text-align:center}table.st th:first-child,table.st td:first-child{text-align:left}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;font-weight:700}.row input[type=range]{width:55%;accent-color:var(--acc2)}
/* 전투 HUD */
#hud{position:fixed;inset:0;z-index:6;pointer-events:none;display:none}#hud.on{display:block}
#hud button{pointer-events:auto}
.glass{background:var(--panel);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(8px);box-shadow:0 6px 18px rgba(0,0,0,.25)}
#topbar{position:absolute;top:calc(10px + var(--sat));left:50%;transform:translateX(-50%);display:flex;align-items:stretch;gap:8px}
#turnTag{padding:6px 12px;display:flex;flex-direction:column;justify-content:center;min-width:120px;border-left:5px solid var(--tc,#fff)}
#turnTag b{font-family:var(--fd);font-weight:400;font-size:16px;white-space:nowrap}#turnTag small{font-size:11.5px;font-weight:700;opacity:.85;white-space:nowrap}
#timer{font-family:var(--fd);font-size:30px;min-width:66px;text-align:center;padding:4px 10px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
#timer.low{color:#ff6a7a;animation:blink 1s infinite}#timer.ret{color:var(--acc)}@keyframes blink{50%{opacity:.55}}
#windBox{padding:6px 10px;display:flex;flex-direction:column;justify-content:center;gap:4px;min-width:130px}
#windBox small{font-size:10.5px;font-weight:900;opacity:.8;text-align:center}
#windBar{position:relative;height:12px;border-radius:6px;background:rgba(0,0,0,.4);overflow:hidden}
#windBar i{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,#3ee6c8,#ffd23a)}#windBar::after{content:'';position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:#fff}
#teamBars{position:absolute;bottom:calc(10px + var(--sab));left:50%;transform:translateX(-50%);padding:7px 12px;display:flex;flex-direction:column;gap:5px;min-width:260px}
.tb{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:900}.tb span{width:64px;white-space:nowrap}.tb u{flex:1;height:11px;border-radius:6px;background:rgba(0,0,0,.4);overflow:hidden;text-decoration:none;min-width:120px}.tb u i{display:block;height:100%;transition:width .5s}.tb em{font-style:normal;width:46px;text-align:right;font-variant-numeric:tabular-nums}
#sdTxt{font-size:10.5px;text-align:center;opacity:.8;font-weight:700}
#wpnBtn{position:absolute;right:calc(12px + var(--sar));top:calc(10px + var(--sat));padding:6px 12px 6px 6px;display:flex;align-items:center;gap:8px;min-height:50px}
#wpnBtn img{width:40px;height:40px}#wpnBtn b{font-family:var(--fd);font-weight:400;font-size:15px;display:block;white-space:nowrap}#wpnBtn small{font-size:11px;font-weight:900;opacity:.8}
#fuse{position:absolute;right:calc(12px + var(--sar));top:calc(68px + var(--sat));display:none;gap:4px;padding:4px}
#fuse button{width:34px;height:32px;border-radius:9px;background:rgba(255,255,255,.08);font-weight:900}#fuse button.on{background:var(--acc);color:#3a2200}
#drawer{position:fixed;z-index:15;right:calc(10px + var(--sar));top:calc(64px + var(--sat));bottom:calc(10px + var(--sab));width:min(420px,calc(100% - 20px));padding:12px;overflow:auto;display:none}
#drawer.on{display:block}
#drawer h4{margin:8px 2px 5px;font-size:12px;color:var(--acc2);letter-spacing:.05em}
.wg{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:6px}
.wb{position:relative;background:rgba(255,255,255,.07);border:2px solid transparent;border-radius:12px;padding:6px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:900;line-height:1.15;text-align:center;min-height:76px}
.wb img{width:36px;height:36px}.wb.sel{border-color:var(--acc);background:rgba(255,210,58,.16)}
.wb .am{position:absolute;right:4px;top:3px;font-size:10px;color:var(--acc)}.wb:disabled{opacity:.3}.wb.lock::after{content:attr(data-lock);position:absolute;inset:auto 2px 2px;font-size:9px;background:rgba(0,0,0,.6);border-radius:5px}
#wInfo{margin-top:10px;padding:10px;background:rgba(0,0,0,.25);border-radius:12px;font-size:12.5px;line-height:1.5;min-height:60px}
#wInfo b{font-family:var(--fd);font-weight:400;font-size:15px;color:var(--acc)}
#tip{position:absolute;left:50%;top:calc(76px + var(--sat));transform:translateX(-50%);padding:8px 14px;font-weight:700;font-size:13px;display:none;white-space:nowrap;max-width:calc(100% - 20px);overflow:hidden;text-overflow:ellipsis}
#wait{position:absolute;left:50%;bottom:calc(80px + var(--sab));transform:translateX(-50%);padding:9px 16px;font-weight:900;display:none;white-space:nowrap;font-size:14px}
/* 터치 조작 */
#ctrl{position:absolute;inset:auto 0 0 0;height:0;display:none}
html.touch #ctrl{display:block}
.cb{position:absolute;width:58px;height:58px;border-radius:18px;background:rgba(30,26,70,.82);border:1px solid var(--line);font-size:20px;font-weight:900;display:grid;place-items:center;touch-action:none;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.cb svg{width:26px;height:26px;stroke:#fff;stroke-width:2.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.cb.on{background:rgba(255,210,58,.35)}
#cL{left:calc(12px + var(--sal));bottom:calc(14px + var(--sab))}#cR{left:calc(78px + var(--sal));bottom:calc(14px + var(--sab))}
#cJ{left:calc(12px + var(--sal));bottom:calc(80px + var(--sab))}#cB{left:calc(78px + var(--sal));bottom:calc(80px + var(--sab));font-size:13px}
#cU{right:calc(118px + var(--sar));bottom:calc(84px + var(--sab))}#cD{right:calc(118px + var(--sar));bottom:calc(18px + var(--sab))}
#fireWrap{position:absolute;right:calc(10px + var(--sar));bottom:calc(14px + var(--sab));width:104px;height:104px;display:grid;place-items:center}
#fireWrap svg{position:absolute;inset:0;transform:rotate(-90deg);pointer-events:none}
#fireWrap .rb{fill:none;stroke:rgba(0,0,0,.5);stroke-width:10}#fireWrap .rf{fill:none;stroke:url(#pg);stroke-width:10;stroke-linecap:round}
#cF{position:relative;z-index:1;width:80px;height:80px;border-radius:50%;font-family:var(--fd);font-size:19px;color:#3a2200;background:radial-gradient(circle at 50% 35%,#fff08a,#ffb21a 70%);box-shadow:inset 0 -6px 0 rgba(160,80,0,.45),inset 0 3px 0 rgba(255,255,255,.7),0 5px 0 #8a4a00;touch-action:none}
html.touch #teamBars{bottom:calc(10px + var(--sab));min-width:0;width:min(300px,calc(100% - 330px))}
html.touch.portrait #teamBars{bottom:auto;top:calc(70px + var(--sat));left:calc(10px + var(--sal));transform:none;width:calc(100% - 200px);padding:5px 8px;gap:3px}
html.portrait .tb span{width:auto;flex:none;font-size:11px}html.portrait .tb u{min-width:40px;height:8px}html.portrait .tb em{width:auto;font-size:11px}html.portrait #sdTxt{display:none}
html.portrait #topbar{left:calc(64px + var(--sal));right:calc(10px + var(--sar));transform:none;flex-wrap:wrap}
html.portrait #turnTag{flex:1;min-width:0}html.portrait #windBox{min-width:110px}
html.portrait #wpnBtn{top:calc(70px + var(--sat))}html.portrait #fuse{top:calc(126px + var(--sat))}
html.portrait #tip{top:calc(188px + var(--sat))}
html.short #turnTag{min-width:96px;padding:4px 8px}html.short #timer{font-size:24px;min-width:54px}html.short #windBox{min-width:100px;padding:4px 8px}
html.short .cb{width:50px;height:50px}html.short #cR,html.short #cB{left:calc(68px + var(--sal))}html.short #cJ,html.short #cB{bottom:calc(70px + var(--sab))}
html.short #fireWrap{width:92px;height:92px}html.short #cF{width:70px;height:70px;font-size:17px}html.short #cU{right:calc(104px + var(--sar));bottom:calc(72px + var(--sab))}html.short #cD{right:calc(104px + var(--sar))}
html.short #teamBars{padding:4px 8px;gap:3px}html.short .tb u{height:8px}
#banner{position:fixed;z-index:9;left:50%;top:38%;transform:translate(-50%,-50%);font-family:var(--fd);font-size:clamp(38px,8.5vw,96px);opacity:0;pointer-events:none;white-space:nowrap;-webkit-text-stroke:3px #2a1270;paint-order:stroke;text-shadow:0 7px 0 #2a1270;text-align:center;line-height:1.05}
#banner small{display:block;font-size:.36em;-webkit-text-stroke:2px #2a1270}
#banner.go{animation:ban 2s}@keyframes ban{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}14%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}24%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%)}}
#flash{position:fixed;inset:0;z-index:7;background:#fff;opacity:0;pointer-events:none}
#toast{position:fixed;z-index:22;left:50%;top:calc(70px + var(--sat));transform:translateX(-50%);padding:10px 16px;font-weight:700;display:none;max-width:calc(100% - 20px)}
#emo{position:absolute;left:calc(10px + var(--sal));top:calc(64px + var(--sat));display:none;flex-direction:column;gap:4px}
#emo button{width:40px;height:40px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:13px;font-weight:900}
body[data-mode=online] #emo{display:flex}
#err{position:fixed;z-index:99;left:10px;right:10px;bottom:10px;background:#c83a4a;padding:10px;border-radius:10px;display:none}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<button id="gMenu" aria-label="메뉴"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
<div id="sheet"><div class="sh">
  <button data-act="hub">게임 목록으로</button><button data-act="title">메인 화면</button><button data-act="surrender">항복하기</button><button data-act="dex">도감</button><button data-act="help">게임 방법</button><button data-act="opt">설정</button>
</div></div>
<section id="title" class="scr on">
  <div class="logo"><div class="k">바이오 <b>포격전</b></div><div class="e">IMMUNE vs PATHOGEN</div></div>
  <div id="tStat"></div>
  <div class="tmenu">
    <button class="gb y wide" data-act="solo">혼자 하기<br><small>AI와 대결 · 쉬움 / 보통 / 어려움</small></button>
    <button class="gb" data-act="local">같이 하기<br><small>한 기기 2~4명</small></button>
    <button class="gb g" data-act="online">온라인 대전<br><small>방 코드로 2~4명</small></button>
  </div>
  <div class="tsub"><button class="gb d" data-act="dex">도감</button><button class="gb d" data-act="help">게임 방법</button><button class="gb d" data-act="hub">게임 목록</button></div>
</section>
<div id="hud">
  <div id="topbar"><div id="turnTag" class="glass"><b id="ttName">-</b><small id="ttSub">-</small></div><div id="timer" class="glass">45</div>
    <div id="windBox" class="glass"><small id="windTxt">바람 0</small><div id="windBar"><i></i></div></div></div>
  <button id="wpnBtn" class="glass" aria-label="무기 고르기"><img id="wpnImg" alt=""><div><b id="wpnName">-</b><small id="wpnAmmo">-</small></div></button>
  <div id="fuse" class="glass"><button data-fz="1">1초</button><button data-fz="2">2초</button><button data-fz="3">3초</button><button data-fz="4">4초</button><button data-fz="5">5초</button></div>
  <div id="teamBars" class="glass"></div>
  <div id="tip" class="glass"></div>
  <div id="wait" class="glass"></div>
  <div id="emo"><button data-emo="👍">👍</button><button data-emo="😂">😂</button><button data-emo="😮">😮</button><button data-emo="😡">😡</button><button data-emo="👏">👏</button><button data-emo="GG">GG</button></div>
  <div id="ctrl">
    <button class="cb" id="cL" data-k="L" aria-label="왼쪽"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="cb" id="cR" data-k="R" aria-label="오른쪽"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>

  N.join = async (code, nick) => { N.leave(); code = String(code || '').trim().toUpperCase(); if (!/^[A-Z0-9]{3,6}$/.test(code)) { toast('방 코드를 확인하세요'); return; }
    N.code = code; N.role = 'guest'; openBc(code); const hello = () => toHost({ t: 'hello', v: VER, name: nick }); hello();
    openPeer().then(p => { if (N.role !== 'guest') { try { p.destroy(); } catch (e) {} return; } N.peer = p; N.hostConn = p.connect(PREFIX + code, { reliable: true }); N.hostConn.on('open', hello); N.hostConn.on('data', onGuest); N.hostConn.on('close', () => { if (N.role === 'guest') N.emit('lost', {}); }); }).catch(() => {});
    setTimeout(() => { if (N.role === 'guest' && !N.lastHost) { toast(`방 [${code}]을 찾지 못했어요`); N.leave(); N.emit('fail', {}); } }, 12000); };
  function onGuest(m) { if (!m || !m.t) return; if (m.src === N.myId) return; N.lastHost = performance.now(); if (m.t === 'deny') { toast('참가할 수 없어요: ' + m.why); N.leave(); N.emit('fail', {}); return; } if (m.t === 'lobby') { N.players = m.players; N.cfg = m.cfg || N.cfg; N.emit('lobby'); return; } N.emit(m.t, m); }
  N.leave = () => { if (N.role === 'guest') toHost({ t: 'bye' }); if (N.role === 'host') broadcast({ t: 'deny', why: '방장이 방을 닫았어요.' }); try { if (N.peer) N.peer.destroy(); } catch (e) {} try { if (N.bc) N.bc.close(); } catch (e) {}
    N.peer = null; N.hostConn = null; N.bc = null; N.conns.clear(); N.seen.clear(); N.role = null; N.code = ''; N.lastHost = 0; N.players = []; N.started = false; };
  setInterval(() => { if (N.role === 'guest') toHost({ t: 'ping' }); if (N.role === 'host') { const now = performance.now(); for (const [pid, t] of N.seen) if (now - t > 15000) drop(pid); } }, 3000);

})();
function rleMask(m) { const out = []; let v = m[0], n = 0; for (let i = 0; i < m.length; i++) { if (m[i] === v) n++; else { out.push(v, n); v = m[i]; n = 1; } } out.push(v, n); return out; }
function unrleMask(G, d) { let i = 0; for (let k = 0; k < d.length; k += 2) { G.mask.fill(d[k], i, i + d[k + 1]); i += d[k + 1]; } V.tc = buildTerrainCanvas(G); V.tctx = V.tc.getContext('2d'); }
function onlineModal() { const nick = (SAVE.nick || '선수' + Math.floor(Math.random() * 90 + 10)).slice(0, 8);
  modal(`<h2>온라인 대전</h2><div class="fld"><label for="onNick">닉네임</label><input id="onNick" maxlength="8" value="${esc(nick)}"></div>
    <div class="btns" style="margin-top:6px"><button class="gb y" id="onHost" style="flex:1">방 만들기</button></div>
    <div class="fld"><label for="onCode">친구 방 코드</label><input id="onCode" maxlength="6" placeholder="ABCD" autocomplete="off"></div>
    <div class="btns" style="margin-top:0"><button class="gb g" id="onJoin" style="flex:1">코드로 참가</button></div>
    <p class="note">2~4명 (1:1 또는 2:2). 방장이 팀과 판 규칙을 정해요.</p>`); }
function lobbyModal() {
  if (!NET.role) return; const host = NET.role === 'host', cfg = NET.cfg, as = cfg.assign || {};
  const ok = NET.players.length >= 2 && NET.players.some(p => as[p.id] === 0) && NET.players.some(p => as[p.id] === 1);
  modal(`<h2>대기실</h2>${host ? `<p class="note" style="text-align:center">친구에게 이 코드를 알려 주세요</p><div class="code">${NET.code}</div>${NET.online === false ? '<p class="note" style="text-align:center">인터넷 서버에 연결하지 못했어요. 지금은 같은 브라우저의 다른 탭에서만 들어올 수 있어요.</p>' : ''}` : `<p style="text-align:center">방 <b class="fd" style="color:var(--acc);letter-spacing:.2em">${NET.code}</b></p>`}
    <div class="plist">${NET.players.map((p, i) => { const t = as[p.id] ?? 0, T = TEAMS[t ? 'pathogen' : 'immune']; return `<div class="pl"><i style="background:${T.col}"></i>${esc(p.name)}${p.id === NET.myId ? ' (나)' : ''}${i === 0 ? ' · 방장' : ''}${host ? `<button class="sw" data-swap="${p.id}" style="color:${T.col}">${T.name} ⇄</button>` : `<small style="color:${T.col}">${T.name}</small>`}</div>`; }).join('')}</div>
    ${host ? settingsH(cfg, false) : `<p class="note" style="text-align:center">유닛 ${cfg.units} · ${SCHEMES[cfg.scheme].name} · 차례 ${cfg.turnTime}초 · 급사 ${cfg.sd ? cfg.sd + '분' : '끔'}</p>`}
    <div class="btns">${host ? `<button class="gb y" data-act="netStart" ${ok ? '' : 'disabled'}>시작</button>` : '<p class="note">방장이 시작하기를 기다리는 중…</p>'}<button class="gb d" data-act="netLeave">나가기</button></div>`, true, host);

    $('#modalBox').querySelectorAll('[data-swap]').forEach(b => b.onclick = () => { const id = b.dataset.swap; as[id] = 1 - (as[id] ?? 0); NET.pushLobby(); }); }
}
function hostStart() { if (NET.role !== 'host') return; const cfg = NET.cfg, as = cfg.assign; const ctrl = [[], []]; NET.players.forEach(p => ctrl[as[p.id] ?? 0].push({ type: 'human', pid: p.id, name: p.name }));
  if (!ctrl[0].length || !ctrl[1].length) { toast('두 팀에 한 명 이상씩 있어야 해요'); return; }
  NET.started = true; const c = cfgFrom(cfg); const m = { t: 'start', cfg: c, ctrl }; NET.send(m); startOnline(m); }
function startOnline(m) { $('#modal').classList.remove('on'); S.me = [0, 1].filter(t => m.ctrl[t].some(x => x.pid === NET.myId)); startMatch('online', m.cfg, m.ctrl); }
NET.listen('lobby', () => { if (document.body.dataset.screen !== 'play') lobbyModal(); });
NET.listen('start', m => { NET.started = true; startOnline(m); });
NET.listen('snap', m => { if (S.mode === 'online' && S.G && !isAuth(S.G)) applySnap(m); });
NET.listen('tend', m => { if (S.mode === 'online' && S.G) applyTurnEnd(m); });
NET.listen('over', m => { if (S.mode !== 'online' || !S.G) return; if (m.ev) handleEv(m.ev, true); applySnapshot(S.G, m.s); S.G.proj = []; endGame(S.G, m.w); });
NET.listen('mask', m => { if (S.G && m.d) unrleMask(S.G, m.d); });
NET.listen('emo', m => { V.emos.push({ e: m.e, team: m.team, t: 0 }); });
NET.listen('ctrl', m => { if (S.G) { S.G.ctrl = m.ctrl; S.ctrl = m.ctrl; } });
NET.listen('left', m => { const G = S.G; if (S.mode !== 'online' || !G || G.phase === 'over') return; toast('한 명이 나갔어요 — AI가 대신해요');
  const wasCur = ctrlNow(G).pid === m.id; for (const l of G.ctrl) for (let i = 0; i < l.length; i++) if (l[i].pid === m.id) l[i] = { type: 'ai', diff: 'normal', name: 'AI' };
  NET.send({ t: 'ctrl', ctrl: G.ctrl }); if (wasCur && NET.role === 'host') { G.proj = []; G.phase = 'settle'; G.settleT = 0; for (const u of G.units) if (u.alive) { u.st = 'air'; u.rope = null; } } });
NET.listen('lost', () => { if (S.mode === 'online') { toast('방장과 연결이 끊겼어요'); goTitle(); } });
NET.listen('fail', () => { if (document.body.dataset.screen !== 'play') onlineModal(); });

/* ---------------- 버튼 ---------------- */
function goTitle() { if (NET.role) NET.leave(); S.mode = 'title'; show('title'); titleStat(); SND.stopMusic(); startDemo(); }
function bindButtons() {
  document.addEventListener('click', e => { const a = e.target.closest('[data-act]'); if (!a || a.disabled) return; SND.init(); SND.play('click'); const k = a.dataset.act;
    if (k === 'solo') soloModal(); else if (k === 'local') localModal(); else if (k === 'online') onlineModal();
    else if (k === 'again') { $('#modal').classList.remove('on'); if (S.mode === 'online') hostStart(); else { const c = Object.assign({}, S.G.cfg, { seed: (Math.random() * 1e9) | 0, first: 1 - S.G.cfg.first }); startMatch(S.mode, c, S.ctrl); } }
    else if (k === 'title') goTitle();
    else if (k === 'hub') { if (NET.role) NET.leave(); location.href = '../index.html'; }
    else if (k === 'surrender') { $('#sheet').classList.remove('on'); const G = S.G; if (!G || G.phase === 'over' || S.demo) return; if (S.mode === 'online') { if (!myHumanTurn(G)) { toast('내 차례에 항복할 수 있어요'); return; } }
      else if (!myHumanTurn(G)) { toast('내 차례에 항복할 수 있어요'); return; } askSurrender(); }
    else if (k === 'dex') dexModal(); else if (k === 'help') helpModal(); else if (k === 'opt') optModal();
    else if (k === 'close') $('#modal').classList.remove('on'); else if (k === 'closeDrawer') closeDrawer();

  $('#modal').addEventListener('click', async e => { const id = e.target.id; if (id !== 'onHost' && id !== 'onJoin') return; const nick = ($('#onNick').value || '').trim().slice(0, 8) || '선수'; SAVE.nick = nick; save(); e.target.disabled = true;
    if (id === 'onHost') { e.target.textContent = '방 만드는 중…'; Object.assign(NET.cfg, DEF_CFG, SAVE.last || {}, { seed: 0 }); await NET.host(nick); lobbyModal(); }
    else { const code = $('#onCode').value; e.target.textContent = '연결 중…'; await NET.join(code, nick); if (NET.role) lobbyModal(); else { e.target.disabled = false; e.target.textContent = '코드로 참가'; } } });
  $('#gMenu').addEventListener('click', () => { SND.init(); $('#sheet').classList.toggle('on'); });
  $('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') $('#sheet').classList.remove('on'); });
}
function titleStat() { $('#tStat').textContent = SAVE.games ? `${SAVE.games}판 · ${SAVE.wins}승 · AI 어려움 ${SAVE.aiWins.hard || 0}승${SAVE.best ? ` · 최고의 한 방 ${SAVE.best}` : ''}` : '면역팀과 병원체팀, 부서지는 몸속 지형에서 펼쳐지는 턴제 포격전!'; }

let lastT = performance.now();
