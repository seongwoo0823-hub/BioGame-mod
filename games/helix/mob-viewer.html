<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>헬릭스 몬스터 도감</title>
<style>
:root{color-scheme:dark;--bg:#12151b;--panel:#1a1f28;--line:#2a3240;--ink:#e6eef0;--dim:#8a96a6;--acc:#c070ff;--acc2:#3cffae;--gold:#ffc040;--red:#ff5a6a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
h1{font-size:18px;margin:0;color:var(--acc)}
header small{color:var(--dim)} header a{color:var(--acc2);margin-left:auto}
main{max-width:1200px;margin:0 auto;padding:12px 16px 40px}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin:12px 0}
h2{font-size:15px;margin:0 0 10px} h3{font-size:13px;margin:14px 0 6px;color:var(--dim);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button,select{background:#232a36;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font:inherit;cursor:pointer}
button.on{border-color:var(--acc);color:var(--acc)}
label{color:var(--dim);display:flex;gap:6px;align-items:center}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.mob{background:#0e1116;border:1px solid transparent;border-radius:8px;padding:6px;cursor:pointer;text-align:center}
.mob.on{border-color:var(--acc)} .mob.mid b{color:var(--gold)} .mob.boss b{color:var(--red)}
.mob canvas{width:100%;height:auto;aspect-ratio:1}
.mob b{display:block;font-size:13px} .mob i{font-style:normal;color:var(--dim);font-size:12px}
#desc{color:var(--dim);margin:6px 0 10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;max-width:760px}
.cell{background:#0e1116;border-radius:8px;position:relative}
.cell canvas{width:100%;height:auto}
.cell span{position:absolute;left:6px;top:4px;color:var(--dim);font-size:12px}
.mid{display:flex;align-items:center;justify-content:center;color:var(--dim);text-align:center;white-space:pre}
#arena{width:100%;height:auto;aspect-ratio:16/10;background:#0b0e12;border-radius:8px;touch-action:none}
.keys{color:var(--dim);font-size:13px;margin-top:6px}
.chap{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-bottom:10px}
.chap button{text-align:left;padding:8px 10px} .chap button b{display:block} .chap button small{color:var(--dim)}
.fx{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.fx div{background:#0e1116;border-radius:8px;padding:6px;text-align:center;color:var(--dim);font-size:12px}
.fx canvas{width:100%;height:auto;margin-bottom:4px}
.pad{display:none;gap:8px;margin-top:8px;flex-wrap:wrap}
@media (pointer:coarse){.pad{display:flex}}
#err{color:var(--red)}
</style>
</head>
<body>
<header><h1>헬릭스 · 몬스터 도감</h1><small>일반 16 · 중간 보스 8 · 챕터 보스 4</small><a id="toHero" href="hero-viewer.html">주인공 보기 →</a></header>
<main>
<div id="err"></div>
<section>
  <h2>챕터 시험장</h2>
  <div class="chap" id="chaps"></div>
  <canvas id="arena" width="640" height="400"></canvas>
  <div class="keys">이동: WASD/방향키 또는 화면 누르기 · 베기: J(연속) · 회전베기: K · 도약 강타: L · 돌진: Space · 처음부터: R</div>
  <div class="pad"><button data-k="j">베기</button><button data-k="k">회전</button><button data-k="l">도약</button><button data-k=" ">돌진</button><button data-k="r">처음부터</button></div>
</section>
<section>
  <h2>몬스터</h2>
  <div id="roster"></div>
</section>
<section>
  <h2 id="mname">동작 · 8방향</h2>
  <div id="desc"></div>
  <div class="row" id="anims"></div>
  <div class="row" style="margin-top:8px">
    <label>속도 <input type="range" id="spd" min="0.25" max="2" step="0.25" value="1"></label>
    <button id="pause">일시정지</button>
  </div>
  <div class="grid" id="grid"></div>
</section>
<section>
  <h2>몬스터 효과</h2>
  <div class="fx" id="fx"></div>
</section>
</main>
<!--BUNDLE--><!--/BUNDLE-->
<script>
const MB = 'assets/mobs/', HB = 'assets/hero/';
const BUNDLE = window.BUNDLE || {};
const src = u => BUNDLE[u] || u;
const getJSON = async u => BUNDLE[u] || (await fetch(u)).json();
const load = u => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error(u)); i.src = src(u); });
const DIRK = ['남', '남동', '동', '북동', '북', '북서', '서', '남서'];
const FPS = {idle: 8, move: 10, attack: 12, attack2: 12, special: 10, roar: 10, hit: 12, death: 10};
const HFPS = {idle: 8, run: 14, atk1: 18, atk2: 18, atk3: 16, spin: 20, leap: 14, dash: 18, hit: 12, death: 10};
// 시험장용 수치: [이동 속도, 공격 거리, 공격력]
const STAT = {
  phage: [70, 40, 3], amoeba: [38, 40, 4], bacillus: [60, 60, 2], brute: [40, 55, 7], researcher: [48, 42, 3], mosquito: [85, 50, 2], worm: [55, 55, 3], shroom: [28, 180, 3],
  prion: [40, 190, 3], planaria: [55, 50, 3], jelly: [45, 50, 3], tick: [65, 45, 2], corona: [55, 65, 3], leech: [50, 45, 3], clone: [42, 200, 3], rat: [95, 40, 2],
  phage_q: [55, 60, 16], shroom_k: [25, 210, 18], leech_l: [45, 60, 18], tick_m: [45, 60, 16], brute_x: [42, 70, 20], clone_c: [40, 220, 18], prion_g: [32, 220, 18], corona_n: [50, 80, 16],
  queen: [26, 95, 40], wormking: [45, 95, 40], doctor: [48, 85, 44], helix: [44, 240, 48],
};
const RANGED = {shroom: 1, prion: 1, clone: 1, shroom_k: 1, clone_c: 1, prion_g: 1, helix: 'beam'};
const BURST = {'#c070ff': 'fx_burst_p', '#46e0a8': 'fx_burst_y', '#a8ff3a': 'fx_burst_y', '#7aff3a': 'fx_burst_y', '#c8ff20': 'fx_burst_y', '#3cffae': 'fx_burst_y', '#5ae0ff': 'fx_burst_y', '#7ae0ff': 'fx_burst_y',
  '#ff70c0': 'fx_burst_r', '#ff4a4a': 'fx_burst_r', '#ff7aa0': 'fx_burst_r', '#ff3a3a': 'fx_burst_r', '#ff4a46': 'fx_burst_r', '#ff6a4a': 'fx_burst_r', '#e08aa0': 'fx_burst_r', '#ff5a90': 'fx_burst_r', '#ff3a6a': 'fx_burst_r'};
let MOBS, MFX, HERO, HFX, CH, IMG = {}, FXI = {}, HIMG = {}, PORT = null, cur = null, curA = 'idle', speed = 1, paused = false, clock = 0;
const anim = (id, a) => MOBS[id].anims.find(x => x.id === a);

async function init() {
  [MOBS, MFX, HERO, HFX, CH] = await Promise.all([MB + 'mobs.json', MB + 'fx.json', HB + 'hero.json', HB + 'fx.json', MB + 'chapters.json'].map(getJSON));
  const jobs = [];
  for (const id in MOBS) for (const a of MOBS[id].anims) jobs.push(load(MB + a.file).then(i => IMG[id + '_' + a.id] = i));
  for (const f of MFX) jobs.push(load(MB + f.file).then(i => FXI[f.id] = i));
  for (const a of HERO.anims) if (HFPS[a.id]) jobs.push(load(HB + a.file).then(i => HIMG[a.id] = i));
  for (const f of HFX) if (['fx_spark', 'fx_shock', 'fx_dash'].includes(f.id)) jobs.push(load(HB + f.file).then(i => FXI[f.id] = i));
  jobs.push(load(HB + 'portrait.webp').then(i => PORT = i).catch(() => {}));
  await Promise.all(jobs);
  for (const id of ['fx_spark', 'fx_shock', 'fx_dash']) MFX.push(HFX.find(f => f.id === id));
  buildRoster(); buildFx(); buildChaps();
  document.getElementById('spd').oninput = e => speed = +e.target.value;
  document.getElementById('pause').onclick = e => { paused = !paused; e.target.classList.toggle('on', paused); };
  pick('queen'); setupArena(); startChapter(0); requestAnimationFrame(loop);
}
function buildRoster() {
  const ro = document.getElementById('roster');
  for (const [tier, title] of [['boss', '챕터 보스'], ['mid', '중간 보스 (챕터마다 2종 중 무작위)'], ['normal', '일반 몬스터']]) {
    ro.insertAdjacentHTML('beforeend', `<h3>${title}</h3>`);
    const g = document.createElement('div'); g.className = 'roster'; ro.appendChild(g);
    for (const id in MOBS) {
      const m = MOBS[id]; if (m.tier !== tier) continue;
      const d = document.createElement('div'); d.className = 'mob ' + tier; d.dataset.id = id;
      const c = document.createElement('canvas'); c.width = c.height = m.cell; d.appendChild(c);
      const ch = m.chapter ? `${m.chapter}장 · ` : (m.chapters || []).map(x => x + '장').join('·') + ' · ';
      d.insertAdjacentHTML('beforeend', `<b>${m.name}</b><i>${ch}${m.role}</i>`);
      d.onclick = () => { pick(id); document.getElementById('mname').scrollIntoView({behavior: 'smooth'}); }; g.appendChild(d);
    }
  }
}
function buildFx() {
  const fx = document.getElementById('fx');
  MFX.forEach(f => { const d = document.createElement('div'); const c = document.createElement('canvas'); c.width = f.w; c.height = f.h; c.dataset.id = f.id; d.appendChild(c); d.append(`${f.name} (${f.frames})`); fx.appendChild(d); });
}
function buildChaps() {
  const box = document.getElementById('chaps');
  CH.forEach((c, i) => { const b = document.createElement('button'); b.innerHTML = `<b>${c.id}장 · ${c.name}</b><small>중간 보스: ${c.mid.map(x => MOBS[x].name).join(' / ')} · 보스: ${MOBS[c.boss].name}</small>`; b.onclick = () => startChapter(i); box.appendChild(b); });
}
let cells = [];
function pick(id) {
  cur = id; curA = 'idle'; const m = MOBS[id];
  document.querySelectorAll('.mob').forEach(e => e.classList.toggle('on', e.dataset.id === id));
  const tierName = {boss: '챕터 보스', mid: '중간 보스', normal: '일반'}[m.tier];
  document.getElementById('mname').textContent = `${m.name} · ${tierName} · ${m.role}`;
  document.getElementById('desc').textContent = m.desc;
  const box = document.getElementById('anims'); box.innerHTML = '';
  m.anims.forEach(a => { const b = document.createElement('button'); b.textContent = `${a.name} (${a.frames})`; b.classList.toggle('on', a.id === curA);
    b.onclick = () => { curA = a.id; clock = 0; [...box.children].forEach(c => c.classList.toggle('on', c === b)); }; box.appendChild(b); });
  const g = document.getElementById('grid'); g.innerHTML = ''; cells = [];
  [5, 4, 3, 6, -1, 2, 7, 0, 1].forEach(d => {
    if (d < 0) { const mm = document.createElement('div'); mm.className = 'cell mid'; mm.id = 'midname'; g.appendChild(mm); return; }
    const c = document.createElement('div'); c.className = 'cell'; const cv = document.createElement('canvas'); cv.width = cv.height = m.cell;
    c.appendChild(cv); c.insertAdjacentHTML('beforeend', `<span>${DIRK[d]}</span>`); g.appendChild(c); cells.push({cv, d});
  });
}
function fr(id, a, t, hold) {
  const A = anim(id, a); const f = Math.floor(t * FPS[a]);
  if (A.loop) return f % A.frames;
  return hold ? Math.min(A.frames - 1, f) : Math.min(A.frames - 1, f % (A.frames + 5));
}
function drawMob(ctx, id, a, f, d, x, y) { const m = MOBS[id], C = m.cell; ctx.drawImage(IMG[id + '_' + a], f * C, d * C, C, C, x - C / 2, y - m.foot, C, C); }
function shadow(ctx, x, y, r) { ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(x, y, r, r * 0.4, 0, 0, Math.PI * 2); ctx.fill(); }
const SH = id => Math.max(8, Math.min(60, MOBS[id].cell * 0.13));
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!paused) clock += dt * speed;
  const m = MOBS[cur]; const mn = document.getElementById('midname');
  if (mn) mn.textContent = `${anim(cur, curA).name}\n${fr(cur, curA, clock) + 1} / ${anim(cur, curA).frames}`;
  for (const {cv, d} of cells) { const c = cv.getContext('2d'); c.clearRect(0, 0, cv.width, cv.height); shadow(c, m.cell / 2, m.foot, SH(cur)); drawMob(c, cur, curA, fr(cur, curA, clock), d, m.cell / 2, m.foot); }
  document.querySelectorAll('.mob canvas').forEach(cv => { const id = cv.parentNode.dataset.id; const c = cv.getContext('2d'); c.clearRect(0, 0, cv.width, cv.height); shadow(c, cv.width / 2, MOBS[id].foot, SH(id)); drawMob(c, id, 'idle', fr(id, 'idle', clock), 1, cv.width / 2, MOBS[id].foot); });
  document.querySelectorAll('#fx canvas').forEach(c => { const f = MFX.find(x => x.id === c.dataset.id); const x = c.getContext('2d'); x.clearRect(0, 0, c.width, c.height);
    const k = Math.floor(clock * 12) % (f.frames + 4); if (k < f.frames) x.drawImage(FXI[f.id], k * f.w, 0, f.w, f.h, 0, 0, f.w, f.h); });
  stepArena(dt); drawArena();
  requestAnimationFrame(loop);
}

// ================= 챕터 시험장 =================
const W = 640, H = 400;
const P = {x: 320, y: 300, d: 4, a: 'idle', t: 0, lock: 0, combo: -1, comboT: 0, hurt: 0, hp: 100, inv: 0};
let foes = [], fxs = [], shots = [], beams = [], banner = null, stage = null;
const keys = new Set();
const dirOf = (dx, dy) => ((Math.round((Math.PI / 2 - Math.atan2(dy, dx)) / (Math.PI / 4)) % 8) + 8) % 8;
const dv = d => { const a = Math.PI / 2 - d * Math.PI / 4; return [Math.cos(a), Math.sin(a)]; };
const rnd = a => a[Math.floor(Math.random() * a.length)];
const STEPS = ['적 무리 1', '중간 보스', '적 무리 2', '챕터 보스'];
function startChapter(i) {
  const c = CH[i]; foes = []; fxs = []; shots = []; beams = [];
  Object.assign(P, {x: 320, y: 320, hp: 100, a: 'idle', t: 0, lock: 0, inv: 1, hitAt: undefined});
  // 순서: 적 무리 → 무작위 중간 보스(2종 중 1) → 적 무리 → 챕터 보스
  stage = {ch: c, i, step: 0, plan: [{wave: 4}, {mid: rnd(c.mid)}, {wave: 5}, {boss: c.boss}], done: false, wait: 0};
  document.querySelectorAll('#chaps button').forEach((b, k) => b.classList.toggle('on', k === i));
  nextStep();
}
function nextStep() {
  const st = stage.plan[stage.step];
  if (!st) { stage.done = true; banner = {t: 0, text: `${stage.ch.id}장 정화 완료!`, sub: 'R을 누르거나 다른 챕터를 골라 다시 시작', col: '#3cffae'}; return; }
  if (st.wave) { for (let k = 0; k < st.wave; k++) spawn(rnd(stage.ch.mobs), k, st.wave); banner = {t: 0, text: `${stage.ch.id}장 · ${stage.ch.name}`, sub: STEPS[stage.step], col: '#c8d0dc'}; }
  if (st.mid) { spawn(st.mid, 0, 1); banner = {t: 0, text: `중간 보스 · ${MOBS[st.mid].name}`, sub: `${stage.ch.mid.map(x => MOBS[x].name).join(' / ')} 중 무작위`, col: '#ffc040'}; }
  if (st.boss) { spawn(st.boss, 0, 1); banner = {t: 0, text: MOBS[st.boss].name, sub: MOBS[st.boss].role, col: '#ff5a6a'}; }
}
function spawn(id, k, n) {
  const m = MOBS[id]; const a = (k + 0.5) / n * Math.PI * 2 + Math.random() * 0.4;
  const big = m.tier !== 'normal';
  const x = big ? 320 : 320 + Math.cos(a) * 250, y = big ? 160 : 210 + Math.sin(a) * 140;
  const hp = m.tier === 'boss' ? 40 : m.tier === 'mid' ? 16 : 3;
  foes.push({id, x: Math.max(40, Math.min(W - 40, x)), y: Math.max(90, Math.min(H - 20, y)), d: 0, a: 'idle', t: 0, hp, max: hp, cd: 1.5 + Math.random() * 1.5, lock: 0, hitDone: false, rf: -1, buff: 0});
}
function setupArena() {
  addEventListener('keydown', e => { const k = e.key.toLowerCase(); keys.add(k); if (e.repeat) return; act(k); if (k.startsWith('arrow') || k === ' ') e.preventDefault(); });
  addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
  document.querySelectorAll('.pad button').forEach(b => b.onpointerdown = e => { e.preventDefault(); act(b.dataset.k); });
  const cv = document.getElementById('arena'); let held = false;
  const aim = e => { const r = cv.getBoundingClientRect(); P.goal = [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H]; };
  cv.addEventListener('pointerdown', e => { held = true; aim(e); }); cv.addEventListener('pointermove', e => held && aim(e));
  addEventListener('pointerup', () => { held = false; P.goal = null; });
}
const HL = a => HERO.anims.find(x => x.id === a).frames / HFPS[a];
function act(k) {
  if (k === 'r') return startChapter(stage ? stage.i : 0);
  if (P.a === 'death' || P.lock > 0.12) return;
  if (k === 'j') { P.combo = P.comboT > 0 ? (P.combo + 1) % 3 : 0; P.comboT = 0.7; P.a = ['atk1', 'atk2', 'atk3'][P.combo]; P.t = 0; P.lock = HL(P.a); P.hitAt = HL(P.a) * 0.45; P.hitR = P.combo === 2 ? 80 : 68; P.arc = true; P.dmg = P.combo === 2 ? 2 : 1; P.mv = 60; }
  if (k === 'k') { P.a = 'spin'; P.t = 0; P.lock = HL('spin'); P.hitAt = HL('spin') * 0.4; P.hitR = 85; P.arc = false; P.dmg = 2; P.mv = 0; }
  if (k === 'l') { P.a = 'leap'; P.t = 0; P.lock = HL('leap'); P.hitAt = HL('leap') * 0.7; P.hitR = 95; P.arc = false; P.dmg = 3; P.mv = 150; P.inv = HL('leap') * 0.7; }
  if (k === ' ') { P.a = 'dash'; P.t = 0; P.lock = HL('dash'); P.hitAt = undefined; P.mv = 520; P.inv = 0.35; fxs.push({id: 'fx_dash', x: P.x, y: P.y, t: 0, d: P.d}); }
}
function hurtFoe(f, dmg) {
  if (f.a === 'death') return;
  const m = MOBS[f.id];
  f.hp -= dmg; fxs.push({id: 'fx_spark', x: f.x, y: f.y - Math.min(60, m.foot * 0.4), t: 0});
  if (m.tier === 'normal') { const vx = f.x - P.x, vy = f.y - P.y, l = Math.hypot(vx, vy) || 1; f.x += vx / l * 12; f.y += vy / l * 8; }
  if (f.hp <= 0) { f.a = 'death'; f.t = 0; f.lock = 99; fxs.push({id: BURST[m.tint] || 'fx_burst_p', x: f.x, y: f.y, t: -0.4}); }
  else if (m.tier === 'normal' || f.lock <= 0) { f.a = 'hit'; f.t = 0; f.lock = 0.33; }
}
function hurtHero(dmg) {
  if (P.inv > 0 || P.a === 'death') return;
  P.hp -= dmg; P.hurt = 0.4; P.inv = 0.5;
  if (P.hp <= 0) { P.hp = 0; P.a = 'death'; P.t = 0; P.lock = 99; banner = {t: 0, text: '쓰러졌습니다', sub: 'R을 눌러 다시 도전', col: '#ff5a6a'}; }
  else if (P.lock <= 0.1) { P.a = 'hit'; P.t = 0; P.lock = HL('hit'); P.mv = -60; P.hitAt = undefined; }
}
function specialFx(f) {
  const ring = n => { for (let k = 0; k < n; k++) { const a = k / n * Math.PI * 2; shots.push({x: f.x, y: f.y - 30, vx: Math.cos(a) * 140, vy: Math.sin(a) * 105, t: 0, dmg: 6}); } };
  const minion = (id, n) => { for (let k = 0; k < n && foes.length < 14; k++) { spawn(id, k, n); const g = foes[foes.length - 1]; g.x = f.x + (k - (n - 1) / 2) * 50; g.y = Math.min(H - 20, f.y + 30); } };
  ({phage_q: () => minion('phage', 2), shroom_k: () => ring(10), leech_l: () => { f.hp = Math.min(f.max, f.hp + 3); }, tick_m: () => minion('tick', 3),
    brute_x: () => { fxs.push({id: 'fx_slam', x: f.x, y: f.y, t: 0}); if (Math.hypot(P.x - f.x, (P.y - f.y) / 0.75) < 150) hurtHero(10); },
    clone_c: () => { foes.forEach(g => g.buff = 4); }, prion_g: () => ring(12), corona_n: () => ring(14),
    queen: () => minion('amoeba', 2),
