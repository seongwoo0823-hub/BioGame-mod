<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>헬릭스 주인공 스프라이트</title>
<style>
:root{--bg:#12151b;--panel:#1a1f28;--line:#2a3240;--ink:#e6eef0;--dim:#8a96a6;--acc:#3cffae;--acc2:#36ccff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
h1{font-size:18px;margin:0;color:var(--acc)}
header small{color:var(--dim)}
main{max-width:1200px;margin:0 auto;padding:12px 16px 40px}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin:12px 0}
h2{font-size:15px;margin:0 0 10px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button,select{background:#232a36;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font:inherit;cursor:pointer}
button.on{border-color:var(--acc);color:var(--acc)}
label{color:var(--dim);display:flex;gap:6px;align-items:center}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;max-width:720px}
.mid{display:flex;align-items:center;justify-content:center;color:var(--dim);text-align:center;font-size:13px}
.cell{background:#0e1116;border-radius:8px;position:relative}
.cell canvas{width:100%;height:auto}
.cell span{position:absolute;left:6px;top:4px;color:var(--dim);font-size:12px}
#play{width:100%;height:min(62vh,520px);background:#0b0e12;border-radius:8px;touch-action:none}
.keys{color:var(--dim);font-size:13px;margin-top:6px}
.fx{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.fx div{background:#0e1116;border-radius:8px;padding:6px;text-align:center;color:var(--dim);font-size:12px}
.fx canvas{width:100%;height:auto;margin-bottom:4px}
.pad{display:none;gap:8px;margin-top:8px;flex-wrap:wrap}
@media (pointer:coarse){.pad{display:flex}}
.light .cell,.light #play,.light .fx div{background:#6b7a6e}
</style>
</head>
<body>
<header><h1>헬릭스 · 주인공 스프라이트</h1><small>8방향 × 15동작 · 효과 10종 · 쿼터뷰 도트</small><a href="mob-viewer.html" style="color:#c070ff;margin-left:auto">몬스터 도감 →</a></header>
<main>
<section>
  <h2>직접 움직여 보기</h2>
  <canvas id="play" width="480" height="300"></canvas>
  <div class="keys">이동: WASD/방향키 · 연속 베기: J · 회전베기: K · 도약 강타: L · 돌진: Space · 세포분열 회피: Shift · 의식: U · 투척: I · 사격: O · 피격: H · 쓰러짐/부활: P</div>
  <div class="pad" id="pad"></div>
</section>
<section>
  <h2>동작 · 8방향 보기</h2>
  <div class="row" id="anims"></div>
  <div class="row" style="margin-top:8px">
    <label>속도 <input type="range" id="spd" min="0.25" max="2" step="0.25" value="1"></label>
    <button id="pause">일시정지</button>
    <button id="bg">배경 밝기</button>
    <label>한 방향 크게 <select id="one"><option value="-1">8방향 모두</option></select></label>
  </div>
  <div class="grid" id="grid"></div>
</section>
<section>
  <h2>초상화</h2>
  <div class="row"><img id="pt1" alt="주인공 초상화" style="width:224px;image-rendering:pixelated;background:#0e1116;border-radius:8px"><img id="pt2" alt="주인공 정면 초상화" style="width:224px;image-rendering:pixelated;background:#0e1116;border-radius:8px"></div>
</section>
<section>
  <h2>효과</h2>
  <div class="fx" id="fx"></div>
</section>
</main>
<!--BUNDLE--><!--/BUNDLE-->
<script>
const BASE = 'assets/hero/';
const FPS = {idle: 8, run: 14, dash: 18, blink: 16, atk1: 18, atk2: 18, atk3: 16, spin: 20, leap: 14, cast: 12, throw: 14, shoot: 16, hit: 12, death: 10, spawn: 10};
const DIRK = ['남', '남동', '동', '북동', '북', '북서', '서', '남서'];
let META, FXM, IMG = {}, FXI = {}, cur = 'idle', speed = 1, paused = false;
const BUNDLE = window.BUNDLE || {};
const src = u => BUNDLE[u] || u;
const getJSON = async u => BUNDLE[u] || (await fetch(u)).json();
function fail(e) { document.querySelector('main').insertAdjacentHTML('afterbegin', '<section style="color:#ff8a8a">그림 파일을 불러오지 못했습니다: ' + (e && e.message || e) + '</section>'); }
const load = u => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error(u)); i.src = src(u); });

async function init() {
  META = await getJSON(BASE + 'hero.json');
  FXM = await getJSON(BASE + 'fx.json');
  await Promise.all(META.anims.map(async a => IMG[a.id] = await load(BASE + a.file)));
  await Promise.all(FXM.map(async f => FXI[f.id] = await load(BASE + f.file)));
  const box = document.getElementById('anims');
  META.anims.forEach(a => {
    const b = document.createElement('button'); b.textContent = `${a.name} (${a.frames})`; b.dataset.id = a.id;
    b.onclick = () => { cur = a.id; t0 = performance.now(); [...box.children].forEach(c => c.classList.toggle('on', c === b)); };
    if (a.id === cur) b.classList.add('on'); box.appendChild(b);
  });
  const one = document.getElementById('one');
  DIRK.forEach((k, i) => { const o = document.createElement('option'); o.value = i; o.textContent = k; one.appendChild(o); });
  one.onchange = buildGrid; buildGrid();
  const fx = document.getElementById('fx');
  FXM.forEach(f => { const d = document.createElement('div'); const c = document.createElement('canvas'); c.width = f.w; c.height = f.h; c.dataset.id = f.id; d.appendChild(c); d.append(f.name + ` (${f.frames})`); fx.appendChild(d); });
  document.getElementById('spd').oninput = e => speed = +e.target.value;
  document.getElementById('pause').onclick = e => { paused = !paused; e.target.classList.toggle('on', paused); };
  document.getElementById('bg').onclick = () => document.body.classList.toggle('light');
  document.getElementById('pt1').src = src(BASE + 'portrait.webp'); document.getElementById('pt2').src = src(BASE + 'portrait_front.webp');
  setupPlay();
  requestAnimationFrame(loop);
}
let cells = [];
function buildGrid() {
  const g = document.getElementById('grid'); g.innerHTML = ''; cells = [];
  const v = +document.getElementById('one').value;
  g.style.gridTemplateColumns = v < 0 ? '' : '1fr';
  (v < 0 ? [5, 4, 3, 6, -1, 2, 7, 0, 1] : [v]).forEach(d => {
    if (d < 0) { const m = document.createElement('div'); m.className = 'cell mid'; m.id = 'midname'; g.appendChild(m); return; }
    const c = document.createElement('div'); c.className = 'cell';
    const cv = document.createElement('canvas'); cv.width = cv.height = META.cell;
    if (v >= 0) cv.style.maxWidth = '480px', cv.style.margin = '0 auto';
    c.appendChild(cv); const s = document.createElement('span'); s.textContent = DIRK[d]; c.appendChild(s); g.appendChild(c);
    cells.push({cv, d});
  });
}
let t0 = performance.now(), last = performance.now(), clock = 0;
function frameOf(id, time) {
  const a = META.anims.find(x => x.id === id); const f = Math.floor(time * FPS[id]);
  return a.loop ? f % a.frames : Math.min(a.frames - 1, f % (a.frames + 6));
}
function drawFrame(ctx, id, f, d, x, y, s = 1) {
  const C = META.cell; ctx.drawImage(IMG[id], f * C, d * C, C, C, x, y, C * s, C * s);
}
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!paused) clock += dt * speed;
  const mn = document.getElementById('midname'); if (mn) { const a = META.anims.find(x => x.id === cur); mn.textContent = `${a.name}\n${frameOf(cur, clock) + 1} / ${a.frames}`; mn.style.whiteSpace = 'pre'; }
  for (const {cv, d} of cells) {
    const ctx = cv.getContext('2d'); ctx.clearRect(0, 0, cv.width, cv.height); ctx.imageSmoothingEnabled = false;
    shadow(ctx, META.cell / 2, META.foot, 1);
    { const fi = frameOf(cur, clock), am2 = META.anims.find(x => x.id === cur); drawFrame(ctx, cur, fi, d, 0, -(am2.lift ? Math.min(am2.lift[fi], META.foot - 90) : 0)); }
  }
  document.querySelectorAll('#fx canvas').forEach(c => {
    const f = FXM.find(x => x.id === c.dataset.id); const ctx = c.getContext('2d'); ctx.clearRect(0, 0, c.width, c.height);
    const k = Math.floor(clock * 12) % (f.frames + 4); if (k < f.frames) ctx.drawImage(FXI[f.id], k * f.w, 0, f.w, f.h, 0, 0, f.w, f.h);
  });
  stepPlay(dt); drawPlay();
  requestAnimationFrame(loop);
}
function shadow(ctx, x, y, s) {
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(x, y - 1, 15 * s, 6 * s, 0, 0, Math.PI * 2); ctx.fill();
}

// ---------------- 직접 움직여 보기 ----------------
const P = {x: 240, y: 170, d: 0, a: 'idle', t: 0, lock: 0, combo: 0, comboT: 0, vx: 0, vy: 0, dead: false, fx: []};
const keys = new Set();
const AL = id => META.anims.find(x => x.id === id).frames / FPS[id];
function act(id, opt = {}) {
  if (P.dead && id !== 'spawn') return;
  P.a = id; P.t = 0; P.lock = AL(id) * (opt.cut || 1); P.mv = opt.mv || 0;
  if (opt.fx) P.fx.push({id: opt.fx, t: 0, x: P.x + (opt.off ? dirv()[0] * opt.off : 0), y: P.y + (opt.off ? dirv()[1] * opt.off * 0.5 : 0), delay: opt.delay || 0});
}
function dirv() { const a = Math.PI / 2 - P.d * Math.PI / 4; return [Math.cos(a), Math.sin(a)]; }
function attack() {
  if (P.lock > 0.12 && !P.a.startsWith('atk')) return;
  if (P.lock > 0.1) return;
  const seq = ['atk1', 'atk2', 'atk3'];
  P.combo = P.comboT > 0 ? (P.combo + 1) % 3 : 0; P.comboT = 0.6;
  act(seq[P.combo], {mv: 40, fx: P.combo === 2 ? 'fx_spark' : null, off: 40, delay: 0.25});
}
const ACT = {
  j: attack, k: () => act('spin', {fx: 'fx_spark', delay: .2}), l: () => act('leap', {mv: 70, fx: 'fx_shock', delay: AL('leap') * 0.66, off: 40}),
  ' ': () => act('dash', {mv: 300, fx: 'fx_dash'}), shift: () => act('blink', {mv: 260, fx: 'fx_bubbles'}),
  u: () => act('cast', {fx: 'fx_ritual', delay: .2}), i: () => act('throw', {fx: 'fx_splash', delay: .5, off: 110}), o: () => act('shoot'),
  h: () => act('hit', {mv: -40}), p: () => { if (P.dead) { P.dead = false; act('spawn', {fx: 'fx_reform'}); } else { act('death'); P.dead = true; } }
};
function setupPlay() {
  addEventListener('keydown', e => { const k = e.key.toLowerCase(); keys.add(k); if (ACT[k] && !e.repeat) { ACT[k](); e.preventDefault(); } if (k.startsWith('arrow') || k === ' ') e.preventDefault(); });
  addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
  const pad = document.getElementById('pad');
  [['베기', 'j'], ['회전', 'k'], ['강타', 'l'], ['돌진', ' '], ['분열', 'shift'], ['의식', 'u'], ['투척', 'i'], ['사격', 'o']].forEach(([n, k]) => {
    const b = document.createElement('button'); b.textContent = n; b.onpointerdown = e => { e.preventDefault(); ACT[k](); }; pad.appendChild(b);
  });
  const cv = document.getElementById('play');
  let touch = null;
  cv.addEventListener('pointerdown', e => { touch = {id: e.pointerId}; aimTo(e); });
  cv.addEventListener('pointermove', e => { if (touch && touch.id === e.pointerId) aimTo(e); });
  addEventListener('pointerup', () => { touch = null; P.goal = null; });
  function aimTo(e) { const r = cv.getBoundingClientRect(); P.goal = [(e.clientX - r.left) / r.width * cv.width, (e.clientY - r.top) / r.height * cv.height]; }
}
function stepPlay(dt) {
  P.t += dt; P.lock -= dt; P.comboT -= dt;
  let mx = (keys.has('d') || keys.has('arrowright')) - (keys.has('a') || keys.has('arrowleft'));
  let my = (keys.has('s') || keys.has('arrowdown')) - (keys.has('w') || keys.has('arrowup'));
  if (P.goal && !mx && !my) { const dx = P.goal[0] - P.x, dy = P.goal[1] - P.y; if (Math.hypot(dx, dy) > 6) { mx = dx; my = dy; } }
  const moving = (mx || my) && !P.dead;
  if (P.lock > 0) {
    if (P.mv) { const [vx, vy] = dirv(); const k = P.mv * dt * (P.a === 'dash' || P.a === 'blink' ? 1 : Math.max(0, 1 - P.t * 3)); P.x += vx * k; P.y += vy * k * 0.75; }
  } else if (P.dead) { P.a = 'death'; }
  else if (moving) {
    const ang = Math.atan2(my, mx); P.d = ((Math.round((Math.PI / 2 - ang) / (Math.PI / 4)) % 8) + 8) % 8;
    const l = Math.hypot(mx, my); P.x += mx / l * 120 * dt; P.y += my / l * 120 * dt * 0.75;
    if (P.a !== 'run') { P.a = 'run'; P.t = 0; }
  } else if (P.a !== 'idle') { P.a = 'idle'; P.t = 0; }
  P.x = Math.max(30, Math.min(450, P.x)); P.y = Math.max(90, Math.min(285, P.y));
  P.fx = P.fx.filter(f => (f.t += dt) < f.delay + 1.2);
}
function drawPlay() {
  const cv = document.getElementById('play'); const ctx = cv.getContext('2d'); ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, cv.width, cv.height);
  // 바닥: 쿼터뷰 마름모 타일
  ctx.strokeStyle = 'rgba(60,255,174,.07)'; ctx.lineWidth = 1;
  for (let i = -20; i < 40; i++) { ctx.beginPath(); ctx.moveTo(i * 40, 0); ctx.lineTo(i * 40 + 600, 300); ctx.stroke(); ctx.beginPath(); ctx.moveTo(i * 40, 0); ctx.lineTo(i * 40 - 600, 300); ctx.stroke(); }
  const ground = P.fx.filter(f => ['fx_ritual', 'fx_shock', 'fx_splash'].includes(f.id));
  const air = P.fx.filter(f => !ground.includes(f));
  const drawFx = f => {
    const m = FXM.find(x => x.id === f.id); const k = Math.floor((f.t - f.delay) * 14); if (k < 0 || k >= m.frames) return;
    let ox = m.w / 2, oy = m.h / 2;
    if (['fx_ritual', 'fx_shock', 'fx_splash'].includes(f.id)) oy = m.h * 0.6;
    if (f.id === 'fx_reform') oy = m.h - 10;
    if (f.id === 'fx_bubbles') oy = m.h - 20;
    if (f.id === 'fx_dash') { ctx.save(); ctx.translate(f.x, f.y - 20); const [vx, vy] = dirv(); ctx.rotate(Math.atan2(vy * 0.75, vx)); ctx.drawImage(FXI[f.id], k * m.w, 0, m.w, m.h, -m.w, -m.h / 2, m.w, m.h); ctx.restore(); return; }
    ctx.drawImage(FXI[f.id], k * m.w, 0, m.w, m.h, Math.round(f.x - ox), Math.round(f.y - oy), m.w, m.h);
  };
  ground.forEach(drawFx);
  const C = META.cell; const am = META.anims.find(x => x.id === P.a); const f0 = 0; const f = am.loop ? frameOf(P.a, P.t) : Math.min(am.frames - 1, Math.floor(P.t * FPS[P.a]));
  const lift = am.lift ? am.lift[f] : 0;
  shadow(ctx, P.x, P.y, Math.max(0.5, 1 - lift / 120));   // 도약 높이: 그림은 띄우고 그림자는 바닥에
  drawFrame(ctx, P.a, f, P.d, Math.round(P.x - C / 2), Math.round(P.y - META.foot - lift));
  if (P.a === 'cast' && P.t > 0.4 && P.t < 0.9) ctx.globalAlpha = 0.7, drawFx({id: 'fx_pillar', t: P.t - 0.4, delay: 0, x: P.x, y: P.y - 70});
  ctx.globalAlpha = 1;
  air.forEach(drawFx);
}
init().catch(fail);
</script>
</body>
</html>
