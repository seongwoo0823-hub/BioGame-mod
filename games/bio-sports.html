<!DOCTYPE html>
<html lang="ko">
<head>
<script src="../device.js"></script>
<script src="../icons.js"></script>
<script src="../net.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>바이오 스포츠 천국 · Bio-Sports Heaven</title>
<meta name="theme-color" content="#0f1a2e">
<link rel="manifest" href="../manifest.webmanifest?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-v2-32.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon-v2.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<script>if('serviceWorker' in navigator&&location.protocol!=='file:')addEventListener('load',()=>navigator.serviceWorker.register('../sw.js',{scope:'../'}).catch(()=>{}));</script>
<style>
:root{--glass:rgba(16,24,46,.66);--line:rgba(255,255,255,.22);--text:#f4f8ff;--sub:#c3d0ea;--neon:#5ef2c8;--gold:#ffd25e;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#0f1a2e;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 14px 34px -14px rgba(0,0,0,.6)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 15px;border-radius:13px;font-weight:800;font-size:14.5px;background:rgba(255,255,255,.14);border:1px solid var(--line);transition:transform .1s}
.btn:active{transform:scale(.95)} .btn[disabled]{opacity:.35;pointer-events:none}
.btn.pri{background:linear-gradient(135deg,#38e0b0,#3aa6ff);color:#05221d;border-color:transparent}
.btn.gold{background:linear-gradient(135deg,#ffe07a,#ff9f43);color:#2a1600;border-color:transparent}
.btn.red{background:linear-gradient(135deg,#ff8a8a,#ff4d6d);color:#2a0008;border-color:transparent}
.btn.sm{min-height:32px;padding:0 10px;font-size:12.5px;border-radius:10px}
html.is-touch .btn{min-height:44px} html.is-touch .btn.sm{min-height:36px}
.ui{position:fixed;z-index:5}
:root{--sbh:34px;--sbf:14px;--ib:42px;--miniw:210px;--minih:132px;--joy:132px;--bb:98px;--sb2:66px;--bbf:17px;--pad:12px}
html.dev-phone{--sbh:28px;--sbf:12px;--ib:36px;--miniw:150px;--minih:94px;--joy:112px;--bb:82px;--sb2:56px;--bbf:15px;--pad:8px}
html.dev-tablet{--sbh:36px;--sbf:15px;--ib:44px;--miniw:200px;--minih:126px;--joy:146px;--bb:106px;--sb2:74px;--bbf:18px}
#top{inset:0 0 auto 0;height:0;pointer-events:none}
#score{position:absolute;left:calc(var(--pad) + env(safe-area-inset-left));top:calc(var(--pad) + env(safe-area-inset-top));pointer-events:none;font-weight:900;display:flex;flex-direction:column;align-items:flex-start;gap:5px}
.sb{display:flex;align-items:stretch;border-radius:9px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.4);height:var(--sbh)}
.sb .t{display:flex;align-items:center;gap:7px;padding:0 10px;background:rgba(10,16,32,.9);font-size:var(--sbf);white-space:nowrap;max-width:28vw;overflow:hidden;text-overflow:ellipsis}
.sb .t i{width:5px;align-self:stretch;margin:5px 0;border-radius:3px;flex:none}
.sb .sc{display:flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;min-width:66px;background:linear-gradient(180deg,#ffe066,#f4b41a);color:#1b1200;font-size:calc(var(--sbf) + 3px);font-variant-numeric:tabular-nums}
.sb .ck{display:flex;align-items:center;padding:0 11px;background:#fff;color:#0d1830;font-size:calc(var(--sbf) + 1px);font-variant-numeric:tabular-nums;white-space:nowrap}
.sbs{display:inline-flex;gap:8px;align-items:center;padding:3px 9px;border-radius:7px;background:rgba(10,16,32,.74);font-size:calc(var(--sbf) - 2px);font-weight:800;color:#e3ebfb}
.sbs:empty{display:none}
.sbx{padding:6px 9px;border-radius:9px;background:rgba(10,16,32,.78);font-size:12px;font-weight:800}
.sbx:empty{display:none}
#btns{position:absolute;right:calc(var(--pad) + env(safe-area-inset-right));top:calc(var(--pad) + env(safe-area-inset-top));display:flex;gap:7px;pointer-events:auto}
.ib{width:var(--ib);height:var(--ib);border-radius:12px;background:rgba(10,16,32,.74);border:1px solid rgba(255,255,255,.2);font-size:18px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.ib:active{transform:scale(.92)}
#info{left:50%;transform:translateX(-50%);top:calc(var(--pad) + var(--sbh) + 14px + env(safe-area-inset-top));padding:6px 14px;border-radius:999px;font-weight:800;font-size:13px;text-align:center;max-width:min(560px,58vw);pointer-events:none;background:rgba(10,16,32,.78);border:1px solid rgba(255,255,255,.16)}
#info:empty{display:none}
#info b{color:var(--gold)}
#help{display:none!important}
#keys{left:calc(var(--pad) + env(safe-area-inset-left));bottom:calc(var(--pad) + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:5px;pointer-events:none;max-width:30vw}
#keys span{display:inline-flex;align-items:center;gap:7px;padding:4px 10px 4px 5px;border-radius:9px;background:rgba(10,16,32,.72);font-size:12.5px;font-weight:800;width:max-content}
#keys span.on{background:rgba(255,210,94,.3);outline:1.5px solid #ffd25e}
#keys kbd{min-width:22px;height:22px;padding:0 5px;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;background:#fff;color:#0d1830;font:900 11.5px ui-monospace,monospace}
#keys span.k-b kbd{background:#3fe0a8} #keys span.k-a kbd{background:#7cc4ff} #keys span.k-c kbd{background:#ff8a8a} #keys span.k-q kbd{background:#ffd25e}
#mini{left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom));width:var(--miniw);height:var(--minih);border-radius:8px;border:1.5px solid rgba(255,255,255,.55);background:rgba(10,30,20,.35);opacity:.9;pointer-events:none}
#gauge{left:50%;bottom:calc(var(--minih) + 58px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(280px,56vw);height:14px;border-radius:8px;background:rgba(0,0,0,.5);border:2px solid rgba(255,255,255,.85);overflow:visible;box-shadow:0 4px 14px rgba(0,0,0,.4)}
#gauge.at{bottom:auto;width:112px;height:12px;transform:translate(-50%,-100%)}
#gauge i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,#5ef2c8,#ffd25e 70%,#ff5d6c)}
#gauge b{position:absolute;top:-5px;bottom:-5px;width:4px;border-radius:2px;background:#fff;box-shadow:0 0 8px #fff}
#toast{position:fixed;left:50%;top:calc(var(--sbh) + 64px + env(safe-area-inset-top));transform:translate(-50%,-10px);z-index:30;padding:8px 22px;text-align:center;opacity:0;transition:all .25s;pointer-events:none;max-width:86vw;border-radius:14px;background:rgba(10,16,32,.84);border:1px solid rgba(255,255,255,.16)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast b{display:block;font-size:19px;font-weight:900}
#toast span{display:block;font-size:13px;color:var(--sub);margin-top:1px}
#toast.big{top:30%;padding:14px 36px;background:linear-gradient(135deg,rgba(255,214,90,.95),rgba(255,128,80,.93));color:#1b0f00;border:0}
#toast.big b{font-size:clamp(34px,7vw,60px);letter-spacing:-.02em}
#toast.big span{color:#3a2000;font-weight:800;font-size:15px}
#touch{position:fixed;inset:0;z-index:4;pointer-events:none}
#joyzone{position:absolute;left:0;bottom:0;width:46%;height:70%;pointer-events:auto;touch-action:none}
#joy{position:absolute;left:calc(var(--joy) * .5 + 26px + env(safe-area-inset-left));top:calc(100% - var(--joy) * .5 - 26px - env(safe-area-inset-bottom));width:var(--joy);height:var(--joy);margin:calc(var(--joy) * -.5) 0 0 calc(var(--joy) * -.5);border-radius:50%;border:2px solid rgba(255,255,255,.5);background:radial-gradient(rgba(255,255,255,.1),rgba(10,20,40,.3));pointer-events:none;transition:opacity .2s}
#joy i{position:absolute;left:50%;top:50%;width:44%;height:44%;margin:-22% 0 0 -22%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#c9d6ee);box-shadow:0 4px 10px rgba(0,0,0,.35)}
#joy.idle{opacity:.55}
#acts{position:absolute;right:calc(16px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));width:calc(var(--bb) + var(--sb2) * 1.9);height:calc(var(--bb) + var(--sb2) * 1.9);pointer-events:none}
#acts button{position:absolute;border-radius:50%;pointer-events:auto;touch-action:none;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;line-height:1.1;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5);border:3px solid rgba(255,255,255,.8);box-shadow:0 6px 16px rgba(0,0,0,.4),inset 0 -6px 0 rgba(0,0,0,.18);font-size:13px;transition:transform .08s,filter .08s}
#acts button small{font-size:10px;font-weight:800;opacity:.85}
#acts button.on{transform:scale(.9);filter:brightness(1.25)}
#acts .k-b{right:0;bottom:0;width:var(--bb);height:var(--bb);font-size:var(--bbf);background:radial-gradient(circle at 35% 28%,#5ef2c8,#119a72)}
#acts .k-a{right:calc(var(--bb) + 10px);bottom:2px;width:var(--sb2);height:var(--sb2);background:radial-gradient(circle at 35% 28%,#7cc4ff,#1f62c4)}
#acts .k-c{right:calc(var(--bb) * .74);bottom:calc(var(--bb) * .74);width:var(--sb2);height:var(--sb2);background:radial-gradient(circle at 35% 28%,#ff9a8a,#c4303a)}
#acts .k-q{right:2px;bottom:calc(var(--bb) + 10px);width:var(--sb2);height:var(--sb2);background:radial-gradient(circle at 35% 28%,#ffe07a,#c98a12);color:#2a1800;text-shadow:none}
#picks{position:absolute;right:calc(16px + env(safe-area-inset-right));bottom:calc(var(--bb) + var(--sb2) * 1.9 + 20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;pointer-events:auto}
#picks:empty{display:none}
#picks button{min-width:112px;padding:7px 12px;border-radius:12px;background:rgba(10,16,32,.82);border:2px solid rgba(255,255,255,.25);font-weight:900;font-size:13px;text-align:left}
#picks button.on{border-color:#ffd25e;background:rgba(120,90,10,.7)}
#picks button small{color:var(--gold);margin-right:6px}
html.is-portrait.dev-phone #mini{left:auto;right:calc(var(--pad) + env(safe-area-inset-right));top:calc(var(--ib) + 18px + env(safe-area-inset-top));bottom:auto;transform:none}
html.is-portrait.dev-phone #info{top:auto;bottom:calc(var(--bb) + var(--sb2) * 1.9 + 24px + env(safe-area-inset-bottom));max-width:90vw}
html.is-portrait.dev-phone #gauge{bottom:calc(var(--bb) + var(--sb2) * 1.9 + 66px + env(safe-area-inset-bottom))}
html.is-touch #keys{display:none!important}
#info{max-width:min(520px,46vw)} html.is-portrait #info{max-width:90vw}
.menu-tabs{display:flex;gap:6px;margin:10px 0 12px;flex-wrap:wrap}
.menu-tabs button{flex:1;min-width:96px;padding:10px 8px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-weight:900;font-size:14px}
.menu-tabs button.on{background:linear-gradient(135deg,rgba(56,224,176,.35),rgba(58,166,255,.35));border-color:var(--neon)}
.menu-head{display:flex;align-items:center;gap:10px;justify-content:space-between}
.menu-head .sb{height:34px}
.scrim{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:12px;background:rgba(5,10,22,.5)}
.modal{width:min(980px,100%);max-height:calc(var(--app-h,100vh) - 24px);overflow:auto;padding:18px;background:rgba(14,22,42,.96);font-size:14.5px;line-height:1.5}
.modal h2{margin:0 0 2px;font-size:21px;font-weight:900}
.modal .sub{margin:0 0 10px;color:var(--sub);font-size:14px}
.lbl{font-size:12.5px;font-weight:900;color:var(--sub);letter-spacing:.04em;margin:12px 0 6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:86px;padding:9px 8px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-weight:800;font-size:13.5px}
.seg button small{display:block;font-weight:600;color:var(--sub);font-size:11.5px}
.seg button.on{background:linear-gradient(135deg,rgba(56,224,176,.35),rgba(58,166,255,.35));border-color:var(--neon)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px}
.teams button{padding:9px 10px;border-radius:13px;background:rgba(255,255,255,.07);border:1px solid var(--line);text-align:left;font-size:13px}
.teams button b{display:block;font-size:14.5px}
.teams button small{color:var(--sub);font-size:11.5px;display:block}
.teams button.on{border-color:var(--neon);background:rgba(94,242,200,.14)}
.teams button.on2{border-color:#ff8fa3;background:rgba(255,143,163,.14)}
.chip{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
table.rt{width:100%;border-collapse:collapse;font-size:13px}
table.rt th,table.rt td{padding:5px 6px;border-bottom:1px solid rgba(255,255,255,.09);text-align:left;white-space:nowrap}
table.rt th{color:var(--sub);font-weight:700;position:sticky;top:0;background:rgba(14,22,42,.98)}
table.rt tr.st{background:rgba(94,242,200,.08)}
table.rt tr.sel{outline:2px solid var(--gold)}
table.rt tr{cursor:pointer}
.bar{display:inline-block;width:46px;height:7px;border-radius:4px;background:rgba(255,255,255,.12);vertical-align:middle;margin-right:4px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#5ef2c8,#3aa6ff)}
.wrap2{display:grid;grid-template-columns:1.25fr 1fr;gap:14px}
.pitch{position:relative;border-radius:14px;min-height:300px;overflow:hidden}
.pitch .ps{position:absolute;transform:translate(-50%,-50%);text-align:center;font-size:11px;font-weight:800;cursor:pointer}
.pitch .ps i{display:block;width:30px;height:30px;margin:0 auto 2px;border-radius:10px;line-height:30px;font-style:normal;font-size:13px;color:#08202a;border:2px solid #fff}
.pitch .ps.sel i{outline:3px solid var(--gold)}
.box{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.box div{padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.07);font-size:13px}
.box div b{display:block;font-size:19px}
/* 로비 종목 카드: 종목마다 색 */
.sports button{position:relative;overflow:hidden;transition:transform .12s,box-shadow .12s;box-shadow:0 10px 26px -12px rgba(0,0,0,.6)}
.sports button:hover{transform:translateY(-3px)}
.sports button::before{content:'';position:absolute;inset:0;opacity:.55;z-index:-1}
.sports button[data-s=soccer]::before{background:linear-gradient(160deg,#1f9a52,#0d4d2a)}
.sports button[data-s=basketball]::before{background:linear-gradient(160deg,#e07a2a,#6a2d0e)}
.sports button[data-s=baseball]::before{background:linear-gradient(160deg,#2a6ad8,#0e2d6a)}
.sports button[data-s=volleyball]::before{background:linear-gradient(160deg,#e0b32a,#7a4a0e)}
.sports button[data-s=pool]::before{background:linear-gradient(160deg,#1a9a8a,#0a3d3a)}
.sports button span{filter:drop-shadow(0 4px 8px rgba(0,0,0,.4))}
#lobby{position:fixed;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;overflow:auto}
#lobby h1{margin:0;font-size:clamp(26px,5vw,44px);font-weight:900;letter-spacing:-.03em;background:linear-gradient(90deg,#7cf5d4,#9ad0ff,#ffb3d9);-webkit-background-clip:text;background-clip:text;color:transparent;text-align:center}
#lobby p{margin:0;color:var(--sub);text-align:center}
.sports{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;width:min(960px,100%)}
.sports button{padding:16px 12px;border-radius:20px;text-align:center;font-weight:900;font-size:16px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px)}
.sports button span{display:block;font-size:42px;margin-bottom:6px}
.sports button small{display:block;font-weight:600;color:var(--sub);font-size:12px;margin-top:4px;line-height:1.4}
.code{font:900 34px/1 ui-monospace,Menlo,monospace;letter-spacing:.18em;color:#a6ffe6;text-align:center;padding:10px;border-radius:14px;background:rgba(0,0,0,.25);margin:6px 0}
input.txt{flex:1;min-width:120px;height:42px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:#fff;font:800 16px inherit;padding:0 12px;letter-spacing:.1em;text-transform:uppercase;outline:none;-webkit-user-select:text;user-select:text}
@media (max-width:760px),(max-height:520px){
  .scrim{padding:0} .modal{width:100%;height:var(--app-h,100vh);max-height:none;border-radius:0;border:0;padding:12px 12px calc(14px + env(safe-area-inset-bottom))}
  .wrap2{grid-template-columns:1fr}
}
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="게임 화면"></canvas>
<div id="lobby"></div>
<div id="top" class="ui" hidden><div id="score"></div><div id="btns"><button class="ib" id="bCam" title="시점 바꾸기 (C)" aria-label="시점 바꾸기"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h3l2-3h8l2 3h3v12H3z"/><circle cx="12" cy="13" r="4"/></svg></button><button class="ib" id="bMenu" title="메뉴 · 경기 현황 (Esc / Tab)" aria-label="메뉴"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button></div></div>
<div id="info" class="ui"></div>
<div id="help" class="ui" hidden></div>
<div id="keys" class="ui" hidden></div>
<canvas id="mini" class="ui" width="420" height="264" hidden></canvas>
<div id="gauge" class="ui" hidden><i></i></div>
<div id="touch" hidden><div id="joyzone"></div><div id="joy" class="idle"><i></i></div><div id="picks"></div><div id="acts"><button class="k-q" data-k="q">변경</button><button class="k-c" data-k="c">태클</button><button class="k-a" data-k="a">패스</button><button class="k-b" data-k="b">슛</button></div></div>
<div id="toast" class="glass"><b></b><span></span></div>
<div id="scrim" class="scrim" hidden><div id="modal" class="modal glass"></div></div>

<script src="../vendor/three.min.js"></script>
<script src="../lyric-audio.js"></script>
<script src="bio-sports/core.js"></script>
<script src="bio-sports/soccer.js"></script>
<script src="bio-sports/basketball.js"></script>
<script src="bio-sports/baseball.js"></script>
<script src="bio-sports/volleyball.js"></script>
<script src="bio-sports/pool.js"></script>
<script src="bio-sports/app.js"></script>
<script src="../goal.js"></script>
<script src="../rank.js"></script>
<script src="../ilog.js"></script>
</body>
</html>
