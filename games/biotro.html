<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>BIOTRO · 세포 포커</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --chip:#1e9bff; --chipD:#0b4f8a; --mult:#ff4b4b; --multD:#8a1414; --gold:#ffc83a; --green:#3fcf6a;
  --ink:#f3eeff; --dim:#a69cc4; --panel:#1f1b30; --panel2:#2a2542; --edge:#463e6c; --dark:#120f1e;
  --px:'Silkscreen','Press Start 2P',monospace; --pp:'Press Start 2P',monospace; --kr:'Do Hyeon','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#0b0a12;overflow:hidden;touch-action:manipulation;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
body{font-family:var(--kr);color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#bg{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0}
img.px,.pxi{image-rendering:pixelated}

/* ---------- panels & buttons ---------- */
.pnl{background:var(--panel);border:2px solid var(--edge);border-radius:8px;box-shadow:0 4px 0 #0a0814}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:6px 16px;border-radius:8px;
  background:#4a4270;font-size:20px;box-shadow:0 4px 0 #1c1830;transition:transform .06s,filter .1s;white-space:nowrap}
.btn:hover{filter:brightness(1.15)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1c1830}
.btn:disabled{filter:grayscale(.8) brightness(.55);cursor:not-allowed;transform:none}
.btn.blue{background:#1d86e0;box-shadow:0 4px 0 #0a3d6e}.btn.red{background:#e0453f;box-shadow:0 4px 0 #6e1512}
.btn.green{background:#2fae58;box-shadow:0 4px 0 #11522a}.btn.gold{background:#e0a020;box-shadow:0 4px 0 #6a4806;color:#1a1200}
.btn.orange{background:#ef7a22;box-shadow:0 4px 0 #6e3008}
.btn.big{min-height:54px;font-size:24px;padding:6px 26px}
.btn.sm{min-height:30px;font-size:16px;padding:3px 10px;box-shadow:0 3px 0 #1c1830}
.chips{color:#fff;background:var(--chip);box-shadow:inset 0 -4px 0 var(--chipD)}
.mult{color:#fff;background:var(--mult);box-shadow:inset 0 -4px 0 var(--multD)}
.gold{color:var(--gold)}

/* ---------- sidebar ---------- */
#side{position:absolute;left:10px;top:10px;bottom:10px;width:284px;display:flex;flex-direction:column;gap:8px;
  background:rgba(18,15,30,.86);border:2px solid var(--edge);border-radius:12px;padding:10px}
#blindBox{overflow:hidden}
#blindBox .bh{padding:6px 10px;font-size:22px;text-align:center;background:#2a5ad0;text-shadow:2px 2px 0 rgba(0,0,0,.35)}
#blindBox .bb{display:flex;align-items:center;gap:10px;padding:8px 10px}
#blindBox .bb img{width:58px;height:58px}
#blindBox small{display:block;color:var(--dim);font-size:15px}
#bReq{display:block;font-family:var(--pp);font-size:16px;color:var(--mult);line-height:1.5}
#bRew{font-size:15px;color:var(--dim)}#bRew b{color:var(--gold);font-weight:400}
#bDesc{padding:0 10px 8px;font-size:15px;color:#ffd0d8;min-height:0}
#scoreBox{display:flex;align-items:center;justify-content:space-between;padding:8px 12px}
#scoreBox small{font-size:16px;color:var(--dim);line-height:1.1}
#rScore{font-family:var(--pp);font-size:17px}
#handBox{padding:8px 10px;text-align:center}
#hName{font-size:22px;min-height:30px;line-height:30px}
#hName small{font-family:var(--px);font-size:12px;color:var(--dim);margin-left:6px}
.cm{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:4px}
.cm span{flex:1;font-family:var(--pp);font-size:17px;padding:10px 4px 12px;border-radius:6px;text-align:center;transition:transform .08s}
.cm span.bump{transform:scale(1.15)}
.cm i{font-style:normal;font-family:var(--pp);font-size:16px;color:var(--mult)}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.st{padding:4px 8px;text-align:center}.st small{display:block;font-size:14px;color:var(--dim);line-height:1.2}
.st b{font-family:var(--pp);font-size:16px;font-weight:400;line-height:1.6}
.st.wide{grid-column:span 2;display:flex;align-items:center;justify-content:center}
.st.wide b{font-size:22px}
.blue{color:#4fb4ff}.red{color:#ff6a6a}
#tagRow{display:flex;flex-wrap:wrap;gap:4px;min-height:0}
#tagRow img{width:36px;height:36px}
.sbtns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:auto}
.sbtns .btn{font-size:18px}

/* ---------- zones ---------- */
.zone{position:absolute}
.zl{position:absolute;bottom:-4px;left:0;font-family:var(--px);font-size:13px;color:var(--dim)}
#jokers{left:312px;top:12px;width:660px;height:150px;background:rgba(10,8,20,.4);border-radius:10px}
#cons{left:984px;top:12px;width:284px;height:150px;background:rgba(10,8,20,.4);border-radius:10px}
#playArea{left:312px;top:196px;width:956px;height:180px}
#handArea{left:312px;top:420px;width:820px;height:170px}
#handBtns{position:absolute;left:312px;top:618px;width:820px;display:flex;align-items:center;justify-content:center;gap:16px}
.sort{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 8px;background:rgba(18,15,30,.8);border:2px solid var(--edge);border-radius:8px}
.sort small{font-size:13px;color:var(--dim)}.sort div{display:flex;gap:4px}
#deckPile{position:absolute;left:1160px;top:470px;width:90px;text-align:center;cursor:pointer}
#deckPile img{width:80px;height:110px;filter:drop-shadow(3px 3px 0 #0007)}
#deckPile span{display:block;font-family:var(--px);font-size:13px;color:var(--dim)}
#handInfo{position:absolute;left:312px;top:408px;width:820px;text-align:center;font-size:17px;color:var(--dim);pointer-events:none}

/* ---------- cards ---------- */
.card{position:absolute;width:80px;height:110px;cursor:pointer;transition:left .22s,top .22s,transform .15s;touch-action:none;transform:translateY(var(--ly,0px)) rotate(var(--r,0deg))}
.card.sel{--ly:-34px}.card.sel img{filter:drop-shadow(0 0 0 #fff) drop-shadow(3px 4px 0 rgba(0,0,0,.45)) brightness(1.06)}.card.sc{--ly:-20px}
.card img{width:100%;height:100%;image-rendering:pixelated;display:block;filter:drop-shadow(3px 4px 0 rgba(0,0,0,.45));pointer-events:none}
.card.sel{z-index:30}
.card.drag{transition:none;z-index:60;filter:brightness(1.1)}
.card.new{animation:deal .35s ease-out}
@keyframes deal{from{opacity:0;transform:translate(120px,40px) rotate(12deg)}}
.card.jig{animation:jig .22s}
@keyframes jig{30%{transform:scale(1.14) rotate(-4deg)}70%{transform:scale(1.08) rotate(3deg)}}
.card.dis{opacity:.5;filter:grayscale(.6)}
.card .db{position:absolute;inset:0;background:linear-gradient(45deg,transparent 46%,rgba(255,40,40,.85) 46% 54%,transparent 54%),linear-gradient(-45deg,transparent 46%,rgba(255,40,40,.85) 46% 54%,transparent 54%);border-radius:6px;pointer-events:none}
.card .ed{position:absolute;inset:3px;border-radius:5px;pointer-events:none;mix-blend-mode:screen;opacity:.55}
.ed-foil .ed{background:linear-gradient(115deg,transparent 20%,#7fd8ff 40%,transparent 55%,#a0c8ff 75%,transparent 90%);background-size:200% 200%;animation:shine 2.4s linear infinite}
.ed-holo .ed{background:repeating-linear-gradient(60deg,rgba(255,80,120,.6) 0 6px,rgba(255,200,80,.25) 6px 12px);animation:shine 3s linear infinite;background-size:200% 200%}
.ed-poly .ed{background:linear-gradient(90deg,#ff5f6d,#ffc371,#5ff08d,#5fb8ff,#c35fff,#ff5f6d);background-size:300% 100%;animation:shine 3s linear infinite;opacity:.45}
.ed-neg img{filter:invert(1) hue-rotate(180deg) drop-shadow(3px 4px 0 rgba(0,0,0,.45))}
@keyframes shine{from{background-position:0 0}to{background-position:200% 0}}
.card .stk{position:absolute;left:2px;top:2px;display:flex;gap:2px;pointer-events:none}.card .stk i{font-style:normal;font-family:var(--kr);font-size:13px;line-height:1;color:#fff;padding:2px 4px;border-radius:4px;box-shadow:0 1px 0 #0008}
.card .ptag{position:absolute;left:50%;bottom:-24px;transform:translateX(-50%);font-family:var(--pp);font-size:11px;padding:4px 6px;border-radius:5px;background:#16122a;border:2px solid var(--edge);color:var(--gold);white-space:nowrap;pointer-events:none}
.card .ptag.free{color:var(--green)}
.card.off img{filter:grayscale(1) brightness(.5)}

/* ---------- popups ---------- */
.pop{position:absolute;z-index:90;font-family:var(--pp);font-size:15px;padding:6px 8px;border-radius:6px;color:#fff;pointer-events:none;
  transform:translate(-50%,-50%);animation:pop .55s ease-out forwards;white-space:nowrap;text-shadow:2px 2px 0 rgba(0,0,0,.35)}
.pop.c{background:var(--chip)}.pop.m{background:var(--mult)}.pop.x{background:#fff;color:var(--mult);text-shadow:none}
.pop.d{background:var(--gold);color:#1a1200;text-shadow:none}.pop.t{background:#3a3260;font-family:var(--kr);font-size:18px}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}75%{opacity:1;transform:translate(-50%,-80%) scale(1)}100%{opacity:0;transform:translate(-50%,-110%)}}

/* ---------- main panel (blind select / shop / cash / pack) ---------- */
#panel{position:absolute;left:312px;top:186px;width:956px;height:520px;display:none}
#panel.on{display:block}
.blinds{display:flex;gap:16px;justify-content:center;height:100%;align-items:flex-end;padding-bottom:6px}
.bl{width:290px;height:440px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px;background:rgba(22,18,38,.92);border:3px solid var(--edge);border-radius:12px;position:relative;transition:transform .2s}
.bl.cur{border-color:#fff;transform:translateY(-16px);box-shadow:0 0 0 3px rgba(255,255,255,.15)}
.bl.done{opacity:.45}.bl.up{opacity:.75}
.bl .hd{width:100%;text-align:center;font-size:24px;padding:4px;border-radius:6px;text-shadow:2px 2px 0 rgba(0,0,0,.35)}
.bl img.chip{width:84px;height:84px}
.bl .req{text-align:center;background:var(--dark);border-radius:8px;padding:6px 10px;width:100%}
.bl .req small{display:block;color:var(--dim);font-size:15px}.bl .req b{font-family:var(--pp);font-size:18px;color:var(--mult);font-weight:400}
.bl .rw{font-size:16px;color:var(--dim)}.bl .rw b{color:var(--gold);font-weight:400;font-family:var(--pp);font-size:13px}
.bl .bd{font-size:16px;color:#ffd0d8;text-align:center;min-height:44px;line-height:1.35}
.bl .skip{margin-top:auto;display:flex;align-items:center;gap:8px;width:100%}
.bl .skip img{width:40px;height:40px}
.bl .skip div{flex:1;font-size:14px;color:var(--dim);line-height:1.25}
.bl .st2{font-family:var(--px);font-size:14px;color:var(--dim);margin-top:auto}

.shop{display:grid;grid-template-columns:200px 1fr;grid-template-rows:250px 1fr;gap:12px;height:100%;padding:8px;background:rgba(22,18,38,.92);border:3px solid #d0405a;border-radius:12px}
.shop .sbt{display:flex;flex-direction:column;gap:12px;justify-content:center}
.shop .sbt .btn{width:100%;min-height:70px;font-size:22px;flex-direction:column;gap:0;line-height:1.1}
.shop .sbt small{font-size:14px;opacity:.85}
.slots{position:relative;background:rgba(0,0,0,.28);border-radius:10px}
.slots .lab{position:absolute;left:10px;top:6px;font-size:14px;color:var(--dim)}
.cash{width:520px;margin:20px auto 0;padding:16px 20px;background:rgba(22,18,38,.95);border:3px solid var(--gold);border-radius:12px}
.cash .row{display:flex;justify-content:space-between;align-items:center;font-size:20px;padding:6px 0;border-bottom:2px dashed #3a3258;opacity:0;animation:fadein .3s forwards}
.cash .row b{font-family:var(--pp);font-size:15px;color:var(--gold);font-weight:400}
@keyframes fadein{to{opacity:1}}
.packp{height:100%;position:relative}
.packp .ph{text-align:center;font-size:26px;text-shadow:2px 2px 0 #000}
.packp .ph small{display:block;font-size:17px;color:var(--dim)}
.packp .choices{position:absolute;left:0;right:0;top:64px;height:150px}
.packp .pbtn{position:absolute;right:20px;top:4px}

/* ---------- action bar / tooltip / toast ---------- */
#act{position:absolute;z-index:80;display:none;gap:6px;transform:translateX(-50%)}
#act.on{display:flex}
#tip{position:absolute;z-index:95;display:none;width:250px;padding:10px 12px;background:#f2ecdf;color:#2a2340;border:3px solid #2a2340;border-radius:10px;box-shadow:4px 4px 0 rgba(0,0,0,.5);pointer-events:none;font-size:17px;line-height:1.35}
#tip.on{display:block}
#tip h4{margin:0 0 4px;font-weight:400;font-size:21px;text-align:center}
#tip .tg{display:flex;justify-content:center;gap:4px;margin-top:6px;flex-wrap:wrap}
#tip .tg span{font-size:14px;padding:1px 8px;border-radius:5px;color:#fff}
#tip .d{background:#fff;border-radius:6px;padding:6px 8px;text-align:center}
.tc{color:var(--chip)}.tm{color:var(--mult)}.tx{background:var(--mult);color:#fff;padding:0 4px;border-radius:3px}.tmo{color:#c88a00}
.tS{color:#3e4ac0}.tH{color:#d22a3a}.tC{color:#24903e}.tD{color:#dc7a10}.th{color:#7a3ad0}.tdim{color:#8a82a0}
#toast{position:absolute;left:50%;top:150px;transform:translateX(-50%);z-index:96;padding:10px 18px;background:#2a2340;border:2px solid var(--gold);border-radius:8px;font-size:20px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
#big{position:absolute;left:640px;top:300px;z-index:97;transform:translate(-50%,-50%);font-family:var(--pp);font-size:34px;pointer-events:none;opacity:0;text-shadow:4px 4px 0 #000;white-space:nowrap}
#big.on{animation:bigp 1.3s ease-out}
@keyframes bigp{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%)}}

/* ---------- modal ---------- */
#modal{position:absolute;inset:0;z-index:100;background:rgba(6,4,12,.72);display:flex;align-items:center;justify-content:center}
#modal.hidden{display:none}
.mbox{width:760px;max-height:660px;overflow:auto;padding:18px 22px;background:var(--panel);border:3px solid var(--edge);border-radius:14px;box-shadow:0 8px 0 #07050e}
.mbox h2{margin:0 0 10px;font-weight:400;font-size:30px;text-align:center}
.mbox h3{margin:14px 0 6px;font-weight:400;font-size:22px;color:var(--gold)}
.mbox p{margin:6px 0;font-size:18px;line-height:1.45;color:#ddd4f4}
.mbox .mb{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.htab{width:100%;border-collapse:collapse;font-size:18px}
.htab td,.htab th{padding:5px 8px;border-bottom:2px solid #2e2850;text-align:left}
.htab th{font-weight:400;color:var(--dim);font-size:15px}
.htab .lv{font-family:var(--px);font-size:13px;color:#fff;background:#4a4270;border-radius:4px;padding:2px 6px}
.htab .cmv{white-space:nowrap}.htab .cmv b{font-family:var(--pp);font-size:12px;font-weight:400;padding:3px 6px;border-radius:4px}
.dgrid{display:grid;grid-template-columns:repeat(13,1fr);gap:4px}
.dgrid img{width:100%;image-rendering:auto}
.dgrid img.gone{opacity:.25}
.orow{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:20px;padding:8px 0;border-bottom:2px solid #2e2850}
.seg{display:flex;gap:4px}.seg button{padding:4px 12px;border-radius:6px;background:#2a2542;font-family:var(--px);font-size:14px}.seg button.on{background:#e0a020;color:#1a1200}
.orow input[type=range]{width:220px;accent-color:#e0a020}
.vgrid{display:flex;flex-direction:column;gap:4px;max-height:260px;overflow:auto;margin-bottom:8px}.vpair{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.vit{background:#221d38;border-radius:5px;padding:3px 7px;opacity:.55;display:flex;flex-direction:column}.vit.own{opacity:1;background:#3a2f12;box-shadow:inset 0 0 0 1px #ffcf5a}.vit b{font-weight:400;font-size:15px}
.vit small{font-size:12px;color:var(--dim);line-height:1.2}.vit .vreq{color:#ff9a7a}
.vlist{display:flex;flex-wrap:wrap;gap:6px}.vlist span{font-size:16px;padding:2px 8px;background:#2a2542;border-radius:5px}

/* ---------- title ---------- */
#title{position:absolute;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(ellipse at center,rgba(10,6,20,.2),rgba(10,6,20,.75))}
#title.hidden{display:none}
#stage.ttl>:not(#title):not(#modal):not(#toast):not(#fx):not(#flash){visibility:hidden}
.logo{font-family:var(--pp);font-size:86px;line-height:1;color:#fff;letter-spacing:4px;text-shadow:6px 6px 0 #c0304a,12px 12px 0 #40102a}
.logo span{display:inline-block;animation:hop 1.6s ease-in-out infinite}
.logo span:nth-child(2n){animation-delay:.2s}
@keyframes hop{50%{transform:translateY(-8px)}}
.tsub{font-size:30px;color:var(--gold);text-shadow:3px 3px 0 #3a2400}
.tfan{position:relative;width:420px;height:150px;margin:6px 0}
.tfan img{position:absolute;width:88px;height:121px;image-rendering:pixelated;filter:drop-shadow(4px 5px 0 rgba(0,0,0,.5));transition:transform .3s}
.tmenu{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.tnote{font-size:16px;color:var(--dim)}
#hubBtn{position:absolute;left:14px;top:14px;z-index:101}
#rot{display:none;position:fixed;inset:0;z-index:200;background:#0b0a12;color:var(--ink);font-size:24px;align-items:center;justify-content:center;text-align:center;padding:20px}
@media (orientation:portrait) and (max-width:820px){#rot{display:flex}}
@media (prefers-reduced-motion:reduce){.logo span,.ed-foil .ed,.ed-holo .ed,.ed-poly .ed{animation:none}}

/* =================== 화려한 연출 (FX) =================== */
#fx{position:absolute;left:0;top:0;width:1280px;height:720px;z-index:89;pointer-events:none;image-rendering:pixelated}
#flash{position:absolute;left:-40px;top:-40px;width:1360px;height:800px;z-index:88;pointer-events:none;background:#fff;opacity:0}
#crt{position:fixed;inset:0;z-index:300;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 58%,rgba(0,0,0,.42) 100%)}
body.crt #crt::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.17) 2px,rgba(0,0,0,.17) 3px);animation:crtf 6s steps(1) infinite}
body.crt #crt::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(255,255,255,0),rgba(255,255,255,.035) 50%,rgba(255,255,255,0));background-size:100% 18%;background-repeat:no-repeat;animation:crtroll 7s linear infinite}
@keyframes crtf{0%,100%{opacity:1}48%{opacity:.86}52%{opacity:1}}
@keyframes crtroll{from{background-position:0 -20%}to{background-position:0 120%}}
body.lowfx #crt::before,body.lowfx #crt::after{animation:none}

/* 패널 · 버튼 입체감 */
.pnl{background:linear-gradient(180deg,#2a2444 0%,#1f1b30 55%,#1a1629 100%);box-shadow:inset 0 2px 0 rgba(255,255,255,.07),inset 0 -3px 0 rgba(0,0,0,.3),0 4px 0 #0a0814}
#side{background:linear-gradient(180deg,rgba(28,22,46,.92),rgba(14,11,24,.92));box-shadow:inset 0 0 0 2px rgba(255,255,255,.04),0 6px 0 rgba(0,0,0,.35),0 0 24px rgba(80,40,160,.18)}
#blindBox .bh{position:relative;overflow:hidden;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.09) 0 8px,rgba(255,255,255,0) 8px 16px)!important;background-size:23px 23px;animation:stripes 1.2s linear infinite}
@keyframes stripes{to{background-position:23px 0}}
body.lowfx #blindBox .bh{animation:none}
#rScore{color:#fff;text-shadow:0 0 8px rgba(255,255,255,.35),2px 2px 0 #000}
#scoreBox b{display:inline-block}
.btn{position:relative}
.btn::before{content:'';position:absolute;left:5px;right:5px;top:3px;height:3px;border-radius:2px;background:rgba(255,255,255,.22);pointer-events:none}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:active:not(:disabled){transform:translateY(3px)}
#bPlay:not(:disabled),#bDisc:not(:disabled){animation:btnglow 1.6s ease-in-out infinite}
@keyframes btnglow{50%{filter:brightness(1.12)}}
body.lowfx #bPlay,body.lowfx #bDisc{animation:none}

/* 칩 × 배수 카운터 */
.cm span{position:relative;background-image:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 45%,rgba(0,0,0,.12));text-shadow:2px 2px 0 rgba(0,0,0,.4),-1px -1px 0 rgba(0,0,0,.15);border:2px solid rgba(0,0,0,.35)}
.cm span.chips{box-shadow:inset 0 -4px 0 var(--chipD),inset 0 2px 0 rgba(255,255,255,.35)}
.cm span.mult{box-shadow:inset 0 -4px 0 var(--multD),inset 0 2px 0 rgba(255,255,255,.35)}
.cm i{font-size:20px;text-shadow:2px 2px 0 #000;display:inline-block;transition:transform .15s}
.cm.hot span{animation:hot .18s ease-in-out infinite alternate}
.cm.hot span.chips{box-shadow:inset 0 -4px 0 var(--chipD),0 0 14px 3px rgba(80,180,255,.75)}
.cm.hot span.mult{box-shadow:inset 0 -4px 0 var(--multD),0 0 16px 4px rgba(255,120,40,.85)}
.cm.hot i{transform:scale(1.35) rotate(-8deg);color:#ffb03a}
@keyframes hot{to{filter:brightness(1.18)}}
body.lowfx .cm.hot span{animation:none}

/* 카드: 안쪽 래퍼(.cw)가 기울기 · 흔들림 · 튀어오름을 담당 */
.card .cw{position:absolute;inset:0;transform:perspective(360px) rotateX(var(--ty,0deg)) rotateY(var(--tx,0deg));transition:transform .14s ease-out;
  animation:bob 3.4s ease-in-out infinite;animation-delay:var(--bd,0s);will-change:transform}
@keyframes bob{0%,100%{translate:0 0;rotate:-.7deg}50%{translate:0 -2.5px;rotate:.7deg}}
.card.hov .cw{scale:1.07}
.card.drag .cw{rotate:var(--dr,0deg);animation:none;transition:rotate .08s}
body.lowfx .card .cw{animation:none;transform:none}
.card.sel img{filter:drop-shadow(2px 0 0 #ffe27a) drop-shadow(-2px 0 0 #ffe27a) drop-shadow(0 -2px 0 #ffe27a) drop-shadow(3px 5px 0 rgba(0,0,0,.45)) brightness(1.06)}
.card.sc img{filter:drop-shadow(0 0 0 #fff) drop-shadow(0 0 6px rgba(255,255,255,.75)) drop-shadow(3px 5px 0 rgba(0,0,0,.45))}
.card.new{animation:none}
.card.jig{animation:none}
.card .ed,.card .cw::after{position:absolute;inset:0;border-radius:0;pointer-events:none;-webkit-mask-image:var(--m);mask-image:var(--m);-webkit-mask-size:100% 100%;mask-size:100% 100%}
.ed-foil .ed{background:linear-gradient(115deg,rgba(80,160,255,.25) 0%,rgba(80,160,255,.25) 30%,rgba(190,235,255,.95) 42%,#fff 47%,rgba(190,235,255,.95) 52%,rgba(80,160,255,.25) 64%,rgba(80,160,255,.25) 100%),repeating-linear-gradient(0deg,rgba(255,255,255,.18) 0 1px,rgba(255,255,255,0) 1px 3px);
  background-size:300% 100%,100% 100%;mix-blend-mode:screen;opacity:.8;animation:sweep 2.6s linear infinite}
.ed-holo .ed{background:repeating-linear-gradient(-55deg,#ff4a6a 0,#ffb84a 9px,#fff36a 18px,#5af08a 27px,#4ad8ff 36px,#9a6aff 45px,#ff4a6a 54px),radial-gradient(circle,rgba(255,255,255,.55) 1px,rgba(255,255,255,0) 1.5px);
  background-size:200% 200%,5px 5px;mix-blend-mode:hard-light;opacity:.42;animation:holo 3.2s linear infinite}
.ed-poly .ed{background:linear-gradient(100deg,#ff5f6d,#ffc371,#5ff08d,#5fb8ff,#c35fff,#ff5f6d);background-size:300% 100%;mix-blend-mode:color;opacity:.5;animation:sweep 3s linear infinite}
.ed-poly img{animation:huecyc 4s linear infinite}
@keyframes huecyc{from{filter:hue-rotate(0deg) saturate(1.3) drop-shadow(3px 4px 0 rgba(0,0,0,.45))}to{filter:hue-rotate(360deg) saturate(1.3) drop-shadow(3px 4px 0 rgba(0,0,0,.45))}}
.ed-neg .ed{background:radial-gradient(ellipse at center,rgba(170,90,255,0) 40%,rgba(170,90,255,.55) 100%);mix-blend-mode:screen;opacity:.9;animation:negp 2s ease-in-out infinite alternate}
@keyframes negp{to{opacity:.4}}
@keyframes sweep{from{background-position:120% 0,0 0}to{background-position:-120% 0,0 0}}
@keyframes holo{from{background-position:0 0,0 0}to{background-position:200% 200%,0 0}}
.card.leg .cw::after{content:'';background:linear-gradient(105deg,rgba(255,240,180,0) 38%,rgba(255,240,180,.85) 48%,rgba(255,255,255,.95) 50%,rgba(255,240,180,.85) 52%,rgba(255,240,180,0) 62%);background-size:300% 100%;mix-blend-mode:screen;animation:sweep 3.4s linear infinite}
body.lowfx .ed-foil .ed,body.lowfx .ed-holo .ed,body.lowfx .ed-poly .ed,body.lowfx .ed-poly img,body.lowfx .card.leg .cw::after,body.lowfx .ed-neg .ed{animation:none}

/* 팝업 숫자 */
.pop{font-size:16px;padding:6px 9px 8px;border-radius:5px;border:2px solid rgba(0,0,0,.55);box-shadow:0 3px 0 rgba(0,0,0,.45),inset 0 -3px 0 rgba(0,0,0,.22),inset 0 2px 0 rgba(255,255,255,.35);
  animation:pop2 .9s cubic-bezier(.2,1,.3,1) forwards}
.pop.x{border-color:var(--mult);color:var(--mult)}
.pop.big{font-size:22px}
@keyframes pop2{0%{opacity:0;transform:translate(-50%,-30%) scale(.3) rotate(-14deg)}16%{opacity:1;transform:translate(-50%,-75%) scale(1.3) rotate(5deg)}28%{transform:translate(-50%,-72%) scale(.95) rotate(-2deg)}
  40%{transform:translate(-50%,-75%) scale(1.05) rotate(0)}80%{opacity:1;transform:translate(-50%,-88%) scale(1)}100%{opacity:0;transform:translate(-50%,-118%) scale(.75)}}
#big{font-size:40px;text-shadow:3px 0 0 #000,-3px 0 0 #000,0 3px 0 #000,0 -3px 0 #000,5px 6px 0 rgba(0,0,0,.6)}
#big.on{animation:bigp2 1.5s cubic-bezier(.2,1,.3,1)}
@keyframes bigp2{0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(-10deg)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.35) rotate(4deg)}22%{transform:translate(-50%,-50%) scale(.92) rotate(-2deg)}
  32%{transform:translate(-50%,-50%) scale(1.06) rotate(0)}80%{opacity:1;transform:translate(-50%,-52%) scale(1)}100%{opacity:0;transform:translate(-50%,-75%) scale(.9)}}
#hName .tot{display:inline-block;font-family:var(--pp);font-size:21px;color:var(--gold);text-shadow:2px 2px 0 #000,0 0 10px rgba(255,200,58,.6);animation:totp .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes totp{from{transform:scale(.2) rotate(-12deg)}}

/* 타이틀 로고 */
.logo span{background:linear-gradient(180deg,#fff 0%,#fff 40%,#ffd0e2 55%,#ff7aa8 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;
  filter:drop-shadow(5px 5px 0 #c0304a) drop-shadow(5px 5px 0 #40102a)}
.tfan img{animation:fanb 2.6s ease-in-out infinite}
.tfan img:nth-child(2n){animation-delay:-1.3s}
@keyframes fanb{50%{translate:0 -6px}}
body.lowfx .tfan img{animation:none}
.seg button.on{box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}

<script>
'use strict';
/* =========================================================
   BIOTRO · 세포 포커 — 기본 유틸
   ========================================================= */
const $=s=>document.querySelector(s);
const R=Math.random;
const pick=a=>a[Math.floor(R()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const wpick=(items,wf)=>{let t=0;for(const it of items)t+=wf(it);let x=R()*t;for(const it of items){x-=wf(it);if(x<=0)return it;}return items[items.length-1];};
const OPT=Object.assign({speed:2,sfx:.6,music:.3},(()=>{try{return JSON.parse(localStorage.getItem('biotroOpt')||'{}')||{};}catch(e){return {};}})());
const saveOpt=()=>{try{localStorage.setItem('biotroOpt',JSON.stringify(OPT));}catch(e){}};
const sleep=ms=>new Promise(r=>setTimeout(r,ms/OPT.speed));
function fmt(n){if(typeof n!=='number'||!isFinite(n)||isNaN(n))return 'naneinf';n=Math.floor(n);if(Math.abs(n)<1e11)return n.toLocaleString('en-US');return n.toExponential(3).replace('e+','e');}

/* =========================================================
   카드 · 족보
   ========================================================= */
const SUITS=['S','H','C','D'];
const SUIT={S:{n:'핵',c:'#4b57c9',d:'#1f2668',k:'#8a5ae0'},H:{n:'혈액',c:'#e0303f',d:'#6e0c18',k:'#ff9aa8'},C:{n:'잎',c:'#2e9c48',d:'#0d4a1c',k:'#9fe86a'},D:{n:'바이러스',c:'#ef8a1f',d:'#6e3404',k:'#7a2a0a'}};
const RL={11:'J',12:'Q',13:'K',14:'A'};
const rankLabel=r=>RL[r]||String(r);
const rankChips=r=>r<=10?r:r===14?11:10;
const isStone=c=>c.enh==='stone';
const SMEAR={H:0,D:0,S:1,C:1};
const isFace=c=>!isStone(c)&&((c.r>=11&&c.r<=13)||(!!G&&hasJ('pareid')));
const suitIs=(c,s)=>!isStone(c)&&(c.enh==='wild'||c.s===s||(!!G&&hasJ('smeared')&&SMEAR[c.s]===SMEAR[s]));

const HANDS=[
 {id:'high',n:'하이 카드',c:5,m:1,dc:10,dm:1,d:'랭크가 가장 높은 카드 1장'},
 {id:'pair',n:'페어',c:10,m:2,dc:15,dm:1,d:'같은 랭크 2장'},
 {id:'two',n:'투 페어',c:20,m:2,dc:20,dm:1,d:'같은 랭크 2장씩 2쌍'},
 {id:'three',n:'트리플',c:30,m:3,dc:20,dm:2,d:'같은 랭크 3장'},
 {id:'straight',n:'스트레이트',c:30,m:4,dc:30,dm:3,d:'연속된 랭크 5장 (A-2-3-4-5 가능, 랩어라운드 불가)'},
 {id:'flush',n:'플러시',c:35,m:4,dc:15,dm:2,d:'같은 문양 5장'},
 {id:'full',n:'풀하우스',c:40,m:4,dc:25,dm:2,d:'트리플 + 페어'},
 {id:'four',n:'포 카드',c:60,m:7,dc:30,dm:3,d:'같은 랭크 4장'},
 {id:'sflush',n:'스트레이트 플러시',c:100,m:8,dc:40,dm:4,d:'스트레이트이면서 플러시'},
 {id:'five',n:'파이브 카드',c:120,m:12,dc:35,dm:3,d:'같은 랭크 5장 (히든 족보)',hidden:1},
 {id:'fhouse',n:'플러시 하우스',c:140,m:14,dc:40,dm:4,d:'같은 문양으로 된 풀하우스 (히든 족보)',hidden:1},
 {id:'ffive',n:'플러시 파이브',c:160,m:16,dc:50,dm:3,d:'같은 문양·같은 랭크 5장 (히든 족보)',hidden:1},
];
const HI={};HANDS.forEach((h,i)=>{h.i=i;HI[h.id]=h;});

const ENH={
 bonus:{n:'영양 카드',d:'{c+30 칩}'},
 mult:{n:'촉매 카드',d:'{m+4 배수}'},
 wild:{n:'줄기세포 카드',d:'모든 문양으로 취급'},
 glass:{n:'유리 카드',d:'{x×2 배수}, 1/4 확률로 파괴'},
 steel:{n:'키틴 카드',d:'손에 들고 있으면 {x×1.5 배수}'},
 stone:{n:'화석 카드',d:'{c+50 칩}, 랭크·문양 없음, 항상 점수 계산'},
 gold:{n:'ATP 카드',d:'라운드 종료 시 손에 있으면 {$$3}'},
 lucky:{n:'돌연변이 카드',d:'1/5 확률 {m+20 배수}, 1/15 확률 {$$20}'},
};
const EDS={
 foil:{n:'포일',d:'{c+50 칩}',col:'#3a8ae8',cost:2},
 holo:{n:'홀로그래픽',d:'{m+10 배수}',col:'#e83a6a',cost:3},
 poly:{n:'폴리크롬',d:'{x×1.5 배수}',col:'#9a4ae8',cost:5},
 neg:{n:'네거티브',d:'조커 슬롯 +1',col:'#2a2a2a',cost:5},
};

/* =========================================================
   소기관 카드 (행성 카드) · 시약 카드 (타로) · 변이 카드
   ========================================================= */
const PLANETS=[
 {id:'p_high',n:'리보솜',hand:'high',col:'#c9b8ff'},
 {id:'p_pair',n:'리소좀',hand:'pair',col:'#ff8ab8'},
 {id:'p_two',n:'골지체',hand:'two',col:'#ffb36b'},
 {id:'p_three',n:'소포체',hand:'three',col:'#6ad0ff'},
 {id:'p_straight',n:'미토콘드리아',hand:'straight',col:'#ff7a4a'},
 {id:'p_flush',n:'엽록체',hand:'flush',col:'#5ad67a'},
 {id:'p_full',n:'핵',hand:'full',col:'#9a7aff'},
 {id:'p_four',n:'중심체',hand:'four',col:'#ffe066'},
 {id:'p_sflush',n:'액포',hand:'sflush',col:'#66ffe0'},
 {id:'p_five',n:'퍼옥시좀',hand:'five',col:'#c8a0ff'},
 {id:'p_fhouse',n:'세포골격',hand:'fhouse',col:'#ff9a6a'},
 {id:'p_ffive',n:'엔도솜',hand:'ffive',col:'#9af0ff'},
];
const planetPool=()=>PLANETS.filter(p=>!HI[p.hand].hidden||(G&&G.lv[p.hand].played>0));
const TAROTS=[
 {id:'t_bonus',n:'영양 공급',sel:2,enh:'bonus',col:'#4aa8ff',d:'선택한 카드 최대 2장을 영양 카드로 강화 ({c+30 칩})'},
 {id:'t_mult',n:'효소 주입',sel:2,enh:'mult',col:'#ff5a5a',d:'선택한 카드 최대 2장을 촉매 카드로 강화 ({m+4 배수})'},
 {id:'t_wild',n:'역분화',sel:1,enh:'wild',col:'#ffffff',d:'선택한 카드 1장을 줄기세포 카드로 강화 (모든 문양)'},
 {id:'t_glass',n:'유리화',sel:1,enh:'glass',col:'#9af0ff',d:'선택한 카드 1장을 유리 카드로 강화 ({x×2 배수})'},
 {id:'t_steel',n:'키틴 코팅',sel:1,enh:'steel',col:'#b8c0cc',d:'선택한 카드 1장을 키틴 카드로 강화 (손에 있으면 {x×1.5 배수})'},
 {id:'t_stone',n:'화석화',sel:1,enh:'stone',col:'#8e8a86',d:'선택한 카드 1장을 화석 카드로 바꿈 ({c+50 칩})'},
 {id:'t_gold',n:'ATP 충전',sel:1,enh:'gold',col:'#ffd23a',d:'선택한 카드 1장을 ATP 카드로 강화 (라운드 종료 시 손에 있으면 {$$3})'},
 {id:'t_lucky',n:'돌연변이 유발',sel:2,enh:'lucky',col:'#7ae05a',d:'선택한 카드 최대 2장을 돌연변이 카드로 강화'},
 {id:'t_S',n:'핵 염색',sel:3,suit:'S',col:'#4b57c9',d:'선택한 카드 최대 3장을 {S} 문양으로 바꿈'},
 {id:'t_H',n:'헤모글로빈 염색',sel:3,suit:'H',col:'#e0303f',d:'선택한 카드 최대 3장을 {H} 문양으로 바꿈'},
 {id:'t_C',n:'엽록소 염색',sel:3,suit:'C',col:'#2e9c48',d:'선택한 카드 최대 3장을 {C} 문양으로 바꿈'},

const CW=32,CH=44,SS=2; // SS: 2배 슈퍼샘플 — 아트 좌표는 그대로, 0.5px 단위 디테일(F)을 덧칠
function mkc(w,h,rf){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d',rf?{willReadFrequently:true}:undefined);g.imageSmoothingEnabled=false;return [c,g];}
const F=(g,x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(x/SS,y/SS,w/SS,h/SS);}; // 고해상도(세밀) 픽셀 — 좌표는 0.5 아트픽셀 단위
const hsh=(x,y)=>{let h=(x*374761393+y*668265263)|0;h=Math.imul(h^(h>>>13),1274126177);return ((h^(h>>>16))>>>0)/4294967296;};

/* 투명 레이어에 그린 뒤 자동 음영: 왼쪽 위 림 라이트, 오른쪽 아래 그림자, 내부 경계 하이라이트, 외곽선, 드롭 섀도 */
let LITC=null;
function lit(g,draw,o){o=o||{};const w=o.w||CW,h=o.h||CH,W=w*SS,H=h*SS;
  if(!LITC)LITC=mkc(W,H,true);const c=LITC[0],x=LITC[1];if(c.width!==W||c.height!==H){c.width=W;c.height=H;}
  x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,W,H);x.imageSmoothingEnabled=false;x.setTransform(SS,0,0,SS,0,0);draw(x);
  const img=x.getImageData(0,0,W,H),d=img.data,s=new Uint8ClampedArray(d);
  const A=(i,j)=>i<0||j<0||i>=W||j>=H?0:s[(j*W+i)*4+3];const L=k=>s[k]*.3+s[k+1]*.59+s[k+2]*.11;
  const hl=o.hl==null?.34:o.hl,sh=o.sh==null?.3:o.sh,oc=o.outline,dr=o.drop||0,gr=o.grad||0;
  for(let j=0;j<H;j++)for(let i=0;i<W;i++){const k=(j*W+i)*4;
    if(s[k+3]>0){let f=0;
      if(!A(i,j-1)||!A(i-1,j))f=hl;else if(!A(i,j+1)||!A(i+1,j))f=-sh;
      else{const ku=k-W*4,kl=k-4;if(L(k)>L(ku)+38||L(k)>L(kl)+38)f=hl*.55;else if(gr)f=Math.round((.45-j/H)*gr*12)/12;}
      if(f>0){d[k]+=(255-d[k])*f;d[k+1]+=(255-d[k+1])*f;d[k+2]+=(255-d[k+2])*f;}else if(f<0){d[k]*=1+f;d[k+1]*=1+f;d[k+2]*=1+f;}}
    else if(oc&&(A(i-1,j)||A(i+1,j)||A(i,j-1)||A(i,j+1))){d[k]=oc[0];d[k+1]=oc[1];d[k+2]=oc[2];d[k+3]=255;}
    else if(dr&&A(i-dr,j-dr)){d[k+3]=o.dropA||70;}}
  x.putImageData(img,0,0);g.drawImage(c,0,0,W,H,0,0,w,h);}
const P=(g,x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),w,h);};
function circ(g,cx,cy,r,c){g.fillStyle=c;cx=Math.round(cx);cy=Math.round(cy);for(let y=-r;y<=r;y++){const d=Math.floor(Math.sqrt(r*r-y*y)+.35);g.fillRect(cx-d,cy+y,2*d+1,1);}}
function ell(g,cx,cy,rx,ry,c){g.fillStyle=c;cx=Math.round(cx);cy=Math.round(cy);for(let y=-ry;y<=ry;y++){const d=Math.floor(rx*Math.sqrt(Math.max(0,1-(y*y)/(ry*ry)))+.35);g.fillRect(cx-d,cy+y,2*d+1,1);}}
function ring(g,cx,cy,r,c){g.fillStyle=c;const n=Math.ceil(r*7);for(let i=0;i<n;i++){const a=i/n*Math.PI*2;g.fillRect(Math.round(cx+Math.cos(a)*r),Math.round(cy+Math.sin(a)*r),1,1);}}

function pmap(g,x,y,rows,pal,s){s=s||1;rows.forEach((r,j)=>{for(let i=0;i<r.length;i++){const k=r[i];if(k==='.'||k==='0'||!pal[k])continue;g.fillStyle=pal[k];g.fillRect(x+i*s,y+j*s,s,s);}});}
const FONT={'0':'111101101101111','1':'010110010010111','2':'111001111100111','3':'111001111001111','4':'101101111001001','5':'111100111001111','6':'111100111101111','7':'111001001010010','8':'111101111101111','9':'111101111001111','A':'010101111101101','J':'001001001101010','Q':'010101101110011','K':'101101110101101'};

  P(g,1,1,1,1,edge);P(g,CW-2,1,1,1,edge);P(g,1,CH-2,1,1,edge);P(g,CW-2,CH-2,1,1,edge);fillIn(g,bg);bevel(g);}
// 테두리 안쪽 0.5px 입체 음영 (위·왼쪽 밝게, 아래·오른쪽 어둡게)
function bevel(g,a){a=a==null?1:a;const W=CW*SS,H=CH*SS;F(g,4,2,W-8,1,`rgba(255,255,255,${.55*a})`);F(g,2,4,1,H-8,`rgba(255,255,255,${.35*a})`);
  F(g,4,H-3,W-8,1,`rgba(0,0,0,${.22*a})`);F(g,W-3,4,1,H-8,`rgba(0,0,0,${.16*a})`);F(g,3,3,1,1,`rgba(255,255,255,${.5*a})`);}
function fillIn(g,c){P(g,1,2,CW-2,CH-4,c);P(g,2,1,CW-4,CH-2,c);}
const SPR=new Map();
const url=(key,fn,w,h)=>{let u=SPR.get(key);if(u)return u;const [c,g]=mkc((w||CW)*SS,(h||CH)*SS);g.scale(SS,SS);fn(g);u=c.toDataURL();SPR.set(key,u);return u;};

function grain(g,dark,light,x0,y0,x1,y1){x0=x0||3;y0=y0||3;x1=x1||CW*SS-3;y1=y1||CH*SS-3;for(let j=y0;j<y1;j++)for(let i=x0;i<x1;i++){const r=hsh(i,j);if(r<.045)F(g,i,j,1,1,dark);else if(r>.988)F(g,i,j,1,1,light);}}

const BY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];const bay=(i,j)=>BY[(j&3)*4+(i&3)]/16; // 4×4 바이어 디더링

/* =========================================================
   족보 판정 (네 개의 손가락 · 지름길 · 혼합 염색 반영)
   ========================================================= */
function findStraight(cards,need,gap){
  const byR={};cards.forEach(c=>{(byR[c.r]=byR[c.r]||[]).push(c);});
  const rs=Object.keys(byR).map(Number);if(rs.includes(14))rs.push(1);
  const u=[...new Set(rs)].sort((a,b)=>a-b);let best=null;
  for(let i=0;i<u.length;i++){const run=[u[i]];for(let j=i+1;j<u.length;j++){if(u[j]-run[run.length-1]<=gap)run.push(u[j]);else break;}
    if(run.length>=need&&(!best||run.length>best.length))best=run;}
  if(!best)return null;
  return best.map(r=>byR[r===1?14:r][0]);
}
function evalHand(cards){
  const ns=cards.filter(c=>!isStone(c)),cnt={};
  ns.forEach(c=>{(cnt[c.r]=cnt[c.r]||[]).push(c);});
  const groups=Object.values(cnt).sort((a,b)=>b.length-a.length||b[0].r-a[0].r);
  const need=hasJ('fourfing')?4:5,gap=hasJ('shortcut')?2:1;
  let flushC=null;
  if(ns.length>=need)for(const s of SUITS){const m=ns.filter(c=>suitIs(c,s));if(m.length>=need&&(!flushC||m.length>flushC.length))flushC=m;}
  const strC=ns.length>=need?findStraight(ns,need,gap):null;
  const flush=!!flushC,straight=!!strC;
  const g0=groups[0]||[],g1=groups[1]||[];
  let type,sc;
  const all5=ns.length===5,flush5=flush&&flushC.length===5;
  if(all5&&g0.length===5&&flush5){type='ffive';sc=ns;}
  else if(all5&&g0.length===3&&g1.length===2&&flush5){type='fhouse';sc=ns;}
  else if(all5&&g0.length===5){type='five';sc=ns;}
  else if(straight&&flush){type='sflush';sc=[...new Set([...strC,...flushC])];}
  else if(g0.length>=4){type='four';sc=g0;}
  else if(g0.length===3&&g1.length>=2){type='full';sc=[...g0,...g1];}
  else if(flush){type='flush';sc=flushC;}
  else if(straight){type='straight';sc=strC;}
  else if(g0.length===3){type='three';sc=g0;}
  else if(g0.length===2&&g1.length===2){type='two';sc=[...g0,...g1];}
  else if(g0.length===2){type='pair';sc=g0;}
  else{type='high';sc=ns.length?[ns.reduce((a,b)=>b.r>a.r?b:a)]:[];}
  const set=new Set([...sc,...cards.filter(isStone)]);
  const scoring=hasJ('splash')?cards.slice():cards.filter(c=>set.has(c));
  return {type,scoring,
    has:{high:true,pair:g0.length>=2,two:g0.length>=2&&g1.length>=2,three:g0.length>=3,four:g0.length>=4,straight,flush,full:g0.length>=3&&g1.length>=2,sflush:straight&&flush,five:g0.length>=5,fhouse:g0.length===3&&g1.length===2&&flush5,ffive:g0.length>=5&&flush5}};
}

function sortCards(a){

  else if(G.sort==='rank')a.sort((x,y)=>(isStone(x)-isStone(y))||y.r-x.r||so[x.s]-so[y.s]);
}
function drawN(n){
  for(let i=0;i<n&&G.draw.length;i++){

    if(G.inRound&&G.blind===2&&!bossDisabled()){const b=G.boss;
      if(b==='house'&&G.houseFirst)c.fd=true;if(b==='wheel'&&chance(1,7))c.fd=true;if(b==='fish'&&G.fishFlip)c.fd=true;if(b==='mark'&&isFace(c))c.fd=true;}

function resolveJ(i,depth){

}

function openPack(pk,size,from){
  const sp=packSpec(pk,size),ch=[];
  const dupOK=hasJ('showman');
  if(pk==='standard'){for(let i=0;i<sp.show;i++)ch.push({kind:'card',card:randomCard(true)});}
  else if(pk==='buffoon'){const ids=[];for(let i=0;i<sp.show;i++){let id=genJokerId(),k=0;while(!dupOK&&ids.includes(id)&&k++<20)id=genJokerId();ids.push(id);ch.push({kind:'joker',id,ed:rollEdition(),sk:rollStickers(id)});}}
  else{
    const src=pk==='arcana'?TAROTS:pk==='celestial'?planetPool():SPECTRALS.filter(s=>!s.rare);let pool=shuffle(src.slice());
    if(pk==='celestial'&&G.vouchers.includes('telescope')){const want=PLANETS.find(p=>p.hand===mostPlayed());pool.splice(pool.indexOf(want),1);pool.unshift(want);}
    for(let i=0;i<sp.show;i++){
      let d=dupOK?pick(src):pool[i%pool.length];
      if(pk==='arcana'&&G.vouchers.includes('omen')&&R()<.2)d=pick(SPECTRALS.filter(s=>!s.rare));
      if((pk==='arcana'||pk==='spectral')&&R()<.006)d=CONS.s_soul;
      if((pk==='celestial'||pk==='spectral')&&R()<.006)d=CONS.s_hole;
      ch.push({kind:d.kind,id:d.id});
    }

  if(OPT.music<=0){AU.next=c.currentTime+.1;return;}
  if(AU.next<c.currentTime-.2)AU.next=c.currentTime+.05;
  while(AU.next<c.currentTime+.3){
    const i=AU.step,s=i%16;if(s===0&&AU.want!==AU.mood){AU.mood=AU.want;}
    const M=MOODS_M[AU.mood],sp=60/M.bpm/4,t=AU.next-c.currentTime,bar=Math.floor(i/16),chord=CHD[M.prog[bar%4]],D=AU.mus,sec=(bar%8)>=4;
    if(s===0)chord.forEach((n,k)=>voice({f:mf(n),d:sp*15,type:'sawtooth',v:.022,a:.25,r:.4,lp:M.cut*.45,det:[-9,9],dl:t+k*.005,dest:D}));
    if(M.bass.includes(s)){const oct=(s===6||s===14)&&AU.mood!=='boss'?12:0;voice({f:mf(chord[0]-24+oct),d:sp*1.6,type:'triangle',v:.16,lp:700,dl:t,dest:D});voice({f:mf(chord[0]-24),d:sp*1.2,type:'sine',v:.12,dl:t,dest:D});}
    if(M.kick.includes(s)){voice({f:150,f2:45,fd:.12,d:.14,type:'sine',v:.32,dl:t,dest:D});}
    if(M.snare.includes(s)){nz({d:.12,v:.11,f:1800,q:.7,dl:t,dest:D});voice({f:190,d:.06,type:'triangle',v:.05,dl:t,dest:D});}
    if(M.hat&&s%M.hat===0)nz({d:.03,v:s%4===2?.05:.025,f:8000,ft:'highpass',dl:t,dest:D});
    if(M.arp&&(M.arp===2||s%2===0)){const n=chord[[0,1,2,1,0,2,1,2][(s/ (M.arp===2?1:2))%8|0]%chord.length]+12+(M.arp===2&&s%4===3?12:0);voice({f:mf(n),d:sp*.8,type:'square',v:M.arp===2?.018:.022,lp:M.cut,dl:t,dest:D,send:AU.dly});}
    if(M.lead&&sec)for(const [st,k] of LEAD)if(st===s)voice({f:mf(chord[k%chord.length]+24),d:sp*(s===12?3.5:2.2),type:'triangle',v:.045,vib:10,dl:t,dest:D,send:AU.dly});
    AU.step++;AU.next+=sp;}
}
function musicMood(){if(!$('#title').classList.contains('hidden')){AU.want='title';return;}if(!G){AU.want='title';return;}
  AU.want=G.inRound&&G.blind===2?'boss':(G.phase==='shop'||G.phase==='pack')?'shop':'play';}
setInterval(musicMood,250);

/* =========================================================
   배경 (저해상도 세포질 소용돌이)
   ========================================================= */
const BG={c:$('#bg'),mood:'title',t:0,heat:0,ht:0,acc:0,sw:1};
BG.c.width=320;BG.c.height=180;BG.g=BG.c.getContext('2d');BG.g.imageSmoothingEnabled=false;
const [SWC,SWG]=mkc(160,90),SWI=SWG.createImageData(160,90),BGA=new Float32Array(14400),BGRr=new Float32Array(14400),BGU=new Float32Array(14400),BGV=new Float32Array(14400),BGD=new Float32Array(14400);
for(let y=0,i=0;y<90;y++)for(let x=0;x<160;x++,i++){const u=x/160-.5,v=y/90-.5;BGU[i]=u;BGV[i]=v;BGRr[i]=Math.sqrt(u*u+v*v);BGA[i]=Math.atan2(v,u);BGD[i]=bay(x,y)-.5;}
const MOODS={title:[[18,62,70],[40,140,130],[80,40,110]],play:[[20,40,70],[30,110,120],[60,30,90]],boss:[[60,10,20],[150,40,50],[60,20,80]],shop:[[40,14,50],[120,40,110],[30,40,90]]};
const HEATC=[[50,8,40],[190,50,70],[110,30,120]],MC=[[0,0,0],[0,0,0],[0,0,0]];
// 저해상도 세포질 소용돌이 (디더링 7단계) — 160×90을 초당 15회만 계산
function swirl(T){const M=MOODS[BG.mood],h=BG.ht,d=SWI.data;
  for(let j=0;j<3;j++)for(let c=0;c<3;c++)MC[j][c]=M[j][c]+(HEATC[j][c]-M[j][c])*h;
  const a=MC[0],b=MC[1],c=MC[2],sp=1+h*1.6;
  for(let i=0,k=0;i<14400;i++){const u=BGU[i],v=BGV[i];
    let s=Math.sin(BGA[i]*3+BGRr[i]*14-T*.6*sp)+Math.sin(u*9+T*.35*sp)+Math.sin(v*11-T*.4*sp+Math.sin(u*5+T*.2));s=(s+3)/6;
    s=Math.floor(s*7+BGD[i]*.9)/7;if(s<0)s=0;else if(s>1)s=1;
    const m=s<.5?s*2:(s-.5)*2,p=s<.5?a:b,q=s<.5?b:c;d[k++]=p[0]+(q[0]-p[0])*m;d[k++]=p[1]+(q[1]-p[1])*m;d[k++]=p[2]+(q[2]-p[2])*m;d[k++]=255;}
  SWG.putImageData(SWI,0,0);}
// 떠다니는 미생물 (3단 패럴랙스)
const BSPR=(()=>{const L=[];
  const mk=(w,h,f)=>{const [c,g]=mkc(w,h);f(g);L.push(c);};
  mk(15,15,g=>{circ(g,7,7,7,'rgba(200,255,240,.35)');ring(g,7,7,7,'rgba(220,255,250,.9)');circ(g,9,6,3,'rgba(190,150,255,.8)');P(g,8,5,1,1,'#fff');P(g,3,9,1,1,'rgba(255,255,255,.7)');P(g,5,11,1,1,'rgba(255,255,255,.5)');});
  mk(18,9,g=>{P(g,3,2,11,5,'rgba(160,255,190,.55)');P(g,2,3,13,3,'rgba(160,255,190,.55)');P(g,3,2,11,1,'rgba(230,255,235,.9)');P(g,15,4,1,1,'rgba(200,255,220,.8)');P(g,16,3,1,1,'rgba(200,255,220,.6)');P(g,17,5,1,1,'rgba(200,255,220,.5)');P(g,6,4,2,1,'rgba(80,160,100,.8)');});
  mk(13,13,g=>{for(let a=0;a<8;a++){const t=a/8*Math.PI*2;P(g,Math.round(6+Math.cos(t)*5),Math.round(6+Math.sin(t)*5),1,1,'rgba(255,200,140,.9)');}circ(g,6,6,3,'rgba(255,170,90,.55)');ring(g,6,6,3,'rgba(255,220,170,.9)');});
  mk(14,9,g=>{ell(g,7,4,6,3,'rgba(255,120,140,.6)');ell(g,7,4,3,1,'rgba(200,60,90,.6)');P(g,4,2,3,1,'rgba(255,220,225,.9)');});
  mk(9,9,g=>{ring(g,4,4,3,'rgba(220,240,255,.8)');P(g,3,2,1,1,'#fff');});
  mk(7,16,g=>{for(let y=0;y<16;y++){const s=Math.sin(y*.8);P(g,Math.round(3+s*2.5),y,1,1,'rgba(120,255,220,.8)');P(g,Math.round(3-s*2.5),y,1,1,'rgba(255,140,190,.8)');if(y%3===0)P(g,2,y,3,1,'rgba(200,220,255,.35)');}});
  return L;})();
const BOBJ=[];for(let i=0;i<26;i++){const z=i%3;BOBJ.push({x:R()*340-10,y:R()*200-10,z,s:(R()*BSPR.length)|0,ph:R()*6.28,vx:(R()-.3)*6,vy:-(2+R()*5)});}
const EMB=new Float32Array(60*3);for(let i=0;i<60;i++){EMB[i*3]=R()*320;EMB[i*3+1]=R()*180;EMB[i*3+2]=.5+R();}
function bgTick(ts,dt){
  BG.acc+=dt;if(BG.acc<1/30)return;const step=BG.acc;BG.acc=0;const T=ts/1000,lo=!fxOn();
  const mood=!$('#title').classList.contains('hidden')?'title':G&&G.inRound&&G.blind===2?'boss':G&&(G.phase==='shop'||G.phase==='pack')?'shop':'play';
  if(mood!==BG.mood){BG.mood=mood;BG.t=0;}
  BG.ht+=(BG.heat-BG.ht)*Math.min(1,step*3);if(Math.abs(BG.ht-BG.heat)<.01)BG.ht=BG.heat;
  BG.t-=step;if(BG.t<=0){swirl(T);BG.t=lo?.25:1/15;}
  const g=BG.g;g.drawImage(SWC,0,0,320,180);
  for(const o of BOBJ){if(!lo){o.x+=(o.vx+Math.sin(T*.5+o.ph)*3)*step*(o.z+1)*.5;o.y+=o.vy*step*(o.z+1)*.5*(1+BG.ht*2);
      if(o.y<-20){o.y=196;o.x=R()*340-10;}if(o.x>336)o.x=-18;if(o.x<-20)o.x=334;}
    g.globalAlpha=o.z===0?.22:o.z===1?.38:.55;const c=BSPR[o.s];
    if(o.z===0)g.drawImage(c,Math.round(o.x),Math.round(o.y),Math.ceil(c.width*.7),Math.ceil(c.height*.7));else g.drawImage(c,Math.round(o.x),Math.round(o.y));}
  g.globalAlpha=1;
  // 점수가 타오를 때 / 보스: 떠오르는 불씨
  const emb=lo?0:mood==='boss'?20:0+Math.round(BG.ht*60);
  for(let i=0;i<Math.min(60,emb);i++){let y=EMB[i*3+1]-step*30*EMB[i*3+2]*(1+BG.ht*2);if(y<0){y=180;EMB[i*3]=R()*320;}EMB[i*3+1]=y;
    g.fillStyle=i%3?'rgba(255,140,60,.7)':'rgba(255,230,140,.8)';g.fillRect(Math.round(EMB[i*3]+Math.sin(T*2+i)*3),Math.round(y),1,i%4?1:2);}
  if(mood==='boss'&&!lo){g.fillStyle=`rgba(255,20,40,${(.05+.05*Math.sin(T*2.2)).toFixed(3)})`;g.fillRect(0,0,320,180);}
}
let lastTs=0;
function tick(ts){requestAnimationFrame(tick);const dt=Math.min(.05,Math.max(0,(ts-(lastTs||ts))/1000));lastTs=ts;
  twTick(dt);fxTick(dt);bgTick(ts,dt);
  if(fxOn()&&!$('#title').classList.contains('hidden')&&R()<dt*7)spawn(3,340+R()*600,150+R()*180,(R()-.5)*20,-10-R()*20,1+R(),R()<.3?3:2,[0,5,12,10,11][(R()*5)|0],0,1);}

/* =========================================================
   입력 · 시작
   ========================================================= */
$('#bPlay').onclick=playHand;$('#bDisc').onclick=discardSel;
$('#sRank').onclick=()=>{if(!G||BUSY)return;G.sort='rank';sortCards(G.hand);if(G.packHand)sortCards(G.packHand);sfx('click');renderHand();};
$('#sSuit').onclick=()=>{if(!G||BUSY)return;G.sort='suit';sortCards(G.hand);if(G.packHand)sortCards(G.packHand);sfx('click');renderHand();};
$('#bInfo').onclick=()=>{auInit();sfx('click');runInfo();};$('#bOpt').onclick=()=>{auInit();sfx('click');optModal();};
$('#deckPile').onclick=()=>{auInit();sfx('click');deckView();};
$('#tNew').onclick=()=>{auInit();if(localStorage.getItem('biotroRun')&&!confirm('저장된 런이 있어요. 새 게임을 시작하면 사라집니다. 계속할까요?'))return;stakeModal();};
let STK_SEL=Math.max(1,+(localStorage.getItem('biotroStake')||1));
function stakeModal(){
  const S=stats();
  const rows=STAKES.map((t,i)=>`<button data-stake="${i+1}" style="width:100%;text-align:left;border-radius:8px;padding:4px 10px;border-bottom:2px solid #2e2850;${STK_SEL===i+1?'background:#3a3260;':''}">
    <span style="display:flex;align-items:center;gap:10px;line-height:1.2;font-size:19px"><img class="px" style="width:28px;height:28px" src="${chipURL(t.col,'star')}" alt=""><span><b style="font-weight:400">${t.n}</b>${S.stakeWin>i?' <span class="gold" style="font-size:15px">✔ 클리어</span>':''}<br><small style="color:var(--dim);font-size:14px">${i?'이전 판돈 효과 + ':''}${t.d}</small></span></span></button>`).join('');
  modal(`<h2>판돈 선택</h2><div style="display:flex;flex-direction:column;gap:4px">${rows}</div>
   <div class="mb"><button class="btn big blue" data-m="go">${STAKES[STK_SEL-1].n}으로 시작</button><button class="btn big" data-m="close">취소</button></div>`);
}
$('#tCont').onclick=()=>{auInit();continueRun();};$('#tHelp').onclick=()=>{auInit();helpModal();};$('#tOpt').onclick=()=>{auInit();optModal();};
$('#act').addEventListener('pointerdown',e=>e.stopPropagation());
ST.addEventListener('pointerover',e=>{const t=e.target.closest('.card,button,.bopt');if(t&&t!==UI.hov){UI.hov=t;if(e.pointerType==='mouse')sfx('hover');}else if(!t)UI.hov=null;});
ST.addEventListener('pointerdown',e=>{auInit();if(!e.target.closest('#act,#modal,.card,button'))clearUI();});
addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(!$('#modal').classList.contains('hidden')&&G&&G.phase!=='over')closeModal();else clearUI();return;}
  if(!G||!$('#modal').classList.contains('hidden')||!$('#title').classList.contains('hidden'))return;
  if(e.key==='Enter'&&G.phase==='play'){e.preventDefault();playHand();}
});
document.addEventListener('visibilitychange',()=>{if(!AU.c)return;if(document.hidden)AU.c.suspend();else AU.c.resume();});
addEventListener('resize',fit);
// 휴대폰 확대 방지: iOS 핀치 제스처 · 더블탭 · 두 손가락 이동 (일반 탭과 모달 스크롤은 그대로)
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
document.addEventListener('touchmove',e=>{if(e.touches&&e.touches.length>1)e.preventDefault();},{passive:false});
{let lastTE=0;document.addEventListener('touchend',e=>{const t=Date.now();if(t-lastTE<300&&e.touches.length===0&&e.cancelable&&!e.target.closest('input,button,.card,#act,#modal'))e.preventDefault();lastTE=t;},{passive:false});}
applyFxOpt();fit();$("#deckImg").src=backURL();showTitle();requestAnimationFrame(tick);
if(document.fonts&&document.fonts.load){document.fonts.load("16px 'Press Start 2P'");document.fonts.load("16px 'Do Hyeon'");}
