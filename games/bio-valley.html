<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2a1a12">
<title>바이오 밸리 타이쿤</title>
<script type="importmap">{ "imports": { "three": "../vendor/three-r187/three.module.js" } }</script>
<style>
:root{
  --ink:#4a3020; --ink2:rgba(74,48,32,.78); --ink3:rgba(74,48,32,.5); --page:#efe2c6; --page2:#f5ecda; --core:#fbf6ea; --accent:#b9603f; --accent2:#a4512f;
  --ok:#5f8a4a; --bad:#b8452e; --gold:#d9a441; --teal:#4f8f8a; --shadow:rgba(42,24,12,.38); --serif:'Noto Serif KR','Nanum Myeongjo','AppleMyungjo','Batang',Georgia,serif;
  --sans:'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',system-ui,sans-serif; --paper:none; --safeB:env(safe-area-inset-bottom,0px); --safeT:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#2a1a12;color:var(--ink);font-family:var(--sans);touch-action:none;user-select:none;-webkit-user-select:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.hidden{display:none!important}
/* 종이 한 장: 카드 바탕 + 안쪽 테두리 + 앞쪽 그림자 */
.sheet{background-color:var(--page);background-image:var(--paper);background-size:256px;border-radius:3px;position:relative;
  box-shadow:0 1px 0 rgba(255,250,236,.7) inset, 0 0 0 1px rgba(90,60,40,.25), 3px 6px 0 -1px rgba(60,36,20,.18), 4px 10px 18px var(--shadow)}
.sheet::before{content:'';position:absolute;inset:5px;border:1.2px solid var(--ink3);border-radius:2px;pointer-events:none;box-shadow:0 0 0 2.5px var(--page) inset,0 0 0 3.3px rgba(74,48,32,.22) inset}
.cap{font-family:var(--serif);font-weight:700;letter-spacing:.08em}
.num{font-style:italic;font-variant-numeric:tabular-nums}
.ic{width:24px;height:24px;display:inline-block;vertical-align:middle;flex:none}
.ic svg{width:100%;height:100%;display:block;overflow:visible}
/* ---------- 불러오기 ---------- */
#veil{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:rgba(42,26,18,.55);z-index:50;transition:opacity .5s}
#veil.off{opacity:0;pointer-events:none}
#veil .sheet{padding:22px 30px;text-align:center;min-width:220px}
#veil .fold{width:60px;height:44px;margin:0 auto 8px;perspective:200px}
#veil .fold i{display:block;width:60px;height:44px;background:var(--accent);border-radius:2px;transform-origin:50% 100%;animation:flap 1.1s cubic-bezier(.3,1.6,.5,1) infinite alternate;box-shadow:0 2px 0 #7a3a22}
@keyframes flap{0%{transform:rotateX(78deg)}100%{transform:rotateX(0)}}
#veil p{margin:0;font-family:var(--serif);font-size:15px}
/* ---------- 시작 화면 ---------- */
#title{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:calc(18px + var(--safeT)) 16px calc(16px + var(--safeB));pointer-events:none}
#title > *{pointer-events:auto}
#logo{padding:16px 30px 14px;text-align:center;margin-top:2vh;transform-origin:50% 100%;animation:rise .9s cubic-bezier(.2,1.5,.4,1) both}
@keyframes rise{0%{transform:perspective(600px) rotateX(85deg)}100%{transform:perspective(600px) rotateX(0)}}
#logo h1{margin:0;font-family:var(--serif);font-size:clamp(26px,5.4vw,44px);letter-spacing:.06em;color:var(--ink);line-height:1.1}
#logo h1 b{color:var(--accent)}
#logo .sub{font-family:var(--serif);font-size:clamp(11px,2.2vw,14px);letter-spacing:.32em;color:var(--ink2);margin-top:6px}
#menu1{display:flex;flex-direction:column;gap:10px;margin-top:auto;width:min(360px,92vw)}
.bigbtn{display:flex;align-items:center;gap:12px;padding:14px 18px;font-size:17px;font-family:var(--serif);font-weight:700;text-align:left;transition:transform .15s}
.bigbtn:active{transform:translateY(2px)}
.bigbtn.primary{background-color:var(--accent2);background-blend-mode:multiply;color:var(--core)}
.bigbtn.primary::before{border-color:rgba(251,246,234,.55);box-shadow:0 0 0 2.5px var(--accent2) inset,0 0 0 3.3px rgba(251,246,234,.3) inset}
.bigbtn small{display:block;font-family:var(--sans);font-weight:400;font-size:12px;opacity:.8;margin-top:2px}
.bigbtn .ic{width:30px;height:30px}
#biomes{margin-top:auto;width:100%;max-width:1100px}
#biomes h2{font-family:var(--serif);text-align:center;color:var(--core);text-shadow:0 1px 3px rgba(0,0,0,.6);font-size:18px;margin:0 0 10px;letter-spacing:.1em}
#bcards{display:flex;gap:10px;overflow-x:auto;padding:6px 6px 12px;scroll-snap-type:x mandatory;justify-content:safe center}
.bcard{flex:0 0 min(200px,62vw);padding:14px 14px 12px;scroll-snap-align:center;text-align:left;transition:transform .25s cubic-bezier(.2,1.6,.4,1)}
.bcard.on{transform:translateY(-8px)}
.bcard.on::after{content:'';position:absolute;left:12px;right:12px;bottom:-9px;height:5px;border-radius:3px;background:var(--accent)}
.bcard .sw{display:flex;gap:3px;margin-bottom:8px}.bcard .sw i{flex:1;height:10px;border-radius:2px;box-shadow:0 1px 0 rgba(0,0,0,.15)}
.bcard b{font-family:var(--serif);font-size:17px;display:block}
.bcard span{font-size:12.5px;line-height:1.45;display:block;margin-top:4px;color:var(--ink2)}
.bcard em{font-style:normal;font-size:11.5px;display:block;margin-top:6px;color:var(--ok);font-weight:700}
#bgo{display:flex;gap:10px;justify-content:center;margin-top:4px}
#bgo .bigbtn{padding:12px 22px}
/* ---------- 게임 화면 ---------- */
#hud{position:fixed;inset:0;z-index:10;pointer-events:none}
#hud > *{pointer-events:auto}
#top{position:absolute;top:calc(8px + var(--safeT));left:8px;right:8px;display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap;pointer-events:none}
#top > *{pointer-events:auto}
.chip{display:flex;align-items:center;gap:6px;padding:6px 11px 6px 8px;font-size:14px;font-weight:700;min-height:36px}
.chip .num{font-size:15px}
.chip small{font-weight:400;font-size:11px;color:var(--ink2)}
.chip.bad .num{color:var(--bad)}
#city{flex-direction:column;align-items:flex-start;gap:0;padding:6px 12px}
#city b{font-family:var(--serif);font-size:14px}#city small{font-size:11px}
#spd{margin-left:auto;display:flex;gap:2px;padding:4px}
.sb{width:36px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:3px}
.sb.on{background:var(--accent2);color:var(--core)}
.sb.on svg *{stroke:var(--core)}
#todo{position:absolute;top:calc(56px + var(--safeT));left:8px;max-width:min(300px,70vw);padding:8px 12px 8px 10px;font-size:13px;display:flex;gap:8px;align-items:center}
#todo b{font-family:var(--serif)}
#side{position:absolute;right:8px;top:calc(60px + var(--safeT));display:flex;flex-direction:column;gap:6px}
.rb{width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.rb.on{background:var(--teal);}
#tools{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(8px + var(--safeB));display:flex;gap:2px;padding:6px 8px;max-width:calc(100vw - 12px);overflow-x:auto;scrollbar-width:none}
#tools::-webkit-scrollbar{display:none}
.tb{flex:none;width:58px;height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:700;border-radius:4px;color:var(--ink)}
.tb .ic{width:28px;height:28px}
.tb.on{background-color:var(--accent2);color:var(--core)}
.tb.sep{width:1px;height:44px;background:var(--ink3);margin:7px 4px;padding:0}
#drawer{position:absolute;left:50%;transform:translate(-50%,0);bottom:calc(82px + var(--safeB));width:max-content;max-width:calc(100vw - 16px);min-width:min(300px,calc(100vw - 16px));padding:12px 10px 10px;transition:transform .35s cubic-bezier(.2,1.4,.4,1),opacity .2s;transform-origin:50% 100%}
#drawer.closed{transform:translate(-50%,0) perspective(800px) rotateX(80deg);opacity:0;pointer-events:none}
#drawer h3{margin:0 8px 8px;font-family:var(--serif);font-size:15px;display:flex;align-items:center;gap:8px}
#drawer h3 small{font-family:var(--sans);font-weight:400;font-size:12px;color:var(--ink2)}
#cards{display:flex;gap:8px;overflow-x:auto;padding:2px 4px 6px;scrollbar-width:thin}
.card{flex:0 0 128px;padding:8px 8px 9px;text-align:left;background:var(--page2);border-radius:3px;box-shadow:0 0 0 1px rgba(90,60,40,.22),2px 3px 0 rgba(60,36,20,.12);position:relative}
.card.on{box-shadow:0 0 0 2.5px var(--accent2),2px 3px 0 rgba(60,36,20,.2)}
.card.lock{opacity:.5;filter:saturate(.3)}
.card img,.card .ph{width:100%;aspect-ratio:1;object-fit:contain;display:block;background:radial-gradient(circle at 50% 70%,rgba(140,110,70,.18),transparent 65%)}
.card .ph{display:flex;align-items:center;justify-content:center}.card .ph .ic{width:52px;height:52px;opacity:.6}
.card b{display:block;font-size:13px;margin-top:4px;font-family:var(--serif)}
.card .price{font-size:12.5px;font-weight:700;color:var(--accent2)}
.card .tag{font-size:11px;color:var(--ink2);display:block;line-height:1.3;margin-top:2px}
.card .lk{position:absolute;top:8px;right:8px;font-size:10.5px;background:var(--ink);color:var(--core);padding:2px 6px;border-radius:2px}
#panel{position:absolute;right:8px;top:calc(56px + var(--safeT));width:min(380px,calc(100vw - 16px));max-height:calc(100% - 150px - var(--safeT) - var(--safeB));overflow:auto;padding:16px 18px 16px;transition:transform .35s cubic-bezier(.2,1.4,.4,1),opacity .2s;transform-origin:100% 0}
#panel.closed{transform:perspective(900px) rotateY(-75deg);opacity:0;pointer-events:none}
#panel h2{margin:0 0 4px;font-family:var(--serif);font-size:19px;display:flex;align-items:center;gap:8px;padding-right:30px}
#panel .x{position:absolute;right:12px;top:12px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;z-index:2}
#panel p{margin:6px 0;font-size:14px;line-height:1.55}
#panel .sci{background:rgba(79,143,138,.12);border-left:3px solid var(--teal);padding:7px 10px;font-size:13px;line-height:1.5;margin:8px 0;border-radius:2px}
.row{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:5px 0;border-bottom:1px dashed rgba(74,48,32,.22);gap:8px}
.row b{font-variant-numeric:tabular-nums}
.bar{height:9px;background:rgba(74,48,32,.14);border-radius:5px;overflow:hidden;margin:4px 0 2px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:5px}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{padding:9px 14px;font-weight:700;font-size:14px;border-radius:3px;background:var(--page2);box-shadow:0 0 0 1px rgba(90,60,40,.3),1px 2px 0 rgba(60,36,20,.15)}
.btn.pri{background:var(--accent2);color:var(--core)}
.sheet.btn.pri,.sheet .btn.pri{background-image:none}
.btn.bad{background:#b8452e;color:var(--core)}
.btn:disabled{opacity:.45}
.seg{display:flex;gap:4px;margin:6px 0}
.seg button{flex:1;padding:7px 4px;font-size:13px;font-weight:700;border-radius:3px;background:var(--page2);box-shadow:0 0 0 1px rgba(90,60,40,.28)}
.seg button.on{background:var(--teal);color:var(--core)}
.tech{padding:8px 10px;border-radius:3px;margin:6px 0;background:var(--page2);box-shadow:0 0 0 1px rgba(90,60,40,.2);text-align:left;width:100%;display:block}
.tech.on{box-shadow:0 0 0 2.5px var(--teal)}
.tech.done{opacity:.6}
.tech b{font-family:var(--serif)} .tech small{display:block;font-size:12px;color:var(--ink2);margin-top:3px;line-height:1.4}
.ms{display:flex;gap:8px;align-items:center;font-size:13.5px;padding:6px 0;border-bottom:1px dashed rgba(74,48,32,.2)}
.ms .ic{width:20px;height:20px}
.ms.done{color:var(--ink3)}
#toasts{position:absolute;left:8px;bottom:calc(84px + var(--safeB));display:flex;flex-direction:column-reverse;gap:6px;max-width:min(420px,calc(100vw - 70px));pointer-events:none}
.toast{padding:9px 13px;font-size:13.5px;line-height:1.45;animation:tin .45s cubic-bezier(.2,1.5,.4,1) both;transform-origin:0 100%}
.toast small{display:block;font-size:12px;color:var(--ink2);margin-top:2px}
.toast.out{animation:tout .4s ease-in both}
@keyframes tin{0%{transform:perspective(500px) rotateX(80deg)}100%{transform:none}}
@keyframes tout{100%{transform:perspective(500px) rotateX(85deg);opacity:0}}
#confirm{position:absolute;left:50%;bottom:calc(84px + var(--safeB));transform:translateX(-50%);display:flex;gap:8px;padding:8px}
#confirm .btn{padding:12px 18px;font-size:15px}
#tip{position:absolute;padding:6px 10px;font-size:13px;pointer-events:none;white-space:nowrap;transform:translate(14px,-120%);z-index:5}
#tip.err{color:var(--bad)}
#modal{position:fixed;inset:0;background:rgba(30,18,10,.45);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}
#modal .sheet{width:min(460px,100%);max-height:90vh;overflow:auto;padding:22px 22px 18px}
#modal h2{font-family:var(--serif);margin:0 0 8px;font-size:21px}
canvas.chart{width:100%;height:120px;display:block}
@media (max-width:640px){
  .chip{padding:4px 8px 4px 6px;font-size:12px;min-height:30px}.chip .num{font-size:13px}.chip small{display:none}
  .chip .ic{width:18px;height:18px}
  #city{display:none}
  .tb{width:50px;height:52px;font-size:10px}.tb .ic{width:24px;height:24px}
  #drawer{bottom:calc(72px + var(--safeB))}
  .card{flex-basis:108px}
  #todo{top:calc(88px + var(--safeT));font-size:12px;max-width:calc(100vw - 70px)}
  #cDate{display:none}
  #panel{top:auto;bottom:calc(72px + var(--safeB));right:8px;max-height:58vh}
  #side{top:calc(132px + var(--safeT))}
  .rb{width:40px;height:40px}
  #toasts{bottom:calc(150px + var(--safeB))}
}
</style>
</head>
<body>
<canvas id="gl" tabindex="0"></canvas>
<div id="veil"><div class="sheet"><div class="fold"><i></i></div><p id="vtext">종이를 접는 중…</p></div></div>
<div id="title" class="hidden">
  <div id="logo" class="sheet"><h1>바이오 <b>밸리</b> 타이쿤</h1><div class="sub">BIO VALLEY TYCOON</div></div>
  <div id="menu1"></div>
  <div id="biomes" class="hidden"><h2>어디에서 시작할까요?</h2><div id="bcards"></div><div id="bgo"></div></div>
</div>
<div id="hud" class="hidden">
  <div id="top"></div>
  <div id="todo" class="sheet hidden"></div>
  <div id="side"></div>
  <div id="toasts"></div>
  <div id="drawer" class="sheet closed"><h3 id="dtitle"></h3><div id="cards"></div></div>
  <div id="panel" class="sheet closed"></div>
  <div id="confirm" class="sheet hidden"></div>
  <div id="tip" class="sheet hidden"></div>
  <div id="tools" class="sheet"></div>
</div>
<div id="modal" class="hidden"><div class="sheet" id="mbox"></div></div>
<script type="module" src="./bio-valley/main.js"></script>
<script src="../goal.js"></script>
<script src="../ilog.js"></script>
</body>
</html>
