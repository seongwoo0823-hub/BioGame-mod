function overlapR(l,t,r,b,k){return r>k.x&&l<k.x+k.w&&b>k.y&&t<k.y+k.h;}
function moveBody(o){
 if(o.mv){o.x+=o.mv.dx;o.y+=o.mv.dy;}
 o.hitWall=false;o.x+=o.vx;
 let l=o.x-o.w/2,r=o.x+o.w/2,t=o.y-o.h,b=o.y;
 for(const k of L.blocks){if(k.x>r+1||k.x+k.w<l-1)continue;if(overlapR(l,t,r,b-.01,k)){
   if(o.og&&k.y>=b-10&&!solidAt(o.x,k.y-o.h+1)){o.y=k.y;b=o.y;t=o.y-o.h;continue;}
   if(o.vx>0||(o.vx===0&&o.x<k.x+k.w/2))o.x=k.x-o.w/2-.01;else o.x=k.x+k.w+o.w/2+.01;
   o.hitWall=true;l=o.x-o.w/2;r=o.x+o.w/2;}}
 const pb=o.y;
 if(!o.fly)o.vy=Math.min(o.vy+GRAV*(o.gm||1),6);
 o.y+=o.vy;o.og=false;o.mv=null;
 l=o.x-o.w/2;r=o.x+o.w/2;t=o.y-o.h;b=o.y;
 for(const k of L.blocks){if(k.x>=r||k.x+k.w<=l)continue;if(overlapR(l,t,r,b,k)){if(o.vy>=0&&pb<=k.y+7){o.y=k.y;o.vy=0;o.og=true;}else if(o.vy<0){o.y=k.y+k.h+o.h;o.vy=0;}b=o.y;t=o.y-o.h;}}
 if(o.drop>0)o.drop--;
 else if(o.vy>=0){for(const p of L.plats){if(o.x+o.w/2>p.x&&o.x-o.w/2<p.x+p.w&&pb<=p.y+.5&&o.y>=p.y){o.y=p.y;o.vy=0;o.og=true;o.onPlat=true;}}
  for(const m of L.movers){if(o.x+o.w/2>m.x&&o.x-o.w/2<m.x+m.w&&pb<=m.y+2+Math.abs(m.dy)&&o.y>=m.y-1){o.y=m.y;o.vy=0;o.og=true;o.mv=m;o.onPlat=true;}}}
}

function ovE(a,b){return a.x+a.w/2>b.x-b.w/2&&a.x-a.w/2<b.x+b.w/2&&a.y>b.y-b.h&&a.y-a.h<b.y;}

 }
 if(p.shotT>3&&k!=='L'&&k!=='T'){const L_=GL[k]+2-rc;const mx=ox+L_*ca,my=oy+L_*sa;const fc=WEP[k]?WEP[k].col:c.col;const big=(k==='macro'||k==='C'||k==='H'||k==='neut')?2:0;const fl=p.shotT>4;C(mx,my,4+big+(fl?1:0),fc);C(mx,my,3+big,'#fff2a0');C(mx,my,1+big/2,'#fff');if(fl)for(let q=0;q<4;q++){const aa=ang+q*Math.PI/2+.4;LN(mx,my,mx+Math.cos(aa)*(5+big*2),my+Math.sin(aa)*(5+big*2),'#fff2a0');}}}

// ================= PLAYER BULLETS =================
function bulletEnd(b){b.rm=true;
 if(b.type==='lyso'){explodeSmall(b.x,b.y,16,3.5,'#7fd07f');}
 else if(b.type==='mac'){explode(b.x,b.y,34,16,'p');parts.push({t:'ring',x:b.x,y:b.y,s:6,c:'#c080ff',life:16,ml:16,vx:0,vy:0,g:0,sp:2});}
 else if(b.type==='bomb'){explode(b.x,b.y,40,b.dmg,'p');parts.push({t:'ring',x:b.x,y:b.y,s:8,c:'#a0d8ff',life:18,ml:18,vx:0,vy:0,g:0,sp:2.4});for(let i=0;i<8;i++){const a=i/8*6.28;part(b.x,b.y,Math.cos(a)*3,Math.sin(a)*3,20,'#e0f4ff',2,0,'sq');}}
 else if(b.type==='net'){zones.push({x:b.x,y:b.y,r:0,life:240});sfx('net');}
 else if(b.type==='shell'){explode(b.x,b.y,44,32,'p');}
 else spark(b.x,b.y,b.type==='gran'?'#f0a0d0':b.type==='needle'?'#c5f':'#fff6a0');}
function explodeSmall(x,y,r,dmg,c){sfx('pop',30);parts.push({t:'ring',x,y,s:3,c,life:10,ml:10,vx:0,vy:0,g:0,sp:1.3});burst(x,y,6,c,2,2);for(const e of enemies){if(!e.dead&&!e.inv&&rectDist(e,x,y)<r)dmgE(e,dmg,{ex:true});}}
function updPB(){
 for(const b of pbul){if(b.rm)continue;b.life--;b.age=(b.age||0)+1;
  switch(b.type){
   case 'gz':{if(b.age>10){let tg=null,bd=1e9;for(const e of enemies){if(e.dead||e.inv)continue;const d=Math.hypot(e.x-b.x,e.y-e.h/2-b.y);if(d<bd){bd=d;tg=e;}}if(tg){const a=Math.atan2(tg.y-tg.h/2-b.y,tg.x-b.x),ca=Math.atan2(b.vy,b.vx);let da=a-ca;while(da>Math.PI)da-=Math.PI*2;while(da<-Math.PI)da+=Math.PI*2;const na=ca+clamp(da,-.13,.13);const s=Math.min(5.5,Math.hypot(b.vx,b.vy)+.15);b.vx=Math.cos(na)*s;b.vy=Math.sin(na)*s;}}else b.vy+=.1;if(b.age%2===0)part(b.x,b.y,rnd(-.2,.2),rnd(-.2,.2),16,'#c8c0c8',2,-.01,'smoke');break;}
   case 'mac':{const s=Math.min(7.5,Math.hypot(b.vx,b.vy)+.25),a=Math.atan2(b.vy,b.vx);b.vx=Math.cos(a)*s;b.vy=Math.sin(a)*s;part(b.x-b.vx,b.y-b.vy,-b.vx*.1,rnd(-.3,.3),12,pick(['#ffa020','#ff6020','#ffe060']),2,0);break;}
   case 'flame':b.vx*=.95;b.vy=b.vy*.95-.05;b.r=Math.min(9,b.r+.35);break;
   case 'bomb':b.vy+=.18;b.rot=(b.rot||0)+.3*sgn(b.vx);break;
   case 'net':b.vy+=.15;break;
   case 'ab':b.rot=(b.rot||0)+.4;break;
   case 'perf':b.r=Math.min(6,b.r+.15);break;
   case 'lyso':b.vy+=.03;break;
   case 'shell':b.vy+=.1;if(b.age%2===0)part(b.x,b.y,rnd(-.3,.3),rnd(-.3,.3),18,'#9a9aa8',3,-.01,'smoke');break;
  }
  b.x+=b.vx;b.y+=b.vy;
  const k=solidAt(b.x,b.y);
  if(k){if(b.type==='bomb'){if(Math.abs(b.vy)>1.4&&(b.bn=(b.bn||0)+1)<2){b.y-=b.vy;b.vy*=-.45;b.vx*=.7;sfx('land');}else bulletEnd(b);}
   else if(b.type==='flame'){b.vx*=.2;b.vy=-.6;b.y-=2;}
   else{if(k.k==='b')dmgBlock(k,b.dmg);bulletEnd(b);}
   if(b.rm)continue;}
  for(const c of L.caps){if(c.st==='tied'&&Math.abs(b.x-c.x)<8&&b.y>c.y-20&&b.y<c.y){freeCap(c);if(!b.pierce)bulletEnd(b);break;}}
  if(b.rm)continue;
  if(boss&&boss.type==='virking'&&boss.plates){for(let i=0;i<4;i++){const a=boss.plate+i*Math.PI/2;const px=boss.x+Math.cos(a)*38,py=boss.y-24+Math.sin(a)*38;if(Math.hypot(b.x-px,b.y-py)<8&&b.type!=='flame'){sfx('clank');spark(b.x,b.y,'#c0f0ff');b.rm=true;break;}}if(b.rm)continue;}
  for(const o of ebul){if(o.hp>0&&Math.hypot(o.x-b.x,o.y-b.y)<o.r+b.r+1){o.hp-=b.dmg;if(o.hp<=0){o.rm=true;burst(o.x,o.y,6,o.col||'#f6a',2,2);sfx('pop');}if(!b.pierce){bulletEnd(b);break;}}}
  if(b.rm)continue;
  for(const e of enemies){if(e.dead||e.inv)continue;if(!hitRect(b.x,b.y,b.r,e))continue;if(b.hits){if(b.hits.has(e))continue;b.hits.add(e);}
   if(b.type==='flame'){if(e.burnT>0)continue;e.burnT=5;dmgE(e,b.dmg*2.4,b);if(Math.random()<.3)part(b.x,b.y,0,-1,20,'#ff8020',2,-.02,'smoke');continue;}
   if(b.type==='net'||b.type==='bomb'){bulletEnd(b);break;}
   const ok=dmgE(e,b.dmg,b);if(b.type==='ab'&&ok)e.marked=360;
   if(!b.pierce){bulletEnd(b);break;}else spark(b.x,b.y,'#fff');}
  if(b.x<cam.x-30||b.x>cam.x+W+30||b.y<-60||b.y>H+30||b.life<=0)b.rm=true;
 }
 pbul=pbul.filter(b=>!b.rm);
}
