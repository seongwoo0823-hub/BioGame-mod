<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#6ec0ee">
<title>바이오 알 도둑</title>
<script type="importmap">{ "imports": { "three": "../vendor/three-r187/three.module.js" } }</script>
<style>
:root{
  --ink:#2a1a28; --ink2:rgba(42,26,40,.72); --card:#ffffff; --sky:#6ec0ee; --mint:#3ac8d8; --gold:#ffc83a; --pink:#ff6a8a; --green:#4ec26a; --purple:#8a6ae8;
  --safeT:env(safe-area-inset-top,0px); --safeB:env(safe-area-inset-bottom,0px); --safeL:env(safe-area-inset-left,0px); --safeR:env(safe-area-inset-right,0px);
  --font: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#6ec0ee;font-family:var(--font);color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
.hidden{display:none!important}
button{font-family:inherit;color:inherit}
/* 공통 카툰 카드 */
.cart{background:var(--card);border:3px solid var(--ink);border-radius:18px;box-shadow:0 4px 0 var(--ink)}
.pill{display:flex;align-items:center;gap:6px;background:#fff;border:3px solid var(--ink);border-radius:999px;box-shadow:0 3px 0 var(--ink);padding:4px 12px 4px 6px;font-weight:900;white-space:nowrap}
.pill .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:17px;border:2.5px solid var(--ink)}

/* 로딩 · 시작 화면 */
#loading{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(#6ec0ee,#e6f6fb);z-index:50;font-weight:900;font-size:20px}
#loading .egg{width:54px;height:70px;border-radius:50% 50% 46% 46%/60% 60% 40% 40%;background:#7af0e0;border:4px solid var(--ink);margin:0 auto 14px;animation:wob .7s ease-in-out infinite alternate}
@keyframes wob{from{transform:rotate(-10deg)}to{transform:rotate(10deg)}}
#title{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px;background:radial-gradient(ellipse at center,rgba(255,255,255,.0) 30%,rgba(30,60,90,.35));}
#logo{text-align:center;transform:rotate(-2deg)}
#logo h1{margin:0;font-size:clamp(44px,9vw,88px);line-height:1;font-weight:900;color:#fff;letter-spacing:-1px;
  -webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink),0 10px 24px rgba(0,0,0,.25)}
#logo h1 b{color:var(--gold)} #logo h1 i{font-style:normal;color:#7af0e0}
#logo .sub{display:inline-block;margin-top:12px;background:var(--ink);color:#fff;font-weight:900;padding:5px 14px;border-radius:999px;letter-spacing:3px;font-size:13px}
#tcard{max-width:440px;width:100%;padding:16px 18px;text-align:center}
#tcard p{margin:0 0 6px;font-weight:700;color:var(--ink2);font-size:14px;line-height:1.5}
#tStat{font-weight:800;margin:6px 0 2px!important;color:var(--ink)!important}
.big{display:block;width:100%;margin-top:10px;font-size:22px;font-weight:900;padding:14px;border-radius:16px;border:3px solid var(--ink);background:linear-gradient(#ffe066,#ffc83a);box-shadow:0 5px 0 var(--ink);cursor:pointer;transition:transform .08s}
.big:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.chips span{font-size:12px;font-weight:800;background:#f1f6fa;border:2px solid var(--ink);border-radius:999px;padding:3px 9px}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#hud > *{pointer-events:auto}
#topL{position:absolute;left:calc(10px + var(--safeL));top:calc(10px + var(--safeT));display:flex;flex-direction:column;gap:7px;align-items:flex-start;pointer-events:none}
#topL > *{pointer-events:auto}
#cashP{font-size:22px} #cashP .ic{background:var(--gold)}
#inc{font-size:13px;color:#2a8a4a;margin-left:4px}
#mult{background:var(--purple);color:#fff;border-radius:999px;padding:1px 8px;font-size:13px;margin-left:4px}
#stats{display:flex;gap:6px;flex-wrap:wrap}
#stats .pill{font-size:14px;padding:2px 10px 2px 4px} #stats .ic{width:24px;height:24px;font-size:13px}
#lockS{background:#e0f6ff} #lockS.open{background:#fff}
#board{background:rgba(255,255,255,.92);border:3px solid var(--ink);border-radius:14px;padding:5px 8px;font-size:12px;font-weight:800;min-width:150px;box-shadow:0 3px 0 var(--ink)}
#board div{display:flex;align-items:center;gap:5px;padding:1px 0}
#board div.me{color:#1a8aa0}
#board i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink);flex:none}
#board b{margin-left:auto;padding-left:8px;font-weight:900}
#topR{position:absolute;right:calc(10px + var(--safeR));top:calc(10px + var(--safeT));display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#mini{width:150px;height:150px;border-radius:50%;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);background:#5cc6e6}
#menu{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:240px}
#menu button{width:46px;height:46px;border-radius:14px;border:3px solid var(--ink);background:#fff;box-shadow:0 3px 0 var(--ink);font-size:21px;cursor:pointer;display:grid;place-items:center;padding:0}
#menu button:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
#event{position:absolute;left:50%;top:calc(10px + var(--safeT));transform:translateX(-50%);background:linear-gradient(90deg,#ff6a8a,#ffb84a);color:#fff;font-weight:900;padding:6px 16px;border-radius:999px;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);font-size:15px;white-space:nowrap;animation:pulse 1.2s ease-in-out infinite alternate}
#event b{font-size:16px;margin-right:4px}
@keyframes pulse{to{transform:translateX(-50%) scale(1.05)}}
#todo{position:absolute;left:50%;top:calc(54px + var(--safeT));transform:translateX(-50%);background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:0 3px 0 var(--ink);padding:6px 14px 7px;text-align:center;max-width:min(380px,calc(100vw - 360px));min-width:220px;pointer-events:none}
#todo i{font-style:normal;font-size:11px;font-weight:900;background:var(--mint);color:#fff;border-radius:999px;padding:1px 7px;margin-right:6px;vertical-align:2px}
#todo b{font-size:15px;font-weight:900}
#todo span{display:block;font-size:12px;font-weight:700;color:var(--ink2)}
#toasts{position:absolute;left:50%;top:calc(122px + var(--safeT));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:min(520px,90vw)}
.toast{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:7px 14px;font-weight:800;font-size:14px;box-shadow:0 3px 0 var(--ink);animation:tin .25s ease-out;text-align:center;transition:opacity .45s,transform .45s}
.toast.bad{background:#ffe2e6} .toast.warn{background:#fff3c8} .toast.event{background:linear-gradient(90deg,#ffe0ea,#fff1d0)}
.toast.out{opacity:0;transform:translateY(-8px)}
@keyframes tin{from{transform:scale(.7);opacity:0}}
#floats{position:fixed;inset:0;pointer-events:none;z-index:9}
.floaty{position:absolute;left:0;top:0;font-weight:900;font-size:18px;white-space:nowrap;-webkit-text-stroke:4px #fff;paint-order:stroke fill;will-change:transform}
#hatch{position:absolute;left:50%;bottom:calc(150px + var(--safeB));transform:translate(-50%,40px) scale(.8);opacity:0;pointer-events:none;display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:0 4px 0 var(--ink),0 0 0 6px var(--rc,#fff) inset;padding:6px 18px 6px 6px;transition:all .35s cubic-bezier(.3,1.6,.5,1)}
#hatch.show{opacity:1;transform:translate(-50%,0) scale(1)}
#hatch .th{width:76px;height:76px}
#hatch small{display:block;font-weight:900;font-size:12px} #hatch b{display:block;font-size:19px;font-weight:900} #hatch span{font-weight:800;color:#2a8a4a;font-size:13px}
/* 조작 버튼 */
#ctrl{position:absolute;right:calc(18px + var(--safeR));bottom:calc(18px + var(--safeB));display:flex;align-items:flex-end;gap:14px}
.rb{position:relative;border-radius:50%;border:4px solid var(--ink);box-shadow:0 5px 0 var(--ink);display:grid;place-items:center;cursor:pointer;touch-action:none;transition:transform .06s}
.rb.down{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
#bJump{width:72px;height:72px;background:linear-gradient(#9ff0ff,#5ad8f0);font-size:30px;font-weight:900}
#bAct{width:96px;height:96px;background:linear-gradient(#ffe880,#ffc83a);font-size:40px}
#bAct.dim{filter:saturate(.25) brightness(1.05)}
#bAct svg{position:absolute;inset:-10px;width:calc(100% + 20px);height:calc(100% + 20px);transform:rotate(-90deg);pointer-events:none}
#actRing{fill:none;stroke:#ff5a8a;stroke-width:6;stroke-linecap:round;stroke-dasharray:176;stroke-dashoffset:176}
#actLabel{position:absolute;right:0;bottom:118px;background:var(--ink);color:#fff;font-weight:900;font-size:14px;padding:6px 12px;border-radius:12px;white-space:nowrap;opacity:0;transform:translateY(6px);transition:all .15s;pointer-events:none}
#actLabel.show{opacity:1;transform:none}
body:not(.touch) #actLabel::after{content:' · E';opacity:.7}
.keys{position:absolute;left:calc(12px + var(--safeL));bottom:calc(12px + var(--safeB));font-size:12px;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);pointer-events:none}
body.touch .keys{display:none}
body:not(.touch) #bJump{width:60px;height:60px;font-size:24px}
body:not(.touch) #bAct{width:78px;height:78px;font-size:32px}
body:not(.touch) #actLabel{bottom:96px}
#joy{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:rgba(255,255,255,.28);border:3px solid rgba(255,255,255,.8);pointer-events:none;opacity:0;transition:opacity .15s;z-index:11}
#joy.on{opacity:1}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;background:#fff;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
#joyHint{position:absolute;left:calc(30px + var(--safeL));bottom:calc(40px + var(--safeB));width:110px;height:110px;border-radius:50%;border:3px dashed rgba(255,255,255,.75);display:grid;place-items:center;color:#fff;font-weight:900;font-size:13px;text-shadow:0 1px 3px rgba(0,0,0,.4);pointer-events:none}
body:not(.touch) #joyHint{display:none}

/* 패널 */
#panel{position:fixed;inset:0;z-index:30;background:rgba(20,30,50,.35);display:flex;align-items:center;justify-content:center;padding:calc(12px + var(--safeT)) 12px calc(12px + var(--safeB))}
#pbox{width:min(760px,100%);max-height:100%;overflow:auto;padding:0 16px 16px;animation:pin .22s cubic-bezier(.3,1.5,.5,1);-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain}
@keyframes pin{from{transform:scale(.85);opacity:0}}
#pbox header{position:sticky;top:0;background:#fff;padding:14px 44px 10px 0;z-index:2;border-bottom:2px dashed #e4dde6;margin-bottom:10px}
#pbox h2{margin:0;font-size:22px;font-weight:900}
#pbox header p{margin:4px 0 0;font-size:13px;font-weight:700;color:var(--ink2);line-height:1.45}
#pbox h3{font-size:16px;margin:16px 0 4px;display:flex;align-items:center;gap:7px} #pbox h3 small{font-size:12px;color:var(--ink2)}
.eg{width:16px;height:20px;border-radius:50% 50% 45% 45%/60% 60% 40% 40%;border:2px solid var(--ink);display:inline-block}
.fact{margin:0 0 8px;font-size:13px;font-weight:600;color:var(--ink2);line-height:1.5}
.x{position:absolute;right:0;top:12px;width:38px;height:38px;border-radius:12px;border:3px solid var(--ink);background:#fff;font-weight:900;font-size:17px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:9px}
.pc{display:flex;align-items:center;gap:8px;background:#fbfafc;border:2.5px solid var(--ink);border-radius:14px;padding:5px 8px 5px 5px;box-shadow:inset 6px 0 0 var(--rc,#ddd);position:relative}
.pc .th{width:64px;height:64px;flex:none;background:radial-gradient(circle,#fff 40%,#eef3f7);border-radius:12px}
.pi{min-width:0;flex:1} .pi small{display:block;font-weight:900;font-size:11px} .pi b{display:block;font-weight:900;font-size:15px;line-height:1.25} .pi span{font-size:12px;font-weight:800;color:#2a8a4a} .pi p{margin:3px 0 0;font-size:11.5px;font-weight:600;color:var(--ink2);line-height:1.4}
.pc button{flex:none}
.cx .pc{align-items:flex-start}
.pc.unk{opacity:.7} .pc .q{width:64px;height:64px;flex:none;border-radius:12px;background:#e8e4ec;display:grid;place-items:center;font-size:30px;font-weight:900;color:#a89cb4}
.stars{color:#f0a020;font-size:13px;letter-spacing:-1px;margin-right:4px}
.mut{font-style:normal;font-size:11px;font-weight:900;border-radius:6px;padding:1px 5px;border:1.5px solid var(--ink);vertical-align:1px;display:inline-block}
.mut.albino{background:#fff;color:#e0405a} .mut.melan{background:#2a2430;color:#ffd84a} .mut.gfp{background:#7aff9a;color:#0a3a1a;box-shadow:0 0 8px #7aff9a} .mut.giant{background:#ffb84a} .mut.chimera{background:linear-gradient(90deg,#ff7ab0,#7ab0ff);color:#fff}
.muts{display:flex;gap:3px;margin-top:2px} .muts .mut.no{opacity:.18}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px;background:#fbfafc;border:2.5px solid var(--ink);border-radius:14px;padding:8px 10px}
.row > div:first-child,.row > div:nth-child(2){flex:1;min-width:0}
.row b{display:block;font-weight:900;font-size:15px} .row b i{font-style:normal;font-size:12px;background:var(--mint);color:#fff;border-radius:999px;padding:0 6px;margin-left:4px;vertical-align:2px}
.row span{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);line-height:1.4} .row small{display:block;font-size:12px;font-weight:800;color:#1a8aa0;margin-top:2px}
.row .th{width:52px;height:52px;flex:none}
.row button,.pc button,.reb button,.seg button{font-weight:900;font-size:14px;padding:9px 12px;border-radius:12px;border:2.5px solid var(--ink);background:linear-gradient(#ffe880,#ffc83a);box-shadow:0 3px 0 var(--ink);cursor:pointer;white-space:nowrap}
.row button:active,.pc button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
button:disabled{filter:grayscale(1);opacity:.55;cursor:default}
button.on{background:linear-gradient(#9ff0c0,#4ec26a)!important}
button.danger{background:linear-gradient(#ffb0b8,#ff6a7a)}
.seg{display:flex;gap:4px} .seg button{padding:7px 10px;background:#fff}
.sw{display:flex;gap:2px;flex:none} .sw i{width:14px;height:30px;border-radius:5px;border:2px solid var(--ink)}
.reb{text-align:center;font-weight:700;font-size:15px;line-height:1.6} .reb ul{list-style:none;padding:0;margin:10px 0;font-size:16px} .reb button{font-size:18px;padding:12px 20px;margin-top:6px}
.help p{font-size:14px;font-weight:600;line-height:1.55;margin:0 0 10px;color:var(--ink2)} .help b{color:var(--ink)}
.empty,.hint{font-weight:700;color:var(--ink2);font-size:13.5px;text-align:center;padding:10px}
/* 작은 화면 */
@media (max-width:760px){
  #mini{width:108px;height:108px}
  #menu{max-width:160px} #menu button{width:40px;height:40px;font-size:18px;border-radius:12px}
  #cashP{font-size:18px} #cashP .ic{width:26px;height:26px}
  #board{display:none}
  #todo{top:auto;bottom:calc(132px + var(--safeB));max-width:calc(100vw - 24px)}
  #toasts{top:calc(56px + var(--safeT))}
}
@media (max-width:520px){ .grid{grid-template-columns:1fr} }
@media (max-height:520px){
  #mini{width:96px;height:96px}
  #board{display:none}
  #todo{top:calc(8px + var(--safeT));max-width:calc(100vw - 420px)}
  #toasts{top:calc(70px + var(--safeT))}
  #hatch{bottom:calc(20px + var(--safeB))}
  #bAct{width:84px;height:84px} #bJump{width:62px;height:62px}
  #actLabel{bottom:104px}
}
</style>
</head>
<body>
<canvas id="gl" tabindex="0"></canvas>
<div id="loading"><div><div class="egg"></div>알을 데우는 중…</div></div>
<div id="title" class="hidden">
  <div id="logo"><h1>바이오 <b>알</b> <i>도둑</i></h1><div class="sub">BIO EGG THIEF</div></div>
  <div id="tcard" class="cart">
    <p>섬 곳곳의 둥지에서 <b>희귀한 알</b>을 훔쳐 와 부화시키고, 생물을 모아 돈을 벌어요!<br>경비 세포와 다른 연구원을 조심하세요.</p>
    <p id="tStat"></p>
    <div class="chips"><span>🥚 알 7종</span><span>🐾 생물 28종</span><span>🧪 돌연변이 5종</span><span>🧬 융합</span><span>🔁 환생</span></div>
    <button id="bStart" class="big">▶ 모험 시작</button>
  </div>
</div>
<div id="hud" class="hidden">
  <div id="topL">
    <div id="cashP" class="pill"><span class="ic">💰</span><span id="cash">0</span><span id="inc"></span><span id="mult" class="hidden"></span></div>
    <div id="stats">
      <div class="pill" title="이동 속도"><span class="ic" style="background:#9ff0c0">🏃</span><span id="spd"></span></div>
      <div class="pill" title="점프 레벨"><span class="ic" style="background:#9fd8ff">⤒</span>Lv.<span id="jmp"></span></div>
      <div class="pill" title="들고 있는 알 / 가방"><span class="ic" style="background:#ffe0a0">🎒</span><span id="bag"></span></div>
      <div class="pill" id="lockS"></div>
    </div>
    <div id="board"></div>
  </div>
  <div id="topR">
    <canvas id="mini" width="300" height="300"></canvas>
    <div id="menu">
      <button data-p="pets" title="내 생물">🐾</button>
      <button data-p="shop" title="업그레이드">⬆️</button>
      <button data-p="codex" title="도감">📖</button>
      <button data-p="help" title="게임 방법">❓</button>
      <button data-p="settings" title="설정">⚙️</button>
    </div>
  </div>
  <div id="event" class="hidden"></div>
  <div id="todo" class="hidden"></div>
  <div id="toasts"></div>
  <div id="hatch"></div>
  <div id="joyHint">끌어서<br>이동</div>
  <div class="keys">WASD 이동 · 끌기 시점 · Space 점프 · E 꾹 훔치기</div>
  <div id="ctrl">
    <div id="bJump" class="rb" title="점프 (Space)">⤒</div>
    <div id="bAct" class="rb dim" title="행동 (E 꾹)"><svg viewBox="0 0 64 64"><circle id="actRing" cx="32" cy="32" r="28"/></svg><span id="actIcon">✋</span><div id="actLabel"></div></div>
  </div>
</div>
<div id="floats"></div>
<div id="joy"><div id="knob"></div></div>
<div id="panel" class="hidden"><div id="pbox" class="cart"></div></div>
<script type="module" src="./bio-egg/main.js"></script>
<script src="../goal.js"></script>
<script src="../ilog.js"></script>
</body>
</html>
