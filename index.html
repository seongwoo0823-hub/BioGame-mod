<!DOCTYPE html>
<html lang="ko" class="dev-pc lay-grid">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BIO ARCADE · 생명과학 게임 아케이드</title>
<meta name="description" content="리듬게임, 런앤건, 카트 레이싱, 5대5 대전, 로그라이크, 핀볼, 3D 난투, FPS, 액션 RPG, 퍼즐까지 생명과학을 주제로 한 웹 게임 15종. PC·태블릿·휴대폰에서 설치 없이 바로 플레이.">
<meta name="theme-color" content="#0b1020">
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-v2-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-v2.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BIO ARCADE">
<script>
/* 기기 판별: 휴대폰 / 태블릿 / PC → <html class="dev-…">. 화면 폭에 따라 목록(lay-list) / 바둑판(lay-grid) */
(function(){
  var d=document.documentElement,ua=navigator.userAgent||'';
  var coarse=matchMedia('(pointer:coarse)').matches,hover=matchMedia('(hover:hover)').matches;
  var short=Math.min(screen.width,screen.height);
  var tabUA=/ipad|tablet|playbook|silk|(android(?!.*mobile))/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  var phoneUA=!tabUA&&/iphone|ipod|android.*mobile|windows phone|mobile/i.test(ua);
  var dev=phoneUA||(coarse&&!hover&&short<600)?'phone':(tabUA||(coarse&&!hover&&short<1100))?'tablet':'pc';
  function lay(){var list=dev==='phone'||innerWidth<600;d.className=d.className.replace(/\b(dev|lay)-\w+/g,'').trim()+' dev-'+dev+' lay-'+(list?'list':'grid');}
  lay();addEventListener('resize',lay);window.BIO_DEV=dev;
})();
</script>
<script src="icons.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1020;--bg2:#10172b;--card:#151c31;--card-h:#1b2440;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
  --ink:#f1f5f9;--sub:#a3b0c6;--dim:#6f7d96;--acc:#38bdf8;--acc2:#818cf8;--ok:#34d399;--try:#fbbf24;
  --r:16px;--pad:16px;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;color-scheme:dark}
body{min-height:100vh;background:radial-gradient(1200px 600px at 10% -10%,#17224a 0,transparent 60%),radial-gradient(900px 500px at 110% 0,#1d1640 0,transparent 55%),var(--bg);
  color:var(--ink);font-family:'IBM Plex Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
.wrap{max-width:1320px;margin:0 auto;padding:0 var(--pad) calc(28px + var(--safe-b))}
i[data-ic]{display:inline-flex;font-style:normal;line-height:0}
i[data-ic] svg.pg{width:1em;height:1em;vertical-align:0}

/* ---------- 위쪽 막대 ---------- */
.bar{position:sticky;top:0;z-index:20;padding:calc(10px + var(--safe-t)) var(--pad) 10px;
  background:rgba(11,16,32,.82);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border-bottom:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:12px;max-width:calc(1320px - 2*var(--pad));margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:.02em;white-space:nowrap}
.brand img{width:32px;height:32px;border-radius:9px}
.search{flex:1;display:flex;align-items:center;gap:8px;height:42px;padding:0 14px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);max-width:420px;margin-left:auto;transition:border-color .15s}
.search:focus-within{border-color:var(--acc)}
.search i{color:var(--dim);font-size:18px}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:15px}
.search input::placeholder{color:var(--dim)}
.search kbd{font:600 11px/1 system-ui;color:var(--dim);border:1px solid var(--line2);border-radius:5px;padding:3px 6px}
.acts{display:flex;gap:6px}
.ib{width:42px;height:42px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-size:20px;color:var(--sub);background:var(--bg2);border:1px solid var(--line);transition:background .15s,color .15s}
.ib:hover{color:var(--ink);background:var(--card-h)}
.ib.on{color:var(--acc)}
.ib-search{display:none}

/* ---------- 분류 + 목표 요약 ---------- */
.tools{display:flex;align-items:center;gap:12px;margin:18px 0 14px}
.seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{height:34px;padding:0 14px;border-radius:9px;font-size:14px;font-weight:600;color:var(--sub);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.seg button b{font-weight:600;font-size:12px;color:var(--dim)}
.seg button.on{background:var(--card-h);color:var(--ink);box-shadow:0 1px 0 rgba(255,255,255,.06) inset}
.seg button.on b{color:var(--acc)}
.sum{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--sub);white-space:nowrap}
.sum i{color:var(--ok);font-size:16px}
.sum b{color:var(--ink)}
.mini{height:28px;padding:0 10px;margin-left:4px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--sub);background:var(--bg2);border:1px solid var(--line)}
.fld{flex:1;min-width:0;height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--line2);background:rgba(255,255,255,.05);color:var(--ink);font-size:15px;outline:0}
.fld:focus{border-color:var(--acc)}
.grow{display:grid;grid-template-columns:1fr 120px;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.04)}
.grow b{display:block;color:var(--ink);font-size:14px}
.grow small{display:block;font-size:12px;color:var(--dim)}
.grow input{height:34px;text-align:right}
.sheet.wide{width:min(640px,100%)}
.rseg{flex-wrap:nowrap;overflow-x:auto}
.rseg button{flex:none}
.rgoal{font-size:12.5px;color:var(--dim)}
.rlist{display:flex;flex-direction:column;gap:4px;max-height:52vh;overflow:auto;min-height:120px}
.rrow{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.04);font-size:14px}
.rrow .n{font-weight:700;text-align:center;color:var(--sub)}
.rrow.top1 .n{color:#facc15}.rrow.top2 .n{color:#cbd5e1}.rrow.top3 .n{color:#f59e0b}
.rrow b{color:var(--ink)}.rrow small{color:var(--dim);font-size:11.5px;margin-left:6px}
.rrow .v{font-weight:700;color:var(--ink);text-align:right}
.rrow .v small{display:block;margin:0}
.rempty{padding:30px 0;text-align:center;color:var(--dim)}
.rme{display:flex;gap:8px}
.srv{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;color:var(--sub);background:var(--bg2);border:1px solid var(--line);white-space:nowrap;flex:none}
.srv button{height:22px;margin-left:2px;padding:0 9px;border-radius:999px;background:#f87171;color:#1a0505;font-size:11.5px;font-weight:700}
.srv button:hover{background:#fca5a5}
.srv.off{padding-right:3px}
.srv i{width:8px;height:8px;border-radius:50%;background:#94a3b8;flex:none}
.srv.ok i{background:#34d399;box-shadow:0 0 6px #34d399}.srv.wake i{background:#fbbf24;animation:srvb 1s infinite}.srv.off i{background:#f87171}
@keyframes srvb{50%{opacity:.3}}
/* 휴대폰·좁은 창: 로고 모서리에 작은 점으로, 꺼졌을 때만 위쪽 막대 아래에 '재시도' 띠 */
.lay-list .bar-in{position:relative}
.lay-list .srv{position:absolute;left:22px;top:22px;height:auto;padding:0;border:0;background:none;z-index:2}
.lay-list .srv i{width:11px;height:11px;border:2px solid var(--bg)}
.lay-list .srv span,.lay-list .srv button{display:none}
.lay-list .srv.off{left:0;top:calc(100% + 8px);height:32px;padding:0 4px 0 10px;border:1px solid rgba(248,113,113,.4);background:rgba(40,12,16,.92);color:#fecaca}
.lay-list .srv.off i{width:8px;height:8px;border:0}
.lay-list .srv.off span,.lay-list .srv.off button{display:inline}
.lay-list .srv.off button{display:inline-flex;align-items:center}
.lay-list .srv.off{top:calc(100% + 10px)}
.lay-list body.srv-off .tools{margin-top:56px}
.dev-phone .ib{width:36px;height:36px;font-size:18px;border-radius:11px}
.dev-phone .acts{gap:4px}
.dev-phone .brand{font-size:16px;gap:8px}
.mini:hover{color:var(--ink);border-color:var(--line2)}
.toast{position:fixed;left:50%;bottom:calc(24px + var(--safe-b));transform:translateX(-50%);z-index:60;padding:10px 16px;border-radius:12px;background:#1e293b;border:1px solid var(--line2);font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.4)}

/* ---------- 이어하기 ---------- */
.resume{display:flex;align-items:center;gap:14px;padding:10px;margin-bottom:14px;border-radius:var(--r);background:linear-gradient(100deg,rgba(56,189,248,.16),rgba(129,140,248,.10));border:1px solid rgba(56,189,248,.28)}
.resume img{width:120px;aspect-ratio:16/9;object-fit:cover;border-radius:10px;flex:none}
.resume .t{flex:1;min-width:0}
.resume small{display:block;font-size:12px;color:var(--acc);font-weight:600}
.resume strong{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.resume .pl{flex:none;height:40px;padding:0 16px;border-radius:12px;background:var(--acc);color:#04111d;font-weight:700;display:inline-flex;align-items:center;gap:6px}

/* ---------- 게임 카드 (바둑판) ---------- */
.games{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{position:relative;display:flex;flex-direction:column;border-radius:var(--r);background:var(--card);border:1px solid var(--line);overflow:hidden;transition:transform .18s,border-color .18s,background .18s}
.th{position:relative;aspect-ratio:16/9;background:#0d1326;overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s}
.badge{position:absolute;left:8px;top:8px;display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:7px;font-size:12px;font-weight:600;background:rgba(8,12,24,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#e0f2fe}
.badge i{font-size:13px;color:var(--acc)}
.recent{position:absolute;right:8px;top:8px;height:24px;padding:0 8px;border-radius:7px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;background:var(--acc);color:#04111d}
.info{padding:12px 14px 14px;display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.info h2{font-size:17px;font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:13.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12.5px;color:var(--dim);min-width:0}
.goal{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:7px;background:rgba(255,255,255,.05);color:var(--sub);font-weight:600;white-space:nowrap;flex:none}
.goal i{font-size:13px}
.goal.ok{background:rgba(52,211,153,.14);color:var(--ok)}
.goal.try{background:rgba(251,191,36,.12);color:var(--try)}
.rec{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.rec b{color:var(--sub);font-weight:600}
.go{display:none}
.gtxt{font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.empty{grid-column:1/-1;padding:48px 0;text-align:center;color:var(--dim)}
.empty i{font-size:34px;display:block;margin:0 auto 8px;width:34px}

/* PC: 마우스를 올리면 살짝 떠오름 */
.dev-pc .card:hover{transform:translateY(-3px);border-color:var(--line2);background:var(--card-h)}
.dev-pc .card:hover .th img{transform:scale(1.04)}
.card:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.card:active{transform:scale(.985)}

/* ---------- 목록형 (휴대폰 · 좁은 창) ---------- */
.lay-list .games{grid-template-columns:1fr;gap:10px}
.lay-list .card{flex-direction:row;align-items:center;gap:12px;padding:10px;border-radius:14px}
.lay-list .th{width:112px;flex:none;border-radius:10px}
.lay-list .badge{left:4px;top:4px;height:20px;padding:0 6px;font-size:11px;border-radius:6px}
.lay-list .recent{display:none}
.lay-list .info{padding:0;gap:1px}
.lay-list .info h2{font-size:16px}
.lay-list .sub{font-size:13px}
.lay-list .meta{margin-top:5px}
.lay-list .rec,.lay-list .gtxt{display:none}
.lay-list .go{display:inline-flex;color:var(--dim);font-size:18px;flex:none}

/* ---------- 휴대폰 ---------- */
.dev-phone{--pad:14px}
.dev-phone body{font-size:15px}
.dev-phone .brand{font-size:17px}
.dev-phone .brand img{width:30px;height:30px}
.dev-phone .search{display:none;margin:0;max-width:none}
.dev-phone .ib-search{display:inline-flex}
.dev-phone .bar-in{flex-wrap:wrap}
.dev-phone .acts{margin-left:auto}
.dev-phone .bar.searching .search{display:flex;order:5;flex-basis:100%}
.dev-phone .search kbd,.dev-tablet .search kbd{display:none}
.dev-phone .tools{flex-direction:column;align-items:stretch;gap:10px;margin:14px 0 12px}
.dev-phone .seg button{flex:1;padding:0 8px}
.dev-phone .sum{margin-left:0;justify-content:flex-end;font-size:13px}
.dev-phone .resume img{width:96px}
.dev-phone .resume .pl span{display:none}
.dev-phone .resume .pl{width:44px;padding:0;justify-content:center}
@media (max-width:600px){
  .search{display:none;margin:0;max-width:none}.ib-search{display:inline-flex}.bar-in{flex-wrap:wrap}.acts{margin-left:auto}
  .bar.searching .search{display:flex;order:5;flex-basis:100%}.search kbd{display:none}
  .tools{flex-direction:column;align-items:stretch;gap:10px}.seg button{flex:1;padding:0 8px}.sum{margin-left:0;justify-content:flex-end}
}
@media (min-width:720px){.dev-phone.lay-list .games{grid-template-columns:1fr 1fr}}

/* ---------- 태블릿 ---------- */
.dev-tablet{--pad:20px}
.dev-tablet .games{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.dev-tablet .ib,.dev-tablet .search{height:46px}
.dev-tablet .ib{width:46px}
.dev-tablet .seg button{height:38px;padding:0 16px}

/* ---------- PC ---------- */
.dev-pc{--pad:28px}
@media (min-width:1500px){.dev-pc .games{grid-template-columns:repeat(5,1fr)}}

footer{margin-top:28px;text-align:center;font-size:12.5px;color:var(--dim)}

/* ---------- 앱 설치 안내 창 ---------- */
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(3,6,14,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.sheet{width:min(440px,100%);border-radius:20px;background:var(--bg2);border:1px solid var(--line2);box-shadow:0 30px 80px rgba(0,0,0,.5);overflow:hidden}
.sheet header{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);font-weight:700;font-size:16px}
.sheet header img{width:28px;height:28px;border-radius:7px}
.sheet header .ib{margin-left:auto;width:36px;height:36px;font-size:18px}
.sheet .bd{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;font-size:14px;color:var(--sub)}
.step{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.04)}
.step .n{flex:none;width:22px;height:22px;border-radius:50%;background:var(--acc);color:#04111d;font:700 12px/22px system-ui;text-align:center}
.step b{color:var(--ink)}
.direct{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;border-radius:12px;background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.3);color:#bbf7d0}
.btn{height:38px;padding:0 16px;border-radius:10px;background:var(--acc);color:#04111d;font-weight:700;white-space:nowrap}
.btn.ghost{background:rgba(255,255,255,.08);color:var(--ink)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;color:var(--dim)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="bar" id="bar">
  <div class="bar-in">
    <a class="brand" href="./" aria-label="BIO ARCADE 처음으로"><img src="icons/icon-v2-192.png" alt="" width="32" height="32"><span>BIO ARCADE</span></a>
    <label class="search" aria-label="게임 검색"><i data-ic="search"></i><input id="q" type="search" placeholder="게임·단원 검색" autocomplete="off" enterkeyhint="go"><kbd>/</kbd></label>
    <span class="srv" id="srv" title="온라인 게임 중계 서버 상태"><i></i><span>서버 확인 중</span><button type="button" id="srvRetry" hidden>재시도</button></span>
    <div class="acts">
      <button class="ib ib-search" id="btnSearch" type="button" aria-label="검색 열기"><i data-ic="search"></i></button>
      <button class="ib" id="btnRank" type="button" aria-label="랭킹 보기" title="랭킹" hidden><i data-ic="trophy"></i></button>
      <button class="ib" id="btnReload" type="button" aria-label="강력 새로고침 (최신 버전 다시 받기)" title="강력 새로고침"><i data-ic="repeat"></i></button>
      <button class="ib" id="btnSnd" type="button" aria-label="효과음 끄기/켜기"><i data-ic="speaker"></i></button>
      <button class="ib" id="btnInstall" type="button" aria-label="앱으로 설치"><i data-ic="download"></i></button>
    </div>
  </div>
</header>
<div class="wrap">

  <div class="tools">
    <nav class="seg" role="tablist" aria-label="분류">
      <button class="on" type="button" role="tab" data-filter="all">전체 <b id="nAll">15</b></button>
      <button type="button" role="tab" data-filter="online">온라인 <b id="nOnline"></b></button>
      <button type="button" role="tab" data-filter="action">액션 <b id="nAction"></b></button>
      <button type="button" role="tab" data-filter="casual">캐주얼 <b id="nCasual"></b></button>
    </nav>
    <div class="sum" title="게임마다 정해진 목표 점수를 넘긴 수"><i data-ic="target"></i>목표 달성 <b id="heroGoal">0 / 12</b><button class="mini" id="goalReset" type="button" aria-label="목표 달성 기록 초기화">초기화</button><button class="mini" id="goalEdit" type="button" aria-label="성공 기준 수정 (선생님용)">기준 수정</button></div>
  </div>

  <a class="resume" id="resume" hidden>
    <img alt="" width="120" height="68">
    <div class="t"><small>이어서 플레이</small><strong></strong></div>
    <span class="pl"><i data-ic="play"></i><span>플레이</span></span>
  </a>

  <main class="games" id="games" aria-label="게임 목록"></main>

  <footer>진행 기록은 이 기기에 자동으로 저장돼요</footer>
</div>

<div class="modal" id="pwaModal" hidden role="dialog" aria-modal="true" aria-labelledby="pwaTitle">
  <div class="sheet">
    <header><img src="icons/icon-v2-192.png" alt=""><span id="pwaTitle">앱으로 설치하기</span><button class="ib" type="button" data-close aria-label="닫기"><i data-ic="x"></i></button></header>
    <div class="bd">
      <div class="direct" id="pwaDirect" hidden><span>이 브라우저는 바로 설치할 수 있어요</span><button class="btn" id="pwaNow" type="button">지금 설치</button></div>
      <div id="pwaSteps" style="display:flex;flex-direction:column;gap:8px"></div>
      <div class="sw"><span id="swTxt">오프라인 저장 확인 중…</span><button class="btn ghost" type="button" data-close>닫기</button></div>
    </div>
  </div>
</div>

<div class="modal" id="goalModal" hidden role="dialog" aria-modal="true" aria-labelledby="goalTitle">
  <div class="sheet">
    <header><span id="goalTitle">성공 기준 수정</span><button class="ib" type="button" data-gclose aria-label="닫기"><i data-ic="x"></i></button></header>
    <div class="bd">
      <div id="gLock" style="display:flex;flex-direction:column;gap:10px">
        <span>선생님용 기능이에요. 비밀번호를 입력하세요.</span>
        <div style="display:flex;gap:8px"><input id="gPw" type="password" inputmode="numeric" autocomplete="off" class="fld" placeholder="비밀번호"><button class="btn" id="gPwOk" type="button">확인</button></div>
        <span id="gPwMsg" style="color:#fca5a5;font-size:13px"></span>
      </div>
      <div id="gEditor" hidden style="display:flex;flex-direction:column;gap:8px">
        <div id="gRows" style="display:flex;flex-direction:column;gap:6px;max-height:55vh;overflow:auto"></div>
        <div class="sw"><button class="btn ghost" type="button" id="gDefault">처음 값으로</button><button class="btn" type="button" id="gSave">저장</button></div>
        <span id="gNote" style="font-size:12px;color:var(--dim)">저장하면 이 기기에 바로 적용돼요.</span>
      </div>
    </div>
  </div>
</div>

<div class="modal" id="rankModal" hidden role="dialog" aria-modal="true" aria-labelledby="rankTitle">
  <div class="sheet wide">
    <header><span id="rankTitle">랭킹</span><button class="ib" type="button" data-rclose aria-label="닫기"><i data-ic="x"></i></button></header>
    <div class="bd">
      <div class="seg rseg" id="rTabs"></div>
      <div class="rgoal" id="rGoal"></div>
      <div class="rlist" id="rList"></div>
      <div class="rme"><input class="fld" id="rWho" placeholder="내 기록 찾기: 20800 홍길동" autocomplete="off"><button class="btn ghost" id="rFind" type="button">내 기록</button></div>
    </div>
  </div>
</div>

<script src="goal.js"></script>
<script src="rank.js"></script>
<script src="net.js"></script>
<script>
(()=>{
  // 게임 목록: id, 제목, 한 줄 소개, 분류, 온라인 인원, 검색어
  const GAMES=[
    ['bio-beat','바이오 비트','생명과학 노래 43곡 리듬게임','online casual','2~4','리듬 음악 노래 퀴즈 세포 유전 생태 bio beat'],
    ['immune-strike','면역 특공대','면역세포로 돌파하는 런앤건 액션','action','','런앤건 면역 호중구 대식세포 T세포 NK세포 immune strike'],
    ['bio-kart','바이오 카트','몸속 15개 트랙 카트 레이싱','online casual','8','카트 레이싱 레이스 혈관 소화 bio kart'],
    ['vessel-canyon','혈관 협곡','세포와 감염원의 5:5 대전','online action','10','모바 MOBA 5대5 대전 면역 감염 vessel canyon'],
    ['biotro','바이오트로','세포 포커 덱빌딩 로그라이크','casual','','포커 카드 덱빌딩 로그라이크 조커 소기관 biotro'],
    ['cell-bound','셀 바운드','세포 던전을 탐험하는 슈터','action','','로그라이크 던전 슈터 세포질 핵 cell bound'],
    ['cell-pinball','세포 탐사대 핀볼','세포 속 핀볼 테이블','casual','','핀볼 세포 미션 cell cadet pinball'],
    ['cell-brawl','셀 브롤','면역세포 3D 난투','online action','6','난투 브롤 3D 면역 병원체 트로피 cell brawl'],
    ['only-up','온리 업','소화관을 거슬러 오르는 점프','casual','','플랫포머 점프 소화관 나노봇 only up'],
    ['bio-strike','바이오 스트라이크','면역 요원 1인칭 슈팅','online action','8','FPS 슈팅 총 백신 바이러스 암세포 bio strike'],
    ['helix','헬릭스','쿼터뷰 액션 로그라이트','action','','로그라이트 이중나선 유전자 변이 helix'],
    ['cell-frontier','세포 개척단','선을 그어 땅을 넓히는 아케이드','casual','','땅따먹기 아케이드 숨은그림 cell frontier'],
    ['bio-tower','바이오 타워','생물 조각 쌓기 대결','online casual','4','쌓기 타워 동물 물리 bio tower'],
    ['bio-kingdom','바이오 킹덤','동물 영웅과 생명의 왕국 키우기','casual','','왕국 건설 영웅 뽑기 수집 RPG 광합성 세포호흡 단백질 동물 병원체 bio kingdom'],
    ['outbreak','감염 도시','좀비 아포칼립스 생존 시뮬레이션','action','','좀비 생존 서바이벌 감염 바이러스 백신 면역 아포칼립스 outbreak'],
    ['codon-glass','코돈 글래스','mRNA 코돈 번역 퍼즐','online casual','4','퍼즐 코돈 mRNA 번역 아미노산 리보솜 codon glass']
  ];
  const ic=n=>window.BioIcon?BioIcon.svg(n):'';
  const get=k=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}};
  const set=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};
  const fmtT=t=>{const m=Math.floor(t/60),s=t-m*60;return m+':'+s.toFixed(2).padStart(5,'0');};
  const dev=window.BIO_DEV||'pc';

  // ---------- 카드 만들기 ----------
  const box=document.getElementById('games');
  box.innerHTML=GAMES.map(([id,t,s,cat,on,kw])=>`<a class="card" href="games/${id}.html" data-id="${id}" data-cat="${cat}" data-kw="${kw}">
    <div class="th"><img src="assets/${id}.jpg" alt="" width="640" height="360" loading="lazy" decoding="async">${on?`<span class="badge"><i>${ic('globe')}</i>${on}인</span>`:''}</div>
    <div class="info"><h2>${t}</h2><p class="sub">${s}</p><p class="gtxt"></p><p class="meta"><span class="goal"></span><span class="rec" data-rec="${id}"></span></p></div>
    <i class="go">${ic('chevron')}</i></a>`).join('')+'<p class="empty" id="empty" hidden><i>'+ic('search')+'</i>찾는 게임이 없어요</p>';
  const cards=[...box.querySelectorAll('.card')];
  const cnt=c=>cards.filter(a=>a.dataset.cat.split(' ').includes(c)).length;
  document.getElementById('nOnline').textContent=cnt('online');
  document.getElementById('nAction').textContent=cnt('action');
  document.getElementById('nCasual').textContent=cnt('casual');

  // ---------- 효과음 ----------
  let actx=null,uiSnd=get('bioArcadeUiSnd')!==false;
  const sndBtn=document.getElementById('btnSnd');
  const syncSnd=()=>{sndBtn.innerHTML=`<i>${ic(uiSnd?'speaker':'mute')}</i>`;sndBtn.classList.toggle('on',uiSnd);sndBtn.setAttribute('aria-label',uiSnd?'효과음 끄기':'효과음 켜기');};
  syncSnd();
  function tone(kind){
    if(!uiSnd)return;
    try{
      if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();
      if(actx.state==='suspended')actx.resume();
      const t=actx.currentTime;
      const note=(f,f2,at,len,vol,type)=>{const o=actx.createOscillator(),g=actx.createGain();o.type=type||'sine';
        o.frequency.setValueAtTime(f,t+at);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+at+len*.8);
        g.gain.setValueAtTime(vol,t+at);g.gain.exponentialRampToValueAtTime(.0001,t+at+len);o.connect(g);g.connect(actx.destination);o.start(t+at);o.stop(t+at+len+.01);};
      if(kind==='hover')note(680,880,0,.04,.015);
      else if(kind==='tap')note(520,1040,0,.075,.05);
      else [523.25,659.25,783.99,1046.5].forEach((f,i)=>note(f,0,i*.035,.14,.055,'triangle'));
    }catch(e){}
  }
  sndBtn.addEventListener('click',()=>{uiSnd=!uiSnd;set('bioArcadeUiSnd',uiSnd);syncSnd();tone('tap');});

  // ---------- 기록 한 줄 (태블릿·PC) ----------
  const REC={
    'bio-beat'(){const r=get('biobeat_rec_v1');if(!r||typeof r!=='object')return '';
      const songs=new Set(Object.keys(r).filter(k=>k[0]!=='_'&&r[k]&&r[k].score>0).map(k=>k.replace(/_\d$/,'')));
      const out=[];if(songs.size)out.push(`클리어 <b>${songs.size}</b>곡`);const q=r._quiz;if(q&&q.t)out.push(`퀴즈 <b>${q.r}/${q.t}</b>`);return out.join(' · ');},
    'immune-strike'(){const hs=get('immuneStrikeHS');if(!Array.isArray(hs)||!hs.length||!hs[0])return '';return `최고 <b>${Number(hs[0].s||0).toLocaleString()}</b>점`;},
    'bio-kart'(){const s=get('biokart');const b=s&&s.best;if(!b||typeof b!=='object')return '';
      const v=Object.values(b).filter(x=>typeof x==='number'&&isFinite(x));if(!v.length)return '';return `최단 <b>${fmtT(Math.min(...v))}</b>`;},
    'biotro'(){const s=get('biotroStats');if(!s||!s.runs)return '';return `최고 앤티 <b>${s.bestAnte||1}</b>`;},
    'cell-bound'(){const s=get('cellBoundStats');if(!s||!s.runs)return '';return s.wins?`승리 <b>${s.wins}</b>회`:`최고 <b>${s.bestFloor||1}</b>층`;},
    'cell-pinball'(){const hs=get('cellCadetHS');if(!Array.isArray(hs)||!hs.length||!hs[0])return '';return `최고 <b>${Number(hs[0].score||0).toLocaleString()}</b>점`;},
    'cell-brawl'(){const t=get('cellbrawl:trophies');if(!t||typeof t!=='object')return '';const v=Object.values(t).filter(x=>typeof x==='number'&&x>0);
      return v.length?`트로피 <b>${v.reduce((a,b)=>a+b,0)}</b>`:'';},
    'only-up'(){const s=get('onlyupBioStats');if(s&&s.clears)return `탈출 <b>${s.clears}</b>회`;const p=get('onlyupBio');return p&&p.cp>0?`<b>${p.cp+1}</b>/7 구간`:'';},
    'bio-strike'(){const s=get('bioStrike');if(!s||typeof s!=='object')return '';const out=[];if(s.cleared)out.push(`스토리 <b>${s.cleared}</b>/5장`);
      if(s.surv&&s.surv.wave)out.push(`생존 <b>${s.surv.wave}</b>웨이브`);return out.join(' · ');},
    'helix'(){const s=get('helix-save-v1');return s&&s.runs?`출정 <b>${s.runs}</b>회`:'';},
    'bio-kingdom'(){const s=get('bioKingdomSave');if(!s||!s.v)return '';return `스테이지 <b>${s.clear||0}</b>개 클리어 · 영웅 <b>${Object.keys(s.heroes||{}).length}</b>명`;},
    'outbreak'(){const s=get('outbreakStats');if(!s||!s.plays)return '';return `최고 <b>${s.bestDays||0}</b>일 생존`+(s.escapes?` · 탈출 <b>${s.escapes}</b>회`:'');},
    'codon-glass'(){const s=get('codonGlass');return s&&s.plays?`<b>${s.plays}</b>판`:'';},
    'bio-tower'(){const s=get('bioTower');return s&&s.rounds?`<b>${s.wins||0}</b>승 · 최고 <b>${s.best||0}m</b>`:'';},
    'cell-frontier'(){const s=get('cellFrontier');if(!s||!s.clear)return '';const c=Object.values(s.clear);return c.length?`정복 <b>${c.length}</b>/16곳`:'';},
    'vessel-canyon'(){const s=get('vesselCanyonStats');return s&&(s.w||s.l)?`<b>${s.w||0}승 ${s.l||0}패</b>`:'';}
  };
  for(const el of document.querySelectorAll('[data-rec]')){let h='';try{h=REC[el.dataset.rec]();}catch(e){}el.innerHTML=h||'';}

  // ---------- 최근 플레이 / 이어하기 ----------
  const last=get('bioArcadeLast');
  const lastCard=cards.find(a=>a.dataset.id===last);
  if(lastCard){
    const t=document.createElement('span');t.className='recent';t.textContent='최근';lastCard.querySelector('.th').appendChild(t);
    const r=document.getElementById('resume');r.href=lastCard.getAttribute('href');r.dataset.id=last;
    r.querySelector('img').src=`assets/${last}.jpg`;r.querySelector('strong').textContent=lastCard.querySelector('h2').textContent;r.hidden=false;
    r.addEventListener('click',()=>tone('launch'));
  }
  for(const a of cards){
    if(dev==='pc')a.addEventListener('pointerenter',()=>tone('hover'));
    a.addEventListener('click',()=>{set('bioArcadeLast',a.dataset.id);tone('launch');});
  }

  // ---------- 분류 · 검색 ----------
  let cur='all';
  const q=document.getElementById('q'),empty=document.getElementById('empty'),bar=document.getElementById('bar');
  function apply(){
    const s=q.value.trim().toLowerCase();let n=0;
    for(const c of cards){
      const ok=(cur==='all'||c.dataset.cat.split(' ').includes(cur))&&(!s||(c.textContent+' '+c.dataset.kw).toLowerCase().includes(s));
      c.hidden=!ok;if(ok)n++;
    }
    empty.hidden=n>0;
    document.getElementById('resume').classList.toggle('dim',!!s);
    if(lastCard)document.getElementById('resume').hidden=!!s||cur!=='all';
  }
  document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{
    cur=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>{x.classList.toggle('on',x===b);x.setAttribute('aria-selected',x===b);});tone('tap');apply();}));
  q.addEventListener('input',apply);
  q.addEventListener('keydown',e=>{if(e.key==='Enter'){const f=cards.find(c=>!c.hidden);if(f){e.preventDefault();f.click();location.href=f.href;}}else if(e.key==='Escape'){q.value='';apply();q.blur();}});
  document.getElementById('btnSearch').addEventListener('click',()=>{const on=!bar.classList.contains('searching');bar.classList.toggle('searching',on);if(on)q.focus();else{q.value='';apply();}});
  addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==q&&!e.ctrlKey&&!e.metaKey){e.preventDefault();q.focus();}});
  addEventListener('pageshow',e=>{if(e.persisted)location.reload();});

  // ---------- 목표 점수 ----------
  function renderGoals(){
    if(!window.BioGoal)return;
    const G=BioGoal.GOALS;let done=0,total=0;
    for(const card of cards){
      const id=card.dataset.id,g=G[id],el=card.querySelector('.goal'),gt=card.querySelector('.gtxt');
      if(!g){el.hidden=true;gt.hidden=true;continue;}
      total++;const st=BioGoal.status(id);if(st&&st.ok)done++;
      el.className='goal'+(st&&st.ok?' ok':st?' try':'');
      el.innerHTML=st&&st.ok?`<i>${ic('check')}</i>목표 달성`:`<i>${ic('target')}</i>${st?'도전 중':'목표'}`;
      el.title='목표: '+g.goal;gt.textContent='목표 · '+g.goal;
    }
    document.getElementById('heroGoal').textContent=`${done} / ${total}`;
  }
  renderGoals();
  addEventListener('pageshow',renderGoals);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)renderGoals();});


  // ---------- 목표 초기화 ----------
  function toast(t){const el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2200);}
  document.getElementById('goalReset').addEventListener('click',()=>{
    tone('tap');
    if(!confirm('모든 게임의 목표 달성 기록을 지울까요?\n(게임 진행 기록과 최고 점수는 그대로 남아요)'))return;
    try{localStorage.removeItem('bioGoal');}catch(e){}
    renderGoals();toast('목표 달성 기록을 초기화했어요');
  });


  // ---------- 성공 기준 수정 (비밀번호) ----------
  const gModal=document.getElementById('goalModal'),gLock=document.getElementById('gLock'),gEd=document.getElementById('gEditor'),gRows=document.getElementById('gRows');
  const NAME=Object.fromEntries(GAMES.map(g=>[g[0],g[1]]));
  function openGoalEdit(){tone('tap');gLock.hidden=false;gEd.hidden=true;document.getElementById('gPw').value='';document.getElementById('gPwMsg').textContent='';gModal.hidden=false;setTimeout(()=>document.getElementById('gPw').focus(),50);}
  function fillRows(cfg){
    const G=BioGoal.GOALS,D=BioGoal.DEFAULTS;
    gRows.innerHTML=Object.keys(G).map(id=>{const g=G[id];const v=(cfg&&cfg[id])||D[id];
      return `<label class="grow"><span><b>${NAME[id]||id}</b><small>${g.tpl.replace('{t}','□')}${g.low?' (작을수록 어려움)':''}</small></span><input class="fld" type="number" min="1" step="1" data-gid="${id}" value="${v}"></label>`;}).join('');
  }
  function unlock(){
    if(document.getElementById('gPw').value!=='1211'){document.getElementById('gPwMsg').textContent='비밀번호가 맞지 않아요.';return;}
    gLock.hidden=true;gEd.hidden=false;fillRows(BioGoal.config());
  }
  document.getElementById('goalEdit').addEventListener('click',openGoalEdit);
  document.getElementById('gPwOk').addEventListener('click',unlock);
  document.getElementById('gPw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock();});
  document.getElementById('gDefault').addEventListener('click',()=>fillRows({}));
  document.getElementById('gSave').addEventListener('click',async()=>{
    const cfg={};gRows.querySelectorAll('[data-gid]').forEach(i=>{const v=Math.round(+i.value);if(v>0&&v!==BioGoal.DEFAULTS[i.dataset.gid])cfg[i.dataset.gid]=v;});
    BioGoal.setConfig(cfg);
    if(window.BioRank&&BioRank.ready())try{await BioRank.saveGoalConfig(cfg);}catch(e){}
    renderGoals();gModal.hidden=true;toast('성공 기준을 저장했어요');
  });
  gModal.querySelectorAll('[data-gclose]').forEach(b=>b.addEventListener('click',()=>{gModal.hidden=true;}));
  gModal.addEventListener('click',e=>{if(e.target===gModal)gModal.hidden=true;});


  // ---------- 랭킹 보기 (Firebase) ----------
  const btnRank=document.getElementById('btnRank'),rModal=document.getElementById('rankModal');
  let rCur=null;
  if(window.BioRank&&BioRank.ready())btnRank.hidden=false;
  window.onBioGoalCfg=()=>renderGoals();
  const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const day=t=>{const d=new Date(t);return (d.getMonth()+1)+'/'+d.getDate();};
  function rTabs(){
    const ids=Object.keys(BioGoal.GOALS);if(!rCur)rCur=ids[0];
    document.getElementById('rTabs').innerHTML=ids.map(id=>`<button type="button" class="${id===rCur?'on':''}" data-rg="${id}">${NAME[id]||id}</button>`).join('');
    document.querySelectorAll('[data-rg]').forEach(b=>b.addEventListener('click',()=>{rCur=b.dataset.rg;rTabs();rLoad();}));
  }
  async function rLoad(who){
    const g=BioGoal.GOALS[rCur],L=document.getElementById('rList');
    document.getElementById('rGoal').textContent='목표 · '+g.goal+(g.low?' · 작을수록 좋은 기록':'');
    L.innerHTML='<div class="rempty">불러오는 중…</div>';
    try{
      const rows=who?await BioRank.mine(rCur,who):await BioRank.top(rCur,g.low,100);
      if(!rows.length){L.innerHTML=`<div class="rempty">${who?'보낸 기록이 없어요':'아직 랭킹이 없어요. 첫 번째 기록을 보내 보세요!'}</div>`;return;}
      L.innerHTML=rows.map((r,i)=>`<div class="rrow ${!who&&i<3?'top'+(i+1):''}"><span class="n">${who?day(r.t):i+1}</span><span><b>${esc(r.sid)} ${esc(r.name)}</b>${r.ok?'<small>목표 달성</small>':''}</span><span class="v">${esc(r.text||r.value)}${who?'':'<small>'+day(r.t)+'</small>'}</span></div>`).join('');
    }catch(e){L.innerHTML='<div class="rempty">랭킹을 불러오지 못했어요 ('+esc(e.message)+')</div>';}
  }
  btnRank.addEventListener('click',()=>{tone('tap');rTabs();rLoad();rModal.hidden=false;try{document.getElementById('rWho').value=localStorage.getItem('bioRankWho')||'';}catch(e){}});
  document.getElementById('rFind').addEventListener('click',()=>{const w=document.getElementById('rWho').value.trim();if(!BioRank.parseName(w)){toast("'20800 홍길동' 형식으로 적어 주세요");return;}rLoad(w);});
  rModal.querySelectorAll('[data-rclose]').forEach(b=>b.addEventListener('click',()=>{rModal.hidden=true;}));
  rModal.addEventListener('click',e=>{if(e.target===rModal)rModal.hidden=true;});


  // ---------- 중계 서버 상태 (위쪽 작은 표시) ----------
  (function(){
    const el=document.getElementById('srv');if(!el)return;
    if(!window.BioRelay||!BioRelay.url){el.hidden=true;return;}
    const rb=document.getElementById('srvRetry');
    const set=(c,t,tip)=>{el.className='srv '+c;el.querySelector('span').textContent=t;el.title=tip;rb.hidden=c!=='off';document.body.classList.toggle('srv-off',c==='off');};
    let tries=0,timer=null,busy=false;
    // 서버가 꺼졌을 때: 재시도 버튼 → 서버를 깨우고 다시 확인
    rb.addEventListener('click',()=>{tone('tap');clearTimeout(timer);tries=0;BioRelay.wake&&BioRelay.wake();set('wake','서버 깨우는 중','서버를 다시 깨우는 중이에요 (최대 1분)');if(!busy)run();});
    const later=(f,ms)=>{clearTimeout(timer);timer=setTimeout(f,ms);};
    const run=async()=>{busy=true;
      const r=await BioRelay.check(tries?12000:6000);busy=false;
      if(r.ok){set('ok',`서버 연결 · ${r.ms}ms`,`온라인 게임 중계 서버가 켜져 있어요 (응답 ${r.ms}ms${r.peers!=null?', 접속 '+r.peers+'명':''})`);later(()=>{tries=0;run();},60000);return;}
      tries++;
      if(tries<=8){set('wake','서버 깨우는 중','무료 서버가 잠들어 있어 깨우는 중이에요 (최대 1분)');later(run,5000);}
      else{set('off','서버 꺼짐 · P2P','중계 서버에 닿지 않아요. 온라인 게임은 기기끼리 직접(P2P) 연결돼요. 재시도를 눌러 다시 깨워 보세요');later(()=>{tries=0;run();},60000);}
    };
    run();
  })();

  // ---------- 강력 새로고침: 저장된 옛 파일을 지우고 최신 버전을 다시 받음 ----------
  document.getElementById('btnReload').addEventListener('click',async()=>{
    tone('tap');
    const b=document.getElementById('btnReload');b.disabled=true;b.style.opacity=.5;toast('최신 버전을 받는 중…');
    try{if(navigator.serviceWorker){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()));}}catch(e){}
    try{if(window.caches){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)));}}catch(e){}
    location.replace(location.pathname+'?r='+Date.now());
  });

  // ---------- 앱 설치 ----------
  const standalone=matchMedia('(display-mode: standalone),(display-mode: fullscreen)').matches||navigator.standalone===true;
  const btnI=document.getElementById('btnInstall'),modal=document.getElementById('pwaModal'),direct=document.getElementById('pwaDirect'),steps=document.getElementById('pwaSteps'),swTxt=document.getElementById('swTxt');
  let deferred=null;
  if(standalone)btnI.hidden=true;
  function syncI(){direct.hidden=!deferred;}
  function renderSteps(){
    const ua=navigator.userAgent||'';
    const iOS=/iphone|ipad|ipod/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1),and=/android/i.test(ua);
    const S=iOS?['Safari 아래쪽(아이패드는 위쪽)의 <b>공유</b> 버튼을 누르세요.','<b>홈 화면에 추가</b>를 고르세요.','오른쪽 위 <b>추가</b>를 누르면 홈 화면에 앱이 생겨요.']
      :and?['브라우저 오른쪽 위 <b>메뉴(⋮)</b>를 여세요.','<b>앱 설치</b> 또는 <b>홈 화면에 추가</b>를 누르세요.','홈 화면에서 전체 화면으로 바로 실행돼요.']
      :['주소창 오른쪽의 <b>설치</b> 아이콘을 누르세요.','또는 <b>메뉴(⋮) → 저장 및 공유 → 페이지를 앱으로 설치</b>를 고르세요.','바탕화면과 작업 표시줄에 앱이 생기고 오프라인에서도 열려요.'];
    steps.innerHTML=S.map((s,i)=>`<div class="step"><span class="n">${i+1}</span><div>${s}</div></div>`).join('');
  }
  async function install(){
    tone('tap');
    if(deferred){try{deferred.prompt();const c=await deferred.userChoice;if(c&&c.outcome==='accepted'){deferred=null;btnI.hidden=true;}syncI();return;}catch(e){}}
    renderSteps();modal.hidden=false;
  }
  addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;syncI();});
  addEventListener('appinstalled',()=>{deferred=null;btnI.hidden=true;modal.hidden=true;});
  btnI.addEventListener('click',install);
  document.getElementById('pwaNow').addEventListener('click',install);
  modal.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>{modal.hidden=true;tone('tap');}));
  modal.addEventListener('click',e=>{if(e.target===modal)modal.hidden=true;});
  addEventListener('keydown',e=>{if(e.key==='Escape')modal.hidden=true;});
  if('serviceWorker' in navigator&&location.protocol!=='file:'){
    navigator.serviceWorker.register('sw.js').then(()=>{swTxt.textContent='오프라인에서도 열 수 있어요';}).catch(()=>{swTxt.textContent='웹 브라우저 모드로 실행 중';});
  }else swTxt.textContent='웹에 올리면 앱 설치를 쓸 수 있어요';
})();
</script>
<script src="ilog.js"></script>
</body>
</html>
